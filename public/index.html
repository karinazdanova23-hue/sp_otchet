<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Свободное Пространство</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#171512">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Свободное Пространство">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#EDE7DC;
    --paper-2:#E3DBCC;
    --ink:#2A2520;
    --ink-soft:#6B6156;
    --line: rgba(42,37,32,0.14);
    --line-strong: rgba(42,37,32,0.28);
    --accent:#3D4F5C;
    --accent-2:#3D4F5C;
    --white:#FBF9F4;
    --danger:#A34A3E;

    --glaze-1:#C08A3E;
    --glaze-2:#8B5D6B;
    --glaze-3:#6E8B6A;
    --glaze-4:#4A7C82;

    --status-green:#5C7A4A;
    --status-green-bg:#5C7A4A;
    --status-red:#A3402F;
    --status-red-bg:#A3402F;
    --status-blue:#3D6FA8;
    --status-purple:#7A5296;
    --status-cyan:#4FA8C9;

    --radius: 3px;
    --font-display: 'Fraunces', serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .app{ max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

  /* ---------- header ---------- */
  .app-header{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 18px; margin-bottom: 22px;
    flex-wrap: wrap; gap: 16px;
  }
  .daily-alerts-banner{
    display:flex; flex-wrap:wrap; gap: 8px 16px;
    background: #FBEFD9; border: 1px solid #E8CE9C; border-radius: var(--radius);
    padding: 10px 14px; margin: -8px 0 22px; font-size: 12.5px; color: #6B4A1E;
  }
  .daily-alert-item.clickable{ cursor:pointer; text-decoration: underline; text-decoration-style: dotted; }
  .app-title{
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin:0;
  }
  .app-sub{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 4px;
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }

  .view-switch{
    display:flex; flex-wrap: wrap; gap: 2px; background: var(--paper-2);
    border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 3px;
  }
  .view-switch button{
    border:none; background: transparent; padding: 8px 16px;
    font-family: var(--font-body); font-size: 13px; font-weight: 500;
    color: var(--ink-soft); cursor:pointer; border-radius: 2px;
    transition: all .15s ease;
  }
  .view-switch button.active{ background: var(--ink); color: var(--white); }
  .view-switch button:not(.active):hover{ color: var(--ink); }

  .lock-btn{
    border: 1px solid var(--line-strong); background: var(--white);
    padding: 9px 14px; border-radius: var(--radius); font-size: 12.5px;
    font-family: var(--font-mono); color: var(--ink-soft); cursor:pointer;
  }
  .lock-btn:hover{ border-color: var(--ink); color: var(--ink); }
  .lock-btn.unlocked{ background: var(--status-green); border-color: var(--status-green); color: var(--white); }

  /* ---------- analytics ---------- */
  .analytics-summary{ display:flex; gap:14px; margin-bottom: 26px; flex-wrap: wrap; }
  .summary-card{
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: 14px 20px; background: var(--white); min-width: 120px;
  }
  .summary-card .num{ font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height:1; }
  .summary-card .label{ font-size: 11px; color: var(--ink-soft); font-family: var(--font-mono); margin-top: 6px; letter-spacing:0.02em; }
  .summary-card.green .num{ color: var(--status-green); }
  .summary-card.red .num{ color: var(--status-red); }

  .analytics-section{ margin-bottom: 30px; }
  .analytics-section h4{
    font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0 0 14px;
  }
  .stat-row{ display:flex; align-items:center; gap: 12px; margin-bottom: 9px; cursor:default; }
  .stat-row.clickable{ cursor:pointer; }
  .stat-row .stat-label{ width: 170px; font-size: 13px; flex-shrink:0; display:flex; align-items:center; gap:6px; }
  .stat-row .stat-bar-track{ flex:1; background: var(--paper-2); height: 10px; border-radius: 3px; overflow:hidden; }
  .stat-row .stat-bar-fill{ height:100%; border-radius:3px; }
  .stat-row .stat-count{ width: 30px; text-align:right; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); flex-shrink:0; }
  .stat-row:hover.clickable .stat-label{ text-decoration: underline; }

  .host-expand{
    margin: 2px 0 14px 182px; padding: 10px 14px; background: var(--paper-2);
    border-radius: var(--radius); font-size: 12.5px;
  }
  .host-expand-row{ display:flex; justify-content:space-between; padding: 3px 0; }
  .host-expand-row .n{ color: var(--ink-soft); font-family: var(--font-mono); }

  .analytics-empty{ color: var(--ink-soft); font-size: 13.5px; padding: 10px 0 30px; }

  /* ---------- space tabs (glaze swatches) ---------- */
  .space-tabs{ display:flex; gap:10px; margin-bottom: 22px; flex-wrap: wrap; }
  .space-tab{
    display:flex; align-items:center; gap:9px;
    border: 1px solid var(--line-strong); background: var(--white);
    border-radius: var(--radius); padding: 9px 14px 9px 11px;
    cursor:pointer; transition: all .15s ease;
  }
  .space-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width: 18px; height:18px; padding:0 3px;
    border-radius: 4px; font-family: var(--font-mono); font-size: 11px; font-weight:600;
    color: var(--white); line-height:1; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    flex-shrink:0;
  }
  .space-badge.sm{ min-width:14px; height:14px; font-size:9px; border-radius:3px; }
  .space-badge.xs{ min-width:12px; height:12px; font-size:8px; border-radius:3px; }
  .swatch-multi{ display:flex; gap:2px; flex-shrink:0; }
  .space-tab.active .space-badge{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15), 0 0 0 2px var(--ink); }
  .space-tab .name{ font-size: 13.5px; font-weight: 500; }
  .space-tab.active{ background: var(--ink); border-color: var(--ink); }
  .space-tab.active .name{ color: var(--white); }
  .space-tab:not(.active):hover{ border-color: var(--ink); }
  .space-tab input.rename{
    font-family: var(--font-body); font-size: 13.5px; font-weight: 500;
    border: none; background: transparent; color: inherit; width: 110px;
    outline: none; border-bottom: 1px dashed currentColor;
  }

  /* ---------- calendar ---------- */
  .cal-nav{
    display:flex; align-items:center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav .month-label{
    font-family: var(--font-display); font-size: 21px; font-weight: 600;
    text-transform: capitalize;
  }
  .cal-nav-btns{ display:flex; gap:8px; align-items:center;}
  .nav-btn{
    border: 1px solid var(--line-strong); background: var(--white);
    width: 32px; height: 32px; border-radius: var(--radius);
    cursor:pointer; font-size: 15px; display:flex; align-items:center; justify-content:center;
    color: var(--ink);
  }
  .nav-btn:hover{ background: var(--ink); color: var(--white); }
  .today-btn{
    border: 1px solid var(--line-strong); background: var(--white);
    padding: 7px 12px; border-radius: var(--radius); font-size: 12.5px;
    cursor:pointer; font-family: var(--font-mono); color: var(--ink-soft);
  }
  .today-btn:hover{ color: var(--ink); border-color: var(--ink);}

  .cal-grid{
    display:grid; grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--line-strong); border-left: 1px solid var(--line-strong);
    background: var(--line-strong);
    gap: 1px;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .cal-dow{
    background: var(--paper-2); padding: 7px 9px; font-size: 11px;
    font-family: var(--font-mono); color: var(--ink-soft); letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .cal-cell{
    background: var(--white); min-height: 104px; padding: 7px 8px;
    cursor:pointer; position:relative; transition: background .12s ease;
    display:flex; flex-direction:column; gap:4px;
  }
  .cal-cell:hover{ background: #F5F1E8; }
  .cal-cell.other-month{ background: var(--paper); opacity: 0.55; }
  .cal-cell.today{ box-shadow: inset 0 0 0 2px var(--ink); }
  .cal-daynum{ font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); }
  .cal-cell.today .cal-daynum{ color: var(--ink); font-weight: 600; }
  .cal-warn-icon{ font-size: 11px; margin-left: 3px; }
  .cal-hostess{
    font-size: 10px; color: var(--ink-soft); font-family: var(--font-mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin: -1px 0 3px;
  }
  .cal-events{ display:flex; flex-direction:column; gap: 3px; overflow:hidden; }
  .cal-evt-chip{
    font-size: 11px; padding: 2.5px 5px; border-radius: 2px;
    color: var(--white); font-weight: 500;
    white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
    display:flex; gap:5px; align-items:baseline;
  }
  .cal-evt-chip .t{ font-family: var(--font-mono); font-size: 10px; opacity: 0.9; }
  .cal-more{ font-size: 10.5px; color: var(--ink-soft); font-family: var(--font-mono); padding-left: 2px; }
  .chip-dot{
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,0.85);
  }
  .status-legend{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom: 10px; }
  .status-legend .item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); font-family: var(--font-mono); }
  .status-legend .sw{ width:10px; height:10px; border-radius:3px; }
  .status-select-wrap{ display:flex; gap:10px; flex-wrap:wrap; }
  .status-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .status-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .status-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }
  .dishes-opt, .dishes-payment-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .dishes-opt .dot, .dishes-payment-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .dishes-opt.active, .dishes-payment-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }
  .payer-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .payer-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .payer-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }
  .certkind-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .certkind-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .certkind-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }
  .certpurpose-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .certpurpose-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .certpurpose-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }

  /* all-spaces mini legend */
  .legend-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; flex-shrink:0; }

  /* ---------- host view ---------- */
  .host-picker{ margin-bottom: 22px; }
  .host-picker label{ display:block; font-size: 12px; color: var(--ink-soft); font-family: var(--font-mono); margin-bottom:8px; letter-spacing:0.02em;}
  .host-chips{ display:flex; flex-wrap:wrap; gap: 8px; }
  .host-chip{
    border: 1px solid var(--line-strong); background: var(--white);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor:pointer;
    font-weight: 500;
  }
  .host-chip.active{ background: var(--ink); color: var(--white); border-color: var(--ink); }
  .host-chip:not(.active):hover{ border-color: var(--ink); }

  .host-empty{ color: var(--ink-soft); font-size: 14px; padding: 40px 0; text-align:center; }

  .host-list{ display:flex; flex-direction:column; gap: 0; border-top: 1px solid var(--line); }
  .host-row{
    display:grid; grid-template-columns: 92px 84px 1fr auto;
    align-items:center; gap: 16px; padding: 14px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .host-row:hover{ background: var(--white); }
  .host-row .date{ font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
  .host-row .time{ font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
  .host-row .info .title{ font-size: 14.5px; font-weight: 500; }
  .host-row .info .space{ font-size: 12px; color: var(--ink-soft); margin-top:2px; display:flex; align-items:center;}
  .host-row .duration{ font-size: 11.5px; color: var(--ink-soft); font-family: var(--font-mono); }
  .host-row.past{ opacity: 0.5; }

  /* ---------- certificates ---------- */
  .cert-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .cert-list{ display:flex; flex-direction:column; border-top: 1px solid var(--line); }
  .cert-row{
    display:grid; grid-template-columns: 46px 90px 100px 100px 100px 110px 1fr;
    align-items:center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .cert-row:hover{ background: var(--white); }
  .cert-row .num{ font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
  .cert-row .cell{ font-size: 13px; }
  .cert-row .amount{ font-family: var(--font-mono); font-size: 13px; }
  .cert-row .comment{ font-size: 12px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cert-year-group{ margin-bottom: 6px; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow:hidden; }
  .cert-group-header{
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 14px; background: var(--paper-2); cursor:pointer;
    font-size: 14px; font-weight: 500; text-transform: capitalize;
  }
  .cert-group-header:hover{ background: var(--white); }
  .cert-month-header{ background: var(--white); font-weight: 400; font-size: 13px; padding: 10px 14px 10px 28px; border-top: 1px solid var(--line); }
  .cert-month-group:last-child .cert-list .cert-row:last-child{ border-bottom: none; }
  .cert-badge{
    display:inline-flex; align-items:center; justify-content:center; padding: 3px 8px;
    border-radius: 999px; font-size: 11px; font-family: var(--font-mono); font-weight:500;
  }
  .cert-badge.in_progress{ background: #FBEFD9; color: #8A5A1E; }
  .cert-badge.partial{ background: #DCE7F0; color: var(--accent); }
  .cert-badge.used{ background: #E3EEE0; color: var(--status-green); }
  .cert-badge.refunded{ background: #E3EEE0; color: var(--status-green); }

  .cert-subtabs{ display:flex; flex-wrap:wrap; gap:2px; background: var(--paper-2); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 3px; margin-bottom: 18px; width:100%; max-width:fit-content; }
  .cert-subtabs button{ border:none; background:transparent; padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--ink-soft); cursor:pointer; border-radius:2px; }
  .cert-subtabs button.active{ background: var(--ink); color: var(--white); }

  .refund-row{
    display:grid; grid-template-columns: 100px 100px 100px 110px 90px 1fr;
    align-items:center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .refund-row:hover{ background: var(--white); }
  .refund-row .cell{ font-size: 13px; }
  .refund-row .amount{ font-family: var(--font-mono); font-size: 13px; }
  .refund-row .reason{ font-size: 12px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .lead-row{
    display:grid; grid-template-columns: 90px 90px 90px 80px 90px 80px 90px 40px;
    align-items:center; gap: 10px; padding: 12px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .lead-row:hover{ background: var(--white); }
  .lead-row .cell{ font-size: 12.5px; }
  .lead-row .amount{ font-family: var(--font-mono); font-size: 13px; }
  .lead-row .sold-mark{ font-size: 16px; text-align:center; }

  .expense-row{
    display:grid; grid-template-columns: 90px 100px 90px 90px 100px 1fr;
    align-items:center; gap: 10px; padding: 12px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .expense-row:hover{ background: var(--white); }
  .expense-row .cell{ font-size: 12.5px; }
  .expense-row .amount{ font-family: var(--font-mono); font-size: 13px; }
  .expense-row .comment{ font-size: 12px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  @media (max-width: 720px){
    .cert-row{ grid-template-columns: 1fr 1fr; grid-auto-rows:auto; row-gap:4px; }
    .cert-row .comment{ grid-column: 1 / -1; white-space:normal; }
    .refund-row{ grid-template-columns: 1fr 1fr; grid-auto-rows:auto; row-gap:4px; }
    .refund-row .reason{ grid-column: 1 / -1; white-space:normal; }
    .lead-row{ grid-template-columns: 1fr 1fr; grid-auto-rows:auto; row-gap:4px; }
    .expense-row{ grid-template-columns: 1fr 1fr; grid-auto-rows:auto; row-gap:4px; }
    .expense-row .comment{ grid-column: 1 / -1; white-space:normal; }
  }

  .host-group-label{
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 18px 4px 6px;
  }

  /* ---------- modal ---------- */
  .overlay{
    position: fixed; inset: 0; background: rgba(42,37,32,0.45);
    display:flex; align-items:center; justify-content:center; z-index: 50;
    padding: 20px;
  }
  .modal{
    background: var(--white); border-radius: var(--radius);
    width: 100%; max-width: 460px; max-height: 88vh; overflow-y:auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--line);
  }
  .modal-head h3{ margin:0; font-family: var(--font-display); font-weight:600; font-size: 18px; }
  .modal-close{
    border:none; background:transparent; font-size: 20px; cursor:pointer; color: var(--ink-soft);
    width: 28px; height: 28px; display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ color: var(--ink); }
  .modal-body{ padding: 18px 20px 20px; display:flex; flex-direction:column; gap: 14px;}

  .field label{ display:block; font-size: 11.5px; font-family: var(--font-mono); color: var(--ink-soft); margin-bottom: 6px; letter-spacing: 0.02em;}
  .field input, .field select, .field textarea{
    width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; font-family: var(--font-body); font-size: 14px; color: var(--ink);
    background: var(--paper); outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--ink); background: var(--white); }
  .field textarea{ resize: vertical; min-height: 56px; font-family: var(--font-body); }

<script>
  (function(){
    function getDeviceId(){
      try{
        let id = localStorage.getItem('sp-device-id');
        if(!id){
          id = 'dev-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
          localStorage.setItem('sp-device-id', id);
        }
        return id;
      }catch(e){ return 'dev-fallback'; }
    }
    const DEVICE_ID = getDeviceId();
    const API_BASE = new URL('/api/storage', window.location.origin).toString();
    window.storage = {
      async get(key, shared){
        const res = await fetch(`${API_BASE}/${encodeURIComponent(key)}?shared=${!!shared}`, { headers: { 'X-Device-Id': DEVICE_ID } });
        if(res.status === 404) return null;
        if(!res.ok) throw new Error('storage.get failed: ' + res.status);
        return res.json();
      },
      async set(key, value, shared){
        const res = await fetch(`${API_BASE}/${encodeURIComponent(key)}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-Id': DEVICE_ID }, body: JSON.stringify({ value, shared: !!shared }) });
        if(!res.ok) throw new Error('storage.set failed: ' + res.status);
        return res.json();
      },
      async delete(key, shared){
        const res = await fetch(`${API_BASE}/${encodeURIComponent(key)}?shared=${!!shared}`, { method: 'DELETE', headers: { 'X-Device-Id': DEVICE_ID } });
        if(!res.ok) throw new Error('storage.delete failed: ' + res.status);
        return res.json();
      },
      async list(prefix, shared){
        const res = await fetch(`${API_BASE}?prefix=${encodeURIComponent(prefix||'')}&shared=${!!shared}`, { headers: { 'X-Device-Id': DEVICE_ID } });
        if(!res.ok) throw new Error('storage.list failed: ' + res.status);
        return res.json();
      }
    };
  })();
</script>

  function renderBarChart(data, opts){
    opts = opts || {};
    const height = opts.height || 160;
    const width = opts.width || 600;
    const n = Math.max(1, data.length);
    const labelH = 18;
    const chartH = height - labelH;
    const barSlot = width / n;
    const maxVal = Math.max(1, ...data.map(d=>Math.abs(d.value)));
    const bars = data.map((d,i)=>{
      const barH = Math.max(1, Math.round((Math.abs(d.value)/maxVal) * (chartH-8)));
      const x = i * barSlot;
      const barW = barSlot * 0.7;
      const barX = x + (barSlot - barW)/2;
      const y = chartH - barH;
      const color = d.color || (d.value < 0 ? 'var(--status-red)' : 'var(--accent)');
      const displayVal = d.valueLabel !== undefined ? d.valueLabel : d.value;
      return `
        <g>
          <rect x="${barX.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="${barH}" fill="${color}" rx="2">
            <title>${escapeHtml(String(d.label))}: ${escapeHtml(String(displayVal))}</title>
          </rect>
          <text x="${(x+barSlot/2).toFixed(1)}" y="${chartH+13}" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)" font-family="var(--font-mono)">${escapeHtml(String(d.label))}</text>
        </g>
      `;
    }).join('');
    return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%;height:${height}px;">${bars}</svg>`;
  }

  const HOSTESS_WEEKDAY_RATE = 1300;

  function hostessDishesBonusesForDate(dateStr, dayShifts){
    // 150₽ тому админу, кто отмечен в мероприятии как мывший посуду;
    // если метка не проставлена — по старой логике: чья смена по времени покрывает мероприятие с платной посудой (300₽) в этот день
    const bonuses = {};
    const dayEvents = state.events.filter(e=> e.date===dateStr && e.dishes==='needed' && e.dishesPayment==='paid');
    if(dayEvents.length === 0) return bonuses;
    dayEvents.forEach(ev=>{
      if(ev.dishesWasher){
        bonuses[ev.dishesWasher] = (bonuses[ev.dishesWasher]||0) + HOSTESS_DISHES_BONUS;
        return;
      }
      if(!dayShifts) return;
      SHIFT_DEFS.forEach(s=>{
        const entry = normalizeShiftEntry(dayShifts[s.key], s);

          bonuses[entry.name] = (bonuses[entry.name]||0) + HOSTESS_DISHES_BONUS;

      });
    });
    return bonuses;

    // КРИТИЧЕСКИ ВАЖНО: если загрузка не удалась (сетевой сбой, недоступность сервера) — мы НЕ сохраняем

  function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function roundTo(n, step){ return Math.round(n/step)*step; }

  function buildDemoEvents30(){
    const typesPool = (state.eventTypes && state.eventTypes.length) ? state.eventTypes : DEFAULT_EVENT_TYPES;
    const spaceIds = ['s1','s2','s3','s4'];
    const times = ['10:00','11:00','12:30','14:00','15:30','17:00','18:30','19:30'];

    const statusSeq = [];
    for(let i=0;i<14;i++) statusSeq.push('confirmed');
    for(let i=0;i<8;i++) statusSeq.push('tentative');
    for(let i=0;i<4;i++) statusSeq.push('marketing');
    for(let i=0;i<4;i++) statusSeq.push('offsite');
    // лёгкое перемешивание, чтобы статусы не шли блоками подряд по датам
    for(let i=statusSeq.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [statusSeq[i], statusSeq[j]] = [statusSeq[j], statusSeq[i]];
    }

    const out = [];
    for(let i=0;i<30;i++){
      const status = statusSeq[i];
      const type = pick(typesPool);
      const spaceId = spaceIds[i % 4];
      const offset = i - 10; // 10 дней в прошлом .. 19 дней в будущем
      const host = pick(state.hostsList);
      const time = times[i % times.length];

      let guests, price, product = '', dishes = '', rentalBefore = null, rentalAfter = null;

      if(status === 'confirmed'){
        guests = randInt(3, 9);
        price = roundTo(randInt(2000, 7000), 100);
      } else if(status === 'tentative'){
        guests = randInt(4, 18);
        product = pick(PRODUCTS.filter(p=>p!=='Мастер-класс'));
        price = roundTo(randInt(6000, 22000), 100);
        dishes = Math.random() < 0.5 ? 'needed' : 'not_needed';
        if(Math.random() < 0.4){ rentalBefore = pick([15,30,45]); }
        if(Math.random() < 0.4){ rentalAfter = pick([15,30,60]); }
      } else if(status === 'marketing'){
        guests = randInt(2, 5);
        price = 0;
        dishes = Math.random() < 0.3 ? 'needed' : 'not_needed';
        if(Math.random() < 0.3){ rentalBefore = 15; }
      } else { // offsite
        guests = randInt(8, 25);
        product = Math.random() < 0.6 ? 'Корпоратив' : '';
        price = roundTo(randInt(12000, 35000), 500);
      }

      out.push({
        id: uid(),
        spaceId,
        date: demoDate(offset),
        time,
        duration: type.duration,
        guests,
        price,
        title: type.name,
        product,
        host,
        status,
        dishes,
        rentalBefore,
        rentalAfter,
        notes: '',
      });
    }
    return out;
  }

  const RECONCILE_STATUSES = ['tentative', 'offsite'];
  async function syncEventIncomeIfNeeded(event){
    // автоматическая синхронизация с "Книга → Доходы" для "Частник" и "Выезд" — тех же статусов,
    // что и сверка "Календарь vs Книга". "По расписанию" сюда не попадает — для него доход ведётся иначе.
    // Если по мероприятию уже ведётся построчный "Журнал платежей" (см. syncEventPaymentsToBook),
    // эта грубая запись на всю сумму сразу не нужна — построчные записи точнее и не должны задваиваться с ней.
    const hasRealPayments = Array.isArray(event.payments) && event.payments.some(p=> p.source !== 'Сертификат' && !p.certRedemptionRef && p.type !== 'refund' && !p.refundRef);
    const eligible = RECONCILE_STATUSES.includes(event.status) && Number(event.price) > 0 && !hasRealPayments;
    const existingAutoIncome = state.incomes.find(i=> i.eventId===event.id && i.autoFromEvent);
    if(eligible){
      const incomeEntry = {
        id: existingAutoIncome ? existingAutoIncome.id : uid(),
        date: event.date, operation: 'Оплата', product: event.product || 'Мастер-класс',
        account: 'Точка', eventId: event.id, amount: Number(event.price), masterName: '', itemSaleId: '', orderId: '',
        comment: `Мероприятие: ${event.title || 'без названия'}`, autoFromEvent: true,
      };
      const idx = state.incomes.findIndex(x=>x.id===incomeEntry.id);
      if(idx>=0) state.incomes[idx] = incomeEntry; else state.incomes.push(incomeEntry);
      await saveIncomes();
    } else if(existingAutoIncome){
      state.incomes = state.incomes.filter(x=>x.id !== existingAutoIncome.id);
      await saveIncomes();
    }
  }

  // синхронизация построчного "Журнала платежей" мероприятия с "Книга → Доходы": у каждой реальной
  // оплаты (кроме списанных с сертификата — это не новые деньги, а трата уже собранного при продаже
  // сертификата) появляется зеркальная запись в "Книге" датой самого платежа. Работает для любого статуса
  // мероприятия (в отличие от syncEventIncomeIfNeeded, который знает только "Частник"/"Выезд").
  async function syncEventPaymentsToBook(event){
    const payments = Array.isArray(event.payments) ? event.payments : [];
    let paymentsIdsAssigned = false;
    payments.forEach(p=>{ if(!p.id){ p.id = uid(); paymentsIdsAssigned = true; } });

    // "живые" оплаты — не сертификат (эти деньги уже учтены доходом при продаже сертификата) и не возврат.
    const genuinePayments = payments.filter(p=> p.source !== 'Сертификат' && !p.certRedemptionRef && p.type !== 'refund' && !p.refundRef);
    // записи возврата (source:'Возврат'/type:'refund' — добавляется при сохранении возврата в "Возвратах").
    // Зеркалим их в "Книгу" отрицательной суммой, но ТОЛЬКО если по мероприятию уже ведётся построчный
    // журнал (есть хоть одна "живая" оплата) — тогда это нужно, чтобы "Книга" осталась равна выручке
    // мероприятия после возврата (ev.price к этому моменту уже уменьшен на сумму возврата). Если же
    // журнал не велся вовсе (грубая запись "на всю сумму" по частнику/выезду), возврат уже и так учтён —
    // через уменьшение ev.price, которое подхватит syncEventIncomeIfNeeded, — второй раз зеркалить не нужно.
    // Задвоения с "Возвраты" в Кэшфлоу при этом не происходит: зеркальная запись помечена autoFromPayment
    // и не участвует в строке "Доходы из «Книги»" кэшфлоу, а "Оплаты по мероприятиям" считается отдельно
    // и только по записям с явной датой — у записи возврата даты нет, так что туда она тоже не попадает.
    const refundPayments = payments.filter(p=> (p.type === 'refund' || p.refundRef) && p.source !== 'Сертификат' && !p.certRedemptionRef);
    const realPayments = genuinePayments.length > 0 ? [...genuinePayments, ...refundPayments] : [];
    const currentPaymentIds = new Set(realPayments.map(p=>p.id));

    let incomesChanged = false;
    const stale = state.incomes.filter(i=> i.eventId===event.id && i.autoFromPayment && !currentPaymentIds.has(i.paymentId));
    if(stale.length){
      const staleIds = new Set(stale.map(i=>i.id));
      state.incomes = state.incomes.filter(i=>!staleIds.has(i.id));
      incomesChanged = true;
    }

    realPayments.forEach(p=>{
      const date = (p.date && p.date.trim()) ? p.date.trim() : (p.ts ? fmtDate(new Date(p.ts)) : event.date);
      const existing = state.incomes.find(i=> i.eventId===event.id && i.autoFromPayment && i.paymentId===p.id);
      // если оплата привязана к конкретному гостю (см. "Гости по отдельности") — подписываем его в комментарии,
      // чтобы в "Книге" было видно, кто именно заплатил, а не только общая сумма по мероприятию
      const guestForPayment = p.guestId && Array.isArray(event.guestList) ? event.guestList.find(g=>g.id===p.guestId) : null;
      const guestSuffix = guestForPayment && guestForPayment.name ? ` — ${guestForPayment.name}` : '';
      const entry = {
        id: existing ? existing.id : uid(),
        date, operation: 'Оплата', product: event.product || 'Мастер-класс',
        account: p.source || '', eventId: event.id, paymentId: p.id, amount: Number(p.amount)||0,
        masterName: '', itemSaleId: '', orderId: '',
        comment: `Оплата по журналу: ${event.title || 'без названия'}${guestSuffix}`, autoFromPayment: true,
      };
      if(!existing || existing.date!==entry.date || existing.amount!==entry.amount || existing.account!==entry.account || existing.comment!==entry.comment){
        const idx = state.incomes.findIndex(i=>i.id===entry.id);
        if(idx>=0) state.incomes[idx] = entry; else state.incomes.push(entry);
        incomesChanged = true;
      }
    });

    // построчные записи появились — старая грубая запись "на всю сумму" (если была) больше не нужна
    if(genuinePayments.length > 0){
      const oldAutoFull = state.incomes.find(i=> i.eventId===event.id && i.autoFromEvent);
      if(oldAutoFull){
        state.incomes = state.incomes.filter(i=>i.id!==oldAutoFull.id);
        incomesChanged = true;
      }
    }

    if(incomesChanged) await saveIncomes();
    if(paymentsIdsAssigned){
      const idx = state.events.findIndex(e=>e.id===event.id);
      if(idx>=0){ state.events[idx].payments = payments; await saveEvents(); }
    }
  }

  async function autoDeductCanvasesForPastPaintingEvents(){
    // 1 гость = 1 холст, только для уже прошедших мероприятий по рисованию — будущие не трогаем.
    // Пере-проверяется при каждой загрузке (не разовая миграция), т.к. мероприятия со временем "переходят" из будущих в прошедшие.
    const canvasCatalog = state.materialsCatalog.find(m=>m.name.trim().toLowerCase()==='холст');
    if(!canvasCatalog) return; // в справочнике "Себес" нет материала "Холст" — списывать нечего

    const today = todayStr();
    let eventsChanged = false;
    let catalogChanged = false;
    state.events.forEach(e=>{
      if(!isPaintingEvent(e.title)) return;
      if(!e.date || e.date > today) return; // будущие даты не трогаем
      if(!Array.isArray(e.materialsItems)) e.materialsItems = [];
      if(e.materialsItems.some(m=>m.autoCanvas)) return; // это мероприятие уже обработано ранее
      const guests = (e.guests!==undefined && e.guests!==null && !isNaN(e.guests)) ? Number(e.guests) : 0;
      if(guests <= 0) return;
      e.materialsItems.push({ name: canvasCatalog.name, cost: canvasCatalog.cost * guests, qty: guests, source: 'studio', autoCanvas: true });
      eventsChanged = true;
      if(canvasCatalog.trackStock){
        canvasCatalog.stock = (canvasCatalog.stock!==undefined && canvasCatalog.stock!==null && !isNaN(canvasCatalog.stock) ? Number(canvasCatalog.stock) : 0) - guests;
        catalogChanged = true;
      }
    });
    if(eventsChanged) await saveEvents();
    if(catalogChanged) await saveMaterialsCatalog();
  }

  async function autoApplyMaterialRulesForPastEvents(){
    // для видов мероприятий со статьями расхода материалов (настраивается в "Виды мероприятий", может быть несколько статей на вид) —
    // после того как мероприятие прошло, каждая статья сама добавляется строкой в его себестоимость.
    // "Студия" — просто известная цена материала. "Мастер" — компенсация конкретному человеку (не обязательно ведущему),
    // попадает и в его зарплату, и в себестоимость — через тот же механизм, что и при ручном добавлении строки с "Кому платить".
    // Будущие мероприятия не трогаем. Пере-проверяется при каждой загрузке, каждая статья на каждое мероприятие — один раз.
    const typesWithRules = state.eventTypes.filter(t=>Array.isArray(t.materialRules) && t.materialRules.length>0);
    if(typesWithRules.length === 0) return;
    const today = todayStr();
    let eventsChanged = false;
    state.events.forEach(e=>{
      if(!e.date || e.date > today) return;
      const title = (e.title||'').trim().toLowerCase();
      const matchedType = typesWithRules.find(t=>t.name.trim().toLowerCase() === title);
      if(!matchedType) return;
      const guests = (e.guests!==undefined && e.guests!==null && !isNaN(e.guests)) ? Number(e.guests) : 0;
      if(guests <= 0) return;
      if(!Array.isArray(e.materialsItems)) e.materialsItems = [];
      matchedType.materialRules.forEach(rule=>{
        if(!rule.name || !rule.ratePerGuest || rule.ratePerGuest<=0) return;
        if(rule.policy==='master' && !rule.payeeMaster) return;
        const tag = 'autorule:' + rule.name.trim().toLowerCase() + ':' + rule.policy;
        const already = e.materialsItems.some(m=>m.autoRuleTag === tag);
        if(already) return;
        const amount = guests * rule.ratePerGuest;
        if(rule.policy === 'master'){
          e.materialsItems.push({ name: rule.name, cost: amount, source: 'master', payTo: rule.payeeMaster, autoRuleTag: tag });
        } else {
          e.materialsItems.push({ name: rule.name, cost: amount, qty: guests, source: 'studio', autoRuleTag: tag });
        }
        eventsChanged = true;
      });
    });
    if(eventsChanged) await saveEvents();
  }

  function downloadFile(filename, content, mime){
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;

  // автоматический бэкап — раз в сутки, без участия человека. Хранится 7 копий по дням недели
  // (auto-backup-0 .. auto-backup-6), так что место не растёт бесконечно, а глубина — неделя.
  async function autoBackupCheckAndRun(){
    try{
      const lastRun = await window.storage.get('auto-backup-last-run', true);
      const lastRunAt = lastRun ? new Date(lastRun.value) : null;
      const now = new Date();
      if(lastRunAt && !isNaN(lastRunAt.getTime()) && (now - lastRunAt) < 24*60*60*1000) return;
      const dow = now.getDay();
      await storageSetWithRetry(`auto-backup-${dow}`, buildJsonExport());
      await storageSetWithRetry('auto-backup-last-run', now.toISOString());
      if(!state.autoBackupMeta) state.autoBackupMeta = {};
      state.autoBackupMeta[dow] = now.toISOString();
      await storageSetWithRetry('auto-backup-meta', JSON.stringify(state.autoBackupMeta));
    }catch(e){ /* автобэкап не критичен — не мешаем работе приложения при сбое */ }
  }

  // ежедневные push-напоминания: смены хостес на сегодня + закончившиеся отслеживаемые материалы.
  // Не чаще раза в ~20 часов — сработает у того, кто первым откроет приложение в этот день.
  async function checkAndSendDailyPushReminders(){
    try{
      const lastRun = await window.storage.get('daily-push-reminders-last-run', true);
      const lastRunAt = lastRun ? new Date(lastRun.value) : null;
      const now = new Date();
      if(lastRunAt && !isNaN(lastRunAt.getTime()) && (now - lastRunAt) < 20*60*60*1000) return;
      await storageSetWithRetry('daily-push-reminders-last-run', now.toISOString());

      const todayShifts = state.hostessShifts[todayStr()];
      if(todayShifts){
        const names = [];
        SHIFT_DEFS.forEach(s=>{

          if(entry && entry.name) names.push(`${entry.name} (${entry.start}–${entry.end})`);
        });
        if(names.length > 0){

        }
      }

      const outOfStock = state.materialsCatalog.filter(m=>m.trackStock && (m.stock===undefined||m.stock===null||m.stock<=0));
      if(outOfStock.length > 0){
        await sendPushNotification('Закончился материал', outOfStock.map(m=>m.name).join(', '), ['admin','owner']);
      }
      const belowMinStock = state.materialsCatalog.filter(m=>m.trackStock && m.minStock>0 && m.stock!==undefined && m.stock!==null && m.stock>0 && m.stock<m.minStock);
      if(belowMinStock.length > 0){

      }
    }catch(e){ /* напоминания не критичны — не мешаем работе приложения при сбое */ }
  }


  async function storageSetWithRetry(key, value, attempts=3){
    let lastErr = null;
    for(let i=0;i<attempts;i++){
      try{
        const res = await window.storage.set(key, value, true);
        if(res){
          if(key !== 'sync-token') bumpSyncToken(); // не ждём — не критично для основного сохранения
          return true;
        }
        lastErr = new Error('empty result');
      }catch(e){
        lastErr = e;
      }
      if(i < attempts-1) await sleep(500 * (i+1));
    }
    console.error('storage save failed after retries:', key, lastErr);
    showSaveError();
    return false;
  }

  // "токен синхронизации" — общий на всех; меняется при каждом сохранении кем угодно.
  // Если у нас на руках токен старее — значит, кто-то ещё поменял данные, пока мы были здесь.
  async function bumpSyncToken(){
    try{
      const token = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      await window.storage.set('sync-token', token, true);
      state.syncToken = token;
    }catch(e){ /* не критично, просто пропустим */ }
  }

  async function checkForRemoteChanges(){
    if(state.syncWarningShown || !state.syncToken) return;
    try{
      const t = await window.storage.get('sync-token', true);
      if(t && t.value && t.value !== state.syncToken){
        state.syncWarningShown = true;
        showSyncWarningBanner();
      }
    }catch(e){ /* тихо пропускаем, попробуем при следующей проверке */ }
  }

  function showSyncWarningBanner(){
    if(document.getElementById('sync-warning-banner')) return;

  function addDaysToDateStr(dateStr, days){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate()+days);
    return fmtDate(dt);
  }
  const EVENTS_INTEGRITY_DAYS_BACK = 3;
  const EVENTS_INTEGRITY_DAYS_FWD = 120;
  function buildEventsIntegritySnapshotList(from, to){
    return state.events
      .filter(e => (e.status||'confirmed')==='confirmed' && e.date && e.date>=from && e.date<=to)
      .map(e => ({ id: e.id, date: e.date, time: e.time||'', title: e.title||'', host: e.host||'' }));
  }
  // Проверка сохранности мероприятий "По расписанию": при каждой УСПЕШНОЙ загрузке данных с сервера
  // (никогда — при неудачной, см. комментарий в loadData) сравниваем список таких мероприятий за окно
  // "3 дня назад — 120 дней вперёд" с тем, что было записано в прошлый раз. Если часть пропала —
  // записываем это как предупреждение, которое видно в окне "Сохранность расписания".
  async function checkEventsIntegrity(){
    const today = todayStr();
    const from = addDaysToDateStr(today, -EVENTS_INTEGRITY_DAYS_BACK);
    const to = addDaysToDateStr(today, EVENTS_INTEGRITY_DAYS_FWD);
    const currentList = buildEventsIntegritySnapshotList(from, to);
    const currentIds = new Set(currentList.map(e=>e.id));
    const prevSnapshot = state.eventsIntegritySnapshot;
    if(prevSnapshot && Array.isArray(prevSnapshot.events) && prevSnapshot.events.length > 0){
      // сравниваем только те мероприятия из прошлого снимка, что по-прежнему должны попадать в текущее окно —
      // иначе мероприятие, просто "выкатившееся" из окна назад по времени, ложно считалось бы пропавшим
      const stillRelevant = prevSnapshot.events.filter(e => e.date >= from && e.date <= to);
      const missing = stillRelevant.filter(e => !currentIds.has(e.id));
      if(missing.length > 0){
        if(!state.eventsIntegrityAlerts) state.eventsIntegrityAlerts = [];
        state.eventsIntegrityAlerts.push({
          ts: new Date().toISOString(),
          prevCount: stillRelevant.length,
          currentCount: currentList.length,
          missingCount: missing.length,
          missing: missing.slice(0, 30).map(e=>({date:e.date, time:e.time, title:e.title, host:e.host})),
        });
        if(state.eventsIntegrityAlerts.length > 200) state.eventsIntegrityAlerts = state.eventsIntegrityAlerts.slice(-200);
        saveEventsIntegrityAlerts(); // не ждём — не критично для основной загрузки
      }
    }
    state.eventsIntegritySnapshot = { ts: new Date().toISOString(), from, to, events: currentList };
    saveEventsIntegritySnapshot(); // не ждём — не критично для основной загрузки
  }

  function monthReceiptsBreakdown(ym){
    const rows = (state.stockReceipts||[]).filter(r=> (r.date||'').startsWith(ym));
    const total = rows.reduce((s,r)=> s + (Number(r.amount)||0), 0);
    const catMap = {};

      const cat = (mat && mat.category && mat.category.trim()) ? mat.category.trim() : 'Без категории';
      catMap[cat] = (catMap[cat] || 0) + (Number(r.amount) || 0);
    });
    const byCategory = Object.entries(catMap).map(([category, amount])=>({category, amount})).sort((a,b)=>b.amount-a.amount);
    return { total, count: rows.length, byCategory };
  }
  // ЗП менеджеров за месяц: оклад + % от выручки "Частник" + % от выручки "По расписанию" + % от суммы проданных сертификатов.
  // Единая цифра на всех менеджеров (не привязана к конкретному человеку — см. обсуждение при добавлении).
  function computeManagerSalaryForMonth(ym){
    const revenueByStatus = { confirmed: 0, tentative: 0 };
    state.events.forEach(e=>{
      if(!e.date || !e.date.startsWith(ym)) return;
      if(e.status!=='confirmed' && e.status!=='tentative') return;
      const price = (e.price!==undefined && e.price!==null && !isNaN(e.price)) ? Number(e.price) : 0;
      revenueByStatus[e.status] += price;
    });
    const certsRevenue = state.certificates.reduce((sum,c)=>{
      if(!c.saleDate || !c.saleDate.startsWith(ym)) return sum;
      if(c.purpose === 'marketing') return sum; // маркетинговые сертификаты — не продажа, в выручку не считаем
      const amt = (c.amount!==undefined && c.amount!==null && !isNaN(c.amount)) ? Number(c.amount) : 0;
      return sum + amt;
    }, 0);
    const bonusTentative = Math.round(revenueByStatus.tentative * MANAGER_SALARY_PCT_TENTATIVE);
    const bonusConfirmed = Math.round(revenueByStatus.confirmed * MANAGER_SALARY_PCT_CONFIRMED);
    const bonusCerts = Math.round(certsRevenue * MANAGER_SALARY_PCT_CERTS);
    const total = MANAGER_SALARY_BASE + bonusTentative + bonusConfirmed + bonusCerts;
    return {
      base: MANAGER_SALARY_BASE,
      revenueTentative: revenueByStatus.tentative, bonusTentative,
      revenueConfirmed: revenueByStatus.confirmed, bonusConfirmed,
      certsRevenue, bonusCerts,
      total,
    };
  }

  const MIN_GAP_MINUTES = 30;
  function timeToMinutes(t){
    if(!t) return 0;
    const parts = t.split(':').map(Number);
    return (parts[0]||0)*60 + (parts[1]||0);
  }
  // Фактическое время занятости пространства с учётом доп. аренды до/после (актуально для частников)
  function effectiveStart(e){ return timeToMinutes(e.time) - (Number(e.rentalBefore)||0); }
  function effectiveEnd(e){ return timeToMinutes(e.time) + (Number(e.duration)||0) + (Number(e.rentalAfter)||0); }

  // Возвращает { eventId: gapMinutes } для событий, у которых перерыв с предыдущим
  // мероприятием в ТОМ ЖЕ пространстве меньше MIN_GAP_MINUTES (может быть отрицательным при наложении)
  function computeGapWarnings(evts){
    const bySpace = {};
    evts.forEach(e=>{ (bySpace[e.spaceId] = bySpace[e.spaceId] || []).push(e); });
    const warnMap = {};
    Object.values(bySpace).forEach(list=>{
      const sorted = [...list].sort((a,b)=> effectiveStart(a) - effectiveStart(b));
      for(let i=1;i<sorted.length;i++){
        const prev = sorted[i-1], cur = sorted[i];
        const prevEnd = effectiveEnd(prev);
        const curStart = effectiveStart(cur);
        const gap = curStart - prevEnd;
        if(gap < MIN_GAP_MINUTES){
          warnMap[cur.id] = { gap, prevTitle: prev.title, prevEndMinutes: prevEnd };
        }
      }
    });
    return warnMap;
  }

  function attachLoginGateEvents(){
    const input = document.getElementById('gate-code');
    const errorEl = document.getElementById('gate-error');
    const submit = ()=>{
      const val = input.value.trim();
      const matchedRole = CODE_LOGIN_ROLES.find(r => val && val === state.roleCodes[r]);
      if(matchedRole){
        state.currentRole = matchedRole;
        state.unlocked = true;
        state.unlockedAdmin = ['assistant','admin','owner'].includes(matchedRole);
        state.unlockedOwner = (matchedRole === 'owner');
        state.loggedInMasterName = null;
        state.loggedInHostessName = null;
        state.loggedInManagerName = null;
        render();
        checkPushSubscriptionStatus().then(enabled=>{ state.pushEnabled = enabled; render(); });
        return;
      }
      const matchedMasterName = val ? Object.keys(state.masterPersonalPasswords).find(name => state.masterPersonalPasswords[name] && state.masterPersonalPasswords[name] === val) : null;
      if(matchedMasterName){
        state.currentRole = 'master';
        state.unlocked = true;
        state.unlockedAdmin = false;
        state.unlockedOwner = false;
        state.loggedInMasterName = matchedMasterName;
        state.loggedInHostessName = null;
        state.loggedInManagerName = null;
        render();
        checkPushSubscriptionStatus().then(enabled=>{ state.pushEnabled = enabled; render(); });
        return;
      }
      const matchedHostessName = val ? Object.keys(state.hostessPersonalPasswords).find(name => state.hostessPersonalPasswords[name] && state.hostessPersonalPasswords[name] === val) : null;
      if(matchedHostessName){
        state.currentRole = 'hostess';
        state.unlocked = true;
        state.unlockedAdmin = false;
        state.unlockedOwner = false;
        state.loggedInMasterName = null;
        state.loggedInHostessName = matchedHostessName;
        state.loggedInManagerName = null;
        render();
        checkPushSubscriptionStatus().then(enabled=>{ state.pushEnabled = enabled; render(); });
        return;
      }
      const matchedManagerName = val ? Object.keys(state.managerPersonalPasswords).find(name => state.managerPersonalPasswords[name] && state.managerPersonalPasswords[name] === val) : null;
      if(matchedManagerName){
        state.currentRole = 'manager';
        state.unlocked = true;
        state.unlockedAdmin = false;
        state.unlockedOwner = false;
        state.loggedInMasterName = null;
        state.loggedInHostessName = null;
        state.loggedInManagerName = matchedManagerName;
        render();
        checkPushSubscriptionStatus().then(enabled=>{ state.pushEnabled = enabled; render(); });
        return;
      }
      errorEl.style.display = 'block';
      input.style.borderColor = 'var(--danger)';
      input.value = '';
      input.focus();
    };
    document.getElementById('gate-submit').onclick = submit;
    input.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  }

  function computeDailyAlerts(){
    const alerts = [];
    const today = todayStr();

    // просроченная выдача изделий (смола, тафтинг)
    let overduePickups = 0;
    state.events.forEach(e=>{
      (e.pickupItems||[]).forEach(p=>{
        if(p.status!=='picked_up' && p.readyDate && p.readyDate < today) overduePickups++;
      });
    });
    if(overduePickups > 0 && roleCanAccessManagersTab(state.currentRole)) alerts.push({icon:'📦', text:`Просрочено выдач: ${overduePickups}`, view:'certificates', certView:'pickups'});

    // закончились отслеживаемые материалы
    const outOfStock = state.materialsCatalog.filter(m=>m.trackStock && (m.stock===undefined||m.stock===null||m.stock<=0));
    if(outOfStock.length > 0) alerts.push({icon:'🧱', text:`Закончился материал: ${outOfStock.map(m=>m.name).join(', ')}`, view: roleCanAccessProcurement(state.currentRole) ? 'procurement' : undefined});

    // остаток ниже заданного минимума (но ещё не закончился)
    const belowMinStock = state.materialsCatalog.filter(m=>m.trackStock && m.minStock>0 && m.stock!==undefined && m.stock!==null && m.stock>0 && m.stock<m.minStock);
    if(belowMinStock.length > 0) alerts.push({icon:'📉', text:`Ниже минимального остатка: ${belowMinStock.map(m=>m.name).join(', ')}`, view: roleCanAccessProcurement(state.currentRole) ? 'procurement' : undefined});

    // несданные отчёты мастеров за последние 14 дней
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-14);
    const cutoffStr = fmtDate(cutoff);
    const missingReports = state.events.filter(e=> e.host && e.host.trim() && e.date && e.date>=cutoffStr && e.date<=today && !hasMasterReport(e)).length;
    if(missingReports > 0) alerts.push({icon:'📝', text:`Не сдано отчётов за 2 недели: ${missingReports}`});

    return alerts;
  }

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
  }

  async function checkPushSubscriptionStatus(){
    try{
      if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(!sub) return false;
      // подписка на этом устройстве уже есть — обновляем роль на сервере на случай,
      // если с этого же устройства (например, общий планшет на ресепшене) теперь зашёл кто-то другой
      try{
        await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscription: sub.toJSON(), role: state.currentRole }),
        });
      }catch(e){ /* не критично — хотя бы локальный статус знаем */ }
      return true;
    }catch(e){ return false; }
  }

  async function subscribeToPush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      showToast('Браузер не поддерживает уведомления', 'error');
      return false;
    }
    try{
      const permission = await Notification.requestPermission();
      if(permission !== 'granted'){
        showToast('Уведомления не разрешены в браузере', 'error');
        return false;
      }
      const keyRes = await fetch('/api/push/vapid-public-key');
      const { publicKey } = await keyRes.json();
      if(!publicKey){
        showToast('Push пока не настроен на сервере', 'error');
        return false;
      }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
      await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: sub.toJSON(), role: state.currentRole }),
      });
      return true;
    }catch(e){
      showToast('Не получилось включить уведомления', 'error');
      return false;
    }
  }

  async function unsubscribeFromPush(){
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        await fetch('/api/push/unsubscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: sub.endpoint }),
        });
        await sub.unsubscribe();
      }
    }catch(e){ /* не критично */ }
  }

  async function sendPushNotification(title, body, targetRoles){

        body: JSON.stringify({ title, body, targetRoles }),
      });
    }catch(e){ /* push не критичен для основного действия пользователя */ }
  }

  // независимо от того, сколько раз за день кто-то откроет приложение
  async function pushHostessShiftReminderCheckAndRun(){
    try{
      const today = todayStr();
      const lastSent = await window.storage.get('push-hostess-reminder-last-sent', true);
      if(lastSent && lastSent.value === today) return;
      const dayShifts = state.hostessShifts[today];
      if(dayShifts){
        const names = SHIFT_DEFS.map(s=>{
          const entry = normalizeShiftEntry(dayShifts[s.key], s);
          return (entry && entry.name) ? `${entry.name} (${entry.start}–${entry.end})` : null;
        }).filter(Boolean);
        if(names.length > 0){
          await sendPushNotification('Смены сегодня', names.join(', '), ['hostess']);
        }
      }
      await storageSetWithRetry('push-hostess-reminder-last-sent', today);
    }catch(e){ /* напоминание не критично для работы приложения */ }
  }

    return `<div class="space-tabs">` + allTab + state.spaces.map(s=>`

  function renderCalendar(){
    const cursor = state.cursor;
    const year = cursor.getFullYear(), month = cursor.getMonth();
    const first = new Date(year, month, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday=0
    const gridStart = new Date(year, month, 1 - startOffset);
    const isAll = state.activeSpaceId === 'all';
    const space = getSpace(state.activeSpaceId);
    const monthLabel = MONTHS[month] + ' ' + year;

    let cells = '';
    for(let i=0;i<42;i++){
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
      const dStr = fmtDate(d);
      const inMonth = d.getMonth() === month;
      const isToday = dStr === todayStr();
      const evts = eventsFor(state.activeSpaceId, dStr);
      const shown = evts.slice(0,3);
      const extra = evts.length - shown.length;
      const hasWarning = Object.keys(computeGapWarnings(evts)).length > 0;
      const hostessLine = shiftSummaryShort(dStr);
      const managerLine = managerForDate(dStr);
      const dayOffEntries = dayOffEntriesFor(dStr);
      cells += `
        <div class="cal-cell ${inMonth?'':'other-month'} ${isToday?'today':''}" data-date="${dStr}">
          <div class="cal-daynum">${d.getDate()}${hasWarning?' <span class="cal-warn-icon" title="Перерыв между мероприятиями меньше 30 минут">⚠</span>':''}${dayOffEntries.length ? `<span class="cal-dayoff-marks">${dayOffEntries.map(x=>`<span class="cal-dayoff-x" title="${escapeHtml(x.name)} — выходной (${escapeHtml(ROLE_LABELS[x.role]||x.role)})">✕</span>`).join('')}</span>` : ''}</div>
          ${hostessLine ? `<div class="cal-hostess" title="Админ: ${escapeHtml(hostessLine)}">🧑 ${escapeHtml(hostessLine)}</div>` : ''}
          ${managerLine ? `<div class="cal-manager" title="Менеджер: ${escapeHtml(managerLine)}">👔 ${escapeHtml(managerLine)}</div>` : ''}
          ${dayOffEntries.length ? `<div class="cal-dayoff-line" title="Выходной: ${escapeHtml(dayOffEntries.map(x=>`${x.name} (${ROLE_LABELS[x.role]||x.role})`).join(', '))}">🚫 ${escapeHtml(dayOffEntries.map(x=>x.name).join(', '))}</div>` : ''}
          <div class="cal-events">
            ${shown.map(e=>`<div class="cal-evt-chip" style="background:${statusColor(e.status)}">${isAll?spaceBadge(getSpace(e.spaceId),'xs'):''}<span class="t">${e.time}</span><span class="evt-title">${escapeHtml(e.title)}</span></div>`).join('')}
            ${extra>0?`<div class="cal-more">+${extra} ещё</div>`:''}
          </div>
        </div>
      `;
      if(i%7===6 && i > 34) break;
    }

    const scopedEvts = state.events.filter(e=> isAll || e.spaceId===state.activeSpaceId);
    const legend = `
      <div class="status-legend">
        ${Object.keys(STATUS_LABEL).map(key=>{
          const count = scopedEvts.filter(e=>(e.status||'confirmed')===key).length;
          return `<span class="item"><span class="sw" style="background:${statusColor(key)}"></span>${STATUS_LABEL[key]} (${count})</span>`;
        }).join('')}
      </div>
      ${isAll ? `
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;">
        ${state.spaces.map(s=>`<span style="font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);display:inline-flex;align-items:center;gap:6px;">${spaceBadge(s,'sm')}${escapeHtml(s.name)}</span>`).join('')}
      </div>` : ''}
    `;

    return `
      <div class="cal-nav">
        <div class="month-label">${monthLabel}</div>
        <div class="cal-nav-btns">
          <button class="today-btn" id="btn-today">сегодня</button>
          <button class="nav-btn" id="btn-prev">‹</button>
          <button class="nav-btn" id="btn-next">›</button>
        </div>
      </div>
      ${legend}
      <div class="cal-grid-wrap">
        <div class="cal-grid">
          ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${cells}
        </div>
      </div>
    `;
  }

  function renderHostView(){
    const hosts = allHosts();
    let body = '';
    if(hosts.length === 0){
      body = `<div class="host-empty">Пока нет ни одного мероприятия с указанным ведущим.<br>Добавьте события в разделе «По пространствам».</div>`;
    } else {
      if(!state.activeHost || !hosts.includes(state.activeHost)) state.activeHost = hosts[0];
      const chips = `<div class="host-chips">${hosts.map(h=>`<div class="host-chip ${h===state.activeHost?'active':''}" data-host="${escapeHtml(h)}">${escapeHtml(h)}</div>`).join('')}</div>`;

      const evts = state.events.filter(e => {
        const names = eventHostsWithPay(e).map(h=>h.name);
        return names.includes(state.activeHost);
      }).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

      const today = todayStr();
      const upcoming = evts.filter(e=> e.date >= today);
      const past = evts.filter(e=> e.date < today);

      function row(e){
        const sp = getSpace(e.spaceId);
        const dLabel = formatDateText(e.date);
        const isPast = e.date < today;
        return `
          <div class="host-row ${isPast?'past':''}" data-eid="${e.id}">
            <div class="date"><span class="chip-dot" style="background:${statusColor(e.status)};display:inline-block;margin-right:6px;"></span>${dLabel}</div>
            <div class="time">${e.time}</div>
            <div class="info">
              <div class="title">${escapeHtml(e.title)}</div>
              <div class="space" style="display:flex;align-items:center;gap:6px;">${spaceBadge(sp,'sm')}${escapeHtml(sp.name)}${e.product?' · '+escapeHtml(e.product):''}</div>
            </div>
            <div class="duration">${e.duration ? formatDuration(e.duration) : ''}${(e.guests!==undefined&&e.guests!==null&&e.guests!=='')?'<br>👤 '+e.guests:''}</div>
          </div>
        `;
      }

      body = `
        <div class="host-picker">
          <label>Ведущий</label>
          ${chips}
        </div>
        <div class="host-list">
          ${upcoming.length ? `<div class="host-group-label">Предстоящие</div>` + upcoming.map(row).join('') : ''}
          ${past.length ? `<div class="host-group-label">Прошедшие</div>` + past.map(row).join('') : ''}
          ${evts.length===0 ? `<div class="host-empty">У этого ведущего пока нет мероприятий</div>` : ''}
        </div>
      `;
    }
    return body;
  }

  function nextCertNumber(){

      <div class="cert-subtabs">

  function renderMarketingStatsView(){
    const mode = state.marketingStatsMode || 'month';
    const cursor = state.marketingStatsCursor || (state.marketingStatsCursor = new Date());
    const year = cursor.getFullYear();
    const monthIdx = cursor.getMonth();
    const ym = year+'-'+pad(monthIdx+1);
    const periodLabel = mode==='month' ? (MONTHS[monthIdx]+' '+year) : (year+' год');
    const navLabel = mode==='month' ? periodLabel : String(year); // в шапке без слова «год» — CSS делает text-transform:capitalize и превращает его в «Год»
    const inPeriod = (dateStr)=> dateStr && (mode==='month' ? dateStr.startsWith(ym) : dateStr.startsWith(String(year)));

    const spendInPeriod = state.marketingSpend.filter(m=> inPeriod(m.date));
    const leadsInPeriod = state.leads.filter(l=> inPeriod(l.requestDate));

    const totalSpendPeriod = spendInPeriod.reduce((s,m)=>s+(Number(m.amount)||0), 0);
    const totalRevenuePeriod = state.events
      .filter(e=> inPeriod(e.date))
      .reduce((s,e)=> s + eventRevenueForecast(e), 0);
    const spendPctOfRevenue = totalRevenuePeriod>0 ? (totalSpendPeriod/totalRevenuePeriod*100) : null;

    const marketingCertsInPeriod = state.certificates.filter(c=> c.purpose==='marketing' && inPeriod(c.saleDate));
    const marketingCertsValue = marketingCertsInPeriod.reduce((s,c)=> s + (Number(c.amount)||0), 0);

    // сколько раз реально ПРИШЛИ и воспользовались маркетинговым сертификатом за период — считаем по всем
    // маркетинговым сертификатам (не только выпущенным в этом периоде), но сами списания смотрим за этот период
    const marketingRedemptionsInPeriod = [];
    state.certificates.filter(c=>c.purpose==='marketing').forEach(c=>{
      (c.redemptions||[]).forEach(r=>{
        if(inPeriod(r.date)) marketingRedemptionsInPeriod.push(r);
      });
    });

    const byDirection = {};
    spendInPeriod.forEach(m=>{
      byDirection[m.direction] = (byDirection[m.direction]||0) + (Number(m.amount)||0);
    });
    const maxDir = Math.max(1, ...Object.values(byDirection));

    // канал = соцсеть, если указана; иначе — само направление (для офлайн-направлений типа "Листовки")
    const channelOf = (m)=> m.socialNetwork || m.direction;
    const spendByChannel = {};
    spendInPeriod.forEach(m=>{
      const ch = channelOf(m);
      spendByChannel[ch] = (spendByChannel[ch]||0) + (Number(m.amount)||0);
    });
    const leadsByChannel = {};
    const soldByChannel = {};
    const soldRevenueByChannel = {};
    leadsInPeriod.forEach(l=>{
      leadsByChannel[l.source] = (leadsByChannel[l.source]||0) + 1;
      if(l.sold){
        soldByChannel[l.source] = (soldByChannel[l.source]||0) + 1;
        soldRevenueByChannel[l.source] = (soldRevenueByChannel[l.source]||0) + (Number(l.revenue)||0);
      }
    });
    const allChannels = [...new Set([...Object.keys(spendByChannel), ...Object.keys(leadsByChannel)])];

    // блогеры — рейтинг по цене охвата (дешевле охват — выше в списке)
    const bloggerRows = spendInPeriod.filter(m=>m.direction==='Блогеры').map(m=>{
      const linkedEvent = m.eventId ? state.events.find(e=>e.id===m.eventId) : null;
      const linkedRevenue = linkedEvent ? eventRevenueForecast(linkedEvent) : null;
      const realRoi = (linkedRevenue!==null && Number(m.amount)>0) ? Math.round((linkedRevenue/Number(m.amount))*100) : null;
      return {
        ...m,
        perReach: (m.reach && Number(m.reach)>0) ? (Number(m.amount)/Number(m.reach)) : null,
        linkedEvent, linkedRevenue, realRoi,
      };
    }).sort((a,b)=>{
      // сначала те, у кого есть настоящая окупаемость по выручке (от большей к меньшей),
      // затем остальные — по цене охвата (от дешёвого к дорогому)
      if(a.realRoi!==null && b.realRoi===null) return -1;
      if(a.realRoi===null && b.realRoi!==null) return 1;
      if(a.realRoi!==null && b.realRoi!==null) return b.realRoi - a.realRoi;
      if(a.perReach===null) return 1;
      if(b.perReach===null) return -1;
      return a.perReach - b.perReach;
    });

    // только для режима «Год»: динамика по месяцам + погашения сертификатов по месяцам
    let yearOnlyHtml = '';
    if(mode === 'year'){
      const monthlyTotals = Array(12).fill(0);
      spendInPeriod.forEach(m=>{
        const mi = parseInt(m.date.slice(5,7),10) - 1;
        if(mi>=0 && mi<12) monthlyTotals[mi] += Number(m.amount)||0;
      });
      const redemptionsByMonth = Array(12).fill(0);
      marketingRedemptionsInPeriod.forEach(r=>{
        const mi = parseInt(r.date.slice(5,7),10) - 1;
        if(mi>=0 && mi<12) redemptionsByMonth[mi]++;
      });
      yearOnlyHtml = `
        ${marketingRedemptionsInPeriod.length>0 ? `
        <div class="analytics-section">
          <h4>Погашения маркетинговых сертификатов по месяцам — ${periodLabel}</h4>
          ${MONTHS.map((name,i)=> redemptionsByMonth[i]>0 ? `
            <div class="stat-row">
              <div class="stat-label">${escapeHtml(name)}</div>
              <div style="flex:1;font-family:var(--font-mono);font-size:13px;">${redemptionsByMonth[i]} раз</div>
            </div>
          ` : '').join('')}
        </div>
        ` : ''}
        <div class="analytics-section">
          <h4>Динамика по месяцам — ${periodLabel}</h4>
          ${renderBarChart(MONTHS.map((name,i)=>({ label: name.slice(0,3), value: monthlyTotals[i], valueLabel: formatMoney(monthlyTotals[i]) })))}
        </div>
      `;
    }

    const navHtml = `
      <div class="cal-nav" style="margin-bottom:14px;">
        <div class="month-label">${escapeHtml(navLabel)}</div>
        <div class="cal-nav-btns">
          <button class="today-btn" id="mst-mode-toggle">${mode==='month' ? '📆 Сводка за год' : '📅 По месяцам'}</button>
          <button class="today-btn" id="mst-today">${mode==='month' ? 'текущий месяц' : 'текущий год'}</button>
          <button class="nav-btn" id="mst-prev">‹</button>
          <button class="nav-btn" id="mst-next">›</button>
        </div>
      </div>
    `;

    return navHtml + `
      <div class="analytics-section">
        <h4>Общая картина — ${periodLabel}</h4>
        <div class="stat-row"><div class="stat-label">Потрачено на маркетинг</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;">${formatMoney(totalSpendPeriod)}</div></div>
        <div class="stat-row"><div class="stat-label">Доля от выручки студии</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;">${spendPctOfRevenue!==null ? spendPctOfRevenue.toFixed(1)+'%' : '— (выручки за этот период пока нет)'}</div></div>
        ${marketingCertsValue>0 ? `<div class="stat-row"><div class="stat-label">+ маркетинговые сертификаты (услугами)</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);">${formatMoney(marketingCertsValue)} · ${marketingCertsInPeriod.length} шт. — деньги не платились, но это тоже часть промо-бюджета</div></div>` : ''}
        <div class="stat-row"><div class="stat-label">Пришли по маркетинговому сертификату</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;">${marketingRedemptionsInPeriod.length>0 ? marketingRedemptionsInPeriod.length+' раз' : '— (пока никто не воспользовался)'}</div></div>
      </div>

      ${yearOnlyHtml}

      <div class="analytics-section">
        <h4>Траты по направлениям — ${periodLabel}</h4>
        ${Object.keys(byDirection).length===0 ? `<div style="color:var(--ink-soft);font-size:13px;">Пока нет данных за этот период.</div>` : Object.entries(byDirection).sort((a,b)=>b[1]-a[1]).map(([dir,amt])=>`
          <div class="stat-row">
            <div class="stat-label">${escapeHtml(dir)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(amt/maxDir*100)}%;"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(amt)}</div>
          </div>
        `).join('')}

  function attachMarketingSpendModalEvents(overlay){
    const directionSelect = overlay.querySelector('#ms-direction');
    const bloggerField = overlay.querySelector('#ms-blogger-field');
    const eventOptionsList = overlay.querySelector('#ms-event-options');
    const eventHintEl = overlay.querySelector('#ms-event-hint');
    const eventSearchInput = overlay.querySelector('#ms-event-search');
    const eventHidden = overlay.querySelector('#ms-event');
    let labelToId = {};

    function refreshEventOptions(){
      const isBlogger = directionSelect.value === 'Блогеры';
      const options = isBlogger
        ? eventSelectOptions()
        : eventSelectOptions().filter(o=> state.events.find(e=>e.id===o.id && e.status==='marketing'));
      labelToId = {};
      options.forEach(o=>{ labelToId[o.label] = o.id; });
      eventOptionsList.innerHTML = options.map(o=>`<option value="${escapeHtml(o.label)}">`).join('');
      eventHintEl.textContent = isBlogger
        ? 'Показаны все мероприятия — привяжите то, которое реально пришло по этому блогеру, тогда окупаемость посчитается по настоящей выручке.'
        : 'Показаны только мероприятия со статусом «Маркетинг» — например, съёмки или розыгрыши.';
      // если уже выбранное мероприятие больше не подходит под новый фильтр — сбрасываем выбор
      const currentLabel = eventSearchInput.value.trim();
      if(currentLabel && !labelToId[currentLabel]){
        eventSearchInput.value = '';
        eventHidden.value = '';
      }
    }
    refreshEventOptions();

    directionSelect.onchange = ()=>{
      bloggerField.style.display = directionSelect.value === 'Блогеры' ? 'block' : 'none';
      refreshEventOptions();
    };

    if(eventSearchInput && eventHidden){
      eventSearchInput.addEventListener('input', ()=>{
        const val = eventSearchInput.value.trim();
        if(val === ''){ eventHidden.value = ''; return; }
        if(labelToId[val]) eventHidden.value = labelToId[val];
      });
      eventSearchInput.addEventListener('blur', ()=>{
        const val = eventSearchInput.value.trim();
        if(val !== '' && !labelToId[val]){
          eventSearchInput.value = '';
          eventHidden.value = '';
        }
      });
    }

    overlay.querySelector('#btn-cancel-marketing-spend').onclick = ()=>{ state.modal = null; overlay.remove(); };

    overlay.querySelector('#btn-save-marketing-spend').onclick = async ()=>{
      const dateVal = overlay.querySelector('#ms-date').value;
      const directionVal = overlay.querySelector('#ms-direction').value;
      const socialVal = overlay.querySelector('#ms-social').value;
      const bloggerHandleVal = overlay.querySelector('#ms-blogger-handle').value.trim();
      const reachRaw = overlay.querySelector('#ms-reach').value;
      const amountRaw = overlay.querySelector('#ms-amount').value;
      const commentVal = overlay.querySelector('#ms-comment').value.trim();

      if(state.currentRole !== 'owner'){
        const ymCheck = dateVal ? dateVal.slice(0,7) : null;
        const origYm = (state.modal.marketingSpend.date) ? state.modal.marketingSpend.date.slice(0,7) : null;
        const blockedYm = [ymCheck, origYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      overlay.querySelectorAll('#ms-date,#ms-blogger-handle,#ms-amount').forEach(el=>el.style.borderColor='');

      if(!dateVal) markInvalid('ms-date');
      const bloggerMissing = directionVal === 'Блогеры' && !bloggerHandleVal;
      if(bloggerMissing) markInvalid('ms-blogger-handle');
      if(amountRaw === '' || Number(amountRaw) < 0) markInvalid('ms-amount');

      if(!dateVal || bloggerMissing || amountRaw==='' || Number(amountRaw)<0){
        showGapWarningBanner(bloggerMissing ? 'Для направления «Блогеры» укажите ник блогера.' : 'Заполните дату и сумму. Сумма не может быть отрицательной.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const updated = {
        id: state.modal.marketingSpend.id,
        date: dateVal,
        direction: directionVal,
        socialNetwork: socialVal,
        bloggerHandle: directionVal==='Блогеры' ? bloggerHandleVal : '',
        reach: (directionVal==='Блогеры' && reachRaw!=='') ? parseInt(reachRaw) : null,
        amount: parseInt(amountRaw),
        comment: commentVal,
        expenseId: state.modal.marketingSpend.expenseId || '',
        eventId: overlay.querySelector('#ms-event').value || '',
      };
      updated.expenseId = await syncMarketingSpendExpense(updated);

      // если трата привязана к мероприятию — она же появляется в его себестоимости, чтобы карточка
      // мероприятия и панель "📣 Маркетинг" в Аналитике тоже видели эту сумму
      const prevEventId = state.modal.marketingSpend.eventId || '';
      const affectedEventIds = new Set([prevEventId, updated.eventId].filter(Boolean));
      let anyEventChanged = false;
      affectedEventIds.forEach(eventId=>{
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        if(!Array.isArray(ev.materialsItems)) ev.materialsItems = [];
        const before = ev.materialsItems.length;
        ev.materialsItems = ev.materialsItems.filter(mi=>mi.msRef !== updated.id);
        if(eventId === updated.eventId){
          const label = updated.direction==='Блогеры' && updated.bloggerHandle ? `Маркетинг: ${updated.bloggerHandle}` : `Маркетинг: ${updated.direction}`;
          ev.materialsItems.push({ name: label, cost: updated.amount, source: 'studio', msRef: updated.id });
        }
        if(ev.materialsItems.length !== before || eventId === updated.eventId) anyEventChanged = true;
      });
      if(anyEventChanged) await saveEvents();

      const idx = state.marketingSpend.findIndex(x=>x.id===updated.id);
      if(idx>=0) state.marketingSpend[idx] = updated; else state.marketingSpend.push(updated);
      await saveMarketingSpend();
      recordAction('Трата на маркетинг сохранена');
      state.modal = null; overlay.remove(); render();
    };

    const delBtn = overlay.querySelector('#btn-del-marketing-spend');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.marketingSpend.date ? state.modal.marketingSpend.date.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      showConfirmDeletePopup('Удалить эту трату на маркетинг? Действие необратимо.', async ()=>{
        const toDelete = state.modal.marketingSpend;
        if(toDelete.expenseId){
          state.expenses = state.expenses.filter(x=>x.id !== toDelete.expenseId);
          await saveExpenses();
        }
        if(toDelete.eventId){
          const ev = state.events.find(e=>e.id===toDelete.eventId);
          if(ev && Array.isArray(ev.materialsItems)){
            const before = ev.materialsItems.length;
            ev.materialsItems = ev.materialsItems.filter(mi=>mi.msRef !== toDelete.id);
            if(ev.materialsItems.length !== before) await saveEvents();
          }
        }
        state.marketingSpend = state.marketingSpend.filter(x=>x.id !== toDelete.id);
        await saveMarketingSpend();
        state.modal = null; render();
      });
    };
  }

  function leadsAfterPost(post, windowDays=30){
    if(!post.date) return { count: 0, leads: [] };
    const start = post.date;
    const endDate = new Date(post.date+'T00:00:00');
    endDate.setDate(endDate.getDate() + windowDays);
    const end = endDate.toISOString().slice(0,10);
    const networks = post.socialNetworks || (post.socialNetwork ? [post.socialNetwork] : []);
    const matched = state.leads.filter(l=>{
      if(!networks.includes(l.source)) return false;
      if(post.product && l.product !== post.product) return false;
      return l.requestDate && l.requestDate >= start && l.requestDate <= end;
    });
    return { count: matched.length, leads: matched };
  }
