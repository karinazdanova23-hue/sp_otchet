  function attachExpenseModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-expense');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const eventOptions = eventSelectOptions();
    const labelToId = {};
    eventOptions.forEach(o=>{ labelToId[o.label] = o.id; });
    const eventSearchInput = overlay.querySelector('#ex-event-search');
    const eventHidden = overlay.querySelector('#ex-event');
    if(eventSearchInput && eventHidden){
      eventSearchInput.addEventListener('input', ()=>{
        const val = eventSearchInput.value.trim();
        if(val === ''){ eventHidden.value = ''; eventSearchInput.style.borderColor = ''; return; }
        if(labelToId[val]){ eventHidden.value = labelToId[val]; eventSearchInput.style.borderColor = ''; }
      });
      eventSearchInput.addEventListener('blur', ()=>{
        const val = eventSearchInput.value.trim();
        if(val !== '' && !labelToId[val]){
          eventSearchInput.value = '';
          eventHidden.value = '';
        }
      });
    }

    const categorySelect = overlay.querySelector('#ex-category');
    if(categorySelect){
      const applyFieldVisibility = ()=>{
        const directionField = overlay.querySelector('#expense-direction-field');
        if(directionField) directionField.style.display = (categorySelect.value === 'Материалы') ? 'block' : 'none';
        const masterField = overlay.querySelector('#expense-master-field');
        if(masterField) masterField.style.display = (categorySelect.value === 'Зарплата') ? 'block' : 'none';
      };
      categorySelect.onchange = async ()=>{
        if(categorySelect.value === '__add_new__'){
          const name = (window.prompt('Название новой категории расходов:', '') || '').trim();
          if(!name){
            categorySelect.value = (state.modal.expense && state.modal.expense.category) || EXPENSE_CATEGORIES[0];
            applyFieldVisibility();
            return;
          }
          const exists = allExpenseCategories().some(c=>c.toLowerCase()===name.toLowerCase());
          if(!exists){
            state.customExpenseCategories = [...(state.customExpenseCategories||[]), name];
            await saveCustomExpenseCategories();
          }
          const addOption = categorySelect.querySelector('option[value="__add_new__"]');
          const newOption = document.createElement('option');
          newOption.value = name; newOption.textContent = name;
          categorySelect.insertBefore(newOption, addOption);
          categorySelect.value = name;
        }
        applyFieldVisibility();
      };
    }

    const delBtn = overlay.querySelector('#btn-del-expense');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.expense.date ? state.modal.expense.date.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      const hasLink = !!state.modal.expense.eventId;
      showConfirmDeletePopup(`Удалить этот расход?${hasLink ? ' Он также уберётся из себестоимости привязанного мероприятия.' : ' Действие необратимо.'}`, async ()=>{
        const expToDelete = state.modal.expense;
        state.expenses = state.expenses.filter(x=>x.id !== expToDelete.id);
        if(expToDelete.eventId){
          const ev = state.events.find(e=>e.id===expToDelete.eventId);
          if(ev && Array.isArray(ev.materialsItems)){
            const before = ev.materialsItems.length;
            ev.materialsItems = ev.materialsItems.filter(m=>m.expRef !== expToDelete.id);
            if(ev.materialsItems.length !== before) await saveEvents();
          }
        }
        await saveExpenses();
        state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-expense').onclick = async ()=>{
      if(state.currentRole !== 'owner'){
        const dateCheck = overlay.querySelector('#ex-date').value;
        const ymCheck = dateCheck ? dateCheck.slice(0,7) : null;
        const origYm = (state.modal.expense && state.modal.expense.date) ? state.modal.expense.date.slice(0,7) : null;
        const blockedYm = [ymCheck, origYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      ['ex-date','ex-amount','ex-responsible','ex-comment','ex-direction-search'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dateVal = overlay.querySelector('#ex-date').value;
      const amountRaw = overlay.querySelector('#ex-amount').value;
      const categoryVal = overlay.querySelector('#ex-category').value;
      const directionVal = overlay.querySelector('#ex-direction-search').value.trim();
      const masterVal = overlay.querySelector('#ex-master-search').value.trim();
      const sourceVal = overlay.querySelector('#ex-source').value;
      const responsibleVal = overlay.querySelector('#ex-responsible').value.trim();
      const commentVal = overlay.querySelector('#ex-comment').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!dateVal) markInvalid('ex-date');
      if(amountRaw === '' || Number(amountRaw) < 0) markInvalid('ex-amount');
      if(!responsibleVal) markInvalid('ex-responsible');
      if(!commentVal) markInvalid('ex-comment');
      let directionMissing = false;
      if(categoryVal === 'Материалы' && !directionVal){ directionMissing = true; markInvalid('ex-direction-search'); }
      let masterMissing = false;
      if(categoryVal === 'Зарплата' && !masterVal){ masterMissing = true; markInvalid('ex-master-search'); }

      if(!dateVal || amountRaw==='' || Number(amountRaw)<0 || !responsibleVal || !commentVal || directionMissing || masterMissing){
        showGapWarningBanner('Заполните все поля перед сохранением расхода. Сумма не может быть отрицательной.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const previousExpense = state.modal.expense;
      const updated = {
        id: previousExpense.id,
        date: dateVal,
        category: categoryVal,
        direction: categoryVal==='Материалы' ? directionVal : '',
        master: categoryVal==='Зарплата' ? masterVal : '',
        source: sourceVal,
        amount: Math.round(Number(amountRaw) * 100) / 100, // округляем только до копеек, а не до целых рублей
        responsible: responsibleVal,
        eventId: overlay.querySelector('#ex-event').value || '',
        comment: commentVal,
      };

      // синхронизация с себестоимостью привязанного мероприятия — кроме категории "Зарплата",
      // которая уже учитывается через зарплату мастера и задвоилась бы
      const prevEventId = previousExpense.eventId || '';
      const affectedExpEventIds = new Set([prevEventId, updated.eventId].filter(Boolean));
      let anyExpEventChanged = false;
      affectedExpEventIds.forEach(eventId=>{
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        if(!Array.isArray(ev.materialsItems)) ev.materialsItems = [];
        const before = ev.materialsItems.length;
        ev.materialsItems = ev.materialsItems.filter(m=>m.expRef !== updated.id);
        if(eventId === updated.eventId && updated.category !== 'Зарплата'){
          ev.materialsItems.push({ name: `Расход: ${updated.comment || updated.category}`, cost: updated.amount, source: 'studio', expRef: updated.id });
        }
        if(ev.materialsItems.length !== before || (eventId === updated.eventId && updated.category !== 'Зарплата')) anyExpEventChanged = true;
      });
      if(anyExpEventChanged) await saveEvents();

      const idx = state.expenses.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.expenses[idx] = updated; else state.expenses.push(updated);
      await saveExpenses();
      recordAction("Расход сохранён");
      state.modal = null; overlay.remove(); render();
    };
  }

  function attachCertificateModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-cert');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    // журнал списаний по сертификату (мероприятие + дата + сумма), с остатком
    let redemptionsDraft = (state.modal.cert.redemptions || (state.modal.cert.eventId ? [{id:uid(), eventId:state.modal.cert.eventId, date:state.modal.cert.useDate||state.modal.cert.saleDate, amount:state.modal.cert.amount}] : [])).map(r=>({...r, id: r.id||uid()}));
    const redemptionEventOptions = eventSelectOptions();
    const redemptionLabelToId = {};
    redemptionEventOptions.forEach(o=>{ redemptionLabelToId[o.label] = o.id; });

    function syncRedemptionsFromInputs(){
      overlay.querySelectorAll('#cert-redemptions-list [data-rd-idx]').forEach(row=>{
        const i = parseInt(row.dataset.rdIdx);
        const eventInput = row.querySelector('.rd-event');
        const dateInput = row.querySelector('.rd-date');
        const amountInput = row.querySelector('.rd-amount');
        if(redemptionsDraft[i]){
          redemptionsDraft[i] = {
            id: redemptionsDraft[i].id || uid(),
            eventId: redemptionLabelToId[eventInput.value.trim()] || (redemptionsDraft[i].eventId && eventInput.value.trim()===(eventSelectOptions().find(o=>o.id===redemptionsDraft[i].eventId)?.label) ? redemptionsDraft[i].eventId : ''),
            date: dateInput.value,
            amount: amountInput.value !== '' ? parseInt(amountInput.value) : null,
          };
        }
      });
    }
    function updateRemainingHint(){
      const totalAmount = parseInt(overlay.querySelector('#c-amount').value) || 0;
      const spent = redemptionsDraft.reduce((s,r)=> s + ((r.amount!==undefined&&r.amount!==null&&!isNaN(r.amount))?Number(r.amount):0), 0);
      const remaining = totalAmount - spent;
      const hint = overlay.querySelector('#cert-remaining-hint');
      if(hint){
        hint.textContent = `Списано: ${formatMoney(spent)} · Остаток: ${formatMoney(remaining)}`;
        hint.style.color = remaining < 0 ? 'var(--status-red)' : (remaining === 0 ? 'var(--status-green)' : 'var(--ink-soft)');
      }
    }
    function refreshRedemptionsUI(){
      const container = overlay.querySelector('#cert-redemptions-list');
      container.innerHTML = renderRedemptionRows(redemptionsDraft);
      attachRedemptionRowEvents();
      updateRemainingHint();
    }
    function attachRedemptionRowEvents(){
      overlay.querySelectorAll('#cert-redemptions-list [data-rd-idx]').forEach(row=>{
        row.querySelectorAll('input').forEach(inp=>{
          inp.addEventListener('input', ()=>{ syncRedemptionsFromInputs(); updateRemainingHint(); });
        });
      });
      overlay.querySelectorAll('.rd-del').forEach(btn=>{
        btn.onclick = ()=>{
          syncRedemptionsFromInputs();
          redemptionsDraft.splice(parseInt(btn.dataset.idx), 1);
          refreshRedemptionsUI();
        };
      });
    }
    attachRedemptionRowEvents();
    updateRemainingHint();
    const addRedemptionBtn = overlay.querySelector('#btn-add-redemption');
    if(addRedemptionBtn) addRedemptionBtn.onclick = ()=>{
      syncRedemptionsFromInputs();
      redemptionsDraft.push({id: uid(), eventId:'', date: todayStr(), amount: null});
      refreshRedemptionsUI();
    };
    const amountInputForRemaining = overlay.querySelector('#c-amount');
    if(amountInputForRemaining) amountInputForRemaining.addEventListener('input', updateRemainingHint);

    overlay.querySelectorAll('[data-certstatus]').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('[data-certstatus]').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#c-status').value = opt.dataset.certstatus;
        const redemptionsField = overlay.querySelector('#cert-redemptions-field');
        const showRedemptions = (opt.dataset.certstatus === 'used' || opt.dataset.certstatus === 'partial');
        if(redemptionsField) redemptionsField.style.display = showRedemptions ? 'block' : 'none';
        if(showRedemptions && redemptionsDraft.length === 0){
          redemptionsDraft.push({id: uid(), eventId:'', date: todayStr(), amount: null});
          refreshRedemptionsUI();
        }
      };
    });

    overlay.querySelectorAll('.certkind-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.certkind-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#c-kind').value = opt.dataset.certkind;
        const specificField = overlay.querySelector('#cert-specific-field');
        if(specificField) specificField.style.display = (opt.dataset.certkind === 'specific') ? 'block' : 'none';
      };
    });

    overlay.querySelectorAll('.certpurpose-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.certpurpose-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#c-purpose').value = opt.dataset.certpurpose;
      };
    });

    const delBtn = overlay.querySelector('#btn-del-cert');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.cert.saleDate ? state.modal.cert.saleDate.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      const cascades = state.modal.cert.incomeId || (state.modal.cert.redemptions && state.modal.cert.redemptions.length);
      showConfirmDeletePopup(`Удалить этот сертификат?${cascades ? ' Связанный доход в «Книге» и платежи в привязанных мероприятиях тоже удалятся.' : ' Действие необратимо.'}`, async ()=>{
      const certToDelete = state.modal.cert;
      state.certificates = state.certificates.filter(x=>x.id !== certToDelete.id);
      if(certToDelete.incomeId){
        state.incomes = state.incomes.filter(x=>x.id !== certToDelete.incomeId);
        await saveIncomes();
      }
      // убираем платежи по всем списаниям этого сертификата из мероприятий, куда они были начислены
      const refPrefix = certToDelete.id + ':';
      let anyEventChanged = false;
      state.events.forEach(ev=>{
        if(!Array.isArray(ev.payments)) return;
        const before = ev.payments.length;
        ev.payments = ev.payments.filter(p=>{
          if(p.certRedemptionRef && p.certRedemptionRef.startsWith(refPrefix)){
            ev.price = Math.max(0,(ev.price||0) - (p.amount||0));
            return false;
          }
          return true;
        });
        if(ev.payments.length !== before) anyEventChanged = true;
      });
      if(anyEventChanged) await saveEvents();
      await saveCertificates();
      state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-cert').onclick = async ()=>{
      if(state.currentRole !== 'owner'){
        const dateCheck = overlay.querySelector('#c-date').value;
        const ymCheck = dateCheck ? dateCheck.slice(0,7) : null;
        const origYm = (state.modal.cert && state.modal.cert.saleDate) ? state.modal.cert.saleDate.slice(0,7) : null;
        const blockedYm = [ymCheck, origYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      ['c-number','c-date','c-amount','c-comment','c-specific-mk','c-owner-name','c-owner-contact'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      overlay.querySelectorAll('.rd-event, .rd-date, .rd-amount').forEach(el=>{ el.style.borderColor = ''; });

      const numberRaw = overlay.querySelector('#c-number').value;
      const channelVal = overlay.querySelector('#c-channel').value;
      const certTypeVal = overlay.querySelector('#c-type').value;
      const certKindVal = overlay.querySelector('#c-kind').value || 'value';
      const specificVal = overlay.querySelector('#c-specific-mk').value.trim();
      const dateVal = overlay.querySelector('#c-date').value;
      const amountRaw = overlay.querySelector('#c-amount').value;
      const statusVal = overlay.querySelector('#c-status').value || 'in_progress';
      const ownerNameVal = overlay.querySelector('#c-owner-name').value.trim();
      const ownerContactVal = overlay.querySelector('#c-owner-contact').value.trim();
      const commentVal = overlay.querySelector('#c-comment').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(numberRaw === '') markInvalid('c-number');
      if(!channelVal) markInvalid('c-channel');
      if(!certTypeVal) markInvalid('c-type');
      if(!dateVal) markInvalid('c-date');
      if(amountRaw === '' || Number(amountRaw) < 0) markInvalid('c-amount');
      if(!ownerNameVal) markInvalid('c-owner-name');
      if(!ownerContactVal) markInvalid('c-owner-contact');
      if(!commentVal) markInvalid('c-comment');
      let specificMissing = false, redemptionsMissing = false, redemptionsIncomplete = false;
      if(certKindVal === 'specific' && !specificVal){ specificMissing = true; markInvalid('c-specific-mk'); }

      syncRedemptionsFromInputs();
      const cleanedRedemptions = redemptionsDraft.filter(r=> r.eventId || r.date || (r.amount!==undefined&&r.amount!==null));
      let redemptionBeforeSale = false;
      if(statusVal === 'used' || statusVal === 'partial'){
        if(cleanedRedemptions.length === 0){
          redemptionsMissing = true;
        } else {
          overlay.querySelectorAll('#cert-redemptions-list [data-rd-idx]').forEach(row=>{
            const i = parseInt(row.dataset.rdIdx);
            const r = redemptionsDraft[i];
            if(!r) return;
            if(!r.eventId){ redemptionsIncomplete = true; row.querySelector('.rd-event').style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = row.querySelector('.rd-event'); }
            if(!r.date){ redemptionsIncomplete = true; row.querySelector('.rd-date').style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = row.querySelector('.rd-date'); }
            if(r.amount===undefined||r.amount===null){ redemptionsIncomplete = true; row.querySelector('.rd-amount').style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = row.querySelector('.rd-amount'); }
            if(r.date && dateVal && r.date < dateVal){ redemptionBeforeSale = true; row.querySelector('.rd-date').style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = row.querySelector('.rd-date'); }
          });
        }
      }
      const spentTotal = cleanedRedemptions.reduce((s,r)=> s + ((r.amount!==undefined&&r.amount!==null&&!isNaN(r.amount))?Number(r.amount):0), 0);
      const totalAmountNum = parseInt(amountRaw) || 0;
      const overspent = spentTotal > totalAmountNum;
      if(overspent){
        const remainingEl = overlay.querySelector('#cert-remaining-hint');
        if(remainingEl && !firstInvalid) firstInvalid = remainingEl;
      }

      if(numberRaw==='' || !channelVal || !certTypeVal || !dateVal || amountRaw==='' || Number(amountRaw)<0 || !ownerNameVal || !ownerContactVal || !commentVal || specificMissing || redemptionsMissing || redemptionsIncomplete || redemptionBeforeSale || overspent){
        let msg = 'Заполните все поля перед сохранением сертификата. Сумма не может быть отрицательной.';
        if(redemptionBeforeSale) msg = 'Дата списания не может быть раньше даты продажи сертификата.';
        if(redemptionsMissing) msg = 'Статус «Использован»/«Частично использован» — добавьте хотя бы одно списание.';
        else if(redemptionsIncomplete) msg = 'Заполните мероприятие, дату и сумму в каждой строке списания.';
        else if(overspent) msg = `Списано больше, чем номинал сертификата (списано ${formatMoney(spentTotal)} из ${formatMoney(totalAmountNum)}).`;
        showGapWarningBanner(msg);
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const previousCert = state.modal.cert;
      const previousRedemptions = previousCert.redemptions || [];

      const updated = {
        id: previousCert.id,
        number: numberRaw.trim() || previousCert.number,
        channel: channelVal,
        certType: certTypeVal,
        certKind: certKindVal,
        purpose: overlay.querySelector('#c-purpose').value || 'sale',
        specificEventType: specificVal,
        saleDate: dateVal,
        amount: totalAmountNum,
        status: statusVal,
        redemptions: (statusVal==='used'||statusVal==='partial') ? cleanedRedemptions : [],
        // старые поля оставляем в синхроне с первым списанием — для обратной совместимости мест, которые их ещё читают
        useDate: cleanedRedemptions.length ? (cleanedRedemptions[cleanedRedemptions.length-1].date||'') : '',
        eventId: cleanedRedemptions.length ? (cleanedRedemptions[cleanedRedemptions.length-1].eventId||'') : '',
        ownerName: ownerNameVal,
        ownerContact: ownerContactVal,
        incomeId: previousCert.incomeId || '',
        comment: commentVal,
      };

      // 1) синхронизация с "Книга → Доходы": продажа сертификата = доход студии в момент продажи
      if(updated.purpose === 'sale'){
        const incomeEntry = {
          id: updated.incomeId || uid(), date: updated.saleDate, operation: 'Оплата', product: 'Сертификат',
          account: 'Точка', eventId: '', amount: updated.amount, masterName: '', itemSaleId: '', orderId: '',
          comment: `Сертификат №${updated.number} — ${updated.ownerName}`,
        };
        updated.incomeId = incomeEntry.id;
        const incIdx = state.incomes.findIndex(x=>x.id===incomeEntry.id);
        if(incIdx >= 0) state.incomes[incIdx] = incomeEntry; else state.incomes.push(incomeEntry);
        await saveIncomes();
      } else if(updated.incomeId){
        // маркетинговый сертификат — не доход, убираем ранее созданную запись
        state.incomes = state.incomes.filter(x=>x.id !== updated.incomeId);
        await saveIncomes();
        updated.incomeId = '';
      }

      // 2) синхронизация списаний с журналом платежей конкретных мероприятий
      const oldById = {}; previousRedemptions.forEach(r=>{ if(r.id) oldById[r.id] = r; });
      const newById = {}; updated.redemptions.forEach(r=>{ if(r.id) newById[r.id] = r; });
      const affectedEventIds = new Set();
      Object.values(oldById).forEach(r=>{ if(r.eventId) affectedEventIds.add(r.eventId); });
      Object.values(newById).forEach(r=>{ if(r.eventId) affectedEventIds.add(r.eventId); });

      let anyEventChanged = false;
      affectedEventIds.forEach(eventId=>{
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        if(!Array.isArray(ev.payments)) ev.payments = [];
        let changedThisEvent = false;

        // убираем платежи по списаниям, которых больше нет здесь (удалены или перенесены на другое мероприятие)
        ev.payments = ev.payments.filter(p=>{
          if(p.certRedemptionRef && p.certRedemptionRef.startsWith(updated.id+':')){
            const rid = p.certRedemptionRef.split(':')[1];
            const stillHere = newById[rid] && newById[rid].eventId === eventId;
            if(!stillHere){ ev.price = Math.max(0,(ev.price||0) - (p.amount||0)); changedThisEvent = true; return false; }
          }
          return true;
        });

        // добавляем/обновляем платежи по списаниям, которые сейчас указывают сюда
        Object.values(newById).forEach(r=>{
          if(r.eventId !== eventId) return;
          const ref = updated.id + ':' + r.id;
          const existing = ev.payments.find(p=>p.certRedemptionRef===ref);
          if(existing){
            if(existing.amount !== r.amount){
              ev.price = Math.max(0,(ev.price||0) - (existing.amount||0)) + (r.amount||0);
              existing.amount = r.amount;
              changedThisEvent = true;
            }
          } else {
            ev.payments.push({ amount: r.amount, source:'Сертификат', type:'balance', ts: Date.now(), certRedemptionRef: ref });
            ev.price = (ev.price||0) + (r.amount||0);
            changedThisEvent = true;
          }
        });

        if(changedThisEvent) anyEventChanged = true;
      });
      if(anyEventChanged) await saveEvents();

      const idx = state.certificates.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.certificates[idx] = updated; else state.certificates.push(updated);
      await saveCertificates();
      recordAction("Сертификат сохранён");
      state.modal = null; overlay.remove(); render();
    };
  }

              <input type="date" id="r-request-date" value="${refund.requestDate||''}">
            </div>
            <div class="field">
              <label>Сумма (₽)</label>
              <input type="number" id="r-amount" value="${refund.amount!==undefined&&refund.amount!==null?refund.amount:''}" min="0" step="100" placeholder="Например: 5000">
            </div>
          </div>
          <div class="field">
            <label>Дата платежа</label>
            <input type="date" id="r-payment-date" value="${refund.paymentDate||''}">
          </div>
          <div class="field">
            <label>Причина возврата</label>
            <textarea id="r-reason" placeholder="Почему возвращаем...">${escapeHtml(refund.reason||'')}</textarea>
          </div>
          <div class="field">
            <label>Статус</label>
            <div class="status-select-wrap">
              <div class="dishes-opt ${(refund.status||'in_progress')==='in_progress'?'active':''}" data-refundstatus="in_progress">
                <span class="dot" style="background:#C08A3E"></span>В процессе
              </div>
              <div class="dishes-opt ${refund.status==='refunded'?'active':''}" data-refundstatus="refunded">
                <span class="dot" style="background:var(--status-green)"></span>Возвращено
              </div>
            </div>
            <input type="hidden" id="r-status" value="${refund.status||'in_progress'}">
          </div>
          <div class="field">
            <label>Что возвращаем</label>
            <div class="status-select-wrap">
              <div class="dishes-opt ${isEventType?'active':''}" data-refundtype="event">
                <span class="dot" style="background:var(--status-blue)"></span>Мероприятие
              </div>
              <div class="dishes-opt ${isCertType?'active':''}" data-refundtype="cert">
                <span class="dot" style="background:var(--status-purple)"></span>Сертификат
              </div>
            </div>
            <input type="hidden" id="r-type" value="${linkType}">
          </div>
          <div id="refund-event-block" style="display:${isEventType?'block':'none'};">
            <div class="field">
              <label>Мероприятие</label>
              <input type="text" id="r-event-search" placeholder="Начните вводить дату, название или пространство…" list="r-event-options" value="${escapeHtml(refund.eventId ? (eventSelectOptions().find(o=>o.id===refund.eventId)?.label || '') : '')}">
              <datalist id="r-event-options">${eventSelectOptions().map(o=>`<option value="${escapeHtml(o.label)}">`).join('')}</datalist>
              <input type="hidden" id="r-event" value="${refund.eventId||''}">
              <div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">Если статус «Возвращено» — сумма автоматически вычтется из выручки этого мероприятия.</div>
            </div>
            <div class="field">
              <label>Кому из гостей возвращаем</label>
              <select id="r-guest"><option value="">Сначала выберите мероприятие…</option></select>
              <div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">Отменится запись именно этого гостя — остальные гости мероприятия не затрагиваются (само мероприятие пометится «Отменено» только если так вернули уже всех гостей).</div>
            </div>
            <div class="field">
              <label>Источник</label>
              <select id="r-source">
                ${REFUND_SOURCES.map(s=>`<option value="${escapeHtml(s)}" ${refund.source===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div id="refund-cert-block" style="display:${isCertType?'block':'none'};">
            <div class="field">
              <label>Сертификат</label>

              <datalist id="r-cert-options">${certSelectOptions().map(o=>`<option value="${escapeHtml(o.label)}">`).join('')}</datalist>

            <input type="text" id="r-account" value="${escapeHtml(refund.accountNumber||'')}" placeholder="Номер счёта" style="margin-bottom:8px;">
            <input type="text" id="r-bank" value="${escapeHtml(refund.bank||'')}" placeholder="Банк" style="margin-bottom:8px;">
            <input type="text" id="r-bik" value="${escapeHtml(refund.bik||'')}" placeholder="БИК банка">
          </div>
          <div class="modal-actions">
            <div>${!isNew ? `<button class="btn-danger" id="btn-del-refund">Удалить</button>` : '<span></span>'}</div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-ghost" id="btn-cancel-refund">Отмена</button>
              <button class="btn btn-primary" id="btn-save-refund">Сохранить</button>
            </div>

      </div>

  }

  function attachRefundModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-refund');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const refundEventOptions = eventSelectOptions();
    const refundLabelToId = {};
    refundEventOptions.forEach(o=>{ refundLabelToId[o.label] = o.id; });
    const refundEventSearchInput = overlay.querySelector('#r-event-search');
    const refundEventHidden = overlay.querySelector('#r-event');

    // селектор "кому из гостей возвращаем" — при типе "мероприятие" выбор человека обязателен.
    // если у мероприятия только один гость (или список гостей ещё не заведён отдельно, а есть только
    // общее имя) — выбираем его сам, без действий пользователя; если гостей несколько — заставляем
    // выбрать явно, без варианта "не выбрано"
    const refundGuestSelect = overlay.querySelector('#r-guest');
    function refreshRefundGuestOptions(){
      if(!refundGuestSelect) return;
      const evId = refundEventHidden.value;
      const ev = evId ? state.events.find(e=>e.id===evId) : null;
      if(!ev){
        refundGuestSelect.innerHTML = '<option value="">Сначала выберите мероприятие…</option>';
        return;
      }
      const guests = Array.isArray(ev.guestList) ? ev.guestList : [];
      const keepVal = (state.modal.refund.eventId === evId) ? (state.modal.refund.guestId||'') : '';
      if(guests.length === 0){
        // у мероприятия ещё нет отдельного списка гостей — предложим единственный вариант по общему
        // имени/названию; при сохранении для него автоматически заведётся запись в списке гостей
        const soloLabel = ev.guestName ? ev.guestName : 'Гость мероприятия';
        refundGuestSelect.innerHTML = `<option value="__solo__" selected>${escapeHtml(soloLabel)}</option>`;
        return;
      }
      if(guests.length === 1){
        refundGuestSelect.innerHTML = `<option value="${guests[0].id}" selected>${escapeHtml(guests[0].name||'без имени')}</option>`;
        return;
      }
      refundGuestSelect.innerHTML = '<option value="">— выберите гостя —</option>' +
        guests.map(g=>`<option value="${g.id}" ${g.id===keepVal?'selected':''}>${escapeHtml(g.name||'без имени')}${g.refunded?' (уже возвращено)':''}</option>`).join('');
    }
    refreshRefundGuestOptions();

    if(refundEventSearchInput && refundEventHidden){
      refundEventSearchInput.addEventListener('input', ()=>{
        const val = refundEventSearchInput.value.trim();
        if(val === ''){ refundEventHidden.value = ''; refundEventSearchInput.style.borderColor = ''; refreshRefundGuestOptions(); return; }
        if(refundLabelToId[val]){ refundEventHidden.value = refundLabelToId[val]; refundEventSearchInput.style.borderColor = ''; refreshRefundGuestOptions(); }
      });
      refundEventSearchInput.addEventListener('blur', ()=>{
        const val = refundEventSearchInput.value.trim();
        if(val !== '' && !refundLabelToId[val]){
          refundEventSearchInput.value = '';
          refundEventHidden.value = '';
        }
        refreshRefundGuestOptions();
      });
    }

    // привязка возврата к сертификату — та же логика поиска, что и для мероприятия выше; при редактировании
    // уже привязанного возврата список для поиска дополняем самим этим сертификатом, даже если он уже
    // отмечен возвращённым (иначе поле не находило бы совпадение и сбрасывалось при потере фокуса)
    const currentlyLinkedCert = overlay.querySelector('#r-cert') && overlay.querySelector('#r-cert').value
      ? state.certificates.find(c=>c.id===overlay.querySelector('#r-cert').value) : null;
    const refundCertOptions = certSelectOptions();
    if(currentlyLinkedCert && !refundCertOptions.some(o=>o.id===currentlyLinkedCert.id)){
      refundCertOptions.push({ id: currentlyLinkedCert.id, label: certPickerLabel(currentlyLinkedCert) });
    }
    const refundCertLabelToId = {};
    refundCertOptions.forEach(o=>{ refundCertLabelToId[o.label] = o.id; });
    const refundCertSearchInput = overlay.querySelector('#r-cert-search');
    const refundCertHidden = overlay.querySelector('#r-cert');
    if(refundCertSearchInput && refundCertHidden){
      refundCertSearchInput.addEventListener('input', ()=>{
        const val = refundCertSearchInput.value.trim();
        if(val === ''){ refundCertHidden.value = ''; refundCertSearchInput.style.borderColor = ''; return; }
        if(refundCertLabelToId[val]){ refundCertHidden.value = refundCertLabelToId[val]; refundCertSearchInput.style.borderColor = ''; }
      });
      refundCertSearchInput.addEventListener('blur', ()=>{
        const val = refundCertSearchInput.value.trim();
        if(val !== '' && !refundCertLabelToId[val]){
          refundCertSearchInput.value = '';
          refundCertHidden.value = '';
        }
      });
    }

    const refundTypeHidden = overlay.querySelector('#r-type');
    const refundEventBlock = overlay.querySelector('#refund-event-block');
    const refundCertBlock = overlay.querySelector('#refund-cert-block');
    const tochkaField = overlay.querySelector('#refund-tochka-field');
    function updateTochkaFieldVisibility(){
      if(!tochkaField) return;
      const isCert = refundTypeHidden.value === 'cert';
      tochkaField.style.display = (isCert || sourceSelect.value === 'Точка') ? 'block' : 'none';
    }
    const sourceSelect = overlay.querySelector('#r-source');
    if(sourceSelect){
      sourceSelect.onchange = updateTochkaFieldVisibility;
    }
    overlay.querySelectorAll('[data-refundtype]').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('[data-refundtype]').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        refundTypeHidden.value = opt.dataset.refundtype;
        const isEvent = opt.dataset.refundtype === 'event';
        if(refundEventBlock) refundEventBlock.style.display = isEvent ? 'block' : 'none';
        if(refundCertBlock) refundCertBlock.style.display = isEvent ? 'none' : 'block';
        updateTochkaFieldVisibility();
      };
    });
    updateTochkaFieldVisibility();

    overlay.querySelectorAll('[data-refundstatus]').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('[data-refundstatus]').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#r-status').value = opt.dataset.refundstatus;
      };
    });

    const delBtn = overlay.querySelector('#btn-del-refund');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.refund.requestDate ? state.modal.refund.requestDate.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      const hasLink = !!state.modal.refund.eventId || !!state.modal.refund.certId;
      showConfirmDeletePopup(`Удалить эту запись о возврате?${hasLink ? ' Мероприятие или сертификат, привязанные к нему, тоже вернутся к прежнему состоянию.' : ' Действие необратимо.'}`, async ()=>{
        const refundToDelete = state.modal.refund;
        state.refunds = state.refunds.filter(x=>x.id !== refundToDelete.id);
        if(refundToDelete.certId){
          const linkedCert = state.certificates.find(c=>c.id===refundToDelete.certId);
          if(linkedCert && linkedCert.refundRef === refundToDelete.id){
            restoreCertStatusAfterRefundUndo(linkedCert);
            await saveCertificates();
          }
        }
        if(refundToDelete.eventId){
          const ev = state.events.find(e=>e.id===refundToDelete.eventId);
          if(ev && Array.isArray(ev.payments)){
            const before = ev.payments.length;
            ev.payments = ev.payments.filter(p=>{
              if(p.refundRef === refundToDelete.id){
                const restoreAmt = Math.abs(p.amount||0);
                ev.price = (ev.price||0) + restoreAmt;
                // "Согласованная цена" уменьшалась вместе с "Выручкой" при оформлении этого возврата
                // (чтобы прогнозная выручка в "Чистой прибыли" тоже учитывала возврат) — восстанавливаем и её
                if(ev.agreedPrice!==undefined && ev.agreedPrice!==null && !isNaN(ev.agreedPrice)){
                  ev.agreedPrice = Number(ev.agreedPrice) + restoreAmt;
                }
                // если возврат был привязан к конкретному гостю — снимаем с него пометку "возврат"
                if(p.guestId && Array.isArray(ev.guestList)){
                  const g = ev.guestList.find(x=>x.id===p.guestId);
                  if(g && g.refundRef === refundToDelete.id){ g.refunded = false; delete g.refundRef; }
                }
                return false;
              }
              return true;
            });
            if(ev.payments.length !== before){
              await saveEvents();
              await syncEventIncomeIfNeeded(ev);
              await syncEventPaymentsToBook(ev);
            }
          }
        }
        await saveRefunds();
        state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-refund').onclick = async ()=>{
      if(state.currentRole !== 'owner'){
        const dateCheck = overlay.querySelector('#r-request-date').value;
        const ymCheck = dateCheck ? dateCheck.slice(0,7) : null;
        const origYm = (state.modal.refund && state.modal.refund.requestDate) ? state.modal.refund.requestDate.slice(0,7) : null;
        const blockedYm = [ymCheck, origYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      ['r-request-date','r-amount','r-payment-date','r-reason','r-fullname','r-account','r-bank','r-bik'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });

      const requestDateVal = overlay.querySelector('#r-request-date').value;
      const amountRaw = overlay.querySelector('#r-amount').value;
      const paymentDateVal = overlay.querySelector('#r-payment-date').value;
      const reasonVal = overlay.querySelector('#r-reason').value.trim();
      const statusVal = overlay.querySelector('#r-status').value || 'in_progress';
      const typeVal = overlay.querySelector('#r-type').value === 'cert' ? 'cert' : 'event';
      // возврат по сертификату всегда идёт через "Точку" — выбор источника для него не показывается,
      // а реквизиты обязательны в любом случае
      const source = typeVal === 'cert' ? 'Точка' : overlay.querySelector('#r-source').value;
      const fullNameVal = overlay.querySelector('#r-fullname').value.trim();
      const accountVal = overlay.querySelector('#r-account').value.trim();
      const bankVal = overlay.querySelector('#r-bank').value.trim();
      const bikVal = overlay.querySelector('#r-bik').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!requestDateVal) markInvalid('r-request-date');
      if(amountRaw === '' || Number(amountRaw) < 0) markInvalid('r-amount');
      if(!paymentDateVal) markInvalid('r-payment-date');
      if(!reasonVal) markInvalid('r-reason');
      let tochkaMissing = false;
      if(source === 'Точка'){
        if(!fullNameVal){ tochkaMissing = true; markInvalid('r-fullname'); }
        if(!accountVal){ tochkaMissing = true; markInvalid('r-account'); }
        if(!bankVal){ tochkaMissing = true; markInvalid('r-bank'); }
        if(!bikVal){ tochkaMissing = true; markInvalid('r-bik'); }
      }

      // при типе "мероприятие" обязательны и само мероприятие, и конкретный человек
      const linkedEventIdForCheck = typeVal === 'event' ? (overlay.querySelector('#r-event').value || '') : '';
      let eventMissing = false, guestMissing = false;
      let linkedGuestIdForCheck = '';
      if(typeVal === 'event'){
        if(!linkedEventIdForCheck){ eventMissing = true; markInvalid('r-event-search'); }
        linkedGuestIdForCheck = refundGuestSelect.value || '';
        if(linkedEventIdForCheck && !linkedGuestIdForCheck){ guestMissing = true; markInvalid('r-guest'); }
      }
      // при типе "сертификат" обязателен сам сертификат
      const linkedCertIdForCheck = typeVal === 'cert' ? (overlay.querySelector('#r-cert').value || '') : '';
      let certMissing = false;
      if(typeVal === 'cert' && !linkedCertIdForCheck){ certMissing = true; markInvalid('r-cert-search'); }

      let linkedEv = linkedEventIdForCheck ? state.events.find(e=>e.id===linkedEventIdForCheck) : null;
      const evGuests = (linkedEv && Array.isArray(linkedEv.guestList)) ? linkedEv.guestList : [];
      const isMultiGuest = evGuests.length > 1;

      // возврат не может быть больше, чем реально получено на привязанном мероприятии (а если гостей
      // несколько — не больше, чем реально получено именно от выбранного гостя)
      let refundExceedsReceived = false;
      if(linkedEv && amountRaw !== ''){
        if(isMultiGuest && linkedGuestIdForCheck){
          const guestPaid = (Array.isArray(linkedEv.payments)?linkedEv.payments:[]).filter(p=>p.guestId===linkedGuestIdForCheck).reduce((s,p)=> s + (Number(p.amount)||0), 0);
          const alreadyRefundedForGuest = state.refunds
            .filter(r=> r.eventId===linkedEventIdForCheck && r.guestId===linkedGuestIdForCheck && r.id!==state.modal.refund.id && r.status==='refunded')
            .reduce((s,r)=> s + (Number(r.amount)||0), 0);
          const guestReceivedAvailable = guestPaid + alreadyRefundedForGuest;
          if(Number(amountRaw) > guestReceivedAvailable){
            refundExceedsReceived = true;
            markInvalid('r-amount');
          }
        } else {
          const alreadyRefundedElsewhere = state.refunds
            .filter(r=> r.eventId===linkedEventIdForCheck && r.id!==state.modal.refund.id && r.status==='refunded')
            .reduce((s,r)=> s + (Number(r.amount)||0), 0);
          const receivedAvailable = (Number(linkedEv.price)||0) + alreadyRefundedElsewhere; // до уже проведённых по этому мероприятию возвратов
          if(Number(amountRaw) > receivedAvailable){
            refundExceedsReceived = true;
            markInvalid('r-amount');
          }
        }
      }

      // возврат не может быть больше остатка привязанного сертификата (если гость уже что-то списал с него —
      // вернуть можно только неиспользованную часть)
      let refundExceedsCertRemaining = false;
      if(linkedCertIdForCheck && amountRaw !== ''){
        const linkedCert = state.certificates.find(c=>c.id===linkedCertIdForCheck);
        if(linkedCert){
          const certRemainingAvailable = certRemaining(linkedCert) + (linkedCert.refundRef===state.modal.refund.id ? Number(state.modal.refund.amount)||0 : 0);
          if(Number(amountRaw) > certRemainingAvailable){
            refundExceedsCertRemaining = true;
            markInvalid('r-amount');
          }
        }
      }

      if(!requestDateVal || amountRaw==='' || Number(amountRaw)<0 || !paymentDateVal || !reasonVal || tochkaMissing || refundExceedsReceived || refundExceedsCertRemaining || eventMissing || guestMissing || certMissing){
        showGapWarningBanner(eventMissing
          ? 'Выберите мероприятие, за которое оформляется возврат.'
          : guestMissing
          ? 'Выберите, кому из гостей возвращаем.'
          : certMissing
          ? 'Выберите сертификат, за который оформляется возврат.'
          : refundExceedsReceived
          ? `Сумма возврата больше, чем реально получено (доступно к возврату: ${(isMultiGuest && linkedGuestIdForCheck ? ((linkedEv&&Array.isArray(linkedEv.payments)?linkedEv.payments:[]).filter(p=>p.guestId===linkedGuestIdForCheck).reduce((s,p)=>s+(Number(p.amount)||0),0)) : (linkedEv?.price||0)) + state.refunds.filter(r=> r.eventId===linkedEventIdForCheck && (isMultiGuest?r.guestId===linkedGuestIdForCheck:true) && r.id!==state.modal.refund.id && r.status==='refunded').reduce((s,r)=> s + (Number(r.amount)||0), 0)} ₽).`
          : refundExceedsCertRemaining
          ? `Сумма возврата больше остатка на сертификате.`
          : 'Заполните все поля перед сохранением возврата. Сумма не может быть отрицательной.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      // если у мероприятия ещё не было отдельного списка гостей (старая запись) — заводим его прямо
      // сейчас на основе общего имени, чтобы у возврата был реальный человек, на которого можно сослаться
      if(linkedEv && linkedGuestIdForCheck === '__solo__'){
        if(!Array.isArray(linkedEv.guestList)) linkedEv.guestList = [];
        const soloGuest = { id: uid(), name: (linkedEv.guestName||'Гость мероприятия').trim() || 'Гость мероприятия', seats: linkedEv.guests||1, items: 1, phone: '', comment: '', expected: null };
        linkedEv.guestList.push(soloGuest);
        linkedGuestIdForCheck = soloGuest.id;
      }

      const previousRefund = state.modal.refund;
      const updated = {
        id: previousRefund.id,
        requestDate: requestDateVal,
        amount: parseInt(amountRaw),
        paymentDate: paymentDateVal,
        reason: reasonVal,
        status: statusVal,
        source: source,
        linkType: typeVal,
        eventId: linkedEventIdForCheck,
        guestId: typeVal === 'event' ? linkedGuestIdForCheck : '',
        certId: linkedCertIdForCheck,
        fullName: source==='Точка' ? fullNameVal : '',
        accountNumber: source==='Точка' ? accountVal : '',
        bank: source==='Точка' ? bankVal : '',
        bik: source==='Точка' ? bikVal : '',
      };

      // синхронизация с выручкой привязанного мероприятия — только для реально возвращённых (не "в процессе")
      const prevRefundEventId = previousRefund.eventId || '';
      const affectedRefundEventIds = new Set([prevRefundEventId, updated.eventId].filter(Boolean));
      let anyRefundEventChanged = false;
      affectedRefundEventIds.forEach(eventId=>{
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        if(!Array.isArray(ev.payments)) ev.payments = [];
        const before = ev.payments.length;
        ev.payments = ev.payments.filter(p=>{
          if(p.refundRef === updated.id){
            const restoreAmt = Math.abs(p.amount||0);
            ev.price = (ev.price||0) + restoreAmt;
            if(ev.agreedPrice!==undefined && ev.agreedPrice!==null && !isNaN(ev.agreedPrice)) ev.agreedPrice = Number(ev.agreedPrice) + restoreAmt;
            // если этот платёж-возврат был привязан к конкретному гостю — снимаем с гостя пометку "возврат"
            if(p.guestId && Array.isArray(ev.guestList)){
              const g = ev.guestList.find(x=>x.id===p.guestId);
              if(g && g.refundRef === updated.id){ g.refunded = false; delete g.refundRef; }
            }
            return false;
          }
          return true;
        });
        if(eventId === updated.eventId && updated.status === 'refunded'){
          ev.payments.push({ amount: -updated.amount, source:'Возврат', type:'refund', ts: Date.now(), refundRef: updated.id, guestId: updated.guestId || undefined });
          ev.price = Math.max(0, (ev.price||0) - updated.amount);
          // "Согласованная цена" тоже уменьшается — иначе "Чистая прибыль" считает прогнозную выручку
          // как max(цена, согласованная цена) и при указанной согласованной цене продолжит игнорировать возврат
          if(ev.agreedPrice!==undefined && ev.agreedPrice!==null && !isNaN(ev.agreedPrice)){
            ev.agreedPrice = Math.max(0, Number(ev.agreedPrice) - updated.amount);
          }
          // если возврат оформлен на конкретного гостя — помечаем именно его запись как "возврат",
          // остальных гостей в мероприятии это не трогает
          let allGuestsNowRefunded = true;
          if(updated.guestId && Array.isArray(ev.guestList)){
            const g = ev.guestList.find(x=>x.id===updated.guestId);
            if(g){ g.refunded = true; g.refundRef = updated.id; }
            allGuestsNowRefunded = ev.guestList.every(x=>x.refunded === true);
          }
          // если этим возвратом гостю (или гостям — при возврате по мероприятию в целом) вернули всё, что
          // успели внести (предоплату целиком) — считаем мероприятие несостоявшимся и помечаем "Отменено".
          // Но если гостей несколько и возврат оформлен только одному из них — отменяем всё мероприятие,
          // только когда ТАК возвращены уже все гости (иначе остальные ещё могут прийти/доплатить).
          // "Согласованную цену" намеренно НЕ обнуляем — она уже уменьшена симметрично выше и должна
          // остаться восстанавливаемой (если возврат потом удалят/отменят); то, что отменённое мероприятие
          // не должно считаться в прогнозной выручке и не должно больше показывать "Ждём ещё", обеспечивается
          // отдельно, по статусу — см. eventRevenueForecast, eventRemainderTotal и updateAwaitingHint
          if(ev.price <= 0 && allGuestsNowRefunded){
            ev.status = 'cancelled';
          }
        }
        if(ev.payments.length !== before || (eventId === updated.eventId && updated.status === 'refunded')) anyRefundEventChanged = true;
      });

      // синхронизация с привязанным сертификатом — возвращённый сертификат больше нельзя списывать
      // (см. certRemaining); отвязка/смена привязки или снятие статуса "Возвращено" возвращают ему
      // тот статус, который был бы у него без этого возврата
      const prevRefundCertId = previousRefund.certId || '';
      const affectedRefundCertIds = new Set([prevRefundCertId, updated.certId].filter(Boolean));
      let anyCertChanged = false;
      affectedRefundCertIds.forEach(certId=>{
        const cert = state.certificates.find(c=>c.id===certId);
        if(!cert) return;
        if(cert.refundRef === updated.id && !(certId === updated.certId && updated.status === 'refunded')){
          restoreCertStatusAfterRefundUndo(cert);
          anyCertChanged = true;
        }
        if(certId === updated.certId && updated.status === 'refunded' && cert.refundRef !== updated.id){
          markCertRefunded(cert, updated.id);
          anyCertChanged = true;
        }
      });
      if(anyCertChanged) await saveCertificates();

      if(anyRefundEventChanged) await saveEvents();
      // возврат меняет цену/журнал платежей мероприятия — подтягиваем "Книгу" (и грубую авто-запись, если журнала нет),
      // иначе "Книга" останется на сумме до возврата и сверка "Календарь vs Книга" покажет ложное расхождение
      for(const eventId of affectedRefundEventIds){
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) continue;
        await syncEventIncomeIfNeeded(ev);
        await syncEventPaymentsToBook(ev);
      }

      const idx = state.refunds.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.refunds[idx] = updated; else state.refunds.push(updated);
      await saveRefunds();
      recordAction("Возврат сохранён");
      if(Number(updated.amount) >= (state.pushRefundThreshold || 10000)){
        sendPushNotification('Крупный возврат', `${formatMoney(updated.amount)} — ${updated.reason||'без причины'}`, ['owner']);
      }
      state.modal = null; overlay.remove(); render();
    };
  }

  // -------------------- event handlers --------------------
  function requireViewAccess(view, action){
    if(canAccessView(view)){ action(); return; }
    state.pendingAction = action;
    state.modal = {type:'role-login'};
    render();
  }

  function attachHeaderEvents(){
    const searchInput = document.getElementById('global-search-input');
    const searchResultsEl = document.getElementById('global-search-results');
    if(searchInput && searchResultsEl){
      const runSearch = ()=>{
        const q = searchInput.value;
        const results = performGlobalSearch(q);
        searchResultsEl.innerHTML = renderGlobalSearchResults(results, q);
        searchResultsEl.style.display = q.trim().length >= 2 ? 'block' : 'none';
        searchResultsEl.querySelectorAll('.global-search-result').forEach(row=>{
          row.onclick = ()=>{
            const type = row.dataset.restype;
            const id = row.dataset.resid;
            searchResultsEl.style.display = 'none';
            searchInput.value = '';
            if(type === 'event'){
              const ev = state.events.find(e=>e.id===id);
              if(!ev) return;
              state.view = 'calendar';
              if(ev.date){ const [y,m] = ev.date.split('-'); state.cursor = new Date(parseInt(y), parseInt(m)-1, 1); }
              if(state.currentRole === 'master'){
                state.modal = {type:'quick-host', event:{...ev}, keepAll:true};
                render();
              } else {
                requireUnlock(()=>{ state.modal = {type:'event', event:{...ev}, isNew:false, keepAll:true}; render(); });
              }
            } else if(type === 'lead'){
              const lead = state.leads.find(l=>l.id===id);
              if(!lead) return;
              state.view = 'certificates';
              state.certView = 'conversion';
              requireUnlock(()=>{ state.modal = {type:'lead', lead:{...lead}, isNew:false}; render(); });
            } else if(type === 'certificate'){
              const cert = state.certificates.find(c=>c.id===id);
              if(!cert) return;
              state.view = 'certificates';
              state.certView = 'certificates';
              requireUnlock(()=>{ state.modal = {type:'certificate', cert:{...cert}, isNew:false}; render(); });
            }
          };
        });
      };
      searchInput.addEventListener('input', runSearch);
      searchInput.addEventListener('focus', runSearch);
      document.addEventListener('click', (ev)=>{
        if(!ev.target.closest('.global-search-wrap')){
          searchResultsEl.style.display = 'none';
        }
      });
    }

    document.querySelectorAll('.view-switch button').forEach(b=>{
      b.onclick = ()=>{
        const targetView = b.dataset.view;
        state.view = targetView; render();
      };
    });

    const pushToggleBtn = document.getElementById('btn-push-toggle');
    if(pushToggleBtn) pushToggleBtn.onclick = async ()=>{
      pushToggleBtn.disabled = true;
      if(state.pushEnabled){
        await unsubscribeFromPush();
        state.pushEnabled = false;
        recordAction('Уведомления выключены');
      } else {
        const ok = await subscribeToPush();
        state.pushEnabled = ok;
        if(ok) recordAction('Уведомления включены');
      }
      pushToggleBtn.disabled = false;
      render();
    };

    document.querySelectorAll('.daily-alert-item.clickable').forEach(item=>{
      item.onclick = ()=>{
        const targetView = item.dataset.alertView;
        const targetCertView = item.dataset.alertCertview;
        const go = ()=>{
          state.view = targetView;
          if(targetCertView) state.certView = targetCertView;
          render();
        };
        requireViewAccess(targetView, go);
      };
    });
    const todayViewBtn = document.getElementById('btn-today-view');
    if(todayViewBtn) todayViewBtn.onclick = ()=>{ state.view = 'today'; render(); };
    const lockBtn = document.getElementById('btn-lock');
    if(lockBtn) lockBtn.onclick = ()=>{
      if(state.currentRole){
        // выход
        state.currentRole = null;
        state.unlocked = false;
        state.unlockedAdmin = false;
        state.unlockedOwner = false;
        state.loggedInMasterName = null;
        state.loggedInHostessName = null;
        state.loggedInManagerName = null;
        if(!canAccessView(state.view)) state.view = 'calendar';
        render();
      } else {
        state.modal = {type:'role-login'};
        render();
      }
    };
    const settingsBtn = document.getElementById('btn-role-settings');
    if(settingsBtn) settingsBtn.onclick = ()=>{
      state.modal = {type:'code-settings'};
      render();
    };
    const exportBtn = document.getElementById('btn-export');
    if(exportBtn) exportBtn.onclick = ()=>{
      requireAdminUnlock(()=>{
        state.modal = {type:'export'};
        render();
      });
    };
    const etBtn = document.getElementById('btn-event-types');
    if(etBtn) etBtn.onclick = ()=>{
      requireAdminUnlock(()=>{
        draftEventTypes = state.eventTypes.map(t=>({...t}));
        state.modal = {type:'event-types'};
        render();
      });
    };

  function attachCalendarEvents(){
    document.querySelectorAll('.space-tab').forEach(t=>{
      t.onclick = (ev)=>{
        if(ev.target.classList.contains('rename')) return;
        state.activeSpaceId = t.dataset.space; render();
      };
      const label = t.querySelector('[data-role="label"]');
      if(!label) return;
      label.ondblclick = (ev)=>{
        ev.stopPropagation();
        const sp = getSpace(t.dataset.space);
        const input = document.createElement('input');
        input.className = 'rename'; input.value = sp.name;
        label.replaceWith(input); input.focus(); input.select();
        const commit = ()=>{
          sp.name = input.value.trim() || sp.name;
          saveSpaces(); render();
        };
        input.onblur = commit;
        input.onkeydown = (e)=>{ if(e.key==='Enter'){ input.blur(); } if(e.key==='Escape'){ render(); } };
      };
    });
    const prev = document.getElementById('btn-prev');
    const next = document.getElementById('btn-next');
    const todayBtn = document.getElementById('btn-today');
    if(prev) prev.onclick = ()=>{ state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth()-1, 1); render(); };
    if(next) next.onclick = ()=>{ state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth()+1, 1); render(); };
    if(todayBtn) todayBtn.onclick = ()=>{ state.cursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1); render(); };

    document.querySelectorAll('.cal-cell').forEach(c=>{
      c.onclick = ()=>{ state.modal = {type:'day', date: c.dataset.date}; render(); };
    });
  }

  function attachHostEvents(){
    document.querySelectorAll('.host-chip').forEach(c=>{
      c.onclick = ()=>{ state.activeHost = c.dataset.host; render(); };
    });
    document.querySelectorAll('.host-row').forEach(r=>{

          }
        }
      };
    });
  }

  function attachRoleLoginModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-role-login');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; state.pendingAction = null; overlay.remove(); };

    const input = overlay.querySelector('#f-role-code');
    const errorEl = overlay.querySelector('#role-code-error');
    const submit = ()=>{
      const val = input.value.trim();
      const matchedRole = CODE_LOGIN_ROLES.find(r => val && val === state.roleCodes[r]);
      if(matchedRole){
        state.currentRole = matchedRole;
        state.unlocked = true;
        state.unlockedAdmin = ['assistant','admin','owner'].includes(matchedRole);
        state.unlockedOwner = (matchedRole === 'owner');
        state.loggedInMasterName = null;
        state.loggedInHostessName = null;
        state.loggedInManagerName = null;
        const action = state.pendingAction;
        state.pendingAction = null;
        state.modal = null;
        overlay.remove();
        if(action) action(); else render();
        return;
      }
      const matchedMasterName = val ? Object.keys(state.masterPersonalPasswords).find(name => state.masterPersonalPasswords[name] && state.masterPersonalPasswords[name] === val) : null;
      if(matchedMasterName){
        state.currentRole = 'master';
        state.unlocked = true;
        state.unlockedAdmin = false;
        state.unlockedOwner = false;
        state.loggedInMasterName = matchedMasterName;
        state.loggedInHostessName = null;
        state.loggedInManagerName = null;
        const action = state.pendingAction;
        state.pendingAction = null;
        state.modal = null;
        overlay.remove();
        if(action) action(); else render();
        return;
      }
      const matchedHostessName = val ? Object.keys(state.hostessPersonalPasswords).find(name => state.hostessPersonalPasswords[name] && state.hostessPersonalPasswords[name] === val) : null;
      if(matchedHostessName){
        state.currentRole = 'hostess';
        state.unlocked = true;
        state.unlockedAdmin = false;
        state.unlockedOwner = false;
        state.loggedInMasterName = null;
        state.loggedInHostessName = matchedHostessName;
        state.loggedInManagerName = null;
        const action = state.pendingAction;
        state.pendingAction = null;
        state.modal = null;
        overlay.remove();
        if(action) action(); else render();
        return;
      }
      const matchedManagerName = val ? Object.keys(state.managerPersonalPasswords).find(name => state.managerPersonalPasswords[name] && state.managerPersonalPasswords[name] === val) : null;
      if(matchedManagerName){
        state.currentRole = 'manager';
        state.unlocked = true;
        state.unlockedAdmin = false;
        state.unlockedOwner = false;
        state.loggedInMasterName = null;
        state.loggedInHostessName = null;
        state.loggedInManagerName = matchedManagerName;
        const action = state.pendingAction;
        state.pendingAction = null;
        state.modal = null;
        overlay.remove();
        if(action) action(); else render();
        return;
      }
      errorEl.textContent = 'Неверный пароль, попробуйте ещё раз';
      errorEl.style.display = 'block';
      input.style.borderColor = 'var(--danger)';
    };
    overlay.querySelector('#btn-submit-role-login').onclick = submit;
    input.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  }
