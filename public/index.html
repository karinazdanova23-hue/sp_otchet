  function buildShoppingListText(){
    const booked30 = materialBookedAheadStats(30);
    const cheapestByMaterial = cheapestSupplierByMaterial();
    const tracked = [...state.materialsCatalog].filter(m=>m.trackStock);
    const shoppingList = tracked.map(m=>{
      const calc = computeMaterialToBuy(m, booked30);
      if(calc.toBuy<=0) return null;
      const key = m.name.trim().toLowerCase();
      const best = cheapestByMaterial[key];
      const needBy = earliestNeedDateForMaterial(m.name);
      const daysLeft = needBy ? daysBetweenDates(todayStr(), needBy) : null;
      const atRisk = !!(best && best.leadDays!==null && daysLeft!==null && best.leadDays > daysLeft);
      return { name:m.name, unit:m.unit, toBuy:calc.toBuy, supplierName: best?best.supplierName:null, price: best?best.price:null, estCost: best ? Math.round(best.price*calc.toBuy) : null, leadDays: best?best.leadDays:null, needBy, atRisk };
    }).filter(Boolean);
    if(shoppingList.length===0) return '';
    const lines = [`Список закупок — ${formatDateText(todayStr())}`, ''];
    shoppingList.forEach(x=>{
      const unitSuffix = x.unit ? ' '+x.unit : '';
      let line = `— ${x.name}: ${x.toBuy}${unitSuffix}`;
      if(x.supplierName) line += ` (у «${x.supplierName}»${x.price!==null?', '+formatMoney(x.price)+(x.unit?'/'+x.unit:''):''})`;
      if(x.estCost!==null) line += ` — ${formatMoney(x.estCost)}`;
      if(x.leadDays!==null) line += ` [срок поставки ${x.leadDays} дн.${x.atRisk?', нужно к '+formatDateText(x.needBy)+' — ЗАКАЗАТЬ СРОЧНО':''}]`;
      lines.push(line);
    });
    const total = shoppingList.reduce((s,x)=>s+(x.estCost||0),0);
    if(total>0) lines.push('', `Итого: ≈ ${formatMoney(total)}`);
    return lines.join('\n');
  }

  function renderProcurementBudgetTab(){
    const cursor = state.procurementBudgetCursor;
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const ym = y+'-'+pad(m+1);
    const label = MONTHS[m] + ' ' + y;
    const now = new Date();
    const isPastMonth = (y < now.getFullYear()) || (y===now.getFullYear() && m < now.getMonth());
    const isCurrentMonth = (y===now.getFullYear() && m===now.getMonth());
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const daysElapsed = isCurrentMonth ? now.getDate() : (isPastMonth ? daysInMonth : 0);

    const plan = (state.monthlyPlans && state.monthlyPlans[ym]) || {};
    const budget = (plan.procurementBudget!==undefined && plan.procurementBudget!==null && plan.procurementBudget!=='') ? Number(plan.procurementBudget) : null;
    const breakdown = monthReceiptsBreakdown(ym);
    const pctUsed = (budget!==null && budget>0) ? Math.round(breakdown.total/budget*100) : null;
    const expectedByNow = (budget!==null && daysElapsed>0) ? Math.round(budget * daysElapsed / daysInMonth) : null;

    let paceStatus = 'no_budget';
    if(budget!==null){
      if(breakdown.total > budget) paceStatus = 'over_budget';
      else if(expectedByNow!==null && breakdown.total > expectedByNow) paceStatus = 'over_pace';
      else paceStatus = 'on_track';
    }
    const PACE_COLOR = { over_budget: 'var(--status-red)', over_pace: '#8A5A1E', on_track: 'var(--status-green)', no_budget: 'var(--ink-soft)' };
    const PACE_LABEL = { over_budget: '⚠ бюджет превышен', over_pace: '⚠ тратим быстрее плана', on_track: '✅ в рамках плана', no_budget: '' };
    const maxCatSpend = Math.max(1, ...breakdown.byCategory.map(x=>x.amount));

    return `
      <div class="cal-nav">
        <div class="month-label" style="text-transform:capitalize;">${escapeHtml(label)}</div>
        <div class="cal-nav-btns">
          <button class="today-btn" id="pb-today">текущий месяц</button>
          <button class="nav-btn" id="pb-prev">‹</button>
          <button class="nav-btn" id="pb-next">›</button>
        </div>
      </div>

      <div class="analytics-section">
        <div class="field" style="max-width:280px;">
          <label>Бюджет закупок на месяц (₽) <span style="font-weight:400;color:var(--ink-soft);">— необязательно</span></label>
          <input type="number" id="pb-budget-input" value="${budget!==null?budget:''}" min="0" step="1000" placeholder="Например: 60000">
        </div>
      </div>

      <div class="analytics-summary">
        <div class="summary-card"><div class="num">${budget!==null?formatMoney(budget):'—'}</div><div class="label">БЮДЖЕТ НА МЕСЯЦ</div></div>
        <div class="summary-card ${paceStatus==='over_budget'?'red':(paceStatus==='on_track'?'green':'')}"><div class="num">${formatMoney(breakdown.total)}</div><div class="label">ПОТРАЧЕНО (ПРИХОД)</div></div>
        <div class="summary-card ${paceStatus==='over_budget'?'red':''}"><div class="num">${budget!==null?formatMoney(Math.abs(budget-breakdown.total)):'—'}</div><div class="label">${paceStatus==='over_budget'?'ПРЕВЫШЕНИЕ':'ОСТАТОК БЮДЖЕТА'}</div></div>
        <div class="summary-card"><div class="num">${pctUsed!==null?pctUsed+'%':'—'}</div><div class="label">% ИСПОЛЬЗОВАНО</div></div>
        <div class="summary-card"><div class="num">${breakdown.count}</div><div class="label">ПРИХОДОВ ЗА МЕСЯЦ</div></div>
      </div>

      ${budget!==null ? `
      <div class="analytics-section">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
          <span style="font-size:13px;">${formatMoney(breakdown.total)} <span style="color:var(--ink-soft);">из ${formatMoney(budget)}${pctUsed!==null?' ('+pctUsed+'%)':''}</span></span>
          <span style="font-size:12px;color:${PACE_COLOR[paceStatus]};">${PACE_LABEL[paceStatus]}</span>
        </div>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.min(100,pctUsed||0)}%;background:${PACE_COLOR[paceStatus]};"></div></div>
        ${daysElapsed>0 && expectedByNow!==null ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">День ${daysElapsed} из ${daysInMonth}. При равномерном темпе к этому дню — ${formatMoney(expectedByNow)}.</div>` : ''}
      </div>
      ` : `
      <div class="analytics-section">
        <div style="color:var(--ink-soft);font-size:13px;">Бюджет на этот месяц не задан — заполните поле выше, чтобы видеть темп расходования и превышения.</div>
      </div>
      `}

      <div class="analytics-section">
        <h4 style="margin-top:0;">Расход по категориям за месяц</h4>
        ${breakdown.byCategory.length===0 ? `<div class="host-empty">Приходов за ${escapeHtml(label)} пока нет.</div>` : breakdown.byCategory.map(x=>`
          <div class="stat-row">
            <div class="stat-label" style="width:150px;">${escapeHtml(x.category)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.amount/maxCatSpend*100)}%;background:var(--accent);"></div></div>
            <div style="width:90px;text-align:right;font-family:var(--font-mono);font-size:13px;">${formatMoney(x.amount)}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderProcurementSuppliersTab(){
    const rows = [...state.suppliers].sort((a,b)=> (a.material||'').localeCompare(b.material||'','ru') || (Number(a.price)||0)-(Number(b.price)||0));
    const minByMaterial = {};
    state.suppliers.forEach(s=>{
      const key = (s.material||'').trim().toLowerCase();
      const price = Number(s.price);
      if(!key || isNaN(price)) return;
      if(minByMaterial[key]===undefined || price < minByMaterial[key]) minByMaterial[key] = price;
    });
    return `
      <div class="cert-toolbar">
        <div style="font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);">Записей: ${rows.length}</div>
        <button class="btn btn-primary" id="btn-add-supplier">+ Добавить поставщика</button>
      </div>
      ${rows.length===0 ? `<div class="host-empty">Пока нет ни одной записи о поставщике.<br>Добавляйте: материал, у кого покупаем и по какой цене — так будет легко сравнивать варианты.</div>` : `
      <div class="cert-list">
        ${rows.map(s=>{
          const key = (s.material||'').trim().toLowerCase();
          const price = Number(s.price);
          const isCheapest = key && !isNaN(price) && price === minByMaterial[key];
          const hasHistory = Array.isArray(s.priceHistory) && s.priceHistory.length>1;
          const prevEntry = hasHistory ? s.priceHistory[s.priceHistory.length-2] : null;
          const priceChangeHint = prevEntry && Number(prevEntry.price)!==price
            ? ` <span style="font-size:11px;color:var(--ink-soft);">(было ${formatMoney(prevEntry.price)})</span>` : '';
          return `
          <div class="refund-row proc-supplier-row" data-sid="${s.id}">
            <div class="cell" style="font-weight:500;">${escapeHtml(s.material||'—')}</div>
            <div class="cell">${escapeHtml(s.supplierName||'—')}</div>
            <div class="amount">${!isNaN(price) ? formatMoney(price) : '—'}${s.unit?' / '+escapeHtml(s.unit):''}${isCheapest?' <span class="cert-badge used">выгоднее всех</span>':''}${priceChangeHint}</div>
            <div class="cell" style="font-family:var(--font-mono);color:var(--ink-soft);">${s.leadDays!==undefined&&s.leadDays!==null&&s.leadDays!==''?s.leadDays+' дн.':'—'}</div>
            <div class="cell">${escapeHtml(s.contact||'')}</div>
            <div class="reason">${escapeHtml(s.notes||'')}</div>
          </div>
        `;}).join('')}
      </div>
      `}
    `;
  }

  function attachProcurementEvents(){
    document.querySelectorAll('.proc-subtabs button').forEach(b=>{
      b.onclick = ()=>{ state.procurementTab = b.dataset.proctab; render(); };
    });
    const addBtn = document.getElementById('btn-add-supplier');
    if(addBtn) addBtn.onclick = ()=>{
      state.modal = {type:'supplier-entry', isNew:true, supplier:{ id: uid(), material:'', supplierName:'', price:'', unit:'', leadDays:'', contact:'', notes:'', priceHistory:[] }};
      render();
    };
    document.querySelectorAll('.proc-supplier-row[data-sid]').forEach(row=>{
      row.onclick = ()=>{
        const item = state.suppliers.find(x=>x.id===row.dataset.sid);
        if(!item) return;
        state.modal = {type:'supplier-entry', isNew:false, supplier:{...item}};
        render();
      };
    });
    const addReceiptBtn = document.getElementById('btn-add-receipt');
    if(addReceiptBtn) addReceiptBtn.onclick = ()=>{
      state.modal = {type:'stock-receipt', isNew:true, receipt:{ id: uid(), date: todayStr(), material:'', qty:'', unit:'', supplierName:'', amount:'', notes:'', expenseId:'' }};
      render();
    };
    document.querySelectorAll('.proc-receipt-row[data-rcid]').forEach(row=>{
      row.onclick = ()=>{
        const item = (state.stockReceipts||[]).find(x=>x.id===row.dataset.rcid);
        if(!item) return;
        state.modal = {type:'stock-receipt', isNew:false, receipt:{...item}};
        render();
      };
    });
    const copyBtn = document.getElementById('btn-copy-shopping-list');
    if(copyBtn) copyBtn.onclick = async ()=>{
      const text = buildShoppingListText();
      if(!text) return;
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        showToast('Список скопирован');
      }catch(e){
        showToast('Не удалось скопировать — выделите список вручную');
      }
    };
    const pbPrev = document.getElementById('pb-prev');
    const pbNext = document.getElementById('pb-next');
    const pbToday = document.getElementById('pb-today');
    if(pbPrev) pbPrev.onclick = ()=>{ state.procurementBudgetCursor = new Date(state.procurementBudgetCursor.getFullYear(), state.procurementBudgetCursor.getMonth()-1, 1); render(); };
    if(pbNext) pbNext.onclick = ()=>{ state.procurementBudgetCursor = new Date(state.procurementBudgetCursor.getFullYear(), state.procurementBudgetCursor.getMonth()+1, 1); render(); };
    if(pbToday) pbToday.onclick = ()=>{ state.procurementBudgetCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1); render(); };
    const pbBudgetInput = document.getElementById('pb-budget-input');
    if(pbBudgetInput) pbBudgetInput.onchange = async ()=>{
      const cursor = state.procurementBudgetCursor;
      const ym = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
      const raw = pbBudgetInput.value;
      if(!state.monthlyPlans) state.monthlyPlans = {};
      if(!state.monthlyPlans[ym]) state.monthlyPlans[ym] = {};
      state.monthlyPlans[ym].procurementBudget = raw!=='' ? parseFloat(raw) : null;
      if(state.monthlyPlans[ym].procurementBudget===null && Object.keys(state.monthlyPlans[ym]).every(k=>state.monthlyPlans[ym][k]===null||state.monthlyPlans[ym][k]===undefined||(Array.isArray(state.monthlyPlans[ym][k])&&state.monthlyPlans[ym][k].length===0))){
        delete state.monthlyPlans[ym];
      }
      await saveMonthlyPlans();
      recordAction(`Бюджет закупок на ${ym} изменён`);
      render();
      showToast('Бюджет сохранён');
    };
  }

  function attachStockReceiptModalEvents(overlay){
    overlay.querySelector('#btn-cancel-receipt').onclick = ()=>{ state.modal = null; overlay.remove(); };

    const materialInput = overlay.querySelector('#rc-material');
    const unitInput = overlay.querySelector('#rc-unit');
    const supplierInput = overlay.querySelector('#rc-supplier');
    const qtyInput = overlay.querySelector('#rc-qty');
    const amountInput = overlay.querySelector('#rc-amount');
    const amountHint = overlay.querySelector('#rc-amount-hint');

    function suggestAmount(){
      const matName = materialInput.value.trim().toLowerCase();
      const supName = supplierInput.value.trim().toLowerCase();
      const qty = parseFloat(qtyInput.value);
      if(!matName || !qty || amountInput.value !== ''){ amountHint.textContent = ''; return; }
      let candidates = state.suppliers.filter(s=>(s.material||'').trim().toLowerCase()===matName && !isNaN(Number(s.price)));
      if(supName) candidates = candidates.filter(s=>(s.supplierName||'').trim().toLowerCase()===supName);
      if(candidates.length===0){ amountHint.textContent = ''; return; }
      const cheapest = candidates.reduce((min,s)=> Number(s.price)<Number(min.price) ? s : min);
      const suggested = Math.round(Number(cheapest.price) * qty);
      amountHint.textContent = `Подсказка: ${cheapest.supplierName} по ${formatMoney(cheapest.price)}/${cheapest.unit||'ед'} → ≈ ${formatMoney(suggested)} за ${qty}${cheapest.unit||''}`;
    }
    [materialInput, supplierInput, qtyInput].forEach(el=> el.addEventListener('input', suggestAmount));
    materialInput.addEventListener('input', ()=>{
      const match = state.materialsCatalog.find(m=>m.name.trim().toLowerCase()===materialInput.value.trim().toLowerCase());
      if(match && match.unit && !unitInput.value) unitInput.value = match.unit;
    });
    suggestAmount();

    overlay.querySelector('#btn-save-receipt').onclick = async ()=>{
      const dateVal = overlay.querySelector('#rc-date').value;
      const materialVal = materialInput.value.trim();
      const qtyRaw = qtyInput.value;
      const unitVal = unitInput.value.trim();
      const supplierVal = supplierInput.value.trim();
      const amountRaw = amountInput.value;
      const notesVal = overlay.querySelector('#rc-notes').value.trim();

      overlay.querySelectorAll('#rc-date,#rc-material,#rc-qty,#rc-amount').forEach(el=>el.style.borderColor='');
      let firstInvalid = null;
      const markInvalid = (id)=>{ const el = overlay.querySelector('#'+id); if(el){ el.style.borderColor='var(--danger)'; if(!firstInvalid) firstInvalid = el; } };

      const qty = parseFloat(qtyRaw);
      const amount = amountRaw==='' ? 0 : parseFloat(amountRaw);
      if(!dateVal) markInvalid('rc-date');
      if(!materialVal) markInvalid('rc-material');
      if(qtyRaw==='' || isNaN(qty) || qty<=0) markInvalid('rc-qty');
      if(amountRaw!=='' && (isNaN(amount) || amount<0)) markInvalid('rc-amount');

      if(!dateVal || !materialVal || qtyRaw==='' || isNaN(qty) || qty<=0 || (amountRaw!=='' && (isNaN(amount)||amount<0))){
        showGapWarningBanner('Укажите дату, материал и количество (больше нуля).');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      if(state.currentRole !== 'owner'){
        const ymCheck = dateVal.slice(0,7);
        const origYm = (!state.modal.isNew && state.modal.receipt.date) ? state.modal.receipt.date.slice(0,7) : null;
        const blockedYm = [ymCheck, origYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }

      const prevReceipt = state.modal.receipt;

      // сначала откатываем эффект прежней версии прихода на складе (если это редактирование)
      if(!state.modal.isNew){
        const oldCat = state.materialsCatalog.find(m=>m.name.trim().toLowerCase()===(prevReceipt.material||'').trim().toLowerCase());
        if(oldCat && oldCat.trackStock){
          oldCat.stock = (Number(oldCat.stock)||0) - (Number(prevReceipt.qty)||0);
        }
      }
      // затем применяем новую версию
      const newCat = state.materialsCatalog.find(m=>m.name.trim().toLowerCase()===materialVal.toLowerCase());
      if(newCat && newCat.trackStock){
        newCat.stock = (Number(newCat.stock)||0) + qty;
      }
      await saveMaterialsCatalog();

      const updated = {
        id: prevReceipt.id,
        date: dateVal, material: materialVal, qty, unit: unitVal,
        supplierName: supplierVal, amount, notes: notesVal,
        expenseId: prevReceipt.expenseId || '',
      };
      updated.expenseId = await syncStockReceiptExpense(updated);

      const idx = state.stockReceipts.findIndex(x=>x.id===updated.id);
      if(idx>=0) state.stockReceipts[idx] = updated; else state.stockReceipts.push(updated);
      await saveStockReceipts();
      recordAction('Приход на склад сохранён');
      state.modal = null; overlay.remove(); render();
    };

    const delBtn = overlay.querySelector('#btn-del-receipt');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.receipt.date ? state.modal.receipt.date.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      showConfirmDeletePopup('Удалить этот приход? Остаток на складе уменьшится на соответствующее количество, а расход уберётся из «Книги». Действие необратимо.', async ()=>{
        const toDelete = state.modal.receipt;
        const catItem = state.materialsCatalog.find(m=>m.name.trim().toLowerCase()===(toDelete.material||'').trim().toLowerCase());
        if(catItem && catItem.trackStock){
          catItem.stock = (Number(catItem.stock)||0) - (Number(toDelete.qty)||0);
          await saveMaterialsCatalog();
        }
        if(toDelete.expenseId){
          state.expenses = state.expenses.filter(x=>x.id !== toDelete.expenseId);
          await saveExpenses();
        }
        state.stockReceipts = state.stockReceipts.filter(x=>x.id !== toDelete.id);
        await saveStockReceipts();
        recordAction('Приход на склад удалён');
        state.modal = null; render();
      });
    };
  }

  function attachSupplierModalEvents(overlay){
    overlay.querySelector('#btn-cancel-supplier').onclick = ()=>{ state.modal = null; overlay.remove(); };

    overlay.querySelector('#btn-save-supplier').onclick = async ()=>{
      const material = overlay.querySelector('#sup-material').value.trim();
      const supplierName = overlay.querySelector('#sup-name').value.trim();
      const priceRaw = overlay.querySelector('#sup-price').value;
      const unit = overlay.querySelector('#sup-unit').value.trim();
      const leadDaysRaw = overlay.querySelector('#sup-leaddays').value;
      const contact = overlay.querySelector('#sup-contact').value.trim();
      const notes = overlay.querySelector('#sup-notes').value.trim();

      overlay.querySelectorAll('#sup-material,#sup-name,#sup-price,#sup-leaddays').forEach(el=>el.style.borderColor='');
      let firstInvalid = null;
      const markInvalid = (id)=>{ const el = overlay.querySelector('#'+id); if(el){ el.style.borderColor='var(--danger)'; if(!firstInvalid) firstInvalid = el; } };
      if(!material) markInvalid('sup-material');
      if(!supplierName) markInvalid('sup-name');
      if(priceRaw==='' || Number(priceRaw)<0) markInvalid('sup-price');
      if(leadDaysRaw!=='' && Number(leadDaysRaw)<0) markInvalid('sup-leaddays');
      if(!material || !supplierName || priceRaw==='' || Number(priceRaw)<0 || (leadDaysRaw!=='' && Number(leadDaysRaw)<0)){
        showGapWarningBanner('Укажите материал, поставщика и цену (цена и срок поставки не могут быть отрицательными).');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const price = parseFloat(priceRaw);
      const existing = state.suppliers.find(x=>x.id===state.modal.supplier.id);
      let priceHistory = (existing && Array.isArray(existing.priceHistory)) ? [...existing.priceHistory] : [];
      if(!existing){
        priceHistory = [{ date: todayStr(), price }];
      } else if(Number(existing.price) !== price){
        priceHistory.push({ date: todayStr(), price });
      }

      const updated = {
        id: state.modal.supplier.id,
        material, supplierName,
        price,
        unit,
        leadDays: leadDaysRaw!=='' ? parseInt(leadDaysRaw) : null,
        contact, notes,
        priceHistory,
      };
      const idx = state.suppliers.findIndex(x=>x.id===updated.id);

  function syncMaterialsCatalogFromInputs(overlay){
    overlay.querySelectorAll('.et-row').forEach(row=>{

      const name = row.querySelector('.mc-name').value;
      const category = row.querySelector('.mc-category').value;
      const cost = parseInt(row.querySelector('.mc-cost').value) || 0;
      const trackStock = row.querySelector('.mc-track').checked;
      const unit = row.querySelector('.mc-unit').value;
      const stock = row.querySelector('.mc-stock').value !== '' ? parseFloat(row.querySelector('.mc-stock').value) : 0;
      const minStockRaw = row.querySelector('.mc-minstock').value;
      const minStock = minStockRaw !== '' ? parseFloat(minStockRaw) : null;
      if(draftMaterialsCatalog[i]) draftMaterialsCatalog[i] = {name, category, cost, trackStock, unit, stock, minStock};
    });
  }

  function attachMaterialsCatalogModalEvents(overlay){
    overlay.querySelectorAll('.mc-track').forEach(cb=>{

        syncMaterialsCatalogFromInputs(overlay);

      refreshMaterialsCatalogModal(overlay);
    };
    const addStockBtn = overlay.querySelector('#mc-add-stock');
    if(addStockBtn) addStockBtn.onclick = ()=>{
      syncMaterialsCatalogFromInputs(overlay);
      draftMaterialsCatalog.push({name:'', category:'', cost:0, trackStock:true, unit:'', stock:0, minStock:null});

      draftMaterialsCatalog = null; state.modal = null; overlay.remove();

        render();

    attachHostsListModalEvents(overlay);

  function attachHostsListModalEvents(overlay){
    const t1max = overlay.querySelector('#pr-tier1-max');
    if(t1max){
      const t2max = overlay.querySelector('#pr-tier2-max');
      const t1flat = overlay.querySelector('#pr-tier1-flat');
      const t2flat = overlay.querySelector('#pr-tier2-flat');
      const t3per = overlay.querySelector('#pr-tier3-per-guest');
      const tier2FromLabel = overlay.querySelector('#pr-tier2-from-label');
      const tier3FromLabel = overlay.querySelector('#pr-tier3-from-label');
      const preview = overlay.querySelector('#pr-preview');
      const updatePreview = ()=>{
        const m1 = parseInt(t1max.value)||0, m2 = parseInt(t2max.value)||0;
        tier2FromLabel.textContent = m1+1;
        tier3FromLabel.textContent = m2+1;
        preview.textContent = `Пример: 2 чел → ${t1flat.value||0}₽ · 6 чел → ${t2flat.value||0}₽ · 12 чел → ${12*(parseInt(t3per.value)||0)}₽`;
      };
      [t1max,t1flat,t2max,t2flat,t3per].forEach(inp=>inp.addEventListener('input', updatePreview));
      updatePreview();
    }

    overlay.querySelectorAll('.hl-tariff').forEach(btn=>{
      btn.onclick = ()=>{
        syncHostsDraftFromInputs(overlay);
        syncPayRatesDraftFromInputs(overlay);
        const name = (draftHostsList[parseInt(btn.dataset.idx)]||'').trim();
        if(!name){
          showGapWarningBanner('Сначала впишите имя мастера, потом можно будет задать ему тариф.');
          return;
        }
        state.modal = {type:'master-tariff', masterName: name};
        render();
      };
    });
    overlay.querySelectorAll('.hl-del').forEach(btn=>{
      btn.onclick = ()=>{
        syncHostsDraftFromInputs(overlay);
        syncPayRatesDraftFromInputs(overlay);
        draftHostsList.splice(parseInt(btn.dataset.idx), 1);
        refreshHostsListModal(overlay);
      };
    });
    const addBtn = overlay.querySelector('#hl-add');
    if(addBtn) addBtn.onclick = ()=>{
      syncHostsDraftFromInputs(overlay);
      syncPayRatesDraftFromInputs(overlay);
      draftHostsList.push('');
      refreshHostsListModal(overlay);
    };
    overlay.querySelector('#hl-cancel').onclick = ()=>{
      draftHostsList = null; draftPayRates = null; state.modal = null; overlay.remove();
    };
    overlay.querySelector('#hl-save').onclick = ()=>{
      syncHostsDraftFromInputs(overlay);
      syncPayRatesDraftFromInputs(overlay);
      const cleaned = Array.from(new Set(draftHostsList.map(n=>(n||'').trim()).filter(n=>n)));
      const finalRates = {...draftPayRates};
      overlay.remove();
      requireAdminUnlock(async ()=>{
        state.hostsList = cleaned;
        state.masterPayRates = finalRates;
        await saveHostsList();
        await saveMasterPayRates();
        draftHostsList = null;
        draftPayRates = null;
        recordAction("Список мастеров сохранён");
        state.modal = null;
        render();
      });
    };
  }

  // Финмодель: из чего состоит выручка и расходы месяца, с долей каждой строки от выручки,
  // плюс маржа чистой прибыли (% от выручки). Используется в обоих вариантах панели "Чистая прибыль"
  // (месяц с мероприятиями и пустой месяц), чтобы не рассинхронизировать разметку.
  function npSharePct(amount, base){
    if(!base || base<=0) return '';
    return ` <span style="color:var(--ink-soft);font-size:11px;">(${Math.round(amount/base*100)}%)</span>`;
  }

  function renderNetProfitFinModel(revenueRows, expenseRows, npTotalRevenue, npTotalExpenses, netProfit){
    const marginPct = npTotalRevenue>0 ? Math.round(netProfit/npTotalRevenue*100) : 0;
    const revHtml = revenueRows.filter(r=>r.amount>0).map(r=>`
      <div class="stat-row"><div class="stat-label">${escapeHtml(r.label)}</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;">${formatMoney(r.amount)}${npSharePct(r.amount, npTotalRevenue)}</div></div>
    `).join('');
    const expHtml = expenseRows.filter(r=>r.amount>0).map(r=>`
      <div class="stat-row"><div class="stat-label">${escapeHtml(r.label)}</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--status-red);">${formatMoney(r.amount)}${npSharePct(r.amount, npTotalRevenue)}</div></div>
    `).join('');
    return `
      <div style="font-family:var(--font-display);font-weight:600;font-size:14px;margin-top:6px;">Выручка: ${formatMoney(npTotalRevenue)} <span style="color:var(--ink-soft);font-size:12px;font-weight:400;">(100%)</span></div>
      ${revHtml}
      <div style="font-family:var(--font-display);font-weight:600;font-size:14px;margin-top:16px;">Расходы: ${formatMoney(npTotalExpenses)}${npSharePct(npTotalExpenses, npTotalRevenue)}</div>
      ${expHtml}
      <div style="font-family:var(--font-display);font-weight:600;font-size:15px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);">Чистая прибыль: <span style="color:${netProfit>=0?'var(--status-green)':'var(--status-red)'};">${formatMoney(netProfit)}${npSharePct(netProfit, npTotalRevenue)}</span></div>
    `;
  }

  function attachNetProfitEditModalEvents(overlay){
    const cursor = state.analyticsCursor;
    const ym = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
    const existing = (state.netProfitManual && state.netProfitManual[ym]) || {};
    let staffDraft = (existing.staff || []).map(x=>({id:x.id||uid(), name:x.name, amount:x.amount, source:x.source||EXPENSE_SOURCES[0]}));
    let customDraft = (existing.customExpenses || []).map(x=>({id:x.id||uid(), name:x.name, amount:x.amount, source:x.source||EXPENSE_SOURCES[0]}));

    function makeListManager(containerId, draftGetter, draftSetter, cls, addBtnId){
      function sync(){
        const draft = draftGetter();
        overlay.querySelectorAll(`#${containerId} [data-npr-idx]`).forEach(row=>{
          const i = parseInt(row.dataset.nprIdx);
          if(!draft[i]) return;
          const amountRaw = row.querySelector(`.${cls}-amount`).value;
          draft[i] = {
            id: draft[i].id,
            name: row.querySelector(`.${cls}-name`).value,
            amount: amountRaw !== '' ? parseFloat(amountRaw) : null,
            source: row.querySelector(`.${cls}-source`).value,
          };
        });
      }
      function refresh(){
        const draft = draftGetter();
        overlay.querySelector('#'+containerId).innerHTML = renderNetProfitAmountRows(draft, cls);
        attachRowEvents();
      }
      function attachRowEvents(){
        overlay.querySelectorAll(`#${containerId} .${cls}-del`).forEach(btn=>{
          btn.onclick = ()=>{
            sync();
            const draft = draftGetter();
            draft.splice(parseInt(btn.dataset.idx), 1);
            draftSetter(draft);
            refresh();
          };
        });
      }
      attachRowEvents();
      const addBtn = overlay.querySelector('#'+addBtnId);
      if(addBtn) addBtn.onclick = ()=>{
        sync();
        const draft = draftGetter();
        draft.push({id:uid(), name:'', amount:null, source:EXPENSE_SOURCES[0]});
        draftSetter(draft);
        refresh();
      };
      return sync;
    }

    const syncStaff = makeListManager('np-staff-list', ()=>staffDraft, (d)=>{staffDraft=d;}, 'np-staff', 'btn-add-np-staff');
    const syncCustom = makeListManager('np-custom-list', ()=>customDraft, (d)=>{customDraft=d;}, 'np-custom', 'btn-add-np-custom');

    overlay.querySelector('#np-cancel').onclick = ()=>{ state.modal = null; overlay.remove(); };
    overlay.querySelector('#np-save').onclick = async ()=>{
      syncStaff(); syncCustom();
      const readVal = (id)=>{ const v = overlay.querySelector('#'+id).value; return v!=='' ? parseFloat(v) : null; };
      const cleanedStaff = staffDraft.map(x=>({id:x.id, name:(x.name||'').trim(), amount:x.amount, source:x.source||EXPENSE_SOURCES[0]})).filter(x=>x.name);
      const cleanedCustom = customDraft.map(x=>({id:x.id, name:(x.name||'').trim(), amount:x.amount, source:x.source||EXPENSE_SOURCES[0]})).filter(x=>x.name);
      const newManual = {
        rent: readVal('np-rent'),
        rentSource: overlay.querySelector('#np-rent-source').value,
        staff: cleanedStaff,
        customExpenses: cleanedCustom,
      };
      if(!state.netProfitManual) state.netProfitManual = {};
      const hasAny = newManual.rent!==null || cleanedStaff.length>0 || cleanedCustom.length>0;
      if(hasAny) state.netProfitManual[ym] = newManual; else delete state.netProfitManual[ym];
      syncNetProfitLinkedExpenses(ym, hasAny ? newManual : {});
      await saveNetProfitManual();
      await saveExpenses();
      recordAction("Данные сохранены");
      state.modal = null;
      overlay.remove();
      render();
    };
  }

  // Зеркалит "Ручные расходы" (аренда / другие сотрудники / свои статьи) из модалки чистой прибыли
  // в настоящие записи Книга → Расходы — чтобы деньги не "терялись" и было видно, из какого источника
  // они ушли. Эти записи помечаются ownerOnly и видны только владельцу, редактируются только отсюда
  // (не через обычную форму расхода), чтобы не разъезжались с исходными данными месяца.
  function syncNetProfitLinkedExpenses(ym, manual){
    const prefix = 'npm:'+ym+':';
    const desiredRefs = new Set();
    const hasRent = manual.rent!==undefined && manual.rent!==null && Number(manual.rent)>0;
    if(hasRent) desiredRefs.add(prefix+'rent');
    (manual.staff||[]).forEach(s=>{ if(s.id && s.amount!==undefined && s.amount!==null && Number(s.amount)>0) desiredRefs.add(prefix+'staff:'+s.id); });
    (manual.customExpenses||[]).forEach(c=>{ if(c.id && c.amount!==undefined && c.amount!==null && Number(c.amount)>0) desiredRefs.add(prefix+'custom:'+c.id); });

    // убираем записи этого месяца, которых больше нет в "Ручных расходах" (удалили строку/обнулили сумму)
    state.expenses = state.expenses.filter(e=> !(e.netProfitRef && e.netProfitRef.startsWith(prefix) && !desiredRefs.has(e.netProfitRef)));

    function upsert(ref, category, name, amount, source){
      const existing = state.expenses.find(e=>e.netProfitRef===ref);
      const comment = name ? `Ручные расходы (чистая прибыль): ${name}` : 'Ручные расходы (чистая прибыль)';
      if(existing){
        existing.amount = Number(amount);
        existing.source = source || EXPENSE_SOURCES[0];
        existing.category = category;
        existing.comment = comment;
        existing.ownerOnly = true;
      } else {
        state.expenses.push({
          id: uid(), date: ym+'-01', category, direction:'', master:'',
          source: source || EXPENSE_SOURCES[0], amount: Number(amount),
          responsible: 'Карина', eventId: '',
          comment, ownerOnly: true, netProfitRef: ref,
        });
      }
    }

    if(hasRent) upsert(prefix+'rent', 'Аренда', '', manual.rent, manual.rentSource);
    (manual.staff||[]).forEach(s=>{
      if(s.id && s.amount!==undefined && s.amount!==null && Number(s.amount)>0) upsert(prefix+'staff:'+s.id, 'Зарплата', s.name, s.amount, s.source);
    });
    (manual.customExpenses||[]).forEach(c=>{
      if(c.id && c.amount!==undefined && c.amount!==null && Number(c.amount)>0) upsert(prefix+'custom:'+c.id, 'Операции', c.name, c.amount, c.source);
    });
  }

  // Снимок факта месяца для калькулятора финмодели: выручка по источникам + расходы,
  // которые естественно растут вместе с выручкой (материалы, ЗП мастеров/админов/менеджеров).
  // Аренда/другие сотрудники/свои статьи сюда не входят — это фиксированные суммы, задаются в калькуляторе вручную.
  function computeNetProfitSnapshot(ym){
    const evts = state.events.filter(e=> e.date && e.date.startsWith(ym));
    const npEventsRevenue = evts.reduce((s,e)=> s + eventRevenueForecast(e), 0);
    const npItemSalesRevenue = state.itemSales
      .filter(x=> x.date && x.date.startsWith(ym))
      .reduce((s,x)=> s + ((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0), 0);
    const npCertSalesRevenue = state.certificates
      .filter(c=> c.saleDate && c.saleDate.startsWith(ym) && c.purpose !== 'marketing' && c.status !== 'refunded')
      .reduce((s,c)=> s + ((c.amount!==undefined&&c.amount!==null&&!isNaN(c.amount))?Number(c.amount):0), 0);
    const npOrdersRevenue = state.orders
      .filter(x=> x.date && x.date.startsWith(ym))
      .reduce((s,x)=> s + ((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0), 0);
    const npTotalRevenue = npEventsRevenue + npItemSalesRevenue + npCertSalesRevenue + npOrdersRevenue;

    const npMaterialsCost = evts.reduce((s,e)=> s + eventMaterialsCost(e), 0);
    const npMastersBasePay = evts.reduce((s,e)=> s + eventTotalMasterPay(e), 0);
    const npMastersItemShare = state.itemSales
      .filter(x=> x.date && x.date.startsWith(ym))
      .reduce((s,x)=> s + Math.round(((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0) * ITEM_SALE_MASTER_PCT / 100), 0);
    const npMastersOrderShare = state.orders
      .filter(x=> x.date && x.date.startsWith(ym))
      .reduce((s,x)=> s + ((x.masterShare!==undefined&&x.masterShare!==null&&!isNaN(x.masterShare))?Number(x.masterShare):0), 0);
    const npUnlinkedAdjustments = state.salaryAdjustments
      .filter(a=> a.date && a.date.startsWith(ym) && !a.eventId)
      .reduce((s,a)=> s + (Number(a.amount)||0), 0);
    const npMastersSalary = npMastersBasePay + npMastersItemShare + npMastersOrderShare + npUnlinkedAdjustments;

    let npHostessSalary = 0;
    {
      const [y, mo] = ym.split('-').map(Number);
      const mIdx = mo - 1;
      const daysInM = new Date(y, mIdx+1, 0).getDate();
      for(let d=1; d<=daysInM; d++){
        const dateObj = new Date(y, mIdx, d);
        const dow = dateObj.getDay();
        const rate = (dow===0 || dow===6) ? HOSTESS_WEEKEND_RATE : HOSTESS_WEEKDAY_RATE;
        const dateStr = fmtDate(dateObj);
        const dayShifts = state.hostessShifts[dateStr];
        if(!dayShifts) continue;
        SHIFT_DEFS.forEach(s=>{
          const rawEntry = dayShifts[s.key];
          const entry = normalizeShiftEntry(rawEntry, s);
          if(entry && entry.name){
            const extra = shiftExtraHours(rawEntry, s);
            npHostessSalary += rate + extra*HOSTESS_EXTRA_HOUR_RATE;
          }
        });
        npHostessSalary += Object.values(hostessDishesBonusesForDate(dateStr, dayShifts)).reduce((s,v)=>s+v,0);
      }
    }
    const npManagerSalary = computeManagerSalaryForMonth(ym).total;

    return { npEventsRevenue, npItemSalesRevenue, npCertSalesRevenue, npOrdersRevenue, npTotalRevenue,
      npMaterialsCost, npMastersSalary, npHostessSalary, npManagerSalary };
  }

  function attachNetProfitCalcModalEvents(overlay){
    const cursor = state.analyticsCursor;
    const ym = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
    const snap = computeNetProfitSnapshot(ym);
    const existingManual = (state.netProfitManual && state.netProfitManual[ym]) || {};

    let staffDraft = (existingManual.staff || []).map(x=>({id:uid(), name:x.name, amount:x.amount}));
    let customDraft = (existingManual.customExpenses || []).map(x=>({id:uid(), name:x.name, amount:x.amount}));
    let revenuePlanTouched = false;

    const defaultRatioPct = snap.npTotalRevenue > 0
      ? Math.round((snap.npMaterialsCost + snap.npMastersSalary + snap.npHostessSalary + snap.npManagerSalary) / snap.npTotalRevenue * 1000) / 10
      : 0;

    const rentInput = overlay.querySelector('#fc-rent');
    rentInput.value = (existingManual.rent!==undefined && existingManual.rent!==null) ? existingManual.rent : 120400;
    const ratioInput = overlay.querySelector('#fc-ratio');
    ratioInput.value = defaultRatioPct;
    overlay.querySelector('#fc-ratio-hint').textContent = snap.npTotalRevenue > 0
      ? `По факту этого месяца: ${defaultRatioPct}%`
      : `В этом месяце пока нет данных для расчёта — вписан 0%, поправьте вручную`;

    function renderStaffRows(){
      overlay.querySelector('#fc-staff-list').innerHTML = renderCalcAmountRows(staffDraft, 'fc-staff');
      attachRowEvents('#fc-staff-list', staffDraft, 'fc-staff');
    }
    function renderCustomRows(){
      overlay.querySelector('#fc-custom-list').innerHTML = renderCalcAmountRows(customDraft, 'fc-custom');
      attachRowEvents('#fc-custom-list', customDraft, 'fc-custom');
    }
    function attachRowEvents(containerId, draft, cls){
      overlay.querySelectorAll(`${containerId} .${cls}-name, ${containerId} .${cls}-amount`).forEach(inp=>{
        inp.oninput = ()=> recalc();
      });
      overlay.querySelectorAll(`${containerId} .${cls}-del`).forEach(btn=>{
        btn.onclick = ()=>{
          syncDrafts();
          draft.splice(parseInt(btn.dataset.idx), 1);
          if(cls==='fc-staff') renderStaffRows(); else renderCustomRows();
          recalc();
        };
      });
    }
    function syncDrafts(){
      overlay.querySelectorAll('#fc-staff-list [data-fcr-idx]').forEach(row=>{
        const i = parseInt(row.dataset.fcrIdx);
        if(!staffDraft[i]) return;
        const amountRaw = row.querySelector('.fc-staff-amount').value;
        staffDraft[i] = { id: staffDraft[i].id, name: row.querySelector('.fc-staff-name').value, amount: amountRaw!==''?parseFloat(amountRaw):null };
      });
      overlay.querySelectorAll('#fc-custom-list [data-fcr-idx]').forEach(row=>{
        const i = parseInt(row.dataset.fcrIdx);
        if(!customDraft[i]) return;
        const amountRaw = row.querySelector('.fc-custom-amount').value;
        customDraft[i] = { id: customDraft[i].id, name: row.querySelector('.fc-custom-name').value, amount: amountRaw!==''?parseFloat(amountRaw):null };
      });
    }

    renderStaffRows();
    renderCustomRows();

    overlay.querySelector('#fc-add-staff').onclick = ()=>{
      syncDrafts();
      staffDraft.push({id:uid(), name:'', amount:null});
      renderStaffRows();
      recalc();
    };
    overlay.querySelector('#fc-add-custom').onclick = ()=>{
      syncDrafts();
      customDraft.push({id:uid(), name:'', amount:null});
      renderCustomRows();
      recalc();
    };

    function recalc(){
      syncDrafts();
      const target = parseFloat(overlay.querySelector('#fc-target').value);
      const rent = parseFloat(rentInput.value) || 0;
      const ratioPct = parseFloat(ratioInput.value);
      const staffTotal = staffDraft.reduce((s,x)=> s + (Number(x.amount)||0), 0);
      const customTotal = customDraft.reduce((s,x)=> s + (Number(x.amount)||0), 0);
      const F = rent + staffTotal + customTotal;
      const resultsEl = overlay.querySelector('#fc-results');
      const revenuePlanInput = overlay.querySelector('#fc-revenue-plan');

      if(isNaN(target)){
        resultsEl.innerHTML = `<div style="color:var(--ink-soft);font-size:13px;margin-top:12px;">Впишите желаемую чистую прибыль, чтобы увидеть расчёт.</div>`;
        return null;
      }
      const r = (isNaN(ratioPct) ? 0 : ratioPct) / 100;
      if(r >= 1){
        resultsEl.innerHTML = `<div style="color:var(--status-red);font-size:13px;margin-top:12px;">% расходов, растущих с выручкой, ≥ 100% — расчёт невозможен, снизьте процент.</div>`;
        return null;
      }
      const minRevenue = (target + F) / (1 - r);
      if(!revenuePlanTouched) revenuePlanInput.value = Math.round(minRevenue);
      const revenuePlanRaw = parseFloat(revenuePlanInput.value);
      const revenuePlan = isNaN(revenuePlanRaw) ? minRevenue : revenuePlanRaw;

      const variableCosts = r * revenuePlan;
      const mandatory = F + variableCosts;
      const marketingResidual = revenuePlan - mandatory - target;
      const totalExpensesPlan = mandatory + marketingResidual;

      const baseRev = snap.npTotalRevenue;
      const shares = baseRev > 0
        ? { events: snap.npEventsRevenue/baseRev, items: snap.npItemSalesRevenue/baseRev, certs: snap.npCertSalesRevenue/baseRev, orders: snap.npOrdersRevenue/baseRev }
        : { events: 0.25, items: 0.25, certs: 0.25, orders: 0.25 };
      const revRows = [
        {label:'Мероприятия', amount: revenuePlan*shares.events},
        {label:'Изделия', amount: revenuePlan*shares.items},
        {label:'Сертификаты', amount: revenuePlan*shares.certs},
        {label:'Заказы', amount: revenuePlan*shares.orders},
      ];

      resultsEl.innerHTML = `
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);">
          <div style="font-family:var(--font-display);font-weight:600;font-size:14px;">Нужная выручка: ${formatMoney(Math.round(revenuePlan))}${revenuePlan > minRevenue+0.5 ? ` <span style="color:var(--ink-soft);font-size:11.5px;font-weight:400;">(минимум для цели — ${formatMoney(Math.round(minRevenue))})</span>` : ''}</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">${baseRev>0 ? 'Разбивка по долям этого месяца:' : 'В этом месяце нет данных — разбивка поровну:'}</div>
          ${revRows.map(rr=>`<div class="stat-row"><div class="stat-label">${escapeHtml(rr.label)}</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;">${formatMoney(Math.round(rr.amount))}</div></div>`).join('')}

          <div style="font-family:var(--font-display);font-weight:600;font-size:14px;margin-top:16px;">Расходы всего: ${formatMoney(Math.round(totalExpensesPlan))}</div>
          <div class="stat-row"><div class="stat-label">Аренда</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--status-red);">${formatMoney(rent)}</div></div>
          ${staffDraft.filter(s=>s.name && s.amount).map(s=>`<div class="stat-row"><div class="stat-label">${escapeHtml(s.name)}</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--status-red);">${formatMoney(Number(s.amount)||0)}</div></div>`).join('')}
          ${customDraft.filter(c=>c.name && c.amount).map(c=>`<div class="stat-row"><div class="stat-label">${escapeHtml(c.name)}</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--status-red);">${formatMoney(Number(c.amount)||0)}</div></div>`).join('')}
          <div class="stat-row"><div class="stat-label">Материалы + ЗП (${isNaN(ratioPct)?0:ratioPct}% от выручки)</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--status-red);">${formatMoney(Math.round(variableCosts))}</div></div>
          <div class="stat-row"><div class="stat-label">Маркетинг — остаток</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;color:${marketingResidual>=0?'var(--status-green)':'var(--status-red)'};">${formatMoney(Math.round(marketingResidual))}</div></div>
          ${marketingResidual<0 ? `<div style="color:var(--status-red);font-size:11.5px;margin-top:2px;">Обязательных расходов больше, чем позволяет план выручки при этой цели — увеличьте выручку выше или снизьте расходы.</div>` : ''}

          <div style="font-family:var(--font-display);font-weight:600;font-size:15px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);">Чистая прибыль: <span style="color:var(--status-green);">${formatMoney(Math.round(target))}</span></div>
        </div>
      `;
      return { target, revenuePlan };
    }

    overlay.querySelector('#fc-target').oninput = ()=> recalc();
    rentInput.oninput = ()=> recalc();
    ratioInput.oninput = ()=> recalc();
    overlay.querySelector('#fc-revenue-plan').oninput = ()=>{ revenuePlanTouched = true; recalc(); };

    recalc();

    overlay.querySelector('#fc-cancel').onclick = ()=>{ state.modal = null; overlay.remove(); };
    overlay.querySelector('#fc-save-plan').onclick = async ()=>{
      const result = recalc();
      if(!result) return;
      if(!state.monthlyPlans) state.monthlyPlans = {};
      if(!state.monthlyPlans[ym]) state.monthlyPlans[ym] = {};
      state.monthlyPlans[ym].revenue = Math.round(result.revenuePlan);
      state.monthlyPlans[ym].profit = Math.round(result.target);
      await saveMonthlyPlans();
      recordAction("Данные сохранены");
      state.modal = null;
      overlay.remove();
      render();
    };
  }

  // Выручка по конкретному продукту (мероприятия) за месяц — используется и для подсказки
  // "прошлый год" в плане по продуктам, и для сравнения факт/план в "Выполнение плана".
  function productRevenueForMonth(product, ym){
    return state.events
      .filter(e=> e.date && e.date.startsWith(ym) && e.product === product)
      .reduce((s,e)=> s + eventRevenueForecast(e), 0);
  }

  function attachPlanEditModalEvents(overlay){
    const cursor = state.analyticsCursor;
    const ym = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
    const existingPlan = (state.monthlyPlans && state.monthlyPlans[ym]) || {};
    let customDraft = (existingPlan.custom || []).map(m=>({...m}));

    function syncCustomFromInputs(){
      overlay.querySelectorAll('#plan-custom-list [data-pc-idx]').forEach(row=>{
        const i = parseInt(row.dataset.pcIdx);
        if(!customDraft[i]) return;
        const targetRaw = row.querySelector('.pc-target').value;
        const actualRaw = row.querySelector('.pc-actual').value;
        customDraft[i] = {
          name: row.querySelector('.pc-name').value,
          target: targetRaw !== '' ? parseFloat(targetRaw) : null,
          actual: actualRaw !== '' ? parseFloat(actualRaw) : null,
        };
      });
    }
    function refreshCustomUI(){
      const container = overlay.querySelector('#plan-custom-list');
      container.innerHTML = renderPlanCustomRows(customDraft);
      attachCustomRowEvents();
    }
    function attachCustomRowEvents(){
      overlay.querySelectorAll('.pc-del').forEach(btn=>{
        btn.onclick = ()=>{
          syncCustomFromInputs();
          customDraft.splice(parseInt(btn.dataset.idx), 1);
          refreshCustomUI();
        };
      });
    }
    attachCustomRowEvents();
    const addCustomBtn = overlay.querySelector('#btn-add-plan-custom');
    if(addCustomBtn) addCustomBtn.onclick = ()=>{
      syncCustomFromInputs();
      customDraft.push({name:'', target:null, actual:null});
      refreshCustomUI();
    };

    overlay.querySelector('#plan-cancel').onclick = ()=>{ state.modal = null; overlay.remove(); };
    overlay.querySelector('#plan-save').onclick = ()=>{
      const readVal = (id)=>{ const v = overlay.querySelector('#'+id).value; return v!=='' ? parseInt(v) : null; };
      syncCustomFromInputs();
      const cleanedCustom = customDraft
        .map(m=>({name:(m.name||'').trim(), target:m.target, actual:m.actual}))
        .filter(m=>m.name);
      const byProduct = {};
      overlay.querySelectorAll('.plan-product-input').forEach(inp=>{
        const v = inp.value.trim();
        if(v!=='') byProduct[inp.dataset.product] = parseInt(v);
      });
      const byProductSum = Object.values(byProduct).reduce((s,v)=>s+v, 0);
      let revenueVal = readVal('plan-revenue');
      // если общая выручка не задана явно, а по продуктам что-то вписано — считаем её суммой
      if(revenueVal===null && byProductSum>0) revenueVal = byProductSum;
      const newPlan = {
        revenue: revenueVal,
        profit: readVal('plan-profit'),
        eventsCount: readVal('plan-events'),
        guestsCount: readVal('plan-guests'),
        leadsCount: readVal('plan-leads'),
        conversionPct: readVal('plan-conversion'),
        custom: cleanedCustom,
        byProduct,
      };
      overlay.remove();
      requireAdminUnlock(async ()=>{
        if(!state.monthlyPlans) state.monthlyPlans = {};
        const hasAny = Object.values(newPlan).some(v=> v!==null && !(Array.isArray(v) && v.length===0) && !(typeof v==='object' && !Array.isArray(v) && Object.keys(v).length===0));
        if(hasAny) state.monthlyPlans[ym] = newPlan; else delete state.monthlyPlans[ym];
        await saveMonthlyPlans();
        recordAction('План сохранён');
        state.modal = null;
        render();
      });
    };
  }

  function allHostNamesDisplay(e){
    const names = eventHostsWithPay(e).map(h=>h.name);
    return names.length ? names.join(', ') : 'без мастера';
  }

  function rentalSuffix(e){
    if(!showsDishesAndRental(e.status)) return '';
    const parts=[];
    if(e.rentalBefore) parts.push(`+${e.rentalBefore} до`);
    if(e.rentalAfter) parts.push(`+${e.rentalAfter} после`);
    return parts.length ? ' · ⏱ '+parts.join(', ') : '';
  }

  function missingDocs(e){
    if(e.payerType !== 'legal') return [];
    const d = e.documents || {};
    const missing = [];
    if(!d.contract) missing.push('Договор');
    if(!d.paymentOrder) missing.push('Платёжное поручение');
    if(!d.act) missing.push('Акт');
    return missing;
  }
  function legalSuffix(e){
    if(e.payerType !== 'legal') return '';
    const missing = missingDocs(e);
    const label = e.companyName ? escapeHtml(e.companyName) : 'Юр.лицо';
    return missing.length
      ? ` · 🏢 ${label} · ⚠ нет: ${missing.join(', ')}`
      : ` · 🏢 ${label} · ✓ документы полные`;
  }

  function shiftSummaryShort(dateStr){
    const s = state.hostessShifts[dateStr];
    if(!s) return '';
    const parts = [];
    SHIFT_DEFS.forEach(def=>{
      const entry = normalizeShiftEntry(s[def.key], def);
      if(entry && entry.name) parts.push(entry.name);
    });
    return parts.join(' → ');
  }

  function renderDayModal(dateStr){
    const d = parseDate(dateStr);
    const dLabel = d.toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'});
    const isAll = state.activeSpaceId === 'all';
    const space = getSpace(state.activeSpaceId);
    const evts = eventsFor(state.activeSpaceId, dateStr);
    const warnMap = computeGapWarnings(evts);

    // сводка по всему дню (все пространства), независимо от того, какая вкладка открыта
    const allDayEvts = state.events.filter(e=>e.date===dateStr);
    const dayRevenue = allDayEvts.reduce((s,e)=> s + ((e.price!==undefined&&e.price!==null&&!isNaN(e.price))?Number(e.price):0), 0);
    const dayGuests = allDayEvts.reduce((s,e)=> s + ((e.guests!==undefined&&e.guests!==null&&!isNaN(e.guests))?Number(e.guests):0), 0);
    const dayEventsCount = allDayEvts.length;

    return `

                ${e.notes ? `<div class="notes" title="${escapeHtml(e.notes)}">💬 ${escapeHtml(e.notes)}</div>` : ''}

                <button class="quick-host-btn" data-eid="${e.id}" title="Сменить мастера (без кода)">✎ мастер</button>
                ${isMyEventForReport(e) ? `<button class="quick-report-btn" data-eid="${e.id}" title="Отчёт мастера (без кода)" style="${hasMasterReport(e)?'border-color:var(--status-green);color:var(--status-green);':''}">📝 ${hasMasterReport(e)?'отчёт ✓':'отчёт'}</button>` : ''}

        </div>
      </div>

  function attachDayModalEvents(overlay, dateStr){
    overlay.querySelectorAll('.shift-edit-btn').forEach(btn=>{
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        const shiftDate = btn.dataset.date;
        const shiftKey = btn.dataset.shift;
        const rawEntry = (state.hostessShifts[shiftDate] || {})[shiftKey] || null;
        overlay.remove();
        state.modal = {type:'quick-shift', shiftDate, shiftKey, rawEntry};
        render();
      };
    });
    overlay.querySelectorAll('.manager-shift-edit-btn').forEach(btn=>{
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        const shiftDate = btn.dataset.date;
        overlay.remove();
        state.modal = {type:'quick-manager-shift', shiftDate};
        render();
      };
    });
    const markDayOffBtn = overlay.querySelector('#btn-mark-dayoff');
    if(markDayOffBtn) markDayOffBtn.onclick = async (ev)=>{
      ev.stopPropagation();
      const input = overlay.querySelector('#dayoff-name-input');
      const name = (input.value||'').trim();
      if(!name){ input.style.borderColor = 'var(--danger)'; input.focus(); return; }
      if(!state.daysOff) state.daysOff = [];
      state.daysOff.push({ id: uid(), date: dateStr, role: state.currentRole, name });
      await saveDaysOff();
      setRememberedDayOffName(state.currentRole, name);
      recordAction(`${name} отметил(а) себя выходным на ${formatDateText(dateStr)}`);
      overlay.remove();
      state.modal = {type:'day', date: dateStr};
      render();
    };
    overlay.querySelectorAll('.dayoff-del-btn').forEach(btn=>{
      btn.onclick = async (ev)=>{
        ev.stopPropagation();
        const id = btn.dataset.id;
        state.daysOff = (state.daysOff||[]).filter(x=>x.id!==id);
        await saveDaysOff();
        overlay.remove();
        state.modal = {type:'day', date: dateStr};
        render();
      };
    });
    overlay.querySelectorAll('.day-evt').forEach(el=>{
      el.onclick = ()=>{
        const e = state.events.find(x=>x.id===el.dataset.eid);
        const keepAll = state.activeSpaceId==='all';
        overlay.remove();
        if(state.currentRole === 'master'){
          state.modal = {type:'quick-host', event:{...e}, keepAll};
          render();
          return;
        }
        requireUnlock(()=>{
          state.modal = {type:'event', event:{...e}, isNew:false, keepAll};
          render();
        });
      };
    });
    overlay.querySelectorAll('.quick-host-btn').forEach(btn=>{
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        const e = state.events.find(x=>x.id===btn.dataset.eid);
        if(!e) return;
        const keepAll = state.activeSpaceId==='all';
        overlay.remove();
        state.modal = {type:'quick-host', event:{...e}, keepAll};
        render();
      };
    });
    overlay.querySelectorAll('.quick-report-btn').forEach(btn=>{
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        const e = state.events.find(x=>x.id===btn.dataset.eid);
        if(!e) return;
        if(!isMyEventForReport(e)) return; // мастер может заполнять отчёт только по своим МК
        const keepAll = state.activeSpaceId==='all';
        overlay.remove();
        state.modal = {type:'quick-report', event:{...e}, keepAll};
        render();
      };
    });
    const addBtn = overlay.querySelector('#btn-add-evt');
    if(addBtn) addBtn.onclick = ()=>{
      const defaultSpaceId = state.activeSpaceId === 'all' ? state.spaces[0].id : state.activeSpaceId;
      const keepAll = state.activeSpaceId==='all';
      overlay.remove();
      requireUnlock(()=>{
        state.modal = {type:'event', isNew:true, keepAll, event:{
          id: uid(), spaceId: defaultSpaceId, date: dateStr, time:'10:00', duration:60, guests:null, itemsCount:null, itemsCountAuto:true, masterPay:null, masterPayAuto:true, additionalHosts:[], guestName:'', price:null, agreedPrice:null, materialsItems:[], pickupItems:[], payments:[], title:'', product:'', host:'', dishes:'', dishesWasher:'', rentalBefore:0, rentalAfter:0, payerType:'individual', companyName:'', documents:{contract:false,paymentOrder:false,act:false}, masterReport:null, notes:''
        }};
        render();
      });
    };

    const addSlotBtn = overlay.querySelector('#btn-add-slot');
    if(addSlotBtn) addSlotBtn.onclick = ()=>{
      const defaultSpaceId = state.activeSpaceId === 'all' ? state.spaces[0].id : state.activeSpaceId;
      const keepAll = state.activeSpaceId==='all';
      overlay.remove();
      state.modal = {type:'quick-add-slot', keepAll, event:{
        id: uid(), spaceId: defaultSpaceId, date: dateStr, time:'10:00', duration:60, title:'', host: state.loggedInMasterName || ''
      }};
      render();
    };
  }
