    }

    overlay.querySelectorAll('.dishes-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.dishes-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#f-dishes').value = opt.dataset.dishes;
        const paymentWrap = overlay.querySelector('#dishes-payment-wrap');
        if(paymentWrap) paymentWrap.style.display = opt.dataset.dishes === 'needed' ? 'block' : 'none';
        if(opt.dataset.dishes !== 'needed'){
          overlay.querySelector('#f-dishes-payment').value = '';
          overlay.querySelectorAll('.dishes-payment-opt').forEach(o=>o.classList.remove('active'));
          const washerField = overlay.querySelector('#dishes-washer-field');
          if(washerField) washerField.style.display = 'none';
        }
      };
    });

    overlay.querySelectorAll('.dishes-payment-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.dishes-payment-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#f-dishes-payment').value = opt.dataset.dishespayment;
        const washerField = overlay.querySelector('#dishes-washer-field');
        if(washerField) washerField.style.display = opt.dataset.dishespayment === 'paid' ? 'block' : 'none';
      };
    });

    overlay.querySelectorAll('.payer-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.payer-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#f-payer-type').value = opt.dataset.payer;
        const legalField = overlay.querySelector('#legal-field');
        if(legalField) legalField.style.display = (opt.dataset.payer === 'legal') ? 'block' : 'none';
      };
    });

    const delBtn = overlay.querySelector('#btn-del');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.event.date ? state.modal.event.date.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      showConfirmDeletePopup(`Удалить мероприятие «${escapeHtml(state.modal.event.title||'без названия')}»? Это уберёт и все связанные данные (платежи, себестоимость, привязанные сертификаты). Действие необратимо.`, async ()=>{
      const eventToDelete = state.modal.event;
      state.events = state.events.filter(x=>x.id !== eventToDelete.id);
      // восстанавливаем остатки материалов, списанных этим мероприятием
      let catalogChanged = false;
      (eventToDelete.materialsItems||[]).forEach(m=>{
        if(m.qty===undefined || m.qty===null || isNaN(m.qty)) return;
        const catItem = state.materialsCatalog.find(c=>c.name.trim().toLowerCase()===(m.name||'').trim().toLowerCase());
        if(!catItem || !catItem.trackStock) return;
        catItem.stock = (catItem.stock!==undefined&&catItem.stock!==null&&!isNaN(catItem.stock)?Number(catItem.stock):0) + Number(m.qty);
        catalogChanged = true;
      });
      if(catalogChanged) await saveMaterialsCatalog();
      const linkedAutoIncomes = state.incomes.filter(i=> i.eventId===eventToDelete.id && (i.autoFromEvent || i.autoFromPayment));
      if(linkedAutoIncomes.length){
        const removeIds = new Set(linkedAutoIncomes.map(i=>i.id));
        state.incomes = state.incomes.filter(x=>!removeIds.has(x.id));
        await saveIncomes();
      }
      await saveEvents();
      state.modal = null; overlay.remove(); render();
      });
    };

    const duplicateBtn = overlay.querySelector('#btn-duplicate');
    if(duplicateBtn) duplicateBtn.onclick = ()=>{
      const src = state.modal.event;
      const nextWeek = new Date(parseDate(src.date).getTime() + 7*86400000);
      const clonedMaterials = (src.materialsItems||[]).map(m=>({name:m.name, cost:m.cost, qty: undefined, source:m.source, costAuto:false}));
      const clonedHosts = (src.additionalHosts||[]).map(h=>({...h}));
      const clone = {
        id: uid(),
        spaceId: src.spaceId,
        date: fmtDate(nextWeek),
        time: src.time,
        duration: src.duration,
        guests: src.guests,
        itemsCount: null,
        itemsCountAuto: true,
        host: src.host,
        masterPay: null,
        masterPayAuto: true,
        additionalHosts: clonedHosts.map(h=>({...h, masterPay:null, masterPayAuto:true})),
        guestName: '',
        price: null,
        agreedPrice: null,
        materialsItems: clonedMaterials,
        pickupItems: [],
        payments: [],
        title: src.title,
        product: src.product,
        status: src.status === 'slot' ? 'slot' : 'confirmed',
        dishes: '',
        rentalBefore: 0,
        rentalAfter: 0,
        payerType: 'individual',
        companyName: '',
        documents: {contract:false, paymentOrder:false, act:false},
        masterReport: null,
        notes: '',
      };
      state.modal = {type:'event', isNew:true, event:clone};
      render();
    };

    const saveBtn = overlay.querySelector('#btn-save');
    saveBtn.onclick = async ()=>{
      // защита закрытых периодов: нельзя менять/создавать мероприятия в закрытом месяце, если ты не руководитель
      if(state.currentRole !== 'owner'){
        const origDateYm = state.modal.event.date ? state.modal.event.date.slice(0,7) : null;
        const newDateVal = overlay.querySelector('#f-date').value;
        const newDateYm = newDateVal ? newDateVal.slice(0,7) : null;
        const blockedYm = [origDateYm, newDateYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      // сброс подсветки ошибок с прошлой попытки
      ['f-title','f-product','f-host','f-date','f-time','f-duration','f-guests','f-price','f-notes'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dishesFieldEl = overlay.querySelector('#dishes-field');
      if(dishesFieldEl) dishesFieldEl.style.boxShadow = '';
      const rentalFieldEl = overlay.querySelector('#rental-field');
      if(rentalFieldEl) rentalFieldEl.style.boxShadow = '';

      const title = overlay.querySelector('#f-title').value.trim();
      const productVal = overlay.querySelector('#f-product').value;
      const hostVal = overlay.querySelector('#f-host').value.trim();
      const dateVal = overlay.querySelector('#f-date').value;
      const timeVal = overlay.querySelector('#f-time').value;
      const durationVal = parseInt(overlay.querySelector('#f-duration').value) || 0;
      const guestsRaw = overlay.querySelector('#f-guests').value;
      const priceRaw = overlay.querySelector('#f-price').value;
      const statusVal = overlay.querySelector('#f-status').value || 'confirmed';
      const dishesVal = overlay.querySelector('#f-dishes').value;
      const dishesPaymentVal = overlay.querySelector('#f-dishes-payment').value;
      const rentalBeforeRaw = overlay.querySelector('#f-rental-before').value;
      const rentalAfterRaw = overlay.querySelector('#f-rental-after').value;
      const notesVal = overlay.querySelector('#f-notes').value.trim();
      // "Гости по отдельности" теперь единственное место, где фиксируется, кто пришёл — считаем оттуда
      const guestListForSave = guestListArr.map(g=>({
        id: g.id, name: (g.name||'').trim(), seats: Math.max(1, parseInt(g.seats)||1),
        items: (g.items!==undefined && g.items!==null && !isNaN(parseInt(g.items))) ? Math.max(0, parseInt(g.items)) : 1,
        phone: (g.phone||'').trim(), comment: (g.comment||'').trim(),
        expected: (g.expected!==undefined && g.expected!==null && g.expected!=='' && !isNaN(g.expected)) ? Math.round(Number(g.expected)*100)/100 : null,
      }));
      const guestNameVal = guestListForSave.map(g=>g.name).filter(Boolean).join(', ');
      // обязательно только имя у гостя, который уже добавлен (пустая строка "гость без имени" — ошибка);
      // само по себе отсутствие гостей не блокирует сохранение — иначе старые мероприятия без разбивки
      // по гостям и ещё не забронированные слоты "по расписанию" нельзя было бы сохранить вообще
      const guestNamesMissing = guestListForSave.some(g=>!g.name);
      syncMaterialsItemsFromInputs();
      const cleanedMaterialsItems = materialsItemsDraft
        .map(m=>({name:(m.name||'').trim(), cost:(m.cost!==undefined&&m.cost!==null&&!isNaN(m.cost))?Number(m.cost):null, qty:(m.qty!==undefined&&m.qty!==null&&!isNaN(m.qty))?Number(m.qty):null, source:m.source==='master'?'master':'studio', payTo:m.source==='master'?(m.payTo||'').trim():'', expenseDate:(m.source==='master'&&m.payTo&&m.payTo.trim())?(m.expenseDate||'').trim():''}))
        .filter(m=>m.name && m.cost!==null);
      const materialsMissing = cleanedMaterialsItems.length === 0;
      syncPickupItemsFromInputs();
      const cleanedPickupItems = pickupItemsDraft
        .map(p=>({guestName:(p.guestName||'').trim(), readyDate:p.readyDate||'', status:p.status==='picked_up'?'picked_up':'waiting', pickupDate:p.pickupDate||''}))
        .filter(p=>p.guestName || p.readyDate);
      const rentalBeforeVal = showsDishesAndRental(statusVal) ? (parseInt(rentalBeforeRaw) || 0) : 0;
      const rentalAfterVal = showsDishesAndRental(statusVal) ? (parseInt(rentalAfterRaw) || 0) : 0;

      // для статуса "Слот" поля необязательны — во всех остальных случаях обязательны все графы
      if(statusVal !== 'slot'){
        let firstInvalid = null;
        const markInvalid = (id)=>{
          const el = overlay.querySelector('#'+id);
          if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
        };
        if(!title) markInvalid('f-title');
        if(!hostVal) markInvalid('f-host');
        if(!dateVal) markInvalid('f-date');
        if(!timeVal) markInvalid('f-time');
        if(!durationVal || durationVal<=0) markInvalid('f-duration');
        if(guestsRaw === '') markInvalid('f-guests');
        if(priceRaw === '' || Number(priceRaw) < 0) markInvalid('f-price');
        const agreedPriceRawCheck = overlay.querySelector('#f-agreed-price').value;
        const agreedPriceNegative = agreedPriceRawCheck !== '' && Number(agreedPriceRawCheck) < 0;
        if(agreedPriceNegative) markInvalid('f-agreed-price');
        if(!notesVal) markInvalid('f-notes');
        if(guestNamesMissing){
          const guestListEl = overlay.querySelector('#guest-list-container');
          if(guestListEl){ guestListEl.style.boxShadow = 'inset 0 0 0 1.5px var(--danger)'; guestListEl.style.borderRadius = 'var(--radius)'; if(!firstInvalid) firstInvalid = guestListEl; }
          const detailsEl = overlay.querySelector('#guest-breakdown-details');
          if(detailsEl) detailsEl.open = true;
        }
        const masterPayRawCheck = overlay.querySelector('#f-master-pay').value;
        const masterPayNegative = masterPayRawCheck !== '' && Number(masterPayRawCheck) < 0;
        if(masterPayNegative) markInvalid('f-master-pay');
        const additionalHostsNegative = [...overlay.querySelectorAll('.ah-pay')].some(inp=> inp.value !== '' && Number(inp.value) < 0);
        if(additionalHostsNegative){
          overlay.querySelectorAll('.ah-pay').forEach(inp=>{ if(Number(inp.value) < 0) inp.style.borderColor = 'var(--danger)'; });
          if(!firstInvalid) firstInvalid = overlay.querySelector('.ah-pay');
        }
        const materialsNegative = cleanedMaterialsItems.some(m=> m.cost < 0);
        if(materialsMissing){
          const materialsListEl = overlay.querySelector('#materials-items-list');
          if(materialsListEl){ materialsListEl.style.boxShadow = 'inset 0 0 0 1.5px var(--danger)'; materialsListEl.style.borderRadius = 'var(--radius)'; if(!firstInvalid) firstInvalid = materialsListEl; }
        }
        if(materialsNegative){
          const materialsListEl = overlay.querySelector('#materials-items-list');
          if(materialsListEl){ materialsListEl.style.boxShadow = 'inset 0 0 0 1.5px var(--danger)'; materialsListEl.style.borderRadius = 'var(--radius)'; if(!firstInvalid) firstInvalid = materialsListEl; }
        }
        // аренда до/после мероприятия НЕ обязательна для заполнения — пустое поле значит 0 (см. rentalBeforeVal/rentalAfterVal ниже),
        // это самый частый случай, и заставлять вручную вбивать "0" каждый раз не нужно
        let dishesMissing = false;
        if(showsDishesAndRental(statusVal)){
          if(!dishesVal){ dishesMissing = true; if(dishesFieldEl) dishesFieldEl.style.boxShadow = 'inset 0 0 0 1.5px var(--danger)'; if(!firstInvalid) firstInvalid = dishesFieldEl; }
          else if(dishesVal === 'needed' && !dishesPaymentVal){ dishesMissing = true; if(dishesFieldEl) dishesFieldEl.style.boxShadow = 'inset 0 0 0 1.5px var(--danger)'; if(!firstInvalid) firstInvalid = dishesFieldEl; }
        }
        if(!title || !hostVal || !dateVal || !timeVal || !durationVal || durationVal<=0 || guestsRaw==='' || priceRaw==='' || Number(priceRaw)<0 || agreedPriceNegative || masterPayNegative || additionalHostsNegative || materialsNegative || !notesVal || guestNamesMissing || materialsMissing || dishesMissing){
          showGapWarningBanner('Заполните все поля перед сохранением (для статуса «Слот» это необязательно). Себестоимость: добавьте хотя бы один материал с названием и суммой. Суммы (выручка, ЗП мастеру и со-ведущим, себестоимость) не могут быть отрицательными.');
          if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
          return;
        }
      } else if(!title){
        // даже у "Слота" нужно хоть какое-то название, чтобы отличать события в календаре
        overlay.querySelector('#f-title').style.borderColor = 'var(--danger)';
        return;
      }

      syncAdditionalHostsFromInputs();
      const finalAdditionalHosts = additionalHostsDraft
        .map(h=>({ name: (h.name||'').trim(), masterPay: h.masterPay, masterPayAuto: h.masterPayAuto }))
        .filter(h=>h.name);
      const allNamesForThisEvent = [hostVal, ...finalAdditionalHosts.map(h=>h.name)].filter(Boolean);

      if(allNamesForThisEvent.length){
        const newStart = timeToMinutes(timeVal);
        const newEnd = timeToMinutes(timeVal) + durationVal;
        let conflict = null, conflictName = null;
        for(const name of allNamesForThisEvent){
          conflict = state.events.find(e=>{
            if(e.id === state.modal.event.id) return false; // не сравниваем событие само с собой при редактировании
            if(e.date !== dateVal) return false;
            const names = eventHostsWithPay(e).map(h=>h.name.toLowerCase());
            if(!names.includes(name.toLowerCase())) return false;
            const s = timeToMinutes(e.time);
            const en = s + (Number(e.duration)||0);
            return newStart < en && s < newEnd;
          });
          if(conflict){ conflictName = name; break; }
        }
        if(conflict){
          const csp = getSpace(conflict.spaceId);
          const conflictEnd = timeToMinutes(conflict.time) + (Number(conflict.duration)||0);
          const endH = String(Math.floor(conflictEnd/60)).padStart(2,'0');
          const endM = String(conflictEnd%60).padStart(2,'0');
          showHostConflictPopup(
            `<b>${escapeHtml(conflictName)}</b> уже занят(а) в это время — ведёт «${escapeHtml(conflict.title)}» с ${conflict.time} до ${endH}:${endM} в пространстве «${escapeHtml(csp.name)}» (${formatDateText(dateVal)}).<br><br>Выберите другое время или другого мастера.`
          );
          return; // блокируем сохранение
        }
      }

      const updated = {
        id: state.modal.event.id,
        spaceId: overlay.querySelector('#f-space').value,
        host: hostVal,
        date: dateVal,
        time: timeVal,
        duration: durationVal,
        guests: overlay.querySelector('#f-guests').value !== '' ? parseInt(overlay.querySelector('#f-guests').value) : null,
        itemsCount: (overlay.querySelector('#f-items-count') && overlay.querySelector('#f-items-count').value !== '') ? parseInt(overlay.querySelector('#f-items-count').value) : null,
        itemsCountAuto: overlay.querySelector('#f-items-count') ? (overlay.querySelector('#f-items-count').dataset.auto === 'true') : true,
        masterPay: overlay.querySelector('#f-master-pay').value !== '' ? parseInt(overlay.querySelector('#f-master-pay').value) : null,
        masterPayAuto: overlay.querySelector('#f-master-pay').dataset.auto === 'true',
        additionalHosts: finalAdditionalHosts,
        guestName: guestNameVal,
        price: overlay.querySelector('#f-price').value !== '' ? parseInt(overlay.querySelector('#f-price').value) : null,
        agreedPrice: overlay.querySelector('#f-agreed-price').value !== '' ? parseInt(overlay.querySelector('#f-agreed-price').value) : null,
        materialsItems: cleanedMaterialsItems,
        pickupItems: cleanedPickupItems,
        payerType: overlay.querySelector('#f-payer-type').value || 'individual',
        companyName: overlay.querySelector('#f-company-name').value.trim(),
        documents: {
          contract: overlay.querySelector('#f-doc-contract').checked,
          paymentOrder: overlay.querySelector('#f-doc-payment').checked,
          act: overlay.querySelector('#f-doc-act').checked,
        },
        payments: (()=>{ try{ return JSON.parse(overlay.querySelector('#f-payments').value || '[]'); }catch(e){ return []; } })(),
        guestList: guestListForSave,
        title: title,
        product: overlay.querySelector('#f-product').value || '',
        status: overlay.querySelector('#f-status').value || 'confirmed',
        dishes: overlay.querySelector('#f-dishes').value || '',
        dishesPayment: overlay.querySelector('#f-dishes').value === 'needed' ? (overlay.querySelector('#f-dishes-payment').value || '') : '',
        dishesWasher: (overlay.querySelector('#f-dishes').value === 'needed' && overlay.querySelector('#f-dishes-payment').value === 'paid' && overlay.querySelector('#f-dishes-washer')) ? (overlay.querySelector('#f-dishes-washer').value || '') : '',
        rentalBefore: rentalBeforeVal,
        rentalAfter: rentalAfterVal,
        notes: overlay.querySelector('#f-notes').value.trim(),
        masterReport: (()=>{
          const source = overlay.querySelector('#f-report-source').value.trim();
          const professions = overlay.querySelector('#f-report-professions').value.trim();
          const unique = overlay.querySelector('#f-report-unique').value.trim();
          const ratingRaw = overlay.querySelector('#f-report-rating').value;
          const ratingComment = overlay.querySelector('#f-report-rating-comment').value.trim();
          if(!source && !professions && !unique && !ratingRaw && !ratingComment) return state.modal.event.masterReport || null;
          return { source, professions, unique, rating: ratingRaw?parseInt(ratingRaw):null, ratingComment };
        })(),
      };
      const idx = state.events.findIndex(x=>x.id===updated.id);
      const previousMaterialsItems = idx >= 0 ? (state.events[idx].materialsItems || []) : [];
      if(idx >= 0) state.events[idx] = updated; else state.events.push(updated);
      if(!state.modal.keepAll) state.activeSpaceId = updated.spaceId;

      // списание/восстановление остатков материалов — по разнице количества между старой и новой версией мероприятия
      const oldQtyByName = {};
      previousMaterialsItems.forEach(m=>{
        if(m.qty!==undefined && m.qty!==null && !isNaN(m.qty)){
          const key = (m.name||'').trim().toLowerCase();
          oldQtyByName[key] = (oldQtyByName[key]||0) + Number(m.qty);
        }
      });
      const newQtyByName = {};
      cleanedMaterialsItems.forEach(m=>{
        if(m.qty!==undefined && m.qty!==null && !isNaN(m.qty)){
          const key = m.name.trim().toLowerCase();
          newQtyByName[key] = (newQtyByName[key]||0) + Number(m.qty);
        }
      });
      const affectedMaterialKeys = new Set([...Object.keys(oldQtyByName), ...Object.keys(newQtyByName)]);
      let catalogChanged = false;
      const justRanOutNames = [];
      affectedMaterialKeys.forEach(key=>{
        const catItem = state.materialsCatalog.find(m=>m.name.trim().toLowerCase()===key);
        if(!catItem || !catItem.trackStock) return; // материал не найден в справочнике или остатки по нему не отслеживаются (переменный расходник)
        const delta = (newQtyByName[key]||0) - (oldQtyByName[key]||0);
        if(delta !== 0){
          const stockBefore = (catItem.stock!==undefined&&catItem.stock!==null&&!isNaN(catItem.stock)?Number(catItem.stock):0);
          const stockAfter = stockBefore - delta;
          catItem.stock = stockAfter;
          catalogChanged = true;
          if(stockBefore > 0 && stockAfter <= 0) justRanOutNames.push(catItem.name);
        }
      });
      if(catalogChanged) await saveMaterialsCatalog();
      if(justRanOutNames.length > 0){
        sendPushNotification('Закончился материал', justRanOutNames.join(', '), ['admin','owner']);
      }

      await saveEvents();
      await syncEventIncomeIfNeeded(updated);
      await syncEventPaymentsToBook(updated);
      const dayEvts = state.events.filter(e=>e.date===updated.date && e.spaceId===updated.spaceId);
      const warns = computeGapWarnings(dayEvts);
      recordAction('Мероприятие сохранено');
      state.modal = null; overlay.remove(); render();
      if(warns[updated.id]){
        const w = warns[updated.id];
        showGapWarningBanner(w.gap < 0
          ? `Внимание: «${updated.title}» накладывается по времени на «${w.prevTitle}» (${Math.abs(w.gap)} мин)`
          : `Внимание: перерыв между «${w.prevTitle}» и «${updated.title}» — всего ${w.gap} мин (меньше ${MIN_GAP_MINUTES})`);
      }
    };
  }

  function showConfirmDeletePopup(message, onConfirm){
    let existing = document.getElementById('confirm-delete-popup');
    if(existing) existing.remove();
    const wrap = document.createElement('div');
    wrap.id = 'confirm-delete-popup';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(42,37,32,0.5);display:flex;align-items:center;justify-content:center;z-index:220;padding:20px;';
    wrap.innerHTML = `
      <div style="background:var(--white);border-radius:4px;max-width:400px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.3);font-family:var(--font-body);">
        <div style="font-family:var(--font-display);font-weight:600;font-size:16px;margin-bottom:10px;color:var(--danger);">Подтвердите удаление</div>
        <div style="font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:18px;">${message}</div>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button id="confirm-del-no" style="border:1px solid var(--line-strong);background:var(--white);color:var(--ink);padding:9px 18px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:var(--font-body);">Отмена</button>
          <button id="confirm-del-yes" style="border:none;background:var(--danger);color:#fff;padding:9px 18px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:var(--font-body);">Удалить</button>
        </div>
      </div>
    `;
    document.body.appendChild(wrap);
    wrap.querySelector('#confirm-del-yes').onclick = ()=>{ wrap.remove(); recordAction('Удалено'); onConfirm(); };
    wrap.querySelector('#confirm-del-no').onclick = ()=> wrap.remove();
    wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  }

  function showHostConflictPopup(htmlMessage){
    let existing = document.getElementById('host-conflict-popup');
    if(existing) existing.remove();
    const wrap = document.createElement('div');
    wrap.id = 'host-conflict-popup';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(42,37,32,0.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';
    wrap.innerHTML = `
      <div style="background:var(--white);border-radius:4px;max-width:400px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.3);font-family:var(--font-body);">
        <div style="font-family:var(--font-display);font-weight:600;font-size:17px;margin-bottom:10px;color:var(--danger);">🚫 Мастер занят</div>
        <div style="font-size:13.5px;color:var(--ink); line-height:1.55;margin-bottom:18px;">${htmlMessage}</div>
        <div style="display:flex;justify-content:flex-end;">
          <button id="host-conflict-ok" style="border:none;background:var(--ink);color:#fff;padding:9px 18px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:var(--font-body);">Понятно</button>
        </div>
      </div>
    `;
    document.body.appendChild(wrap);
    wrap.querySelector('#host-conflict-ok').onclick = ()=> wrap.remove();
    wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  }

  function showCapacityConfirmPopup(spaceName, capacity, guests){
    let existing = document.getElementById('capacity-confirm-popup');
    if(existing) existing.remove();
    const wrap = document.createElement('div');
    wrap.id = 'capacity-confirm-popup';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(42,37,32,0.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';
    wrap.innerHTML = `
      <div style="background:var(--white);border-radius:4px;max-width:400px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.3);font-family:var(--font-body);">
        <div style="font-family:var(--font-display);font-weight:600;font-size:17px;margin-bottom:10px;color:#8A5A1E;">⚠ Много гостей для пространства</div>
        <div style="font-size:13.5px;color:var(--ink); line-height:1.55;margin-bottom:18px;">Вы указали <b>${guests}</b> человек в пространстве «${escapeHtml(spaceName)}», обычная вместимость которого — до <b>${capacity}</b>. Вы уверены, что гости войдут?</div>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button id="capacity-no" style="border:1px solid var(--line-strong);background:var(--white);color:var(--ink);padding:9px 18px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:var(--font-body);">Нет</button>
          <button id="capacity-yes" style="border:none;background:var(--ink);color:#fff;padding:9px 18px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:var(--font-body);">Да</button>
        </div>
      </div>
    `;
    document.body.appendChild(wrap);
    // оба ответа просто закрывают предупреждение — количество гостей остаётся тем, что ввёл менеджер
    wrap.querySelector('#capacity-yes').onclick = ()=> wrap.remove();
    wrap.querySelector('#capacity-no').onclick = ()=> wrap.remove();
    wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  }

  function showGapWarningBanner(text){
    let banner = document.getElementById('gap-warning-banner');
    if(banner) banner.remove();
    banner = document.createElement('div');
    banner.id = 'gap-warning-banner';
    banner.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#8A5A1E;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;font-family:var(--font-body);z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.25);display:flex;gap:12px;align-items:center;max-width:90vw;';
    banner.innerHTML = `⚠ ${escapeHtml(text)} <button style="background:transparent;border:1px solid rgba(255,255,255,0.6);color:#fff;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:12px;flex-shrink:0;">Ок</button>`;
    banner.querySelector('button').onclick = ()=> banner.remove();
    document.body.appendChild(banner);
    setTimeout(()=>{ if(banner && banner.parentNode) banner.remove(); }, 8000);
  }

  loadData();
})();
</script>


<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
  }
</script>
