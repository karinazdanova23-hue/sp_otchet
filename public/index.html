              </div>`;
            })()}
            <div id="quick-cert-controls" style="display:none;margin-top:10px;padding:10px;border:1px dashed var(--line-strong);border-radius:var(--radius);">
              <label style="display:block;font-size:11.5px;font-family:var(--font-mono);color:var(--ink-soft);margin-bottom:6px;">🎟 Оплатить сертификатом</label>
              <div style="display:flex;gap:8px;">
                <input type="text" id="cert-attach-search" placeholder="Номер сертификата…" list="cert-attach-options" style="flex:1;border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 9px;font-family:var(--font-body);font-size:13px;background:var(--paper);">
                <input type="hidden" id="cert-attach-id" value="">
                <input type="number" id="cert-attach-amount" placeholder="Сумма" step="100" style="width:110px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 9px;font-family:var(--font-body);font-size:13px;background:var(--paper);">
                <button type="button" class="btn btn-ghost" id="btn-attach-cert" style="white-space:nowrap;">+ Добавить</button>
              </div>
              <datalist id="cert-attach-options">${state.certificates.filter(c=>certRemaining(c)>0).map(c=>`<option value="${escapeHtml(certPickerLabel(c))}">`).join('')}</datalist>
              <div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">Если один номер встречается несколько раз (например, после импорта) — выбирайте по дате, показанной в списке.</div>
              <div id="cert-attach-hint" style="font-size:11px;color:var(--ink-soft);margin-top:4px;"></div>
            </div>
            <div id="cert-attach-summary"></div>
            ${(()=>{
              const linkedRefunds = state.refunds.filter(r=>r.eventId===ev.id);
              if(linkedRefunds.length === 0) return '';
              const sum = linkedRefunds.reduce((s,r)=> s+((r.amount!==undefined&&r.amount!==null&&!isNaN(r.amount))?Number(r.amount):0), 0);
              return `<div style="margin-top:10px;padding:8px 10px;background:var(--paper-2);border-radius:var(--radius);font-size:12px;color:var(--status-red);">
                ↩ Возвраты по этому мероприятию: ${linkedRefunds.length} на сумму ${formatMoney(sum)}
                <div style="margin-top:4px;color:var(--ink-soft);">${linkedRefunds.map(r=>`${formatDateText(r.requestDate)} · ${r.status==='refunded'?'возвращено (вычтено из выручки)':'в процессе (пока не вычтено)'}`).join('<br>')}</div>
              </div>`;
            })()}
          </div>
          <div class="field" id="guest-breakdown-field">
            <details id="guest-breakdown-details">
              <summary style="cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);"><span id="guest-breakdown-summary-text">Гости по отдельности${(ev.guestList&&ev.guestList.length)?` (${ev.guestList.length})`:''}</span> <span style="font-weight:400;color:var(--ink-soft);">— заводите каждого гостя здесь, у кого-то может быть несколько мест</span></summary>
              <div style="margin-top:10px;">
                <div id="guest-list-container"></div>
                <button type="button" class="btn btn-ghost" id="btn-add-guest" style="margin-top:4px;">+ Добавить гостя</button>
                <input type="hidden" id="f-guest-list" value='${escapeHtml(JSON.stringify(ev.guestList||[]))}'>
              </div>
            </details>
          </div>
          <div class="field">
            <label>Прогнозная выручка</label>
            <input type="number" id="f-agreed-price" value="${ev.agreedPrice!==undefined && ev.agreedPrice!==null ? ev.agreedPrice : ''}" min="0" step="100" placeholder="Например: 10000">
            <div id="awaiting-hint" style="font-size:12px;margin-top:6px;font-family:var(--font-mono);"></div>
          </div>
          <div class="field">
            <label>Себестоимость материалов <span style="font-weight:400;color:var(--ink-soft);">— по каждому материалу: сколько стоит и кто его предоставил</span></label>
            <div id="materials-estimate-hint" style="display:none;font-size:12.5px;background:var(--paper-2);border-radius:var(--radius);padding:8px 10px;margin-bottom:10px;color:var(--ink-soft);"></div>
            <div id="materials-items-list">${renderMaterialsItemRows(ev.materialsItems||[])}</div>
            <datalist id="materials-catalog-suggestions">${state.materialsCatalog.map(m=>`<option value="${escapeHtml(m.name)}">`).join('')}</datalist>
            <button type="button" class="add-evt-btn" id="btn-add-material">+ добавить материал</button>
            <div id="materials-total-hint" style="font-size:12px;margin-top:8px;font-family:var(--font-mono);color:var(--ink-soft);"></div>
            <div id="profit-estimate-hint" style="font-size:13px;margin-top:10px;font-family:var(--font-mono);font-weight:600;"></div>
            ${(()=>{
              const linkedExpenses = state.expenses.filter(x=>x.eventId===ev.id);
              if(linkedExpenses.length === 0) return '';
              const sum = linkedExpenses.reduce((s,x)=> s+((x.amount!==undefined&&x.amount!==null&&!isNaN(x.amount))?Number(x.amount):0), 0);
              return `<div style="margin-top:10px;padding:8px 10px;background:var(--paper-2);border-radius:var(--radius);font-size:12px;color:var(--ink-soft);">
                🧾 В «Расходах» привязано записей: ${linkedExpenses.length} на сумму ${formatMoney(sum)}
                <div style="margin-top:4px;">${linkedExpenses.map(x=>`${formatDateText(x.date)} · ${escapeHtml(x.category)} · ${formatMoney(x.amount||0)} · ${escapeHtml(x.source)}`).join('<br>')}</div>
              </div>`;
            })()}
          </div>
          <div class="field">
            <label>Заметки</label>
            <textarea id="f-notes" placeholder="Доп. детали и т.п.">${escapeHtml(ev.notes||'')}</textarea>
          </div>
          <div class="field" style="border-top:1px solid var(--line); padding-top:16px;">
            <label style="font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--ink);margin-bottom:10px;">Отчёт мастера</label>
          </div>
          <div class="field">
            <label>1. Откуда гости узнали про СП</label>
            <input type="text" id="f-report-source" value="${escapeHtml((ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.source||''):'')}" placeholder="Например: Инста" list="f-report-source-options">
            <datalist id="f-report-source-options">${LEAD_SOURCES.map(s=>`<option value="${escapeHtml(s)}">`).join('')}</datalist>
          </div>
          <div class="field">
            <label>2. Профессии гостей</label>
            <input type="text" id="f-report-professions" value="${escapeHtml((ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.professions||''):'')}" placeholder="Например: врач, дизайнер, студентка">
          </div>
          <div class="field">
            <label>3. Уникальное на МК <span style="font-weight:400;color:var(--ink-soft);">— необязательно</span></label>
            <textarea id="f-report-unique" placeholder="Сообщили о беременности, сделали предложение и т.д.">${escapeHtml((ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.unique||''):'')}</textarea>
          </div>
          <div class="field">
            <label>4. Оценка МК по 5-балльной шкале</label>
            <div class="rating-scale">
              ${[1,2,3,4,5].map(n=>`<button type="button" class="rating-btn f-rating-btn" data-rating="${n}" ${((ev.masterReport&&typeof ev.masterReport==='object'&&ev.masterReport.rating===n))?'style="background:var(--ink);color:var(--white);border-color:var(--ink);"':''}>${n}</button>`).join('')}
            </div>
            <input type="hidden" id="f-report-rating" value="${(ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.rating||''):''}">
          </div>
          <div class="field">
            <label>5. Расшифровка оценки <span style="font-weight:400;color:var(--ink-soft);">— обязательно, если оценка ниже 5</span></label>
            <textarea id="f-report-rating-comment" placeholder="Что именно было некомфортно...">${escapeHtml((ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.ratingComment||''):'')}</textarea>
          </div>
          <div class="modal-actions">
            <div style="display:flex;gap:8px;">
              ${!isNew ? `<button class="btn-danger" id="btn-del">Удалить</button>` : ''}
              ${!isNew ? `<button class="btn btn-ghost" id="btn-duplicate">🔁 Повторить</button>` : ''}
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-ghost" id="btn-cancel">Отмена</button>
              <button class="btn btn-primary" id="btn-save">Сохранить</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // администратор (роль "hostess") открывает мероприятие только на просмотр — без права что-либо
  // редактировать: все поля дизейблятся нативно, а не через кнопку "Сохранить" (иначе некоторые
  // действия, например списание сертификата, сохранились бы в базу мгновенно, до всякого "Сохранить")
  function lockdownEventModalForViewing(overlay){
    overlay.querySelectorAll('input, select, textarea').forEach(el=>{ el.disabled = true; });
    overlay.querySelectorAll('button').forEach(btn=>{
      if(btn.id === 'btn-cancel' || btn.classList.contains('modal-close')) return;
      btn.disabled = true;
    });
    // кастомные "пилюли"-переключатели (статус, посуда, плательщик и т.п.) — не настоящие кнопки,
    // поэтому blocked отдельно через pointer-events
    overlay.querySelectorAll('.status-select-wrap > div').forEach(el=>{
      el.style.pointerEvents = 'none';
      el.style.opacity = '0.65';
    });
    const cancelBtn = overlay.querySelector('#btn-cancel');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };
    const actionsEl = overlay.querySelector('.modal-actions');
    if(actionsEl){
      const noteEl = document.createElement('div');
      noteEl.style.cssText = 'font-size:12px;color:var(--ink-soft);width:100%;text-align:center;margin-top:4px;';
      noteEl.textContent = '👁 Только просмотр — редактирование мероприятий недоступно для этой роли';
      actionsEl.insertAdjacentElement('afterend', noteEl);
    }
  }

  function attachEventModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const titleInput = overlay.querySelector('#f-title');
    const durationInput = overlay.querySelector('#f-duration');
    if(titleInput && durationInput){
      titleInput.addEventListener('input', ()=>{
        const match = state.eventTypes.find(t=>t.name.toLowerCase() === titleInput.value.trim().toLowerCase());
        if(match){ durationInput.value = match.duration; }
        const itemsField = overlay.querySelector('#items-count-field');
        if(itemsField){
          const show = isCeramicsEvent(titleInput.value);
          itemsField.style.display = show ? 'block' : 'none';
          if(show){
            const itemsInput = overlay.querySelector('#f-items-count');
            if(itemsInput && itemsInput.dataset.auto === 'true' && itemsInput.value === ''){
              const guestsInputEl = overlay.querySelector('#f-guests');
              itemsInput.value = guestsInputEl ? guestsInputEl.value : '';
            }
          }
        }
        // керамика включает поле "изделий" у каждого гостя по отдельности — перерисовываем блоки гостей,
        // чтобы поле появилось/исчезло, и пересчитываем сумму изделий по гостям
        if(typeof renderGuestList === 'function') renderGuestList();
        if(typeof syncItemsCountFromList === 'function') syncItemsCountFromList();
        const pickupField = overlay.querySelector('#pickup-field');
        if(pickupField) pickupField.style.display = isPickupTrackedEvent(titleInput.value) ? 'block' : 'none';
      });
    }

    const guestsInput = overlay.querySelector('#f-guests');
    const masterPayInput = overlay.querySelector('#f-master-pay');
    const spaceSelect = overlay.querySelector('#f-space');
    const hostInputEl = overlay.querySelector('#f-host');
    if(guestsInput && masterPayInput){
      guestsInput.addEventListener('input', ()=>{
        if(masterPayInput.dataset.auto === 'true'){
          masterPayInput.value = masterPayForGuests(guestsInput.value, hostInputEl ? hostInputEl.value : '');
        }
        overlay.querySelectorAll('#additional-hosts-list [data-ah-idx]').forEach(row=>{
          const inp = row.querySelector('.ah-pay');
          const nameInp = row.querySelector('.ah-name');
          if(inp && inp.dataset.auto === 'true'){ inp.value = masterPayForGuests(guestsInput.value, nameInp?nameInp.value:''); }
        });
        overlay.querySelectorAll('#materials-items-list [data-mi-idx]').forEach(row=>{
          const costInput = row.querySelector('.mi-cost');
          const nameInput = row.querySelector('.mi-name');
          if(costInput && costInput.dataset.auto === 'true' && nameInput){
            const match = findMaterialsCatalogMatch(nameInput.value);
            if(match){
              const g = parseInt(guestsInput.value) || 1;
              costInput.value = match.cost * g;
            }
          }
        });
        const itemsInput = overlay.querySelector('#f-items-count');
        if(itemsInput && itemsInput.dataset.auto === 'true'){
          itemsInput.value = guestsInput.value;
        }
        if(typeof syncMaterialsItemsFromInputs === 'function') syncMaterialsItemsFromInputs();
        if(typeof updateMaterialsTotalHint === 'function') updateMaterialsTotalHint();
      });
      masterPayInput.addEventListener('input', ()=>{
        masterPayInput.dataset.auto = 'false'; // менеджер поправил вручную — больше не пересчитываем автоматически
      });
      if(hostInputEl){
        hostInputEl.addEventListener('input', ()=>{
          if(masterPayInput.dataset.auto === 'true'){
            masterPayInput.value = masterPayForGuests(guestsInput.value, hostInputEl.value);
          }
        });
      }
    }

    const itemsCountInput = overlay.querySelector('#f-items-count');
    if(itemsCountInput){
      itemsCountInput.addEventListener('input', ()=>{
        itemsCountInput.dataset.auto = 'false'; // менеджер поправил вручную (например, кто-то сделал 2 изделия)
      });
    }

    // предупреждение о вместимости — только предупреждает, никогда не блокирует ввод
    function checkSpaceCapacity(){
      if(!guestsInput || !spaceSelect) return;
      const guests = parseInt(guestsInput.value);
      if(!guests || guests <= 0) return;
      const capacity = SPACE_CAPACITY[spaceSelect.value];
      if(capacity === null || capacity === undefined) return; // без ограничений (напр. "Выезд")
      if(guests > capacity){
        const sp = getSpace(spaceSelect.value);
        showCapacityConfirmPopup(sp.name, capacity, guests);
      }
    }
    if(guestsInput) guestsInput.addEventListener('change', checkSpaceCapacity);
    if(spaceSelect) spaceSelect.addEventListener('change', checkSpaceCapacity);

    if(spaceSelect) spaceSelect.addEventListener('change', ()=>{
      if(spaceSelect.value === 's5'){
        const offsiteOpt = overlay.querySelector('.status-opt[data-status="offsite"]');
        if(offsiteOpt && !offsiteOpt.classList.contains('active')){
          overlay.querySelectorAll('.status-opt').forEach(o=>o.classList.remove('active'));
          offsiteOpt.classList.add('active');
          overlay.querySelector('#f-status').value = 'offsite';
          const dishesField = overlay.querySelector('#dishes-field');
          if(dishesField) dishesField.style.display = showsDishesAndRental('offsite') ? 'block' : 'none';
          const rentalField = overlay.querySelector('#rental-field');
          if(rentalField) rentalField.style.display = showsDishesAndRental('offsite') ? 'block' : 'none';
        }
      }
    });

    // дополнительные ведущие
    let additionalHostsDraft = (state.modal.event.additionalHosts || []).map(h=>({...h}));
    function syncAdditionalHostsFromInputs(){
      overlay.querySelectorAll('#additional-hosts-list [data-ah-idx]').forEach(row=>{
        const i = parseInt(row.dataset.ahIdx);
        const nameInput = row.querySelector('.ah-name');
        const payInput = row.querySelector('.ah-pay');
        if(additionalHostsDraft[i]){
          additionalHostsDraft[i] = { name: nameInput.value, masterPay: payInput.value!==''?parseInt(payInput.value):null, masterPayAuto: payInput.dataset.auto === 'true' };
        }
      });
    }
    function refreshAdditionalHostsUI(){
      const container = overlay.querySelector('#additional-hosts-list');
      container.innerHTML = renderAdditionalHostRows(additionalHostsDraft, guestsInput ? guestsInput.value : null);
      attachAdditionalHostsRowEvents();
    }
    function attachAdditionalHostsRowEvents(){
      overlay.querySelectorAll('.ah-pay').forEach(inp=>{
        inp.addEventListener('input', ()=>{ inp.dataset.auto = 'false'; });
      });
      overlay.querySelectorAll('#additional-hosts-list [data-ah-idx]').forEach(row=>{
        const nameInp = row.querySelector('.ah-name');
        const payInp = row.querySelector('.ah-pay');
        if(nameInp && payInp){
          nameInp.addEventListener('input', ()=>{
            if(payInp.dataset.auto === 'true'){
              payInp.value = masterPayForGuests(guestsInput ? guestsInput.value : null, nameInp.value);
            }
          });
        }
      });
      overlay.querySelectorAll('.ah-del').forEach(btn=>{
        btn.onclick = ()=>{
          syncAdditionalHostsFromInputs();
          additionalHostsDraft.splice(parseInt(btn.dataset.idx), 1);
          refreshAdditionalHostsUI();
        };
      });
    }
    attachAdditionalHostsRowEvents();
    const addHostBtn = overlay.querySelector('#btn-add-host');
    if(addHostBtn) addHostBtn.onclick = ()=>{
      syncAdditionalHostsFromInputs();
      additionalHostsDraft.push({ name:'', masterPay:null, masterPayAuto:true });
      refreshAdditionalHostsUI();
    };

    // себестоимость материалов — построчно, с указанием источника (студия/мастер)
    let materialsItemsDraft = (state.modal.event.materialsItems || []).map(m=>({...m}));
    function syncMaterialsItemsFromInputs(){
      overlay.querySelectorAll('#materials-items-list [data-mi-idx]').forEach(row=>{
        const i = parseInt(row.dataset.miIdx);
        const nameInput = row.querySelector('.mi-name');
        const costInput = row.querySelector('.mi-cost');
        const qtyInput = row.querySelector('.mi-qty');
        const sourceActive = row.querySelector('.mi-source-opt.active');
        const payToInput = row.querySelector('.mi-payto');
        const expDateInput = row.querySelector('.mi-expdate');
        if(materialsItemsDraft[i]){
          materialsItemsDraft[i] = {
            name: nameInput.value,
            cost: costInput.value !== '' ? parseInt(costInput.value) : null,
            qty: qtyInput && qtyInput.value !== '' ? parseFloat(qtyInput.value) : null,
            source: sourceActive ? sourceActive.dataset.source : 'studio',
            payTo: payToInput ? payToInput.value : '',
            expenseDate: expDateInput ? expDateInput.value : '',
          };
        }
      });
    }
    function updateMaterialsTotalHint(){
      const studioTotal = materialsItemsDraft.reduce((s,m)=> s + (m.source!=='master' ? (Number(m.cost)||0) : 0), 0);
      const masterTotal = materialsItemsDraft.reduce((s,m)=> s + (m.source==='master' ? (Number(m.cost)||0) : 0), 0);
      const hint = overlay.querySelector('#materials-total-hint');
      if(hint) hint.textContent = `От студии (влияет на прибыль): ${formatMoney(studioTotal)}${masterTotal>0 ? ' · Приносит мастер (для сведения): '+formatMoney(masterTotal) : ''}`;
    }
    function refreshMaterialsItemsUI(){
      const container = overlay.querySelector('#materials-items-list');
      container.innerHTML = renderMaterialsItemRows(materialsItemsDraft);
      attachMaterialsItemsRowEvents();
      updateMaterialsTotalHint();
    }
    function attachMaterialsItemsRowEvents(){
      overlay.querySelectorAll('#materials-items-list [data-mi-idx]').forEach(row=>{
        const costInput = row.querySelector('.mi-cost');
        if(costInput) costInput.addEventListener('input', ()=>{
          costInput.dataset.auto = 'false'; // менеджер поправил вручную — больше не пересчитываем по справочнику
          syncMaterialsItemsFromInputs();
          updateMaterialsTotalHint();
          updateEstimateAndProfit();
        });
        const nameInput = row.querySelector('.mi-name');
        if(nameInput) nameInput.addEventListener('input', ()=>{
          const match = findMaterialsCatalogMatch(nameInput.value);
          if(match && costInput && costInput.dataset.auto !== 'false'){
            const guests = parseInt(guestsInput ? guestsInput.value : 0) || 1;
            costInput.value = match.cost * guests;
            costInput.dataset.auto = 'true';
          }
          syncMaterialsItemsFromInputs();
          updateMaterialsTotalHint();
          updateEstimateAndProfit();
        });
        const payToInputForRow = row.querySelector('.mi-payto');
        const expDateInputForRow = row.querySelector('.mi-expdate');
        const refreshExpDateVisibility = ()=>{
          const isMaster = row.querySelector('.mi-source-opt.active')?.dataset.source === 'master';
          if(expDateInputForRow) expDateInputForRow.style.display = (isMaster && payToInputForRow && payToInputForRow.value.trim()) ? 'block' : 'none';
        };
        if(payToInputForRow) payToInputForRow.addEventListener('input', ()=>{
          refreshExpDateVisibility();
          syncMaterialsItemsFromInputs();
        });
        if(expDateInputForRow) expDateInputForRow.addEventListener('input', syncMaterialsItemsFromInputs);
        row.querySelectorAll('.mi-source-opt').forEach(opt=>{
          opt.onclick = ()=>{
            row.querySelectorAll('.mi-source-opt').forEach(o=>o.classList.remove('active'));
            opt.classList.add('active');
            if(payToInputForRow) payToInputForRow.style.display = (opt.dataset.source === 'master') ? 'block' : 'none';
            refreshExpDateVisibility();
            syncMaterialsItemsFromInputs();
            updateMaterialsTotalHint();
            updateEstimateAndProfit();
          };
        });
      });
      overlay.querySelectorAll('.mi-del').forEach(btn=>{
        btn.onclick = ()=>{
          syncMaterialsItemsFromInputs();
          materialsItemsDraft.splice(parseInt(btn.dataset.idx), 1);
          refreshMaterialsItemsUI();
        };
      });
    }
    attachMaterialsItemsRowEvents();
    updateMaterialsTotalHint();
    const addMaterialBtn = overlay.querySelector('#btn-add-material');
    if(addMaterialBtn) addMaterialBtn.onclick = ()=>{
      syncMaterialsItemsFromInputs();
      materialsItemsDraft.push({ name:'', cost:null, source:'studio' });
      refreshMaterialsItemsUI();
    };

    // выдача изделий (смола, тафтинг) — изготовили сегодня, забирают позже
    let pickupItemsDraft = (state.modal.event.pickupItems || []).map(p=>({...p}));
    function syncPickupItemsFromInputs(){
      overlay.querySelectorAll('#pickup-items-list [data-pk-idx]').forEach(row=>{
        const i = parseInt(row.dataset.pkIdx);
        if(!pickupItemsDraft[i]) return;
        const statusActive = row.querySelector('.pk-status-opt.active');
        pickupItemsDraft[i] = {
          guestName: row.querySelector('.pk-guest').value,
          readyDate: row.querySelector('.pk-ready').value,
          status: statusActive ? statusActive.dataset.pkstatus : 'waiting',
          pickupDate: row.querySelector('.pk-pickup-date').value,
        };
      });
    }
    function refreshPickupItemsUI(){
      const container = overlay.querySelector('#pickup-items-list');
      container.innerHTML = renderPickupItemRows(pickupItemsDraft);
      attachPickupItemsRowEvents();
    }
    function attachPickupItemsRowEvents(){
      overlay.querySelectorAll('#pickup-items-list [data-pk-idx]').forEach(row=>{
        row.querySelectorAll('.pk-guest, .pk-ready, .pk-pickup-date').forEach(inp=>{
          inp.addEventListener('input', syncPickupItemsFromInputs);
        });
        row.querySelectorAll('.pk-status-opt').forEach(opt=>{
          opt.onclick = ()=>{
            row.querySelectorAll('.pk-status-opt').forEach(o=>o.classList.remove('active'));
            opt.classList.add('active');
            const pickupDateInput = row.querySelector('.pk-pickup-date');
            if(pickupDateInput){
              pickupDateInput.style.display = (opt.dataset.pkstatus === 'picked_up') ? 'block' : 'none';
              if(opt.dataset.pkstatus === 'picked_up' && !pickupDateInput.value) pickupDateInput.value = todayStr();
            }
            syncPickupItemsFromInputs();
          };
        });
      });
      overlay.querySelectorAll('.pk-del').forEach(btn=>{
        btn.onclick = ()=>{
          syncPickupItemsFromInputs();
          pickupItemsDraft.splice(parseInt(btn.dataset.idx), 1);
          refreshPickupItemsUI();
        };
      });
    }
    attachPickupItemsRowEvents();
    const addPickupBtn = overlay.querySelector('#btn-add-pickup');
    if(addPickupBtn) addPickupBtn.onclick = ()=>{
      syncPickupItemsFromInputs();
      const defaultReady = state.modal.event.date ? fmtDate(new Date(parseDate(state.modal.event.date).getTime() + 7*86400000)) : '';
      pickupItemsDraft.push({ guestName:'', readyDate: defaultReady, status:'waiting', pickupDate:'' });
      refreshPickupItemsUI();
    };

    // подсказка себестоимости по справочнику "Себес" (цена за гостя × количество гостей)
    const priceInput = overlay.querySelector('#f-price');
    const estimateHintEl = overlay.querySelector('#materials-estimate-hint');
    const profitHintEl = overlay.querySelector('#profit-estimate-hint');

    function updateEstimateAndProfit(){
      const guests = parseInt(guestsInput ? guestsInput.value : 0) || 0;
      const match = findMaterialsCatalogMatch(titleInput ? titleInput.value : '');
      if(match && guests > 0){
        const total = match.cost * guests;
        estimateHintEl.style.display = 'block';
        estimateHintEl.innerHTML = `По справочнику «${escapeHtml(match.name)}»: ${formatMoney(match.cost)}/чел × ${guests} чел = <b>${formatMoney(total)}</b> <button type="button" id="btn-substitute-materials" style="margin-left:8px;border:1px solid var(--ink-soft);background:var(--white);border-radius:var(--radius);padding:3px 10px;font-size:12px;cursor:pointer;">Подставить</button>`;
        const subBtn = estimateHintEl.querySelector('#btn-substitute-materials');
        if(subBtn) subBtn.onclick = ()=>{
          syncMaterialsItemsFromInputs();
          materialsItemsDraft.push({ name: match.name, cost: total, source: 'studio' });
          refreshMaterialsItemsUI();
        };
      } else {
        estimateHintEl.style.display = 'none';
        estimateHintEl.innerHTML = '';
      }

      // ориентировочная прибыль по текущим данным формы (ещё до сохранения)
      syncMaterialsItemsFromInputs();
      syncAdditionalHostsFromInputs();
      const revenue = parseInt(priceInput ? priceInput.value : 0) || 0;
      const studioMaterials = materialsItemsDraft.reduce((s,m)=> s + (m.source!=='master' ? (Number(m.cost)||0) : 0), 0);
      const primaryPay = masterPayInput ? (parseInt(masterPayInput.value)||0) : 0;
      const extraPay = additionalHostsDraft.reduce((s,h)=> s + (h.masterPay!==undefined&&h.masterPay!==null?Number(h.masterPay):0), 0);
      const estProfit = revenue - studioMaterials - primaryPay - extraPay;
      if(profitHintEl){
        profitHintEl.style.color = estProfit >= 0 ? 'var(--status-green)' : 'var(--status-red)';
        profitHintEl.textContent = `Ориентировочная прибыль: ${formatMoney(estProfit)}`;
      }
    }
    if(titleInput) titleInput.addEventListener('input', updateEstimateAndProfit);
    if(guestsInput) guestsInput.addEventListener('input', updateEstimateAndProfit);
    if(priceInput) priceInput.addEventListener('input', updateEstimateAndProfit);
    if(masterPayInput) masterPayInput.addEventListener('input', updateEstimateAndProfit);
    overlay.querySelector('#materials-items-list').addEventListener('input', updateEstimateAndProfit);
    overlay.querySelector('#additional-hosts-list').addEventListener('input', updateEstimateAndProfit);
    updateEstimateAndProfit();

    overlay.querySelectorAll('.f-rating-btn').forEach(btn=>{
      btn.onclick = ()=>{
        overlay.querySelectorAll('.f-rating-btn').forEach(b=>{ b.style.background=''; b.style.color=''; b.style.borderColor=''; });
        btn.style.background = 'var(--ink)'; btn.style.color = 'var(--white)'; btn.style.borderColor = 'var(--ink)';
        overlay.querySelector('#f-report-rating').value = btn.dataset.rating;
      };
    });

    // журнал платежей ("быстро добавить сумму" к выручке)
    const PAYMENT_TYPE_LABEL = { advance: 'Предоплата', balance: 'Остаток' };
    const paymentsHidden = overlay.querySelector('#f-payments');
    const paymentsLogEl = overlay.querySelector('#payments-log');
    let paymentsArr = [];
    try{ paymentsArr = JSON.parse(paymentsHidden.value || '[]'); }catch(e){ paymentsArr = []; }
    const guestListHidden = overlay.querySelector('#f-guest-list');
    let guestListArr = [];
    try{ guestListArr = guestListHidden ? JSON.parse(guestListHidden.value || '[]') : []; }catch(e){ guestListArr = []; }
    // старые мероприятия (до этого раздела) хранили имя гостя в отдельном поле, которого в форме больше нет —
    // переносим его в список гостей один раз при открытии, чтобы имя не "потерялось" из вида
    function persistGuestList(){ if(guestListHidden) guestListHidden.value = JSON.stringify(guestListArr); }
    if(guestListArr.length === 0 && state.modal.event && state.modal.event.guestName && state.modal.event.guestName.trim()){
      guestListArr.push({ id: uid(), name: state.modal.event.guestName.trim(), seats: 1, items: 1, phone: '', comment: '', expected: null });
      persistGuestList();
    }
    const priceInputForMismatch = overlay.querySelector('#f-price');
    if(priceInputForMismatch) priceInputForMismatch.addEventListener('input', ()=> updatePriceJournalMismatchHint());

    function updatePriceJournalMismatchHint(){
      const hintEl = overlay.querySelector('#price-journal-mismatch');
      if(!hintEl) return;
      if(paymentsArr.length === 0){ hintEl.style.display = 'none'; return; }
      // сертификатные оплаты не входят в "Выручку" — сверяем журнал с полем только по "живым" оплатам
      const journalSum = paymentsArr.filter(p=>!p.certRedemptionRef).reduce((s,p)=> s + (Number(p.amount)||0), 0);
      const priceInput = overlay.querySelector('#f-price');
      const priceVal = priceInput.value === '' ? 0 : Number(priceInput.value);
      if(priceVal !== journalSum){
        hintEl.textContent = `⚠ Сумма в журнале платежей — ${formatMoney(journalSum)}, а в поле «Выручка» — ${formatMoney(priceVal)}. Проверьте, не разошлось ли.`;
        hintEl.style.display = 'block';
      } else {
        hintEl.style.display = 'none';
      }
    }

    function renderPaymentsLog(){
      if(!paymentsLogEl) return;
      paymentsLogEl.innerHTML = paymentsArr.map((p,i)=>{
        const guestForPayment = p.guestId ? guestListArr.find(g=>g.id===p.guestId) : null;
        return `
        <div class="payment-log-row" data-idx="${i}" style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);">
          <span>+${formatMoneyPrecise(p.amount)}${guestForPayment?' · '+escapeHtml(guestForPayment.name||'гость'):''}${p.source?' · '+escapeHtml(p.source):''}${p.type?' · '+(PAYMENT_TYPE_LABEL[p.type]||p.type):''}${p.date?' · '+formatDateText(p.date):(p.ts?' · '+new Date(p.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')}</span>
          <button type="button" class="payment-del" data-idx="${i}" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px;font-family:var(--font-body);">убрать</button>
        </div>
      `;
      }).join('');
      updatePriceJournalMismatchHint();
      paymentsLogEl.querySelectorAll('.payment-del').forEach(btn=>{
        btn.onclick = async ()=>{
          const idx = parseInt(btn.dataset.idx);
          const removed = paymentsArr.splice(idx,1)[0];
          if(removed){
            // сертификатные оплаты не увеличивали "Выручку" — значит и убирать их не нужно
            if(!removed.certRedemptionRef){
              const priceInput = overlay.querySelector('#f-price');
              priceInput.value = Math.max(0, (parseFloat(priceInput.value)||0) - (Number(removed.amount)||0));
            }
            updateAwaitingHint();
            if(removed.certRedemptionRef) await undoCertRedemption(removed.certRedemptionRef);
          }
          paymentsHidden.value = JSON.stringify(paymentsArr);
          renderPaymentsLog();
          renderGuestList();
        };
      });
    }
    renderPaymentsLog();

    function updateAwaitingHint(){
      const hint = overlay.querySelector('#awaiting-hint');
      if(!hint) return;
      // отменённое мероприятие никогда не "ждёт ещё" денег — оно не состоится
      const statusForHint = overlay.querySelector('#f-status') ? overlay.querySelector('#f-status').value : '';
      if(statusForHint === 'cancelled'){ hint.textContent = ''; return; }
      const priceVal = parseInt(overlay.querySelector('#f-price').value) || 0;
      const agreedVal = parseInt(overlay.querySelector('#f-agreed-price').value) || 0;
      // сертификатные оплаты не входят в "Выручку" (#f-price), но для гостя они всё равно закрывают
      // задолженность — иначе полностью оплаченное сертификатом мероприятие ошибочно показывало бы "Ждём ещё"
      const certPaidVal = paymentsArr.filter(p=>p.certRedemptionRef).reduce((s,p)=> s + (Number(p.amount)||0), 0);
      const receivedVal = priceVal + certPaidVal;
      if(agreedVal > 0){
        const remain = agreedVal - receivedVal;
        if(remain > 0){ hint.textContent = `Ждём ещё: ${formatMoney(remain)}`; hint.style.color = 'var(--status-red)'; }
        else if(remain < 0){ hint.textContent = `Переплата: ${formatMoney(-remain)}`; hint.style.color = 'var(--status-blue)'; }
        else { hint.textContent = 'Оплачено полностью'; hint.style.color = 'var(--status-green)'; }
      } else {
        hint.textContent = '';
      }
    }
    updateAwaitingHint();
    const agreedPriceInput = overlay.querySelector('#f-agreed-price');
    if(agreedPriceInput) agreedPriceInput.addEventListener('input', updateAwaitingHint);

    const addPaymentBtn = overlay.querySelector('#btn-add-payment');
    const paymentAmountInput = overlay.querySelector('#payment-add-amount');
    const paymentDateInput = overlay.querySelector('#payment-add-date');
    const paymentSourceSelect = overlay.querySelector('#payment-source');
    const paymentTypeSelect = overlay.querySelector('#payment-type');
    if(addPaymentBtn && paymentAmountInput){
      const doAdd = ()=>{
        const amount = parseInt(paymentAmountInput.value) || 0;
        if(amount <= 0){
          // раньше здесь был просто return — кнопка выглядела "не работает", если забыли ввести сумму
          paymentAmountInput.style.borderColor = 'var(--status-red)';
          paymentAmountInput.focus();
          return;
        }
        paymentAmountInput.style.borderColor = '';
        paymentsArr.push({
          id: uid(),
          amount,
          source: paymentSourceSelect ? paymentSourceSelect.value : '',
          type: paymentTypeSelect ? paymentTypeSelect.value : '',
          date: (paymentDateInput && paymentDateInput.value) ? paymentDateInput.value : todayStr(),
          ts: new Date().toISOString(),
        });
        paymentsHidden.value = JSON.stringify(paymentsArr);
        const priceInput = overlay.querySelector('#f-price');
        priceInput.value = (parseInt(priceInput.value)||0) + amount;
        priceInput.style.borderColor = '';
        paymentAmountInput.value = '';
        renderPaymentsLog();
        updateAwaitingHint();
      };
      addPaymentBtn.onclick = doAdd;
      paymentAmountInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } };
      paymentAmountInput.oninput = ()=>{ paymentAmountInput.style.borderColor = ''; };
    }

    // гости по отдельности: имя + количество мест + свой сворачиваемый журнал оплат (использует тот же paymentsArr, помеченный guestId)
    const GUEST_PAYMENT_SOURCES = ['Точка','YCLIENTS','Наличные'];
    // какие вложенные <details> гостей раскрыты — чтобы форма не схлопывалась после каждой оплаты/списания
    let openGuestDetailsIds = new Set();
    function syncGuestCountFromList(){
      const gInput = overlay.querySelector('#f-guests');
      if(!gInput) return;
      if(guestListArr.length > 0){
        const totalSeats = guestListArr.reduce((s,g)=> s + (Math.max(1, parseInt(g.seats)||1)), 0);
        gInput.value = totalSeats;
        gInput.readOnly = true;
        gInput.style.background = 'var(--paper-2)';
        gInput.title = 'Считается автоматически по гостям ниже';
        gInput.dispatchEvent(new Event('input', {bubbles:true}));
      } else {
        gInput.readOnly = false;
        gInput.style.background = '';
        gInput.title = '';
      }
      syncItemsCountFromList();
    }

    // для керамики — сумма изделий по каждому гостю (кто-то делает 1 изделие, кто-то 2) в общее поле "изделий"
    function syncItemsCountFromList(){
      const itemsInput = overlay.querySelector('#f-items-count');
      if(!itemsInput) return;
      const titleEl = overlay.querySelector('#f-title');
      const ceramics = titleEl && isCeramicsEvent(titleEl.value);
      if(ceramics && guestListArr.length > 0){
        const totalItems = guestListArr.reduce((s,g)=>{
          const v = (g.items!==undefined && g.items!==null && !isNaN(parseInt(g.items))) ? Math.max(0, parseInt(g.items)) : 1;
          return s + v;
        }, 0);
        itemsInput.value = totalItems;
        itemsInput.dataset.auto = 'true';
        itemsInput.readOnly = true;
        itemsInput.style.background = 'var(--paper-2)';
        itemsInput.title = 'Считается автоматически по изделиям у каждого гостя ниже';
      } else if(ceramics){
        itemsInput.readOnly = false;
        itemsInput.style.background = '';
        itemsInput.title = '';
      }
    }

    function renderGuestList(){
      const container = overlay.querySelector('#guest-list-container');
      if(!container) return;
      const summaryEl = overlay.querySelector('#guest-breakdown-summary-text');
      if(summaryEl){
        summaryEl.textContent = 'Гости по отдельности' + (guestListArr.length ? ` (${guestListArr.length})` : '');
      }
      const titleElForItems = overlay.querySelector('#f-title');
      const showItemsPerGuest = !!(titleElForItems && isCeramicsEvent(titleElForItems.value));
      // "Ожидаемая сумма" на гостя нужна только когда гостей несколько — если гость один, у него и так
      // вся согласованная сумма мероприятия (см. #f-agreed-price / #awaiting-hint)
      const showExpectedPerGuest = roleCanSeeGuestBalances(state.currentRole) && guestListArr.length > 1;
      container.innerHTML = guestListArr.map(g=>{
        const gPayments = paymentsArr.filter(p=>p.guestId===g.id);
        const gTotal = gPayments.reduce((s,p)=> s + (Number(p.amount)||0), 0);
        const gExpected = (g.expected!==undefined && g.expected!==null && g.expected!=='' && !isNaN(g.expected)) ? Number(g.expected) : null;
        const gRemainder = g.refunded ? 0 : (gExpected!==null ? Math.max(0, gExpected - gTotal) : null);
        return `
        <div class="guest-block" data-gid="${g.id}" style="border:1px solid ${g.refunded?'var(--status-red)':'var(--line-strong)'};border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;">
          ${g.refunded ? `<div style="font-size:11px;color:var(--status-red);font-family:var(--font-mono);margin-bottom:6px;">💳 Оформлен возврат этому гостю</div>` : ''}
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="text" class="guest-name" data-gid="${g.id}" value="${escapeHtml(g.name||'')}" placeholder="Имя гостя" style="flex:1;min-width:0;border:1px solid ${g.name&&g.name.trim()?'var(--line-strong)':'var(--status-red)'};border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12.5px;">
            <input type="number" class="guest-seats" data-gid="${g.id}" value="${g.seats||1}" min="1" step="1" title="Количество мест, за которые платит этот гость" style="width:52px;flex-shrink:0;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12.5px;">
            <input type="number" class="guest-items" data-gid="${g.id}" value="${(g.items!==undefined&&g.items!==null)?g.items:1}" min="0" step="1" title="Сколько изделий сделал этот гость" style="width:52px;flex-shrink:0;display:${showItemsPerGuest?'block':'none'};border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12.5px;">
            <button type="button" class="guest-remove" data-gid="${g.id}" title="Удалить гостя" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;line-height:1;flex-shrink:0;">✕</button>
          </div>
          ${showItemsPerGuest ? `<div style="font-size:10px;color:var(--ink-soft);margin-top:2px;">место(а) · изделий</div>` : ''}
          ${showExpectedPerGuest ? `<div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
            <label style="font-size:10.5px;color:var(--ink-soft);font-family:var(--font-mono);white-space:nowrap;">Ожидаем с гостя:</label>
            <input type="number" class="guest-expected" data-gid="${g.id}" value="${gExpected!==null?gExpected:''}" min="0" step="0.01" placeholder="Например: 5000" style="width:110px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12.5px;">
          </div>` : ''}
          <div style="display:flex;gap:8px;margin-top:6px;">
            <input type="tel" class="guest-phone" data-gid="${g.id}" value="${escapeHtml(g.phone||'')}" placeholder="Телефон — необязательно" style="flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12.5px;">
          </div>
          <div style="margin-top:6px;">
            <input type="text" class="guest-comment" data-gid="${g.id}" value="${escapeHtml(g.comment||'')}" placeholder="Комментарий — необязательно" style="width:100%;box-sizing:border-box;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12.5px;">
          </div>
          <details style="margin-top:6px;" ${openGuestDetailsIds.has(g.id)?'open':''}>
            <summary style="cursor:pointer;font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);">Оплата: ${formatMoneyPrecise(gTotal)}${gPayments.length?' · '+gPayments.length+' плат.':''}${gRemainder!==null ? ` · Остаток: <span style="color:${gRemainder>0?'var(--status-red)':'var(--status-green)'};">${formatMoneyPrecise(gRemainder)}</span>` : ''}</summary>
            <div style="margin-top:6px;">
              <div class="guest-payments-log" style="display:flex;flex-direction:column;gap:4px;margin-bottom:6px;">
                ${gPayments.map(p=>{
                  const idx = paymentsArr.indexOf(p);
                  return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);">
                    <span>+${formatMoneyPrecise(p.amount)}${p.source?' · '+escapeHtml(p.source):''}${p.date?' · '+formatDateText(p.date):''}</span>
                    <button type="button" class="guest-payment-del" data-idx="${idx}" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px;font-family:var(--font-body);">убрать</button>
                  </div>`;
                }).join('') || `<span style="font-size:11.5px;color:var(--ink-soft);">Пока нет оплат</span>`}
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <input type="date" class="guest-payment-date" data-gid="${g.id}" value="${todayStr()}" style="border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12px;background:var(--paper);">
                <select class="guest-payment-source" data-gid="${g.id}" style="border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12px;background:var(--paper);">
                  ${GUEST_PAYMENT_SOURCES.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}
                </select>
                <input type="number" class="guest-payment-amount" data-gid="${g.id}" placeholder="Сумма" step="0.01" style="width:100px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12px;background:var(--paper);">
                <button type="button" class="guest-add-payment" data-gid="${g.id}" style="white-space:nowrap;padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--white);cursor:pointer;font-size:12px;">+ Оплата</button>
              </div>
              <div style="margin-top:8px;padding:8px;border:1px dashed var(--line-strong);border-radius:var(--radius);">
                <label style="display:block;font-size:10.5px;font-family:var(--font-mono);color:var(--ink-soft);margin-bottom:5px;">🎟 Оплатить сертификатом</label>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  <input type="text" class="guest-cert-search" data-gid="${g.id}" placeholder="Номер сертификата…" list="cert-attach-options" style="flex:1;min-width:100px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12px;background:var(--paper);">
                  <input type="hidden" class="guest-cert-id" data-gid="${g.id}" value="">
                  <input type="number" class="guest-cert-amount" data-gid="${g.id}" placeholder="Сумма" step="0.01" style="width:90px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-body);font-size:12px;background:var(--paper);">
                  <button type="button" class="guest-cert-btn" data-gid="${g.id}" style="white-space:nowrap;padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--white);cursor:pointer;font-size:12px;">Списать</button>
                </div>
                <div class="guest-cert-hint" data-gid="${g.id}" style="font-size:10.5px;color:var(--ink-soft);margin-top:4px;"></div>
              </div>
            </div>
          </details>
        </div>
        `;
      }).join('') || `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">Пока нет отдельных гостей — нажмите «Добавить гостя», чтобы завести первого.</div>`;
      overlay.querySelectorAll('.guest-block details').forEach(d=>{
        d.ontoggle = ()=>{
          const gid = d.closest('.guest-block').dataset.gid;

        };

    function attachGuestBlockEvents(){
      overlay.querySelectorAll('.guest-name').forEach(inp=>{
        inp.oninput = ()=>{
          const g = guestListArr.find(x=>x.id===inp.dataset.gid);
          if(g){ g.name = inp.value; persistGuestList(); }
          inp.style.borderColor = inp.value.trim() ? 'var(--line-strong)' : 'var(--status-red)';
        };
      });
      overlay.querySelectorAll('.guest-seats').forEach(inp=>{

        };

      overlay.querySelectorAll('.guest-items').forEach(inp=>{
        inp.onchange = ()=>{
          const g = guestListArr.find(x=>x.id===inp.dataset.gid);
          if(g){ g.items = Math.max(0, parseInt(inp.value)||0); persistGuestList(); syncItemsCountFromList(); }
        };
      });
      overlay.querySelectorAll('.guest-expected').forEach(inp=>{
        inp.onchange = ()=>{
          const g = guestListArr.find(x=>x.id===inp.dataset.gid);
          if(g){
            const v = parseFloat(inp.value);
            g.expected = (inp.value!=='' && !isNaN(v)) ? Math.round(v*100)/100 : null;
            persistGuestList();
            renderGuestList();
          }
        };
      });
      overlay.querySelectorAll('.guest-phone').forEach(inp=>{
        inp.oninput = ()=>{
          const g = guestListArr.find(x=>x.id===inp.dataset.gid);
          if(g){ g.phone = inp.value; persistGuestList(); }
        };
      });
      overlay.querySelectorAll('.guest-comment').forEach(inp=>{
        inp.oninput = ()=>{
          const g = guestListArr.find(x=>x.id===inp.dataset.gid);
          if(g){ g.comment = inp.value; persistGuestList(); }
        };
      });
      overlay.querySelectorAll('.guest-remove').forEach(btn=>{
        btn.onclick = ()=>{
          const gid = btn.dataset.gid;
          const doRemove = async ()=>{
            guestListArr = guestListArr.filter(x=>x.id!==gid);
            const removedPayments = paymentsArr.filter(p=>p.guestId===gid);
            if(removedPayments.length){
              // из "Выручки" вычитаем только "живые" (не сертификатные) оплаты этого гостя — сертификатные
              // в неё и не добавлялись
              const removedSum = removedPayments.filter(p=>!p.certRedemptionRef).reduce((s,p)=> s + (Number(p.amount)||0), 0);
              paymentsArr = paymentsArr.filter(p=>p.guestId!==gid);
              paymentsHidden.value = JSON.stringify(paymentsArr);
              const priceInput = overlay.querySelector('#f-price');
              priceInput.value = Math.max(0, (parseFloat(priceInput.value)||0) - removedSum);
              renderPaymentsLog();
              updateAwaitingHint();
              for(const p of removedPayments){
                if(p.certRedemptionRef) await undoCertRedemption(p.certRedemptionRef);
              }
            }
            openGuestDetailsIds.delete(gid);
            persistGuestList();
            syncGuestCountFromList();
            renderGuestList();
          };
          const g = guestListArr.find(x=>x.id===gid);
          const gPaymentsCount = paymentsArr.filter(p=>p.guestId===gid).length;
          if(gPaymentsCount > 0 && typeof showConfirmDeletePopup === 'function'){
            showConfirmDeletePopup(`Удалить гостя «${escapeHtml(g&&g.name?g.name:'без имени')}»? Его оплаты (${gPaymentsCount}) тоже удалятся, а выручка мероприятия уменьшится.`, doRemove);
          } else {
            doRemove();
          }
        };
      });
      overlay.querySelectorAll('.guest-payment-del').forEach(btn=>{
        btn.onclick = async ()=>{
          const idx = parseInt(btn.dataset.idx);
          const removed = paymentsArr.splice(idx,1)[0];
          if(removed){
            // сертификатные оплаты не увеличивали "Выручку" — значит и убирать их не нужно
            if(!removed.certRedemptionRef){
              const priceInput = overlay.querySelector('#f-price');
              priceInput.value = Math.max(0, (parseFloat(priceInput.value)||0) - (Number(removed.amount)||0));
            }
            updateAwaitingHint();
            if(removed.certRedemptionRef) await undoCertRedemption(removed.certRedemptionRef);
          }
          paymentsHidden.value = JSON.stringify(paymentsArr);
          renderPaymentsLog();
          renderGuestList();
        };
      });
      overlay.querySelectorAll('.guest-add-payment').forEach(btn=>{
        btn.onclick = ()=>{
          const gid = btn.dataset.gid;
          const amountInput = overlay.querySelector(`.guest-payment-amount[data-gid="${gid}"]`);
          const sourceSelect = overlay.querySelector(`.guest-payment-source[data-gid="${gid}"]`);
          const dateInput = overlay.querySelector(`.guest-payment-date[data-gid="${gid}"]`);
          const amount = Math.round((parseFloat(amountInput.value) || 0) * 100) / 100;
          if(amount <= 0){
            amountInput.style.borderColor = 'var(--status-red)';
            amountInput.focus();
            return;
          }
          amountInput.style.borderColor = '';
          paymentsArr.push({
            id: uid(),
            amount,
            source: sourceSelect ? sourceSelect.value : '',
            guestId: gid,
            date: (dateInput && dateInput.value) ? dateInput.value : todayStr(),
            ts: new Date().toISOString(),
          });
          paymentsHidden.value = JSON.stringify(paymentsArr);
          const priceInput = overlay.querySelector('#f-price');
          priceInput.value = Math.round(((parseFloat(priceInput.value)||0) + amount) * 100) / 100;
          priceInput.style.borderColor = '';
          renderPaymentsLog();
          renderGuestList();
          updateAwaitingHint();
        };
      });
      overlay.querySelectorAll('.guest-cert-search').forEach(inp=>{
        inp.oninput = ()=>{
          const gid = inp.dataset.gid;
          const idHidden = overlay.querySelector(`.guest-cert-id[data-gid="${gid}"]`);
          if(idHidden) idHidden.value = certAttachLabelToId[inp.value.trim()] || '';
        };
      });
      overlay.querySelectorAll('.guest-cert-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          const gid = btn.dataset.gid;
          const searchInput = overlay.querySelector(`.guest-cert-search[data-gid="${gid}"]`);
          const idHidden = overlay.querySelector(`.guest-cert-id[data-gid="${gid}"]`);
          const amountInput = overlay.querySelector(`.guest-cert-amount[data-gid="${gid}"]`);
          const hintEl = overlay.querySelector(`.guest-cert-hint[data-gid="${gid}"]`);
          hintEl.textContent = '';
          hintEl.style.color = 'var(--status-red)';
          const resolved = resolveCertFromSearch(searchInput.value.trim(), idHidden ? idHidden.value : '');
          if(resolved.error){ hintEl.textContent = resolved.error; return; }
          const cert = resolved.cert;
          const amount = Math.round((parseFloat(amountInput.value) || 0) * 100) / 100;
          if(amount <= 0){ hintEl.textContent = 'Впишите сумму больше нуля.'; return; }
          const remaining = certRemaining(cert);
          if(amount > remaining){ hintEl.textContent = `У сертификата №${cert.number} остаток только ${formatMoney(remaining)}.`; return; }
          openGuestDetailsIds.add(gid);
          await performCertRedemption({cert, amount, guestId: gid});
        };
      });
    }

    const guestListContainerEl = overlay.querySelector('#guest-list-container');
    if(guestListContainerEl){
      renderGuestList();
      syncGuestCountFromList();
      const addGuestBtn = overlay.querySelector('#btn-add-guest');
      if(addGuestBtn){
        addGuestBtn.onclick = ()=>{
          guestListArr.push({ id: uid(), name: '', seats: 1, items: 1, phone: '', comment: '', expected: null });
          persistGuestList();
          syncGuestCountFromList();
          renderGuestList();
          const detailsEl = overlay.querySelector('#guest-breakdown-details');
          if(detailsEl) detailsEl.open = true;
          const lastNameInput = overlay.querySelectorAll('.guest-name');
          if(lastNameInput.length) lastNameInput[lastNameInput.length-1].focus();
        };
      }
    }

    function renderCertAttachSummary(){
      const summaryEl = overlay.querySelector('#cert-attach-summary');
      if(!summaryEl) return;
      const certRedemptionsForEvent = [];
      state.certificates.forEach(c=>{
        (c.redemptions||[]).forEach(r=>{
          if(r.eventId === state.modal.event.id) certRedemptionsForEvent.push({cert:c, redemption:r});
        });
      });
      if(certRedemptionsForEvent.length === 0){ summaryEl.innerHTML = ''; return; }
      const sum = certRedemptionsForEvent.reduce((s,x)=> s+((x.redemption.amount!==undefined&&x.redemption.amount!==null&&!isNaN(x.redemption.amount))?Number(x.redemption.amount):0), 0);
      summaryEl.innerHTML = `<div style="margin-top:10px;padding:8px 10px;background:var(--paper-2);border-radius:var(--radius);font-size:12px;color:var(--ink-soft);">
        🎟 Оплачено сертификатом(ами): ${certRedemptionsForEvent.length} на сумму ${formatMoney(sum)}
        <div style="margin-top:4px;">${certRedemptionsForEvent.map(x=>`№${escapeHtml(String(x.cert.number))} · списано ${formatMoney(x.redemption.amount||0)} · остаток по сертификату ${formatMoney(certRemaining(x.cert))}`).join('<br>')}</div>
      </div>`;
    }
    renderCertAttachSummary();

    // подпись → id сертификата, чтобы точно понимать, какой из нескольких сертификатов с одинаковым
    // номером (например, после импорта) выбрали из списка — differentiate по дате в подписи
    let certAttachLabelToId = {};
    function refreshCertAttachOptions(){
      const list = overlay.querySelector('#cert-attach-options');
      if(!list) return;
      const certs = state.certificates.filter(c=>certRemaining(c)>0);
      certAttachLabelToId = {};
      certs.forEach(c=>{ certAttachLabelToId[certPickerLabel(c)] = c.id; });
      list.innerHTML = certs.map(c=>`<option value="${escapeHtml(certPickerLabel(c))}">`).join('');
    }
    refreshCertAttachOptions(); // заполняем карту "подпись → id" сразу же, а не только после первого списания

    const attachCertBtn = overlay.querySelector('#btn-attach-cert');
    const certAttachSearch = overlay.querySelector('#cert-attach-search');
    const certAttachIdHidden = overlay.querySelector('#cert-attach-id');
    const certAttachAmount = overlay.querySelector('#cert-attach-amount');
    const certAttachHint = overlay.querySelector('#cert-attach-hint');
    if(certAttachSearch && certAttachIdHidden){
      certAttachSearch.addEventListener('input', ()=>{
        const val = certAttachSearch.value.trim();
        certAttachIdHidden.value = certAttachLabelToId[val] || '';
      });
    }
    // разыменование строки/id из поля поиска сертификата в конкретный объект сертификата —
    // общая логика и для мероприятия целиком, и для оплаты сертификатом за отдельного гостя
    function resolveCertFromSearch(searchVal, idHiddenVal){
      let cert = idHiddenVal ? state.certificates.find(c=>c.id === idHiddenVal) : null;
      if(!cert){
        const numberMatch = searchVal.match(/^№?(\S+)/);
        const numberStr = numberMatch ? numberMatch[1] : searchVal;
        const matches = state.certificates.filter(c=> String(c.number) === numberStr);
        if(matches.length > 1) return {error: `Есть несколько сертификатов №${numberStr} — выберите нужный из списка (по дате).`};
        cert = matches[0];
      }
      if(!cert) return {error: 'Сертификат с таким номером не найден. Выберите его из списка.'};
      return {cert};
    }

    // списание с сертификата в оплату мероприятия — опционально помечается конкретным гостем (guestId)
    async function performCertRedemption({cert, amount, guestId}){
      const dateVal = overlay.querySelector('#f-date') ? overlay.querySelector('#f-date').value : (state.modal.event.date || todayStr());
      const redemption = { id: uid(), eventId: state.modal.event.id, date: dateVal || todayStr(), amount };
      if(!Array.isArray(cert.redemptions)) cert.redemptions = [];
      cert.redemptions.push(redemption);
      cert.status = certRemaining(cert) <= 0 ? 'used' : 'partial';
      const certIdx = state.certificates.findIndex(c=>c.id===cert.id);
      if(certIdx>=0) state.certificates[certIdx] = cert;
      await saveCertificates();
      recordAction(`Сертификат №${cert.number} применён к мероприятию`, `${formatMoney(amount)}`);

      const paymentEntry = {
        id: uid(), amount, source: 'Сертификат', type: 'balance', date: dateVal || todayStr(), ts: new Date().toISOString(),
        certRedemptionRef: cert.id + ':' + redemption.id,
      };
      if(guestId) paymentEntry.guestId = guestId;
      paymentsArr.push(paymentEntry);
      paymentsHidden.value = JSON.stringify(paymentsArr);
      // оплата сертификатом НЕ увеличивает "Выручку" мероприятия — эти деньги уже стали доходом студии
      // в момент продажи сертификата, а не сейчас; иначе получилось бы задвоение и в самом мероприятии,
      // и в аналитике (см. mCertSalesRevenue в годовой сводке).
      // но поле "Выручка" обязательно к заполнению при сохранении — если оно ещё пустое (мероприятие целиком
      // оплачивается сертификатом, живых денег нет), проставляем туда 0, а не оставляем пустым
      const priceInputForCert = overlay.querySelector('#f-price');
      if(priceInputForCert && priceInputForCert.value === ''){
        priceInputForCert.value = 0;
        priceInputForCert.style.borderColor = '';
      }
      renderPaymentsLog();
      updateAwaitingHint();
      renderCertAttachSummary();
      refreshCertAttachOptions();
      if(guestId) renderGuestList();
    }

    // отмена списания при удалении оплаты, помеченной certRedemptionRef, — возвращает сумму на баланс сертификата
    async function undoCertRedemption(ref){
      if(!ref) return;
      const [certId, redemptionId] = ref.split(':');
      const cert = state.certificates.find(c=>c.id===certId);
      if(!cert) return;
      cert.redemptions = (cert.redemptions||[]).filter(r=>r.id!==redemptionId);
      cert.status = certRemaining(cert) <= 0 ? 'used' : (cert.redemptions.length > 0 ? 'partial' : 'in_progress');
      const certIdx = state.certificates.findIndex(c=>c.id===certId);
      if(certIdx>=0) state.certificates[certIdx] = cert;
      await saveCertificates();
      renderCertAttachSummary();
      refreshCertAttachOptions();
    }

    if(attachCertBtn && certAttachSearch && certAttachAmount){
      attachCertBtn.onclick = async ()=>{
        certAttachHint.textContent = '';
        certAttachHint.style.color = 'var(--status-red)';
        // сначала пробуем точный выбор из списка (по id, надёжно различает дубли номеров),
        // и только если строка не совпала ни с одной подписью — терпимо ищем по номеру (сработает, если номер уникален)
        const resolved = resolveCertFromSearch(certAttachSearch.value.trim(), certAttachIdHidden.value);
        if(resolved.error){ certAttachHint.textContent = resolved.error; return; }
        const cert = resolved.cert;
        const amount = parseInt(certAttachAmount.value) || 0;
        if(amount <= 0){ certAttachHint.textContent = 'Впишите сумму больше нуля.'; return; }
        const remaining = certRemaining(cert);
        if(amount > remaining){ certAttachHint.textContent = `У сертификата №${cert.number} остаток только ${formatMoney(remaining)}.`; return; }

        await performCertRedemption({cert, amount});

        certAttachSearch.value = '';
        certAttachIdHidden.value = '';
        certAttachAmount.value = '';
        certAttachHint.style.color = 'var(--status-green)';
        certAttachHint.textContent = `Готово — списано ${formatMoney(amount)} с сертификата №${cert.number}.`;
      };
    }

    function setEventStatus(statusValue){
      overlay.querySelectorAll('.status-opt').forEach(o=>{
        o.classList.toggle('active', o.dataset.status === statusValue);
      });
      overlay.querySelector('#f-status').value = statusValue;
      const dishesField = overlay.querySelector('#dishes-field');
      if(dishesField) dishesField.style.display = showsDishesAndRental(statusValue) ? 'block' : 'none';
      const rentalField = overlay.querySelector('#rental-field');
      if(rentalField) rentalField.style.display = showsDishesAndRental(statusValue) ? 'block' : 'none';
      if(statusValue === 'offsite' && spaceSelect && state.spaces.find(s=>s.id==='s5')){
        spaceSelect.value = 's5'; // выездные мероприятия по умолчанию идут в пространство "Выезд"
      }
      if(typeof updateAwaitingHint === 'function') updateAwaitingHint();
    }

    overlay.querySelectorAll('.status-opt').forEach(opt=>{
      opt.onclick = ()=>{
        setEventStatus(opt.dataset.status);
      };
    });

    // продукты, которые всегда частные заказы, а не занятия по расписанию —
    // при их выборе статус сам переключается на "Частник" (если сейчас "По расписанию" по умолчанию;
    // уже выставленный вручную "Выезд"/"Маркетинг" не трогаем — это тоже частный формат, просто другой)
    const PRIVATE_PRODUCTS = ['Свидание', 'День рождения', 'Свадьба', 'Корпоратив', 'Девичник', 'Детский МК'];
    const productSelectForAuto = overlay.querySelector('#f-product');
    if(productSelectForAuto){
      productSelectForAuto.addEventListener('change', ()=>{
        const currentStatus = overlay.querySelector('#f-status').value || 'confirmed';
        if(PRIVATE_PRODUCTS.includes(productSelectForAuto.value) && currentStatus === 'confirmed'){
          setEventStatus('tentative');
        }
