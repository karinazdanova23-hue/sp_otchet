    const analyticsPanel_cashflow = `
      <div class="analytics-section">
        <div style="font-size:24px;font-family:var(--font-display);font-weight:600;color:${cfNet>=0?'var(--status-green)':'var(--status-red)'};margin-bottom:4px;">${formatMoney(cfNet)}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">Реальные деньги за ${monthLabel}, по датам факта — приход минус расход. В отличие от «Чистой прибыли», не начисляется заранее: мероприятие попадает сюда только если по нему занесена оплата в «Журнал платежей» карточки мероприятия, с датой, попадающей в этот месяц.</div>
        ${netProfit !== cfNet ? `<div class="stat-row"><div class="stat-label">Для сравнения: начисленная прибыль</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;color:${netProfit>=0?'var(--status-green)':'var(--status-red)'};">${formatMoney(netProfit)}</div></div>` : ''}
      </div>
      <div class="analytics-section">
        <h4 style="margin-top:0;">Приход: ${formatMoney(cfCashIn)}</h4>
        ${cfCashInRows.length===0 ? '<div style="color:var(--ink-soft);font-size:13px;">В этом месяце реальных поступлений не зафиксировано.</div>' : cfCashInRows.map(r=>`
          <div class="stat-row"><div class="stat-label">${escapeHtml(r.label)}</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--status-green);">${formatMoney(r.amount)}</div></div>
        `).join('')}
      </div>
      <div class="analytics-section">
        <h4 style="margin-top:0;">Расход: ${formatMoney(cfCashOut)}</h4>
        ${cfCashOutRows.length===0 ? '<div style="color:var(--ink-soft);font-size:13px;">В этом месяце расходов не зафиксировано.</div>' : cfCashOutRows.map(r=>`
          <div class="stat-row"><div class="stat-label">${escapeHtml(r.label)}</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--status-red);">${formatMoney(r.amount)}</div></div>
        `).join('')}
      </div>
      ${cfEventsMissingLog.length>0 ? `
      <div class="analytics-section">
        <h4 style="margin-top:0;color:var(--status-red);">⚠ Не занесено в журнал платежей: ${cfEventsMissingLog.length} мероприятий на ${formatMoney(cfEventsMissingLogSum)}</h4>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Эти деньги не попали в приход выше — цена указана, но ни одной оплаты в «Журнал платежей» карточки мероприятия не занесено. Занесите оплаты с реальными датами, чтобы кэшфлоу считал их.</div>
        ${cfEventsMissingLog.slice(0,20).map(e=>`
          <div class="stat-row"><div class="stat-label">${escapeHtml(e.date?formatDateText(e.date):'')} · ${escapeHtml(e.title||'без названия')}</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;text-align:right;">${formatMoney(Number(e.price)||0)}</div></div>
        `).join('')}
        ${cfEventsMissingLog.length>20 ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">…и ещё ${cfEventsMissingLog.length-20}</div>` : ''}
      </div>
      ` : ''}
    `;

    if(total === 0 && !state.loggedInMasterName && !state.loggedInHostessName){
      const analyticsPanel_netprofit_empty = `
        <div class="analytics-section">
          <div style="font-size:24px;font-family:var(--font-display);font-weight:600;color:${netProfit>=0?'var(--status-green)':'var(--status-red)'};margin-bottom:4px;">${formatMoney(netProfit)}${npSharePct(netProfit, npTotalRevenue)}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">Выручка − Расходы за месяц. В этом месяце нет мероприятий, но остальная выручка/расходы всё равно считаются.</div>
          ${renderNetProfitFinModel(npRevenueRows, npExpenseRows, npTotalRevenue, npTotalExpenses, netProfit)}
          <div style="margin-top:16px;">
            <button class="btn btn-ghost owner-panel-btn" data-panel="netprofit-edit" style="border-color:#6B4A1E;color:#6B4A1E;">✏ Изменить аренду / свои статьи</button>
          </div>
        </div>
      `;
      state.analyticsPanels = { plan: analyticsPanel_plan, netprofit: analyticsPanel_netprofit_empty, cashflow: analyticsPanel_cashflow, yearsummary: analyticsPanel_yearsummary, auditlog: analyticsPanel_auditlog, marketing: analyticsPanel_marketing, integrity: renderEventsIntegrityPanel() };
      let emptyCompareHtml = '';
      if(state.compareMode){
        const prevCursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1);
        const prevLabel = MONTHS[prevCursor.getMonth()] + ' ' + prevCursor.getFullYear();
        const prevSum = computeQuickSummary(prevCursor);
        emptyCompareHtml = `
          <div class="analytics-section" style="background:var(--paper-2);padding:14px 16px;border-radius:var(--radius);">
            <h4 style="margin-top:0;">Сравнение: ${monthLabel} vs ${prevLabel}</h4>
            <div class="stat-row"><div class="stat-label">Мероприятий</div><div style="flex:1;font-size:13px;">${prevSum.total} → 0</div>${deltaHtml(0, prevSum.total, false)}</div>
            <div class="stat-row"><div class="stat-label">Выручка</div><div style="flex:1;font-size:13px;">${formatMoney(prevSum.totalRevenue)} → 0 ₽</div>${deltaHtml(0, prevSum.totalRevenue, true)}</div>
          </div>
        `;
      }
      return `
        <div class="cal-nav">
          <div class="month-label">${monthLabel}</div>
          <div class="cal-nav-btns">
            ${state.currentRole==='owner' ? `<button class="today-btn" id="an-toggle-lock" style="${state.closedMonths.includes(monthYm)?'border-color:var(--danger);color:var(--danger);':''}">${state.closedMonths.includes(monthYm) ? '🔒 Месяц закрыт — открыть' : '🔓 Закрыть месяц'}</button>` : (state.closedMonths.includes(monthYm) ? `<span class="today-btn" style="border-color:var(--danger);color:var(--danger);pointer-events:none;">🔒 Месяц закрыт</span>` : '')}
            <button class="today-btn" id="an-compare">${state.compareMode ? '✕ Скрыть сравнение' : '🔁 Сравнить с прошлым месяцем'}</button>
            <button class="today-btn" id="an-today">текущий месяц</button>
            <button class="nav-btn" id="an-prev">‹</button>
            <button class="nav-btn" id="an-next">›</button>
          </div>
        </div>
        ${emptyCompareHtml}
        <div class="analytics-section" style="padding:14px 16px;">
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${!isAdminFinRestricted ? `<button class="btn btn-ghost analytics-panel-btn" data-panel="plan" style="${hasAnyPlan?'':'border-color:var(--accent);color:var(--accent);'}">🎯 Выполнение плана</button>` : ''}
            <button class="btn btn-ghost" id="btn-edit-plan">✏ Задать план</button>
            <button class="btn btn-ghost owner-panel-btn" data-panel="netprofit" style="border-color:#6B4A1E;color:#6B4A1E;">🔒 Чистая прибыль</button>
            <button class="btn btn-ghost owner-panel-btn" data-panel="netprofit-calc" style="border-color:#6B4A1E;color:#6B4A1E;">🧮 Калькулятор плана</button>
            <button class="btn btn-ghost owner-panel-btn" data-panel="cashflow" style="border-color:#6B4A1E;color:#6B4A1E;">💵 Кэшфлоу</button>
            <button class="btn btn-ghost analytics-panel-btn" data-panel="yearsummary">📆 Сводка по годам</button>
            <button class="btn btn-ghost analytics-panel-btn" data-panel="auditlog">📜 Журнал действий</button>
            <button class="btn btn-ghost analytics-panel-btn" data-panel="integrity" style="${(state.eventsIntegrityAlerts&&state.eventsIntegrityAlerts.length>0)?'border-color:var(--status-red);color:var(--status-red);':''}">🛡 Сохранность расписания</button>
            <button class="btn btn-ghost analytics-panel-btn" data-panel="marketing">📣 Маркетинг</button>
          </div>
        </div>
        ${(!isAdminFinRestricted && (certOutstandingSaleCount>0 || certOutstandingMarketingCount>0)) ? `
        <div class="analytics-section">
          <div class="stat-row"><div class="stat-label" style="color:var(--status-red);">Непогашено по проданным сертификатам</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;color:var(--status-red);">${formatMoney(certOutstandingSale)} <span style="font-size:11px;">— ${certOutstandingSaleCount} шт., это студия ещё должна отдать услугами</span></div></div>
          ${certOutstandingMarketingCount>0?`<div class="stat-row"><div class="stat-label" style="color:var(--ink-soft);">Непогашено по маркетинговым сертификатам</div><div style="flex:1;font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);">${formatMoney(certOutstandingMarketing)} <span style="font-size:11px;">— ${certOutstandingMarketingCount} шт.</span></div></div>`:''}
        </div>
        ` : ''}
        <div class="analytics-section">
          <h4>Заполняемость</h4>
          <div class="stat-row">
            <div class="stat-label">Занято мест</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:0%;background:var(--status-green);"></div></div>
            <div class="stat-count">0%</div>
          </div>
        </div>
        <div class="analytics-empty">В этом месяце пока нет мероприятий.</div>
      `;
    }

    // по продуктам
    const productCounts = {};
    const productGuests = {};
    PRODUCTS.forEach(p=>{ productCounts[p]=0; productGuests[p]=0; });
    productCounts['Без категории'] = 0; productGuests['Без категории'] = 0;
    evts.forEach(e=>{
      const p = (e.product && PRODUCTS.includes(e.product)) ? e.product : 'Без категории';
      productCounts[p]++;
      productGuests[p] += (e.guests!==undefined&&e.guests!==null&&!isNaN(e.guests)) ? Number(e.guests) : 0;
    });
    const productList = Object.entries(productCounts).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxProduct = Math.max(1, ...productList.map(x=>x[1]));

    // по направлениям (вид мероприятия / название)
    const directionCounts = {};
    evts.forEach(e=>{
      const t = (e.title && e.title.trim()) ? e.title.trim() : 'Без названия';
      directionCounts[t] = (directionCounts[t]||0) + 1;
    });
    const directionList = Object.entries(directionCounts).sort((a,b)=>b[1]-a[1]);
    const maxDirection = Math.max(1, ...directionList.map(x=>x[1]));

    // по ведущим (учитывает всех со-ведущих мероприятия)
    const hostCounts = {};
    evts.forEach(e=>{
      const names = eventHostsWithPay(e).map(h=>h.name);
      if(names.length === 0){ hostCounts['Без ведущего'] = (hostCounts['Без ведущего']||0) + 1; return; }
      names.forEach(name=>{ hostCounts[name] = (hostCounts[name]||0) + 1; });
    });
    const hostList = Object.entries(hostCounts).sort((a,b)=>b[1]-a[1]);
    const maxHost = Math.max(1, ...hostList.map(x=>x[1]));

    // изделия (керамика, гончарный круг) — считаем по мероприятиям соответствующего направления
    const ceramicsEvts = evts.filter(e=> isCeramicsEvent(e.title));
    const totalCeramicsItems = ceramicsEvts.reduce((s,e)=> s + ((e.itemsCount!==undefined&&e.itemsCount!==null&&!isNaN(e.itemsCount))?Number(e.itemsCount):((e.guests!==undefined&&e.guests!==null&&!isNaN(e.guests))?Number(e.guests):0)), 0);
    const totalCeramicsGuests = ceramicsEvts.reduce((s,e)=> s + ((e.guests!==undefined&&e.guests!==null&&!isNaN(e.guests))?Number(e.guests):0), 0);

    // сводка по дням: выручка, гости, количество мероприятий за каждый день месяца
    const dayBreakdown = {};
    evts.forEach(e=>{
      if(!dayBreakdown[e.date]) dayBreakdown[e.date] = {revenue:0, guests:0, count:0};
      dayBreakdown[e.date].revenue += eventRevenueForecast(e);
      dayBreakdown[e.date].guests += (e.guests!==undefined&&e.guests!==null&&!isNaN(e.guests)) ? Number(e.guests) : 0;
      dayBreakdown[e.date].count += 1;
    });
    const dayList = Object.entries(dayBreakdown).sort((a,b)=> a[0].localeCompare(b[0]));
    const maxDayRevenue = Math.max(1, ...dayList.map(([,v])=>v.revenue));

    // по пространствам
    const spaceCounts = {};
    const spaceRevenue = {};
    const spaceProfit = {};
    state.spaces.forEach(s=>{ spaceCounts[s.id]=0; spaceRevenue[s.id]=0; spaceProfit[s.id]=0; });
    evts.forEach(e=>{
      spaceCounts[e.spaceId] = (spaceCounts[e.spaceId]||0)+1;
      spaceRevenue[e.spaceId] = (spaceRevenue[e.spaceId]||0) + eventRevenueForecast(e);
      spaceProfit[e.spaceId] = (spaceProfit[e.spaceId]||0) + eventProfitForecast(e);
    });
    const maxSpace = Math.max(1, ...state.spaces.map(s=>spaceCounts[s.id]||0));
    const maxSpaceRevenue = Math.max(1, ...state.spaces.map(s=>spaceRevenue[s.id]||0));
    const maxSpaceProfit = Math.max(1, ...state.spaces.map(s=>Math.abs(spaceProfit[s.id]||0)));

    // выручка и прибыль по продуктам
    const productRevenue = {};
    const productProfit = {};
    evts.forEach(e=>{
      const p = (e.product && PRODUCTS.includes(e.product)) ? e.product : 'Без категории';
      const rev = eventRevenueForecast(e);
      productRevenue[p] = (productRevenue[p]||0) + rev;
      productProfit[p] = (productProfit[p]||0) + eventProfitForecast(e);
    });
    const productRevenueList = Object.entries(productRevenue).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxProductRevenue = Math.max(1, ...productRevenueList.map(x=>x[1]));
    const productProfitList = Object.entries(productProfit).filter(([k,v])=>v!==0).sort((a,b)=>b[1]-a[1]);
    const maxProductProfit = Math.max(1, ...productProfitList.map(x=>Math.abs(x[1])));

    // средний чек на человека по продуктам
    const productGuestsSum = {};
    evts.forEach(e=>{
      const p = (e.product && PRODUCTS.includes(e.product)) ? e.product : 'Без категории';
      const g = (e.guests!==undefined && e.guests!==null && !isNaN(e.guests)) ? Number(e.guests) : 0;
      productGuestsSum[p] = (productGuestsSum[p]||0) + g;
    });
    const productAvgList = Object.keys(productRevenue)
      .map(p=>({ name:p, avg: (productGuestsSum[p]>0 && productRevenue[p]>0) ? productRevenue[p]/productGuestsSum[p] : 0 }))
      .filter(x=>x.avg>0)
      .sort((a,b)=>b.avg-a.avg);
    const maxProductAvg = Math.max(1, ...productAvgList.map(x=>x.avg));

    // средний чек на человека по направлениям + прибыль
    const directionRevenue = {};
    const directionGuestsSum = {};
    const directionProfit = {};
    evts.forEach(e=>{
      const t = (e.title && e.title.trim()) ? e.title.trim() : 'Без названия';
      const rev = eventRevenueForecast(e);
      const g = (e.guests!==undefined && e.guests!==null && !isNaN(e.guests)) ? Number(e.guests) : 0;
      directionRevenue[t] = (directionRevenue[t]||0) + rev;
      directionGuestsSum[t] = (directionGuestsSum[t]||0) + g;
      directionProfit[t] = (directionProfit[t]||0) + eventProfitForecast(e);
    });
    const directionAvgList = Object.keys(directionRevenue)
      .map(t=>({ name:t, avg: (directionGuestsSum[t]>0 && directionRevenue[t]>0) ? directionRevenue[t]/directionGuestsSum[t] : 0 }))
      .filter(x=>x.avg>0)
      .sort((a,b)=>b.avg-a.avg);
    const maxDirectionAvg = Math.max(1, ...directionAvgList.map(x=>x.avg));

    // выручка по направлениям (переиспользуем directionRevenue из расчёта среднего чека)
    const directionRevenueList = Object.entries(directionRevenue).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxDirectionRevenue = Math.max(1, ...directionRevenueList.map(x=>x[1]));
    const directionProfitList = Object.entries(directionProfit).filter(([k,v])=>v!==0).sort((a,b)=>b[1]-a[1]);
    const maxDirectionProfit = Math.max(1, ...directionProfitList.map(x=>Math.abs(x[1])));

    // приход по источникам оплаты (Точка / YCLIENTS / Наличные)
    const paymentsBySource = {};
    evts.forEach(e=>{
      (e.payments||[]).forEach(p=>{
        const src = p.source || 'Не указано';
        paymentsBySource[src] = (paymentsBySource[src]||0) + (Number(p.amount)||0);
      });
    });
    const paymentsBySourceList = Object.entries(paymentsBySource).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxPaymentsSource = Math.max(1, ...paymentsBySourceList.map(x=>x[1]));
    const totalReceivedViaLog = paymentsBySourceList.reduce((s,[,v])=>s+v, 0);

    // ждём оплату: где согласованная сумма больше уже полученной выручки
    const awaitingEvts = evts
      .map(e=>{
        const agreed = (e.agreedPrice!==undefined && e.agreedPrice!==null && !isNaN(e.agreedPrice)) ? Number(e.agreedPrice) : 0;
        const received = (e.price!==undefined && e.price!==null && !isNaN(e.price)) ? Number(e.price) : 0;
        return { ...e, _remain: agreed - received };
      })
      .filter(e=>e._remain > 0)
      .sort((a,b)=>b._remain-a._remain);
    const totalAwaiting = awaitingEvts.reduce((sum,e)=>sum+e._remain, 0);

    // расхождения: для Частника и Выезда выручка в мероприятии обязана сходиться с "Книгой"
    // (По расписанию, Маркетинг и Слот из этой сверки исключены)
    const discrepancies = evts
      .filter(e=> RECONCILE_STATUSES.includes(e.status))
      .map(e=>{
        const calRev = (e.price!==undefined && e.price!==null && !isNaN(e.price)) ? Number(e.price) : 0;
        const linked = state.incomes.filter(i=>i.eventId===e.id);
        const bookRev = linked.reduce((s,i)=> s+((i.amount!==undefined&&i.amount!==null&&!isNaN(i.amount))?Number(i.amount):0), 0);
        return { ...e, _calRev: calRev, _bookRev: bookRev, _diff: calRev - bookRev, _linkedCount: linked.length };
      })
      .filter(e=> e._diff !== 0)
      .sort((a,b)=> Math.abs(b._diff) - Math.abs(a._diff));
    const totalDiscrepancy = discrepancies.reduce((s,e)=>s+Math.abs(e._diff), 0);

    // топ мероприятий по выручке
    const topByRevenue = [...evts]
      .filter(e=>eventRevenueForecast(e) > 0)
      .sort((a,b)=>eventRevenueForecast(b)-eventRevenueForecast(a))
      .slice(0,10);
    const maxTopRevenue = Math.max(1, ...topByRevenue.map(e=>eventRevenueForecast(e)));

    // топ мероприятий по прибыли
    const topByProfit = [...evts]
      .filter(e=>eventRevenueForecast(e) > 0)
      .map(e=>({ ...e, _profit: eventProfitForecast(e) }))
      .sort((a,b)=>b._profit-a._profit)
      .slice(0,10);
    const maxTopProfit = Math.max(1, ...topByProfit.map(e=>Math.abs(e._profit)));

    // себестоимость материалов
    const totalMaterials = evts.reduce((sum,e)=> sum + eventMaterialsCost(e), 0);
    const spaceMaterials = {};
    state.spaces.forEach(s=>{ spaceMaterials[s.id]=0; });
    evts.forEach(e=>{ spaceMaterials[e.spaceId] = (spaceMaterials[e.spaceId]||0) + eventMaterialsCost(e); });
    const maxSpaceMaterials = Math.max(1, ...state.spaces.map(s=>spaceMaterials[s.id]||0));

    const productMaterials = {};
    evts.forEach(e=>{
      const p = (e.product && PRODUCTS.includes(e.product)) ? e.product : 'Без категории';
      productMaterials[p] = (productMaterials[p]||0) + eventMaterialsCost(e);
    });
    const productMaterialsList = Object.entries(productMaterials).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxProductMaterials = Math.max(1, ...productMaterialsList.map(x=>x[1]));

    const directionMaterials = {};
    evts.forEach(e=>{
      const t = (e.title && e.title.trim()) ? e.title.trim() : 'Без названия';
      directionMaterials[t] = (directionMaterials[t]||0) + eventMaterialsCost(e);
    });
    const directionMaterialsList = Object.entries(directionMaterials).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxDirectionMaterials = Math.max(1, ...directionMaterialsList.map(x=>x[1]));

    // зарплата мастеров (учитывает всех со-ведущих на мероприятии, не только основного)
    const monthYmForItemSales = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
    const totalSalary = evts.reduce((sum,e)=> sum + eventTotalMasterPay(e), 0);

    const hostSalary = {};
    const hostSessionPay = {};
    const hostMaterialsComp = {};
    const masterEventDetails = {};
    // оплата за проведение МК — привязана к дате самого мероприятия
    evts.forEach(e=>{
      const half = parseInt(e.date.slice(8,10),10) <= 15 ? 'H1' : 'H2';
      eventHostsWithPay(e).forEach(h=>{
        hostSalary[h.name] = (hostSalary[h.name]||0) + h.pay;
        hostSessionPay[h.name] = (hostSessionPay[h.name]||0) + h.pay;
        if(!masterEventDetails[h.name]) masterEventDetails[h.name] = [];
        masterEventDetails[h.name].push({ date: e.date, title: e.title || 'Без названия', sessionPay: h.pay, materialsComp: 0, total: h.pay, half, kind: 'session' });
      });
    });
    // компенсация за материалы ("Кому платить") — попадает в ЗП за период, когда фактически был расход:
    // это дата расхода, указанная построчно у материала, а если её нет — дата самого мероприятия.
    // расход мог быть в другом месяце, чем прошло мероприятие, поэтому перебираем ВСЕ мероприятия, а не только этого месяца,
    // и фильтруем уже по эффективной дате компенсации
    state.events.forEach(e=>{
      eventMasterMaterialPayments(e).forEach(p=>{
        if(!p.date || !p.date.startsWith(monthYmForItemSales)) return;
        const half = parseInt(p.date.slice(8,10),10) <= 15 ? 'H1' : 'H2';
        hostSalary[p.name] = (hostSalary[p.name]||0) + p.amount;
        hostMaterialsComp[p.name] = (hostMaterialsComp[p.name]||0) + p.amount;
        if(!masterEventDetails[p.name]) masterEventDetails[p.name] = [];
        const label = p.expenseDateOverride
          ? `Материалы к «${e.title || 'без названия'}» (МК ${formatDateText(e.date)})`
          : (e.title || 'Без названия');
        masterEventDetails[p.name].push({ date: p.date, title: label, sessionPay: 0, materialsComp: p.amount, total: p.amount, half, kind: 'materials' });
      });
    });

    // доля мастеров от продажи изделий за этот же месяц
    const itemSalesByMaster = {};
    state.itemSales.filter(x=> x.date && x.date.startsWith(monthYmForItemSales)).forEach(x=>{
      const name = (x.masterName||'').trim();
      if(!name) return;
      const rev = (x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0;
      itemSalesByMaster[name] = (itemSalesByMaster[name]||0) + Math.round(rev*ITEM_SALE_MASTER_PCT/100);
    });
    // доля мастеров от заказов за этот же месяц
    const ordersByMaster = {};
    state.orders.filter(x=> x.date && x.date.startsWith(monthYmForItemSales)).forEach(x=>{
      const name = (x.masterName||'').trim();
      if(!name) return;
      const share = (x.masterShare!==undefined&&x.masterShare!==null&&!isNaN(x.masterShare))?Number(x.masterShare):0;
      ordersByMaster[name] = (ordersByMaster[name]||0) + share;
    });
    // корректировки ЗП (доплаты/удержания) за этот же месяц
    const adjustmentsByMaster = {};
    const masterAdjustmentDetails = {};
    state.salaryAdjustments.filter(x=> x.date && x.date.startsWith(monthYmForItemSales)).forEach(x=>{
      const name = (x.masterName||'').trim();
      if(!name) return;
      adjustmentsByMaster[name] = (adjustmentsByMaster[name]||0) + (Number(x.amount)||0);
      if(!masterAdjustmentDetails[name]) masterAdjustmentDetails[name] = [];
      masterAdjustmentDetails[name].push({ date: x.date, comment: x.comment||'', amount: Number(x.amount)||0 });
    });
    const combinedMasterNames = Array.from(new Set([...Object.keys(hostSalary), ...Object.keys(itemSalesByMaster), ...Object.keys(ordersByMaster), ...Object.keys(adjustmentsByMaster)]));
    const combinedMasterTotals = combinedMasterNames.map(name=>{
      const fromEvents = hostSalary[name] || 0;
      const fromMaterialsComp = hostMaterialsComp[name] || 0;
      const fromItems = itemSalesByMaster[name] || 0;
      const fromOrders = ordersByMaster[name] || 0;
      const fromAdjustments = adjustmentsByMaster[name] || 0;
      return { name, fromEvents, fromMaterialsComp, fromItems, fromOrders, fromAdjustments, total: fromEvents + fromItems + fromOrders + fromAdjustments };
    }).filter(x=>x.total!==0).sort((a,b)=>b.total-a.total);
    const combinedGrandTotal = combinedMasterTotals.reduce((s,x)=>s+x.total, 0);

    // зарплата по половинам месяца: 1–15 и 16–конец (МК + изделия + заказы = сумма "к выдаче")
    const hostSalaryH1 = {}, hostSalaryH2 = {};
    let totalSalaryH1 = 0, totalSalaryH2 = 0;
    evts.forEach(e=>{
      const day = parseInt((e.date||'').split('-')[2], 10) || 1;
      eventHostsWithPay(e).forEach(h=>{
        if(day <= 15){ hostSalaryH1[h.name] = (hostSalaryH1[h.name]||0) + h.pay; totalSalaryH1 += h.pay; }
        else { hostSalaryH2[h.name] = (hostSalaryH2[h.name]||0) + h.pay; totalSalaryH2 += h.pay; }
      });
    });
    // компенсация за материалы — по дате расхода (может отличаться от даты мероприятия и попасть в другую половину месяца)
    state.events.forEach(e=>{
      eventMasterMaterialPayments(e).forEach(p=>{
        if(!p.date || !p.date.startsWith(monthYmForItemSales)) return;
        const day = parseInt(p.date.split('-')[2], 10) || 1;
        if(day <= 15){ hostSalaryH1[p.name] = (hostSalaryH1[p.name]||0) + p.amount; totalSalaryH1 += p.amount; }
        else { hostSalaryH2[p.name] = (hostSalaryH2[p.name]||0) + p.amount; totalSalaryH2 += p.amount; }
      });
    });
    state.itemSales.filter(x=> x.date && x.date.startsWith(monthYmForItemSales)).forEach(x=>{
      const name = (x.masterName||'').trim();
      if(!name) return;
      const day = parseInt((x.date||'').split('-')[2], 10) || 1;
      const rev = (x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0;
      const share = Math.round(rev*ITEM_SALE_MASTER_PCT/100);
      if(day <= 15){ hostSalaryH1[name] = (hostSalaryH1[name]||0) + share; totalSalaryH1 += share; }
      else { hostSalaryH2[name] = (hostSalaryH2[name]||0) + share; totalSalaryH2 += share; }
    });
    state.orders.filter(x=> x.date && x.date.startsWith(monthYmForItemSales)).forEach(x=>{
      const name = (x.masterName||'').trim();
      if(!name) return;
      const day = parseInt((x.date||'').split('-')[2], 10) || 1;
      const share = (x.masterShare!==undefined&&x.masterShare!==null&&!isNaN(x.masterShare))?Number(x.masterShare):0;
      if(day <= 15){ hostSalaryH1[name] = (hostSalaryH1[name]||0) + share; totalSalaryH1 += share; }
      else { hostSalaryH2[name] = (hostSalaryH2[name]||0) + share; totalSalaryH2 += share; }
    });
    state.salaryAdjustments.filter(x=> x.date && x.date.startsWith(monthYmForItemSales)).forEach(x=>{
      const name = (x.masterName||'').trim();
      if(!name) return;
      const day = parseInt((x.date||'').split('-')[2], 10) || 1;
      const amount = Number(x.amount) || 0;
      if(day <= 15){ hostSalaryH1[name] = (hostSalaryH1[name]||0) + amount; totalSalaryH1 += amount; }
      else { hostSalaryH2[name] = (hostSalaryH2[name]||0) + amount; totalSalaryH2 += amount; }
    });
    const hostSalaryH1List = Object.entries(hostSalaryH1).sort((a,b)=>b[1]-a[1]);
    const hostSalaryH2List = Object.entries(hostSalaryH2).sort((a,b)=>b[1]-a[1]);
    const maxHostSalaryH1 = Math.max(1, ...hostSalaryH1List.map(x=>x[1]));
    const maxHostSalaryH2 = Math.max(1, ...hostSalaryH2List.map(x=>x[1]));

    // зарплата хостес за месяц: будни 1300₽/смена, выходные 1500₽/смена, с разбивкой по половинам месяца
    const hostessSalary = {};
    const hostessSalaryH1 = {}, hostessSalaryH2 = {};
    let totalHostessSalary = 0, totalHostessSalaryH1 = 0, totalHostessSalaryH2 = 0;
    {
      const y = cursor.getFullYear(), m = cursor.getMonth();
      const daysInMonth = new Date(y, m+1, 0).getDate();
      for(let d=1; d<=daysInMonth; d++){
        const dateObj = new Date(y, m, d);
        const dow = dateObj.getDay(); // 0=вс, 6=сб
        const rate = (dow===0 || dow===6) ? HOSTESS_WEEKEND_RATE : HOSTESS_WEEKDAY_RATE;
        const dateStr = fmtDate(dateObj);
        const dayShifts = state.hostessShifts[dateStr];
        if(!dayShifts) continue;
        SHIFT_DEFS.forEach(s=>{
          const rawEntry = dayShifts[s.key];
          const entry = normalizeShiftEntry(rawEntry, s);
          if(entry && entry.name){
            const extra = shiftExtraHours(rawEntry, s);
            const pay = rate + extra*HOSTESS_EXTRA_HOUR_RATE;
            const name = entry.name;
            hostessSalary[name] = (hostessSalary[name]||0) + pay;
            totalHostessSalary += pay;
            if(d <= 15){ hostessSalaryH1[name] = (hostessSalaryH1[name]||0) + pay; totalHostessSalaryH1 += pay; }
            else { hostessSalaryH2[name] = (hostessSalaryH2[name]||0) + pay; totalHostessSalaryH2 += pay; }
          }
        });
        const dishesBonusesMain = hostessDishesBonusesForDate(dateStr, dayShifts);
        Object.entries(dishesBonusesMain).forEach(([name, bonus])=>{
          hostessSalary[name] = (hostessSalary[name]||0) + bonus;
          totalHostessSalary += bonus;
          if(d <= 15){ hostessSalaryH1[name] = (hostessSalaryH1[name]||0) + bonus; totalHostessSalaryH1 += bonus; }
          else { hostessSalaryH2[name] = (hostessSalaryH2[name]||0) + bonus; totalHostessSalaryH2 += bonus; }
        });
      }
    }
    const hostessSalaryList = Object.entries(hostessSalary).sort((a,b)=>b[1]-a[1]);
    const maxHostessSalary = Math.max(1, ...hostessSalaryList.map(x=>x[1]));
    const hostessSalaryH1List = Object.entries(hostessSalaryH1).sort((a,b)=>b[1]-a[1]);
    const hostessSalaryH2List = Object.entries(hostessSalaryH2).sort((a,b)=>b[1]-a[1]);
    const maxHostessSalaryH1 = Math.max(1, ...hostessSalaryH1List.map(x=>x[1]));
    const maxHostessSalaryH2 = Math.max(1, ...hostessSalaryH2List.map(x=>x[1]));

    // сверка: начислено vs выплачено (по расходам категории "Зарплата"), с учётом того, что ЗП выдаётся
    // двумя частями по фактическому графику выплат: за 1–15 число — 16-го числа ЭТОГО ЖЕ месяца,
    // за 16 – конец месяца — 2-го числа СЛЕДУЮЩЕГО месяца. Поэтому:
    //  - расход категории «Зарплата», помеченный мастером, с датой 16-е число и позже в месяце M — это выплата за 1-ю половину M;
    //  - такой же расход с датой 1–15 число в месяце M+1 — это выплата за 2-ю половину M.
    // И до наступления даты выплаты (16-е / 2-е) расхождение не считается долгом — ещё рано его платить.
    const reconY = cursor.getFullYear(), reconM = cursor.getMonth();
    const reconYm = reconY+'-'+pad(reconM+1);
    const reconNextYm = reconM===11 ? (reconY+1)+'-01' : reconY+'-'+pad(reconM+2);
    const dueDateH1 = reconYm+'-16';
    const dueDateH2 = reconNextYm+'-02';
    const todayD = todayStr();
    const hostPaidH1 = {}, hostPaidH2 = {};
    state.expenses.forEach(e=>{
      if(e.category!=='Зарплата' || !e.master || !e.date) return;
      const name = e.master.trim();
      const amount = (e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount)) ? Number(e.amount) : 0;
      const eym = e.date.slice(0,7);
      const day = parseInt(e.date.slice(8,10),10) || 1;
      if(eym===reconYm && day>=16){ hostPaidH1[name] = (hostPaidH1[name]||0) + amount; }
      if(eym===reconNextYm && day<=15){ hostPaidH2[name] = (hostPaidH2[name]||0) + amount; }
    });
    const allSalaryHosts = Array.from(new Set([...Object.keys(hostSalaryH1), ...Object.keys(hostSalaryH2), ...Object.keys(hostPaidH1), ...Object.keys(hostPaidH2)]));
    const salaryReconciliation = [];
    allSalaryHosts.forEach(name=>{
      const accruedH1 = hostSalaryH1[name]||0, paidH1v = hostPaidH1[name]||0, diffH1 = accruedH1 - paidH1v;
      if(diffH1 !== 0 && todayD >= dueDateH1){
        salaryReconciliation.push({ name, halfLabel: '1–15 число', accrued: accruedH1, paid: paidH1v, diff: diffH1 });
      }
      const accruedH2 = hostSalaryH2[name]||0, paidH2v = hostPaidH2[name]||0, diffH2 = accruedH2 - paidH2v;
      if(diffH2 !== 0 && todayD >= dueDateH2){
        salaryReconciliation.push({ name, halfLabel: '16 – конец месяца', accrued: accruedH2, paid: paidH2v, diff: diffH2 });
      }
    });
    salaryReconciliation.sort((a,b)=> Math.abs(b.diff)-Math.abs(a.diff));

    function hostBreakdownHtml(hostName){
      const hostEvts = evts.filter(e=>{
        const names = eventHostsWithPay(e).map(h=>h.name);
        return names.length ? names.includes(hostName) : hostName==='Без ведущего';
      });
      const byProduct = {};
      hostEvts.forEach(e=>{
        const p = (e.product && PRODUCTS.includes(e.product)) ? e.product : 'Без категории';
        byProduct[p] = (byProduct[p]||0)+1;
      });
      const rows = Object.entries(byProduct).sort((a,b)=>b[1]-a[1])
        .map(([p,c])=>`<div class="host-expand-row"><span>${escapeHtml(p)}</span><span class="n">${c}</span></div>`).join('');
      return `<div class="host-expand">${rows}</div>`;
    }

    const FIN_TABS = [
      {id:'revenue', label:'Выручка'},
      {id:'profit', label:'Прибыль'},
      {id:'avg', label:'Средний чек'},
      {id:'materials', label:'Себестоимость'},
      {id:'salary', label:'Зарплата'},
    ];
    const activeFinTab = (state.loggedInMasterName || state.loggedInHostessName) ? 'salary' : (state.analyticsFinTab || 'revenue');
    const finTabsHtml = `
      <div class="view-switch" style="margin-bottom:16px;">
        ${FIN_TABS.map(t=>`<button data-fintab="${t.id}" class="${activeFinTab===t.id?'active':''}">${t.label}</button>`).join('')}
      </div>
    `;

    let finContent = '';
    if(activeFinTab === 'revenue'){
      finContent = `
        <div class="analytics-section">
          <h4>Выручка по пространствам</h4>
          ${state.spaces.map(s=>`
            <div class="stat-row">
              <div class="stat-label">${spaceBadge(s,'sm')}${escapeHtml(s.name)}</div>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round((spaceRevenue[s.id]||0)/maxSpaceRevenue*100)}%;background:${s.hex};"></div></div>
              <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(spaceRevenue[s.id]||0)}${totalRevenue>0?' · '+Math.round((spaceRevenue[s.id]||0)/totalRevenue*100)+'%':''}</div>
            </div>
          `).join('')}
        </div>
        <div class="analytics-section">
          <h4>Выручка по продуктам</h4>
          ${productRevenueList.length ? productRevenueList.map(([p,rev])=>`
            <div class="stat-row">
              <div class="stat-label">${escapeHtml(p)}</div>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(rev/maxProductRevenue*100)}%;background:var(--accent);"></div></div>
              <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(rev)}${totalRevenue>0?' · '+Math.round(rev/totalRevenue*100)+'%':''}</div>
            </div>
          `).join('') : `<div style="color:var(--ink-soft);font-size:13px;">Нет мероприятий с выручкой и указанным продуктом.</div>`}
        </div>
        <div class="analytics-section">
          <h4>Выручка по направлениям</h4>
          ${directionRevenueList.length ? directionRevenueList.map(([t,rev])=>`
            <div class="stat-row">
              <div class="stat-label">${escapeHtml(t)}</div>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(rev/maxDirectionRevenue*100)}%;background:var(--ink);"></div></div>
              <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(rev)}${totalRevenue>0?' · '+Math.round(rev/totalRevenue*100)+'%':''}</div>
            </div>
          `).join('') : `<div style="color:var(--ink-soft);font-size:13px;">Нет мероприятий с указанной выручкой.</div>`}
        </div>
        <div class="analytics-section">
          <h4>Топ мероприятий по выручке</h4>
          ${topByRevenue.length ? topByRevenue.map((e,i)=>`
            <div class="stat-row">
              <div class="stat-label" style="width:210px;">${i+1}. ${escapeHtml(e.title)} ${spaceBadge(getSpace(e.spaceId),'xs')}</div>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(eventRevenueForecast(e)/maxTopRevenue*100)}%;background:var(--ink);"></div></div>
              <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(eventRevenueForecast(e))}</div>
            </div>
          `).join('') : `<div style="color:var(--ink-soft);font-size:13px;">Ни у одного мероприятия не указана выручка.</div>`}
        </div>
        <div class="analytics-section">
          <h4>Приход по источникам оплаты${totalReceivedViaLog>0?': '+formatMoney(totalReceivedViaLog):''}</h4>
          ${paymentsBySourceList.length ? paymentsBySourceList.map(([src,amt])=>`
            <div class="stat-row">
              <div class="stat-label">${escapeHtml(src)}</div>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(amt/maxPaymentsSource*100)}%;background:var(--accent);"></div></div>
              <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(amt)}${totalReceivedViaLog>0?' · '+Math.round(amt/totalReceivedViaLog*100)+'%':''}</div>
            </div>
          `).join('') : `<div style="color:var(--ink-soft);font-size:13px;">Пока нет оплат, добавленных через журнал платежей в карточке мероприятия.</div>`}
        </div>
        <div class="analytics-section">
          <h4 style="color:${totalAwaiting>0?'var(--status-red)':'inherit'};">Ждём оплату: ${formatMoney(totalAwaiting)}</h4>
          ${awaitingEvts.length ? awaitingEvts.slice(0,10).map(e=>`
            <div class="stat-row">
              <div class="stat-label" style="width:210px;">${escapeHtml(e.title)} ${spaceBadge(getSpace(e.spaceId),'xs')}${e.host?' · '+escapeHtml(e.host):''}</div>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(e._remain/(awaitingEvts[0]?awaitingEvts[0]._remain:1)*100)}%;background:var(--status-red);"></div></div>
              <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(e._remain)}</div>
            </div>
          `).join('') : `<div style="color:var(--ink-soft);font-size:13px;">Нет мероприятий с неполной оплатой (или не указана «Прогнозная выручка»).</div>`}
        </div>
        <div class="analytics-section">
          <h4 style="color:${discrepancies.length>0?'var(--status-red)':'inherit'};">Расхождения: Календарь vs Книга ${discrepancies.length ? `(${discrepancies.length}, на сумму ${formatMoney(totalDiscrepancy)})` : ''}</h4>
          <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Проверяются только «Частник» и «Выезд» — по правилам у них выручка в мероприятии обязана совпадать с суммой привязанных записей «Книги» (в том числе если в «Книге» пока вообще ничего не привязано). «По расписанию», «Маркетинг» и «Слот» в эту сверку не входят.</div>
          ${discrepancies.length ? discrepancies.map(e=>`
            <div class="stat-row">
              <div class="stat-label" style="width:210px;">${escapeHtml(e.title)} ${spaceBadge(getSpace(e.spaceId),'xs')} · ${formatDateText(e.date)}</div>
              <div style="flex:1;font-size:12.5px;">Календарь: ${formatMoney(e._calRev)} · Книга: ${formatMoney(e._bookRev)}</div>

  function renderPlanProgressView(){
    const cursor = state.analyticsCursor;
    const monthLabel = MONTHS[cursor.getMonth()] + ' ' + cursor.getFullYear();
    const evts = getMonthEvents(cursor);
    const total = evts.length;
    const totalGuests = evts.reduce((sum,e)=> sum + ((e.guests!==undefined && e.guests!==null && !isNaN(e.guests)) ? Number(e.guests) : 0), 0);
    const totalRevenue = evts.reduce((sum,e)=> sum + eventRevenueForecast(e), 0);

    const planYm = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
    const currentPlan = (state.monthlyPlans && state.monthlyPlans[planYm]) || {};
    const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
    const isCurrentMonth = planYm === (new Date()).getFullYear()+'-'+pad((new Date()).getMonth()+1);
    const isPastMonth = cursor < new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    const daysElapsed = isPastMonth ? daysInMonth : (isCurrentMonth ? new Date().getDate() : 0);
    const planMonthLeads = state.leads.filter(l=> l.requestDate && l.requestDate.startsWith(planYm));
    const planLeadsCount = planMonthLeads.length;
    const planSoldCount = planMonthLeads.filter(l=>l.sold).length;
    const planConversionPct = planLeadsCount>0 ? Math.round(planSoldCount/planLeadsCount*100) : 0;

    // без "Прибыли" — менеджеру/маркетологу не нужны финансовые показатели, только операционные и выручка
    const PP_METRICS = [
      {key:'revenue', label:'Выручка', value: totalRevenue, format:'money'},
      {key:'eventsCount', label:'Мероприятий', value: total, format:'int'},
      {key:'guestsCount', label:'Гостей', value: totalGuests, format:'int'},
      {key:'leadsCount', label:'Заявки', value: planLeadsCount, format:'int'},
      {key:'conversionPct', label:'Конверсия по продажам', value: planConversionPct, format:'pct'},
    ];
    const planProgress = PP_METRICS.map(m=>{
      const target = currentPlan[m.key];
      if(target === undefined || target === null || target === '') return {...m, target: null};
      if(m.format === 'pct'){
        const paceStatus = daysElapsed===0 ? 'notstarted' : (m.value >= target ? 'ahead' : 'behind');
        return {...m, target, pctOfTarget: target>0?Math.round(m.value/target*100):0, expectedByNow: null, paceStatus, projected: null};
      }
      const pctOfTarget = target>0 ? Math.round(m.value/target*100) : 0;
      const expectedByNow = daysElapsed>0 ? Math.round(target * daysElapsed / daysInMonth) : 0;
      const paceStatus = daysElapsed===0 ? 'notstarted' : (m.value >= expectedByNow ? 'ahead' : 'behind');
      const projected = daysElapsed>0 ? Math.round(m.value / daysElapsed * daysInMonth) : null;
      return {...m, target, pctOfTarget, expectedByNow, paceStatus, projected};
    });
    const customPlanProgress = (currentPlan.custom || []).filter(m=>m.name && m.target!==null && m.target!==undefined).map(m=>{
      const value = (m.actual!==undefined && m.actual!==null) ? Number(m.actual) : 0;
      const target = Number(m.target);
      const pctOfTarget = target>0 ? Math.round(value/target*100) : 0;
      const expectedByNow = daysElapsed>0 ? Math.round(target * daysElapsed / daysInMonth) : 0;
      const paceStatus = daysElapsed===0 ? 'notstarted' : (value >= expectedByNow ? 'ahead' : 'behind');
      const projected = daysElapsed>0 ? Math.round(value / daysElapsed * daysInMonth) : null;
      return { key:'custom', label: m.name, value, format:'int', target, pctOfTarget, expectedByNow, paceStatus, projected, isCustom:true };
    });
    const productPlanProgress = Object.entries((currentPlan.byProduct)||{})
      .filter(([, target])=> target!==null && target!==undefined && target>0)
      .map(([product, target])=>{
        const value = productRevenueForMonth(product, planYm);
        const pctOfTarget = target>0 ? Math.round(value/target*100) : 0;
        const expectedByNow = daysElapsed>0 ? Math.round(target * daysElapsed / daysInMonth) : 0;
        const paceStatus = daysElapsed===0 ? 'notstarted' : (value >= expectedByNow ? 'ahead' : 'behind');
        const projected = daysElapsed>0 ? Math.round(value / daysElapsed * daysInMonth) : null;
        return { key:'product', label: product, value, format:'money', target, pctOfTarget, expectedByNow, paceStatus, projected, isProduct:true };
      });
    const hasAnyPlan = planProgress.some(p=>p.target !== null) || customPlanProgress.length > 0 || productPlanProgress.length > 0;

            <div class="stat-bar-track" style="margin-top:6px;"><div class="stat-bar-fill" style="width:${Math.min(100,p.format==='pct'?(p.target>0?Math.round(p.value/p.target*100):0):p.pctOfTarget)}%;background:${p.paceStatus==='behind'?'var(--status-red)':'var(--status-green)'};"></div></div>
            ${daysElapsed>0 && p.format!=='pct' ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">Нужно к этому дню: ${p.format==='money'?formatMoney(p.expectedByNow):p.expectedByNow} · Прогноз на конец месяца: ${p.format==='money'?formatMoney(p.projected):p.projected}</div>` : ''}
          </div>
    `;
    const productRowHtml = p => `
          <div style="margin-bottom:16px;padding:10px 12px;background:var(--paper-2);border-radius:var(--radius);border-left:3px solid ${p.paceStatus==='ahead'?'var(--status-green)':(p.paceStatus==='behind'?'var(--status-red)':'var(--line-strong)')};">
            <div style="display:flex;justify-content:space-between;align-items:baseline;">
              <b style="font-family:var(--font-display);">${escapeHtml(p.label)}</b>
              <span style="font-size:12px;color:${p.paceStatus==='ahead'?'var(--status-green)':(p.paceStatus==='behind'?'var(--status-red)':'var(--ink-soft)')};">${PP_STATUS_LABEL[p.paceStatus]}</span>
            </div>
            <div style="font-family:var(--font-mono);font-size:15px;margin-top:4px;">${formatMoney(p.value)} <span style="color:var(--ink-soft);font-size:12px;">из ${formatMoney(p.target)} (${p.pctOfTarget}%)</span></div>
            <div class="stat-bar-track" style="margin-top:6px;"><div class="stat-bar-fill" style="width:${Math.min(100,p.pctOfTarget)}%;background:${p.paceStatus==='behind'?'var(--status-red)':'var(--status-green)'};"></div></div>
            ${daysElapsed>0 ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">Нужно к этому дню: ${formatMoney(p.expectedByNow)} · Прогноз на конец месяца: ${formatMoney(p.projected)}</div>` : ''}

    return `

  function renderPersonalHostessSalaryView(monthLabel, hostessSalary, hostessSalaryH1, hostessSalaryH2, totalHostessSalary){
    const myName = state.loggedInHostessName;
    const norm = s => (s||'').trim().toLowerCase();
    const cursor = state.analyticsCursor;
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    let resolvedName = Object.keys(hostessSalary).find(n=>n===myName) || Object.keys(hostessSalary).find(n=>norm(n)===norm(myName));
    const myTotal = resolvedName ? (hostessSalary[resolvedName]||0) : 0;
    const shifts = [];
    for(let d=1; d<=daysInMonth; d++){
      const dateObj = new Date(y, m, d);
      const dow = dateObj.getDay();
      const rate = (dow===0 || dow===6) ? HOSTESS_WEEKEND_RATE : HOSTESS_WEEKDAY_RATE;
      const dateStr = fmtDate(dateObj);
      const dayShifts = state.hostessShifts[dateStr];
      if(!dayShifts) continue;
      SHIFT_DEFS.forEach(s=>{
        const rawEntry = dayShifts[s.key];
        const entry = normalizeShiftEntry(rawEntry, s);
        if(entry && entry.name && norm(entry.name)===norm(myName)){
          const extra = shiftExtraHours(rawEntry, s);
          const pay = rate + extra*HOSTESS_EXTRA_HOUR_RATE;
          shifts.push({ date: dateStr, start: entry.start, end: entry.end, pay, half: d<=15?'H1':'H2' });
        }
      });
      const dishesBonusesMain = hostessDishesBonusesForDate(dateStr, dayShifts);
      Object.entries(dishesBonusesMain).forEach(([name, bonus])=>{
        if(norm(name)===norm(myName)){
          shifts.push({ date: dateStr, start: '', end: '', pay: bonus, half: d<=15?'H1':'H2', isDishesBonus: true });
        }
      });
    }
    shifts.sort((a,b)=> a.date.localeCompare(b.date));
    const h1Total = shifts.filter(s=>s.half==='H1').reduce((sum,s)=>sum+s.pay,0);
    const h2Total = shifts.filter(s=>s.half==='H2').reduce((sum,s)=>sum+s.pay,0);
    return `
      <div class="analytics-header">
        <h3 style="text-transform:capitalize;">${escapeHtml(monthLabel)}</h3>
        <div class="nav-btns">
          <button class="nav-btn" id="an-prev">‹</button>
          <button class="nav-btn" id="an-next">›</button>
        </div>
      </div>
      <div class="analytics-section">
        <h4>Моя зарплата: ${formatMoney(myTotal)}</h4>
        ${shifts.length === 0 ? `<div style="color:var(--ink-soft);font-size:13px;">${state.events.length>=0 && Object.values(state.hostessShifts).some(d=>Object.values(d).some(e=>e&&norm(e.name)===norm(myName))) ? 'В этом месяце пока нет смен.' : `Ваше имя «${escapeHtml(myName)}» пока ни разу не встречалось в графике смен. Возможно, оно записано чуть иначе — сверьтесь с администратором.`}</div>` : `
          <div style="display:flex;gap:16px;margin-bottom:10px;font-size:12.5px;">
            <div><b>1–15 число:</b> ${formatMoney(h1Total)}</div>
            <div><b>16 – конец:</b> ${formatMoney(h2Total)}</div>
          </div>
          ${['H1','H2'].map(half=>{
            const halfShifts = shifts.filter(s=>s.half===half);
            if(halfShifts.length === 0) return '';
            const halfLabel = half==='H1' ? '1–15 число' : '16 – конец месяца';
            return `
            <div style="margin-bottom:12px;">
              <div style="font-size:12px;font-weight:600;margin-bottom:6px;">${halfLabel}</div>
              ${halfShifts.map(s=>`
                <div class="stat-row" style="margin-bottom:5px;">
                  <div class="stat-label" style="width:170px;">${formatDateText(s.date)}</div>
                  <div style="flex:1;font-size:12.5px;">${s.isDishesBonus ? '🍽 бонус за посуду' : `смена ${s.start}–${s.end}`}</div>
                  <div style="font-family:var(--font-mono);font-size:12.5px;">${formatMoney(s.pay)}</div>
                </div>
              `).join('')}
            </div>
          `;}).join('')}
        `}
      </div>
    `;
  }

  const WEEKDAYS_SHORT = ['вс','пн','вт','ср','чт','пт','сб'];
  function renderAutoBackupList(){
    const meta = state.autoBackupMeta || {};
    const today = new Date().getDay();
    // показываем последние 7 дней по порядку от сегодня назад
    const order = [];
    for(let i=0;i<7;i++) order.push((today - i + 7) % 7);
    const rows = order.map(dow=>{
      const ts = meta[dow];
      const label = WEEKDAYS_SHORT[dow];
      if(!ts) return `<div class="stat-row"><div class="stat-label" style="color:var(--ink-soft);">${label}</div><div style="flex:1;font-size:12px;color:var(--ink-soft);">пока нет копии</div></div>`;
      const d = new Date(ts);
      const dateLabel = isNaN(d.getTime()) ? ts : d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
      return `<div class="stat-row"><div class="stat-label">${label} · ${escapeHtml(dateLabel)}</div><button type="button" class="btn btn-ghost btn-dl-auto-backup" data-dow="${dow}" style="font-size:11.5px;padding:4px 10px;">Скачать</button></div>`;
    });
    return rows.join('');
  }

  function attachExportModalEvents(overlay){

      downloadFile(`raspisanie-${todayStr()}.json`, buildJsonExport(), 'application/json');
    };
    overlay.querySelectorAll('.btn-dl-auto-backup').forEach(btn=>{
      btn.onclick = async ()=>{
        const dow = btn.dataset.dow;
        const originalText = btn.textContent;
        btn.textContent = 'Загрузка…'; btn.disabled = true;
        try{
          const res = await window.storage.get(`auto-backup-${dow}`, true);
          if(res && res.value){
            downloadFile(`raspisanie-avtobekap-${WEEKDAYS_SHORT[dow]}.json`, res.value, 'application/json');
          } else {
            showGapWarningBanner('Копия за этот день ещё не сохранена.');
          }
        }catch(e){
          showGapWarningBanner('Не получилось скачать копию — попробуйте ещё раз.');
        }
        btn.textContent = originalText; btn.disabled = false;
      };

    if(pushThresholdBtn) pushThresholdBtn.onclick = async ()=>{
      const val = Number(overlay.querySelector('#push-threshold-input').value) || 0;

      await storageSetWithRetry('push-refund-threshold', String(val));
      recordAction('Порог push-уведомления о возврате изменён', `${formatMoney(val)}`);

      downloadFile(`konversia-${todayStr()}.csv`, buildLeadsCsv(), 'text/csv;charset=utf-8');

      downloadFile(`dohody-${todayStr()}.csv`, buildIncomesCsv(), 'text/csv;charset=utf-8');

    overlay.querySelector('#btn-dl-csv-expenses').onclick = ()=>{
      downloadFile(`rashody-${todayStr()}.csv`, buildExpensesCsv(), 'text/csv;charset=utf-8');
    };
    overlay.querySelector('#btn-dl-csv').onclick = ()=>{
      downloadFile(`raspisanie-${todayStr()}.csv`, buildCsv(), 'text/csv;charset=utf-8');
    };

    const archiveBtn = overlay.querySelector('#btn-do-archive');
    const archiveStatusEl = overlay.querySelector('#archive-status');
    if(archiveBtn){
      archiveBtn.onclick = ()=>{
        const cutoff = overlay.querySelector('#archive-before-date').value;
        if(!cutoff){
          archiveStatusEl.textContent = 'Укажите дату.';
          archiveStatusEl.style.color = 'var(--danger)';
          return;
        }
        const toArchive = state.events.filter(e=> e.date && e.date < cutoff);
        if(toArchive.length === 0){
          archiveStatusEl.textContent = 'Нет мероприятий раньше этой даты — архивировать нечего.';
          archiveStatusEl.style.color = 'var(--ink-soft)';
          return;
        }
        requireAdminUnlock(async ()=>{
          downloadFile(
            `arhiv-meropriyatiy-do-${cutoff}.json`,
            JSON.stringify({ exportedAt: new Date().toISOString(), archivedBefore: cutoff, events: toArchive }, null, 2),
            'application/json'
          );
          state.events = state.events.filter(e=> !(e.date && e.date < cutoff));
          await saveEvents();
          state.modal = null;
          render();
          showGapWarningBanner(`В архив выгружено и убрано из расписания: ${toArchive.length} мероприятий (до ${formatDateText(cutoff)}).`);
        });
      };
    }

    const fileInput = overlay.querySelector('#f-import');
    const statusEl = overlay.querySelector('#import-status');
    const importBtn = overlay.querySelector('#btn-do-import');

    fileInput.onchange = ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          const KNOWN_FIELDS = ['spaces','events','certificates','refunds','leads','incomes','expenses','eventTypes','hostsList','materialsCatalog','itemSales','orders','salaryAdjustments','masterPayRates','masterPayOverrides','monthlyPlans','hostessShifts','managerShifts','netProfitManual','yearSummaryManual','auditLog','closedMonths','marketingSpend','marketingPlans','contentPosts','suppliers','stockReceipts','daysOff'];
          const hasAnyKnownField = KNOWN_FIELDS.some(f => data[f] !== undefined);
          if(!hasAnyKnownField) throw new Error('bad shape');
          pendingImportData = data;
          const parts = [];
          if(Array.isArray(data.spaces)) parts.push(`${data.spaces.length} пространств`);
          if(Array.isArray(data.events)) parts.push(`${data.events.length} мероприятий`);
          if(Array.isArray(data.certificates)) parts.push(`${data.certificates.length} сертификатов`);
          if(Array.isArray(data.refunds)) parts.push(`${data.refunds.length} возвратов`);
          if(Array.isArray(data.leads)) parts.push(`${data.leads.length} заявок`);
          if(Array.isArray(data.incomes)) parts.push(`${data.incomes.length} доходов`);
          if(Array.isArray(data.expenses)) parts.push(`${data.expenses.length} расходов`);
          if(Array.isArray(data.hostsList)) parts.push(`${data.hostsList.length} мастеров`);
          if(Array.isArray(data.materialsCatalog)) parts.push(`${data.materialsCatalog.length} материалов в "Себес"`);
          if(Array.isArray(data.itemSales)) parts.push(`${data.itemSales.length} продаж изделий`);
          if(Array.isArray(data.orders)) parts.push(`${data.orders.length} заказов`);
          if(Array.isArray(data.salaryAdjustments)) parts.push(`${data.salaryAdjustments.length} корректировок ЗП`);
          if(Array.isArray(data.suppliers)) parts.push(`${data.suppliers.length} поставщиков`);
          if(Array.isArray(data.stockReceipts)) parts.push(`${data.stockReceipts.length} приходов на склад`);
          if(Array.isArray(data.daysOff)) parts.push(`${data.daysOff.length} отметок о выходных`);
          statusEl.textContent = `Файл прочитан: ${parts.join(', ')}. Дата экспорта: ${data.exportedAt ? new Date(data.exportedAt).toLocaleString('ru-RU') : '—'}`;
          statusEl.style.color = 'var(--ink-soft)';
          importBtn.style.display = 'inline-block';
        }catch(e){
          pendingImportData = null;
          statusEl.textContent = 'Не удалось прочитать файл — это не корректный JSON-экспорт этого приложения.';
          statusEl.style.color = 'var(--danger)';
          importBtn.style.display = 'none';
        }
      };
      reader.readAsText(file);
    };

    importBtn.onclick = ()=>{
      if(!pendingImportData) return;
      requireAdminUnlock(async ()=>{
        if(Array.isArray(pendingImportData.spaces)){ state.spaces = pendingImportData.spaces; await saveSpaces(); }
        if(Array.isArray(pendingImportData.events)){ state.events = pendingImportData.events; await saveEvents(); }
        if(Array.isArray(pendingImportData.certificates)){ state.certificates = pendingImportData.certificates; await saveCertificates(); }
        if(Array.isArray(pendingImportData.refunds)){ state.refunds = pendingImportData.refunds; await saveRefunds(); }
        if(Array.isArray(pendingImportData.leads)){ state.leads = pendingImportData.leads; await saveLeads(); }
        if(Array.isArray(pendingImportData.incomes)){ state.incomes = pendingImportData.incomes; await saveIncomes(); }
        if(Array.isArray(pendingImportData.expenses)){ state.expenses = pendingImportData.expenses; await saveExpenses(); }
        if(Array.isArray(pendingImportData.eventTypes)){ state.eventTypes = pendingImportData.eventTypes; await saveEventTypes(); }
        if(Array.isArray(pendingImportData.hostsList)){ state.hostsList = pendingImportData.hostsList; await saveHostsList(); }
        if(Array.isArray(pendingImportData.materialsCatalog)){ state.materialsCatalog = pendingImportData.materialsCatalog; await saveMaterialsCatalog(); }
        if(Array.isArray(pendingImportData.itemSales)){ state.itemSales = pendingImportData.itemSales; await saveItemSales(); }
        if(Array.isArray(pendingImportData.orders)){ state.orders = pendingImportData.orders; await saveOrders(); }
        if(Array.isArray(pendingImportData.salaryAdjustments)){ state.salaryAdjustments = pendingImportData.salaryAdjustments; await saveSalaryAdjustments(); }
        if(pendingImportData.masterPayRates){ state.masterPayRates = pendingImportData.masterPayRates; await saveMasterPayRates(); }
        if(pendingImportData.masterPayOverrides){ state.masterPayOverrides = pendingImportData.masterPayOverrides; await saveMasterPayOverrides(); }
        if(pendingImportData.monthlyPlans){ state.monthlyPlans = pendingImportData.monthlyPlans; await saveMonthlyPlans(); }
        if(pendingImportData.hostessShifts){ state.hostessShifts = pendingImportData.hostessShifts; await saveHostessShifts(); }
        if(pendingImportData.managerShifts){ state.managerShifts = pendingImportData.managerShifts; await saveManagerShifts(); }
        if(pendingImportData.netProfitManual){ state.netProfitManual = pendingImportData.netProfitManual; await saveNetProfitManual(); }
        if(pendingImportData.yearSummaryManual){ state.yearSummaryManual = pendingImportData.yearSummaryManual; await saveYearSummaryManual(); }
        if(Array.isArray(pendingImportData.auditLog)){ state.auditLog = pendingImportData.auditLog; await saveAuditLog(); }
        if(Array.isArray(pendingImportData.closedMonths)){ state.closedMonths = pendingImportData.closedMonths; await saveClosedMonths(); }
        if(Array.isArray(pendingImportData.marketingSpend)){ state.marketingSpend = pendingImportData.marketingSpend; await saveMarketingSpend(); }
        if(pendingImportData.marketingPlans){ state.marketingPlans = pendingImportData.marketingPlans; await saveMarketingPlans(); }
        if(Array.isArray(pendingImportData.contentPosts)){ state.contentPosts = pendingImportData.contentPosts; await saveContentPosts(); }
        if(Array.isArray(pendingImportData.suppliers)){ state.suppliers = pendingImportData.suppliers; await saveSuppliers(); }
        if(Array.isArray(pendingImportData.stockReceipts)){ state.stockReceipts = pendingImportData.stockReceipts; await saveStockReceipts(); }
        if(Array.isArray(pendingImportData.daysOff)){ state.daysOff = pendingImportData.daysOff; await saveDaysOff(); }
        pendingImportData = null;
        recordAction('Данные восстановлены');
        state.modal = null;
        render();
      });
    };
  }

  function attachQuickShiftModalEvents(overlay){
    const { shiftDate, shiftKey } = state.modal;
    const shiftDef = SHIFT_DEFS.find(s=>s.key===shiftKey);
    const selectEl = overlay.querySelector('#shift-name-select');
    const customField = overlay.querySelector('#shift-custom-field');
    const startInput = overlay.querySelector('#shift-actual-start');
    const endInput = overlay.querySelector('#shift-actual-end');
    const previewEl = overlay.querySelector('#shift-extra-preview');

    selectEl.onchange = ()=>{
      customField.style.display = (selectEl.value === '__custom__') ? 'block' : 'none';
    };

    const updatePreview = ()=>{
      const extra = shiftExtraHours({ start: startInput.value, end: endInput.value }, shiftDef);
      previewEl.textContent = extra > 0
        ? `+${extra%1===0?extra:extra.toFixed(1)} ч сверх нормы → доплата ${formatMoney(extra*HOSTESS_EXTRA_HOUR_RATE)}`
        : '';
    };
    startInput.addEventListener('input', updatePreview);
    endInput.addEventListener('input', updatePreview);
    updatePreview();

    overlay.querySelector('#shift-cancel').onclick = ()=>{
      overlay.remove();
      state.modal = {type:'day', date: shiftDate};
      render();
    };
    overlay.querySelector('#shift-save').onclick = async ()=>{
      let name = selectEl.value;
      if(name === '__custom__'){
        name = overlay.querySelector('#shift-name-custom').value.trim();
      }
      if(!state.hostessShifts[shiftDate]) state.hostessShifts[shiftDate] = {};
      if(name){
        state.hostessShifts[shiftDate][shiftKey] = { name, start: startInput.value || shiftDef.start, end: endInput.value || shiftDef.end };
      } else {
        delete state.hostessShifts[shiftDate][shiftKey];
      }
      await saveHostessShifts();
      recordAction('Смена сохранена');
      overlay.remove();
      state.modal = {type:'day', date: shiftDate};
      render();
    };
  }

  function attachQuickReportModalEvents(overlay){
    overlay.querySelector('#qr-cancel').onclick = ()=>{ state.modal = null; overlay.remove(); };

    const ratingHidden = overlay.querySelector('#qr-rating');
    const commentHint = overlay.querySelector('#qr-comment-hint');
    overlay.querySelectorAll('.rating-btn').forEach(btn=>{
      btn.onclick = ()=>{
        overlay.querySelectorAll('.rating-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        ratingHidden.value = btn.dataset.rating;
        if(commentHint) commentHint.textContent = (Number(btn.dataset.rating) < 5) ? '— обязательно, если оценка ниже 5' : '— необязательно';
      };
    });

    overlay.querySelector('#qr-save').onclick = async ()=>{
      ['qr-source','qr-professions','qr-rating-comment'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const sourceVal = overlay.querySelector('#qr-source').value.trim();
      const professionsVal = overlay.querySelector('#qr-professions').value.trim();
      const uniqueVal = overlay.querySelector('#qr-unique').value.trim();
      const ratingVal = ratingHidden.value ? parseInt(ratingHidden.value) : null;
      const ratingCommentVal = overlay.querySelector('#qr-rating-comment').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!sourceVal) markInvalid('qr-source');
      if(!professionsVal) markInvalid('qr-professions');
      let ratingMissing = false, commentMissing = false;
      if(!ratingVal){ ratingMissing = true; }
      if(ratingVal && ratingVal < 5 && !ratingCommentVal){ commentMissing = true; markInvalid('qr-rating-comment'); }

      if(!sourceVal || !professionsVal || ratingMissing || commentMissing){
        showGapWarningBanner(ratingMissing ? 'Поставьте оценку от 1 до 5.' : 'Заполните все обязательные поля отчёта.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const report = { source: sourceVal, professions: professionsVal, unique: uniqueVal, rating: ratingVal, ratingComment: ratingCommentVal };
      const idx = state.events.findIndex(x=>x.id===state.modal.event.id);
      if(idx>=0){
        state.events[idx] = {...state.events[idx], masterReport: report};
        await saveEvents();
      }
      recordAction("Отчёт мастера сохранён");
      state.modal = null; overlay.remove(); render();
    };
  }

  function attachQuickHostModalEvents(overlay){
    overlay.querySelector('#qh-cancel').onclick = ()=>{ state.modal = null; overlay.remove(); };
    const input = overlay.querySelector('#qh-host');
    const save = async ()=>{
      const ev = state.modal.event;
      const hostVal = input.value.trim();
      if(hostVal){
        const newStart = timeToMinutes(ev.time);
        const newEnd = newStart + (Number(ev.duration)||0);
        const conflict = state.events.find(e=>{
          if(e.id === ev.id) return false;
          if((e.host||'').trim().toLowerCase() !== hostVal.toLowerCase()) return false;
          if(e.date !== ev.date) return false;
          const s = timeToMinutes(e.time);
          const en = s + (Number(e.duration)||0);
          return newStart < en && s < newEnd;
        });
        if(conflict){
          const csp = getSpace(conflict.spaceId);
          const conflictEnd = timeToMinutes(conflict.time) + (Number(conflict.duration)||0);
          const endH = String(Math.floor(conflictEnd/60)).padStart(2,'0');
          const endM = String(conflictEnd%60).padStart(2,'0');
          showHostConflictPopup(
            `<b>${escapeHtml(hostVal)}</b> уже занят(а) в это время — ведёт «${escapeHtml(conflict.title)}» с ${conflict.time} до ${endH}:${endM} в пространстве «${escapeHtml(csp.name)}» (${formatDateText(ev.date)}).<br><br>Выберите другого мастера.`
          );
          return;
        }
      }
      const idx = state.events.findIndex(x=>x.id===ev.id);
      if(idx>=0){
        state.events[idx] = {...state.events[idx], host: hostVal};
        await saveEvents();
      }
      recordAction("Ведущий изменён");
      state.modal = null; overlay.remove(); render();
    };
    overlay.querySelector('#qh-save').onclick = save;
    input.onkeydown = (e)=>{ if(e.key==='Enter') save(); };
  }

  function syncDraftFromInputs(overlay){
    overlay.querySelectorAll('.et-row').forEach(row=>{
      const i = parseInt(row.dataset.idx);
      const name = row.querySelector('.et-name').value;
      const duration = parseInt(row.querySelector('.et-duration').value) || 0;
      const materialRules = [];
      row.querySelectorAll('.rule-list [data-rule-idx]').forEach(ruleRow=>{
        const ruleName = ruleRow.querySelector('.mr-name').value;
        const activePolicyBtn = ruleRow.querySelector('.mr-policy-opt.active');
        const policy = activePolicyBtn ? activePolicyBtn.dataset.policy : 'studio';
        const rateRaw = ruleRow.querySelector('.mr-rate').value;
        const ratePerGuest = rateRaw !== '' ? parseInt(rateRaw) : null;
        const payeeMaster = ruleRow.querySelector('.mr-payee').value.trim();
        materialRules.push({name: ruleName, policy, ratePerGuest, payeeMaster});
      });
      if(draftEventTypes[i]) draftEventTypes[i] = {name, duration, materialRules};
    });
  }

  function refreshEventTypesModal(overlay){

  function attachEventTypesModalEvents(overlay){
    const searchInput = overlay.querySelector('#et-search');
    if(searchInput){
      searchInput.addEventListener('input', ()=>{
        const q = searchInput.value.trim().toLowerCase();
        let anyVisible = false;
        overlay.querySelectorAll('.et-row').forEach(row=>{
          const match = !q || row.dataset.typeName.includes(q);
          row.style.display = match ? '' : 'none';
          if(match) anyVisible = true;
        });
        const noResults = overlay.querySelector('#et-no-results');
        if(noResults) noResults.style.display = (q && !anyVisible) ? 'block' : 'none';
      });
    }
    overlay.querySelectorAll('.et-del').forEach(btn=>{
      btn.onclick = ()=>{
        syncDraftFromInputs(overlay);
        draftEventTypes.splice(parseInt(btn.dataset.idx), 1);
        refreshEventTypesModal(overlay);
      };
    });
    overlay.querySelectorAll('.add-material-rule-btn').forEach(btn=>{
      btn.onclick = ()=>{
        syncDraftFromInputs(overlay);
        const typeIdx = parseInt(btn.dataset.typeIdx);
        if(!draftEventTypes[typeIdx].materialRules) draftEventTypes[typeIdx].materialRules = [];
        draftEventTypes[typeIdx].materialRules.push({name:'', policy:'studio', ratePerGuest:null, payeeMaster:''});
        refreshEventTypesModal(overlay);
      };
    });
    overlay.querySelectorAll('.mr-del').forEach(btn=>{
      btn.onclick = ()=>{
        syncDraftFromInputs(overlay);
        const ruleRow = btn.closest('[data-rule-idx]');
        const ruleList = btn.closest('.rule-list');
        const typeIdx = parseInt(ruleList.dataset.typeIdx);
        const ruleIdx = parseInt(ruleRow.dataset.ruleIdx);
        draftEventTypes[typeIdx].materialRules.splice(ruleIdx, 1);
        refreshEventTypesModal(overlay);
      };
    });
    overlay.querySelectorAll('.mr-policy-opt').forEach(btn=>{
      btn.onclick = ()=>{
        syncDraftFromInputs(overlay);
        const ruleRow = btn.closest('[data-rule-idx]');
        const ruleList = btn.closest('.rule-list');
        const typeIdx = parseInt(ruleList.dataset.typeIdx);
        const ruleIdx = parseInt(ruleRow.dataset.ruleIdx);
        draftEventTypes[typeIdx].materialRules[ruleIdx].policy = btn.dataset.policy;
        refreshEventTypesModal(overlay);
      };
    });
    const addBtn = overlay.querySelector('#et-add');
    if(addBtn) addBtn.onclick = ()=>{
      syncDraftFromInputs(overlay);
      draftEventTypes.push({name:'', duration:120, materialRules:[]});
      refreshEventTypesModal(overlay);
    };
    overlay.querySelector('#et-cancel').onclick = ()=>{
      draftEventTypes = null; state.modal = null; overlay.remove();
    };
    overlay.querySelector('#et-save').onclick = ()=>{
      syncDraftFromInputs(overlay);
      const cleaned = draftEventTypes
        .map(t=>({
          name: (t.name||'').trim(),
          duration: t.duration||120,
          materialRules: (t.materialRules||[])
            .map(r=>({
              name: (r.name||'').trim(),
              policy: r.policy==='master'?'master':'studio',
              ratePerGuest: (r.ratePerGuest!==undefined&&r.ratePerGuest!==null)?r.ratePerGuest:null,
              payeeMaster: r.policy==='master'?(r.payeeMaster||'').trim():'',
            }))
            .filter(r=>r.name),
        }))
        .filter(t=>t.name);
      overlay.remove();
      requireAdminUnlock(async ()=>{
        state.eventTypes = cleaned;
        await saveEventTypes();

        // цена для статей с политикой "Студия" синхронизируется в справочник "Себес" — чтобы не настраивать себестоимость в двух местах
        let catalogChanged = false;
        cleaned.forEach(t=>{
          (t.materialRules||[]).forEach(r=>{
            if(r.policy === 'studio' && r.ratePerGuest !== null && r.ratePerGuest > 0){
              const existing = state.materialsCatalog.find(m=>m.name.trim().toLowerCase()===r.name.trim().toLowerCase());
              if(existing){
                if(existing.cost !== r.ratePerGuest){ existing.cost = r.ratePerGuest; catalogChanged = true; }
              } else {
                state.materialsCatalog.push({ name: r.name, cost: r.ratePerGuest, trackStock: false, unit: '', stock: 0 });
                catalogChanged = true;
              }
            }
          });
        });
        if(catalogChanged) await saveMaterialsCatalog();

        draftEventTypes = null;
        recordAction("Виды мероприятий сохранены");
        state.modal = null;
        render();
      });
    };
