  function attachContentPostModalEvents(overlay){
    const dateInput = overlay.querySelector('#cp-date');
    const weekdayHint = overlay.querySelector('#cp-weekday-hint');
    if(dateInput && weekdayHint){
      dateInput.addEventListener('input', ()=>{
        weekdayHint.textContent = dateInput.value ? weekdayFromDate(dateInput.value) : '';
      });
    }

    overlay.querySelector('#btn-cancel-content-post').onclick = ()=>{ state.modal = null; overlay.remove(); };

    overlay.querySelector('#btn-save-content-post').onclick = async ()=>{
      const dateVal = overlay.querySelector('#cp-date').value;
      const socialVals = [...overlay.querySelectorAll('.cp-social-check:checked')].map(el=>el.value);
      const productVal = overlay.querySelector('#cp-product').value;
      const directionVal = overlay.querySelector('#cp-direction').value;
      const descriptionVal = overlay.querySelector('#cp-description').value.trim();
      const linkVal = overlay.querySelector('#cp-link').value.trim();

      if(state.currentRole !== 'owner'){
        const ymCheck = dateVal ? dateVal.slice(0,7) : null;
        const origYm = (state.modal.contentPost.date) ? state.modal.contentPost.date.slice(0,7) : null;
        const blockedYm = [ymCheck, origYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      overlay.querySelectorAll('#cp-date,#cp-description').forEach(el=>el.style.borderColor='');
      if(!dateVal) markInvalid('cp-date');
      if(!descriptionVal) markInvalid('cp-description');
      if(!dateVal || !descriptionVal || socialVals.length===0){
        showGapWarningBanner(socialVals.length===0 ? 'Отметьте хотя бы одну соцсеть.' : 'Заполните дату и описание поста.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const updated = {
        id: state.modal.contentPost.id,
        date: dateVal, socialNetworks: socialVals, product: productVal, direction: directionVal,
        description: descriptionVal, link: linkVal,
      };
      const idx = state.contentPosts.findIndex(x=>x.id===updated.id);
      if(idx>=0) state.contentPosts[idx] = updated; else state.contentPosts.push(updated);
      await saveContentPosts();
      recordAction('Пост в контент-плане сохранён');
      state.modal = null; overlay.remove(); render();
    };

    const delBtn = overlay.querySelector('#btn-del-content-post');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.contentPost.date ? state.modal.contentPost.date.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      showConfirmDeletePopup('Удалить этот пост из контент-плана? Действие необратимо.', async ()=>{
        state.contentPosts = state.contentPosts.filter(x=>x.id !== state.modal.contentPost.id);
        await saveContentPosts();
        state.modal = null; render();
      });
    };
  }

  function renderCertificatesView(){
    // администратор (роль "hostess") видит здесь только "Сертификаты" и "Изделия" — то, что он сам продаёт;
    // остальные вкладки (корректировки ЗП, возвраты, конверсия, заказы, выдача) остаются только у менеджеров и выше
    const isHostessLimited = state.currentRole === 'hostess';
    // старший администратор (роль "admin") видит почти всё как менеджер, кроме "Возвраты" и "Конверсия" —
    // это финансово-аналитические вкладки, доступ к которым для него закрыт по просьбе владелицы
    const isAdminNoRefundsConversion = state.currentRole === 'admin';
    const hideRefundsConversion = isHostessLimited || isAdminNoRefundsConversion;
    if(isHostessLimited && !['certificates','item-sales'].includes(state.certView)){
      state.certView = 'certificates';
    }
    if(isAdminNoRefundsConversion && ['refunds','conversion'].includes(state.certView)){
      state.certView = 'certificates';
    }
    const subTabsHtml = `
      <div class="cert-subtabs">
        <button data-certview="certificates" class="${state.certView==='certificates'?'active':''}">Сертификаты</button>
        ${!isHostessLimited ? `<button data-certview="salary-adj" class="${state.certView==='salary-adj'?'active':''}">Корректировки ЗП</button>` : ''}
        ${!isHostessLimited ? `<button data-certview="manager-salary" class="${state.certView==='manager-salary'?'active':''}">ЗП менеджеров</button>` : ''}
        ${!hideRefundsConversion ? `<button data-certview="refunds" class="${state.certView==='refunds'?'active':''}">Возвраты</button>` : ''}
        ${!hideRefundsConversion ? `<button data-certview="conversion" class="${state.certView==='conversion'?'active':''}">Конверсия</button>` : ''}
        <button data-certview="item-sales" class="${state.certView==='item-sales'?'active':''}">Изделия</button>
        ${!isHostessLimited ? `<button data-certview="orders" class="${state.certView==='orders'?'active':''}">Заказ</button>` : ''}
        ${!isHostessLimited ? `<button data-certview="pickups" class="${state.certView==='pickups'?'active':''}">Выдача</button>` : ''}
      </div>
    `;
    if(state.certView === 'refunds'){
      return subTabsHtml + renderRefundsView();
    }
    if(state.certView === 'conversion'){
      return subTabsHtml + renderConversionView();
    }
    if(state.certView === 'item-sales'){
      return subTabsHtml + renderItemSalesView();
    }
    if(state.certView === 'orders'){
      return subTabsHtml + renderOrdersView();
    }
    if(state.certView === 'pickups'){
      return subTabsHtml + renderPickupsView();
    }
    if(state.certView === 'salary-adj'){
      return subTabsHtml + renderSalaryAdjustmentsView();
    }
    if(state.certView === 'manager-salary'){
      return subTabsHtml + renderManagerSalaryView();
    }
    return subTabsHtml + renderCertificatesListView();
  }

  function renderCertificatesListView(){
    if(state.certExpandedGroups.size === 0 && state.certificates.length > 0){
      state.certExpandedGroups.add('y:' + todayStr().slice(0,4));
    }
    // сводка по месяцам (на основе даты продажи) — продажи и маркетинг считаются раздельно
    const salesTotals = {};
    const marketingTotals = {};
    state.certificates.forEach(c=>{
      if(!c.saleDate) return;
      const ym = c.saleDate.slice(0,7); // YYYY-MM
      const amt = (c.amount!==undefined && c.amount!==null && !isNaN(c.amount)) ? Number(c.amount) : 0;
      if(c.purpose === 'marketing'){ marketingTotals[ym] = (marketingTotals[ym]||0) + amt; }
      else { salesTotals[ym] = (salesTotals[ym]||0) + amt; }
    });
    const allMonths = Array.from(new Set([...Object.keys(salesTotals), ...Object.keys(marketingTotals)])).sort((a,b)=> b.localeCompare(a));
    const summaryByYear = {};
    allMonths.forEach(ym=>{
      const year = ym.slice(0,4);
      summaryByYear[year] = summaryByYear[year] || [];
      summaryByYear[year].push(ym);
    });
    const summaryYears = Object.keys(summaryByYear).sort((a,b)=> b.localeCompare(a));
    if(!state.certSummaryExpandedYears) state.certSummaryExpandedYears = new Set([todayStr().slice(0,4)]);
    const monthlyHtml = allMonths.length ? `
      <div class="analytics-section" style="margin-bottom:20px;">
        <h4>Сумма сертификатов по месяцам</h4>
        <div style="font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Сумма — только продажи; маркетинговые сертификаты в неё не входят и показаны отдельно.</div>
        ${summaryYears.map(year=>{
          const yearMonths = summaryByYear[year];
          const yearSales = yearMonths.reduce((s,ym)=> s + (salesTotals[ym]||0), 0);
          const yearMarketing = yearMonths.reduce((s,ym)=> s + (marketingTotals[ym]||0), 0);
          const expanded = state.certSummaryExpandedYears.has(year);
          return `
            <div class="cert-year-group">
              <div class="cert-group-header" data-certsummaryyear="${escapeHtml(year)}">
                <span>${expanded?'▾':'▸'} ${escapeHtml(year)}</span>
                <span style="font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);">${formatMoney(yearSales)}${yearMarketing>0?` · маркетинг: ${formatMoney(yearMarketing)}`:''}</span>
              </div>
              ${expanded ? yearMonths.map(ym=>{
                const [y,m] = ym.split('-').map(Number);
                const label = MONTHS[m-1];
                const sales = salesTotals[ym] || 0;
                const marketing = marketingTotals[ym] || 0;
                return `<div class="stat-row" style="padding:10px 14px 10px 28px;border-top:1px solid var(--line);">
                  <div class="stat-label" style="width:140px;text-transform:capitalize;">${label}</div>
                  <div style="flex:1;font-family:var(--font-mono);font-size:13px;">${formatMoney(sales)}${marketing>0?` <span style="color:var(--status-blue);">· маркетинг: ${formatMoney(marketing)}</span>`:''}</div>
                </div>`;
              }).join('') : ''}
            </div>
          `;
        }).join('')}
      </div>
    ` : '';

    const query = (state.certSearchQuery||'').trim();
    let certs = [...state.certificates].sort((a,b)=> (Number(b.number)||0) - (Number(a.number)||0));
    if(query){
      certs = certs.filter(c=> String(c.number).includes(query));
    }

    const printedCount = state.certificates.filter(c=>c.certType==='Печатный').length;
    const electronicCount = state.certificates.filter(c=>c.certType==='Электронный').length;

    function renderCertRow(c){
      return `
        <div class="cert-row" data-cid="${c.id}">
          <div class="num">№${escapeHtml(String(c.number))}</div>
          <div class="cell">${escapeHtml(c.channel||'')}</div>
          <div class="cell">${escapeHtml(c.certType||'')}${c.ownerName?'<br><span style="color:var(--ink-soft);font-size:11px;">👤 '+escapeHtml(c.ownerName)+'</span>':''}</div>
          <div class="cell">${c.saleDate ? formatDateText(c.saleDate) : ''}${(c.status==='used'||c.status==='partial')&&certSpentTotal(c)>0?'<br><span style="color:'+(certRemaining(c)>0?'var(--status-blue)':'var(--status-green)')+';font-size:11px;">ост. '+formatMoney(certRemaining(c))+'</span>':''}</div>
          <div class="amount">${c.amount!==undefined&&c.amount!==null ? formatMoney(c.amount) : ''}</div>
          <div><span class="cert-badge ${c.status||'in_progress'}">${CERT_STATUS_LABEL[c.status||'in_progress']}</span></div>
          <div class="comment">${c.purpose==='marketing'?'<span style="color:var(--status-blue);">📣 Маркетинг</span> · ':''}${c.certKind==='specific'?'🎯 '+escapeHtml(c.specificEventType||'МК')+(c.comment?' · ':''):''}${escapeHtml(c.comment||'')}</div>
        </div>
      `;
    }

    let listHtml;
    if(query){
      // при поиске — плоский список, без группировки, чтобы результат было видно сразу
      listHtml = certs.length === 0
        ? `<div class="host-empty">Ничего не найдено по номеру «${escapeHtml(query)}»</div>`
        : `<div class="cert-list">${certs.map(renderCertRow).join('')}</div>`;
    } else if(certs.length === 0){
      listHtml = `<div class="host-empty">Сертификатов пока нет</div>`;
    } else {
      // группировка по году -> месяцу, обе строки сворачиваемые
      const byYear = {};
      certs.forEach(c=>{
        const year = c.saleDate ? c.saleDate.slice(0,4) : 'без даты';
        const ym = c.saleDate ? c.saleDate.slice(0,7) : 'без даты';
        byYear[year] = byYear[year] || {};
        byYear[year][ym] = byYear[year][ym] || [];
        byYear[year][ym].push(c);
      });
      const years = Object.keys(byYear).sort((a,b)=> b==='без даты'?1 : a==='без даты'?-1 : b.localeCompare(a));
      listHtml = years.map(year=>{
        const monthGroups = byYear[year];
        const yearCerts = Object.values(monthGroups).flat();
        const yearTotal = yearCerts.reduce((s,c)=> s + ((c.amount!==undefined&&c.amount!==null&&!isNaN(c.amount))?Number(c.amount):0), 0);
        const yearExpanded = state.certExpandedGroups.has('y:'+year);
        const months = Object.keys(monthGroups).sort((a,b)=> b==='без даты'?1 : a==='без даты'?-1 : b.localeCompare(a));
        return `

            <div class="cert-group-header" data-certgroup="y:${escapeHtml(year)}">
              <span>${yearExpanded?'▾':'▸'} ${escapeHtml(year)}</span>

            </div>
            ${yearExpanded ? months.map(ym=>{
              const mCerts = monthGroups[ym];
              const mTotal = mCerts.reduce((s,c)=> s + ((c.amount!==undefined&&c.amount!==null&&!isNaN(c.amount))?Number(c.amount):0), 0);
              const mExpanded = state.certExpandedGroups.has('m:'+ym);

              return `
                <div class="cert-month-group">
                  <div class="cert-group-header cert-month-header" data-certgroup="m:${escapeHtml(ym)}">
                    <span>${mExpanded?'▾':'▸'} ${escapeHtml(mLabel)}</span>
                    <span style="font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);">${mCerts.length} шт. · ${formatMoney(mTotal)}</span>

            }).join('') : ''}
          </div>
        `;
      }).join('');
    }

    return `
      ${monthlyHtml}
      <div class="cert-toolbar">
        <div style="font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);">Всего: ${state.certificates.length} · В процессе: ${state.certificates.filter(c=>c.status!=='used').length} · Использовано: ${state.certificates.filter(c=>c.status==='used').length} · 🖨 Печатных: ${printedCount} · 💻 Электронных: ${electronicCount}</div>

        <input type="text" id="cert-search" value="${escapeHtml(query)}" placeholder="Поиск по номеру…" inputmode="numeric">
      </div>
      ${listHtml}
    `;
  }

  function renderConversionView(){
    const leads = [...state.leads].sort((a,b)=> (b.requestDate||'').localeCompare(a.requestDate||''));
    const total = state.leads.length;
    const soldCount = state.leads.filter(l=>l.sold).length;
    const conversionPct = total>0 ? Math.round(soldCount/total*100) : 0;
    const soldRevenue = state.leads.filter(l=>l.sold).reduce((s,l)=> s+((l.revenue!==undefined&&l.revenue!==null&&!isNaN(l.revenue))?Number(l.revenue):0), 0);
    const soldWithoutEventCount = state.leads.filter(l=>l.sold && !l.eventId).length;

    // средний срок продажи: сколько дней в среднем проходит от заявки до продажи
    const salesCycleDays = state.leads
      .filter(l=> l.sold && l.requestDate && l.saleDate)
      .map(l=> Math.round((parseDate(l.saleDate) - parseDate(l.requestDate)) / 86400000))
      .filter(d=> d >= 0);
    const avgSalesCycle = salesCycleDays.length ? Math.round(salesCycleDays.reduce((s,d)=>s+d,0) / salesCycleDays.length * 10) / 10 : null;

    function avgCycleDays(list){
      const days = list
        .filter(l=> l.sold && l.requestDate && l.saleDate)
        .map(l=> Math.round((parseDate(l.saleDate) - parseDate(l.requestDate)) / 86400000))
        .filter(d=> d >= 0);
      return days.length ? Math.round(days.reduce((s,d)=>s+d,0) / days.length * 10) / 10 : null;
    }
    function breakdown(keyFn, list){
      const map = {};
      list.forEach(l=>{
        const k = keyFn(l);
        if(!map[k]) map[k] = {total:0, sold:0, items:[]};
        map[k].total++;
        if(l.sold) map[k].sold++;
        map[k].items.push(l);
      });
      return Object.entries(map).map(([k,v])=>({name:k, total:v.total, sold:v.sold, pct: v.total>0?Math.round(v.sold/v.total*100):0, avgDays: avgCycleDays(v.items)}))
        .sort((a,b)=>b.total-a.total);
    }
    const bySource = breakdown(l=>l.source||'—', state.leads);
    const byProduct = breakdown(l=>l.product||'—', state.leads);
    const maxSourceTotal = Math.max(1, ...bySource.map(x=>x.total));
    const maxProductTotal = Math.max(1, ...byProduct.map(x=>x.total));

    const byMonthRaw = breakdown(l=> l.requestDate ? l.requestDate.slice(0,7) : 'Без даты', state.leads);
    const byMonth = byMonthRaw
      .map(x=>{
        if(x.name === 'Без даты') return {...x, label: 'Без даты'};
        const [y,m] = x.name.split('-').map(Number);
        return {...x, label: MONTHS[m-1].charAt(0).toUpperCase()+MONTHS[m-1].slice(1)+' '+y};
      })
      .sort((a,b)=> b.name.localeCompare(a.name));
    const maxMonthTotal = Math.max(1, ...byMonth.map(x=>x.total));

    // ежедневная конверсия по продажам
    const byDayRaw = breakdown(l=> l.requestDate || 'Без даты', state.leads);
    const byDay = byDayRaw
      .map(x=>{
        if(x.name === 'Без даты') return {...x, label: 'Без даты'};
        return {...x, label: `${formatDateText(x.name)}, ${weekdayFromDate(x.name)}`};
      })
      .sort((a,b)=> b.name.localeCompare(a.name));
    const maxDayTotal = Math.max(1, ...byDay.map(x=>x.total));

    // насколько заранее планируют: месяц мероприятия совпадает с текущим / это будущий месяц / неизвестно
    const currentMonthName = MONTHS[new Date().getMonth()].charAt(0).toUpperCase()+MONTHS[new Date().getMonth()].slice(1);
    const planningGroups = { 'На текущий месяц': 0, 'На будущий месяц': 0, 'Неизвестно': 0 };
    const planningSoldGroups = { 'На текущий месяц': 0, 'На будущий месяц': 0, 'Неизвестно': 0 };
    state.leads.forEach(l=>{
      let key;
      if(!l.eventMonth || l.eventMonth === 'Нет информации') key = 'Неизвестно';
      else if(l.eventMonth === currentMonthName) key = 'На текущий месяц';
      else key = 'На будущий месяц';
      planningGroups[key]++;
      if(l.sold) planningSoldGroups[key]++;
    });
    const planningList = Object.entries(planningGroups).map(([name,cnt])=>({
      name, total:cnt, sold: planningSoldGroups[name], pct: cnt>0?Math.round(planningSoldGroups[name]/cnt*100):0
    }));
    const maxPlanning = Math.max(1, ...planningList.map(x=>x.total));

    return `
      <div class="analytics-summary" style="margin-bottom:20px;">
        <div class="summary-card"><div class="num">${total}</div><div class="label">Всего заявок</div></div>
        <div class="summary-card"><div class="num" style="color:var(--status-green);">${soldCount}</div><div class="label">Продано</div></div>
        <div class="summary-card" style="border-left:4px solid var(--accent);"><div class="num">${conversionPct}%</div><div class="label">Конверсия</div></div>
        <div class="summary-card"><div class="num" style="font-size:20px;">${formatMoney(soldRevenue)}</div><div class="label">Выручка проданных</div></div>
        <div class="summary-card"><div class="num" style="font-size:20px;">${avgSalesCycle!==null?avgSalesCycle+' дн.':'—'}</div><div class="label">Средний срок продажи</div></div>
      </div>
      ${soldWithoutEventCount>0 ? `<div style="font-size:12.5px;color:var(--status-red);margin-bottom:16px;">⚠ ${soldWithoutEventCount} «проданных» заявок без привязки к мероприятию — откройте заявку и укажите, какое мероприятие создано.</div>` : ''}

      ${total>0 ? `
      <details style="margin-bottom:20px;">
        <summary style="cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);font-family:var(--font-mono);padding:6px 0;">📊 Детализация конверсии — по срокам, источникам и продуктам</summary>
        <div style="margin-top:10px;">
      <div class="analytics-section">
        <h4>Насколько заранее планируют мероприятие</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Сравнение поля «Месяц мероприятия» с текущим месяцем (${escapeHtml(currentMonthName)}).</div>
        ${planningList.map(x=>`
          <div class="stat-row">
            <div class="stat-label" style="width:140px;">${escapeHtml(x.name)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxPlanning*100)}%;background:${x.name==='Неизвестно'?'var(--ink-soft)':'var(--accent)'};"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.total}${x.total>0?' · продано '+x.sold+' ('+x.pct+'%)':''}</div>
          </div>
        `).join('')}
      </div>
      <div class="analytics-section">
        <h4>Заявки по месяцам</h4>
        ${byMonth.map(x=>`
          <div class="stat-row">
            <div class="stat-label" style="width:140px;text-transform:capitalize;">${escapeHtml(x.label)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxMonthTotal*100)}%;background:var(--ink);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.total} заявок · продано ${x.sold} (${x.pct}%)</div>
          </div>
        `).join('')}
      </div>
      <div class="analytics-section">
        <h4>Ежедневная конверсия</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">По дате заявки. Показывает, в какие дни приходят заявки и как они конвертируются в продажу.</div>
        ${byDay.map(x=>`
          <div class="stat-row">
            <div class="stat-label" style="width:170px;text-transform:capitalize;">${escapeHtml(x.label)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxDayTotal*100)}%;background:${x.pct>=50?'var(--status-green)':'var(--accent)'};"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.total} · продано ${x.sold} (${x.pct}%)</div>
          </div>
        `).join('')}
      </div>
      <div class="analytics-section">
        <h4>Конверсия по источникам</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Средний срок — от даты заявки до даты продажи, только по проданным с обеими датами.</div>
        ${bySource.map(x=>`
          <div class="stat-row">
            <div class="stat-label">${escapeHtml(x.name)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxSourceTotal*100)}%;background:var(--accent);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.sold}/${x.total} · ${x.pct}%${x.avgDays!==null?' · ~'+x.avgDays+' дн.':''}</div>
          </div>
        `).join('')}
      </div>
      <div class="analytics-section">
        <h4>Конверсия по продуктам</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Средний срок — от даты заявки до даты продажи, только по проданным с обеими датами.</div>
        ${byProduct.map(x=>`
          <div class="stat-row">
            <div class="stat-label">${escapeHtml(x.name)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxProductTotal*100)}%;background:var(--ink);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.sold}/${x.total} · ${x.pct}%${x.avgDays!==null?' · ~'+x.avgDays+' дн.':''}</div>
          </div>
        `).join('')}
      </div>
        </div>
      </details>
      ` : ''}

      <div class="cert-toolbar">
        <div style="font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);">Список заявок</div>
        <button class="btn btn-primary" id="btn-add-lead">+ Добавить заявку</button>
      </div>
      ${leads.length === 0 ? `<div class="host-empty">Заявок пока нет</div>` : `
        <div class="cert-list">
          ${leads.map(l=>`
            <div class="lead-row" data-lid="${l.id}">
              <div class="cell">${l.requestDate ? formatDateText(l.requestDate) : '—'}${l.contact?'<br><span style="color:var(--ink-soft);font-size:11px;">'+escapeHtml(l.contact)+'</span>':''}</div>

  function renderPickupsView(){
    // собираем все изделия на выдачу со всех мероприятий (смола, тафтинг)
    const allPickups = [];
    state.events.forEach(ev=>{
      (ev.pickupItems||[]).forEach((p,i)=>{
        allPickups.push({ ...p, eventId: ev.id, eventTitle: ev.title, eventDate: ev.date, spaceId: ev.spaceId, idx: i });
      });
    });

    const waiting = allPickups.filter(p=>p.status!=='picked_up').sort((a,b)=> (a.readyDate||'').localeCompare(b.readyDate||''));
    const pickedUp = allPickups.filter(p=>p.status==='picked_up').sort((a,b)=> (b.pickupDate||'').localeCompare(a.pickupDate||''));
    const today = todayStr();
    const overdueCount = waiting.filter(p=>p.readyDate && p.readyDate < today).length;

    function pickupRow(p, showPickupDate){
      const sp = getSpace(p.spaceId);
      const overdue = p.status!=='picked_up' && p.readyDate && p.readyDate < today;
      return `
        <div class="refund-row" data-pickup-event="${p.eventId}" data-pickup-idx="${p.idx}">
          <div class="cell">${p.readyDate ? formatDateText(p.readyDate) : '—'}${overdue?' <span style="color:var(--status-red);font-weight:600;">просрочено</span>':''}</div>
          <div class="cell">${escapeHtml(p.guestName||'без имени')}</div>
          <div class="cell">${escapeHtml(p.eventTitle||'')} ${spaceBadge(sp,'xs')} · ${formatDateText(p.eventDate)}</div>
          <div class="cell">${showPickupDate && p.pickupDate ? 'выдано '+formatDateText(p.pickupDate) : ''}</div>
          <div class="reason">${!showPickupDate ? `<button type="button" class="btn btn-ghost pickup-mark-btn" data-event="${p.eventId}" data-idx="${p.idx}" style="font-size:11.5px;padding:4px 10px;">Отметить выдано</button>` : ''}</div>
        </div>
      `;
    }

    return `
      <div class="analytics-summary" style="margin-bottom:20px;">
        <div class="summary-card"><div class="num">${waiting.length}</div><div class="label">Ожидают выдачи</div></div>
        <div class="summary-card" style="border-left:4px solid ${overdueCount>0?'var(--status-red)':'var(--status-green)'};"><div class="num" style="color:${overdueCount>0?'var(--status-red)':'var(--status-green)'};">${overdueCount}</div><div class="label">Просрочено</div></div>
        <div class="summary-card"><div class="num">${pickedUp.length}</div><div class="label">Уже выдано</div></div>
      </div>
      <div class="cert-toolbar">
        <div style="font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);">Изделия со «Смолы» и «Тафтинга» — добавляются внутри карточки мероприятия</div>
      </div>
      <div class="analytics-section">
        <h4 style="color:${overdueCount>0?'var(--status-red)':'inherit'};">Ожидают выдачи</h4>
        ${waiting.length ? `<div class="cert-list">${waiting.map(p=>pickupRow(p,false)).join('')}</div>` : `<div class="host-empty">Все изделия выданы</div>`}
      </div>
      ${pickedUp.length ? `
      <div class="analytics-section">
        <h4>Уже выдано</h4>
        <div class="cert-list">${pickedUp.slice(0,20).map(p=>pickupRow(p,true)).join('')}</div>
      </div>
      ` : ''}
    `;
  }

  function attachLeadModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-lead');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const dateInput = overlay.querySelector('#l-date');
    const weekdayHint = overlay.querySelector('#l-weekday-hint');
    if(dateInput && weekdayHint){
      dateInput.addEventListener('input', ()=>{ weekdayHint.textContent = weekdayFromDate(dateInput.value); });
    }

    overlay.querySelectorAll('[data-leadloc]').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('[data-leadloc]').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#l-location').value = opt.dataset.leadloc;
      };
    });

    const soldCheckbox = overlay.querySelector('#l-sold');
    const saleDateField = overlay.querySelector('#lead-saledate-field');
    const leadEventField = overlay.querySelector('#lead-event-field');
    if(soldCheckbox && saleDateField){
      soldCheckbox.addEventListener('change', ()=>{
        saleDateField.style.display = soldCheckbox.checked ? 'block' : 'none';
        if(leadEventField) leadEventField.style.display = soldCheckbox.checked ? 'block' : 'none';
        if(soldCheckbox.checked){
          const saleDateInput = overlay.querySelector('#l-sale-date');
          if(saleDateInput && !saleDateInput.value) saleDateInput.value = todayStr();
        }
      });
    }

    const leadEventOptions = eventSelectOptions();
    const leadLabelToId = {};
    leadEventOptions.forEach(o=>{ leadLabelToId[o.label] = o.id; });
    const leadEventSearchInput = overlay.querySelector('#l-event-search');
    const leadEventHidden = overlay.querySelector('#l-event');
    if(leadEventSearchInput && leadEventHidden){
      leadEventSearchInput.addEventListener('input', ()=>{
        const val = leadEventSearchInput.value.trim();
        if(val === ''){ leadEventHidden.value = ''; leadEventSearchInput.style.borderColor = ''; return; }
        if(leadLabelToId[val]){ leadEventHidden.value = leadLabelToId[val]; leadEventSearchInput.style.borderColor = ''; }
      });
      leadEventSearchInput.addEventListener('blur', ()=>{
        const val = leadEventSearchInput.value.trim();
        if(val !== '' && !leadLabelToId[val]){
          leadEventSearchInput.value = '';
          leadEventHidden.value = '';
        }
      });
    }

    const delBtn = overlay.querySelector('#btn-del-lead');
    if(delBtn) delBtn.onclick = ()=>{
      showConfirmDeletePopup('Удалить эту заявку? Действие необратимо.', async ()=>{
        state.leads = state.leads.filter(x=>x.id !== state.modal.lead.id);
        await saveLeads();
        state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-lead').onclick = async ()=>{
      ['l-date','l-contact','l-month','l-source','l-product','l-revenue','l-sale-date'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dateVal = overlay.querySelector('#l-date').value;
      const contactVal = overlay.querySelector('#l-contact').value.trim();
      const monthVal = overlay.querySelector('#l-month').value;
      const sourceVal = overlay.querySelector('#l-source').value;
      const productVal = overlay.querySelector('#l-product').value;
      const locationVal = overlay.querySelector('#l-location').value || 'in_studio';
      const revenueRaw = overlay.querySelector('#l-revenue').value;
      const soldVal = overlay.querySelector('#l-sold').checked;
      const saleDateVal = overlay.querySelector('#l-sale-date').value;
      const leadEventVal = overlay.querySelector('#l-event').value || '';

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!dateVal) markInvalid('l-date');
      if(!contactVal) markInvalid('l-contact');
      if(!monthVal) markInvalid('l-month');
      if(!sourceVal) markInvalid('l-source');
      if(!productVal) markInvalid('l-product');
      if(revenueRaw === '') markInvalid('l-revenue');
      const saleDateMissing = soldVal && !saleDateVal;
      if(saleDateMissing) markInvalid('l-sale-date');
      // заявка со статусом "Продано" обязательно должна быть привязана к мероприятию — иначе конверсию
      // потом невозможно сверить с реальным расписанием
      const leadEventMissing = soldVal && !leadEventVal;
      if(leadEventMissing) markInvalid('l-event-search');
      if(!dateVal || !contactVal || !monthVal || !sourceVal || !productVal || revenueRaw==='' || saleDateMissing || leadEventMissing){
        showGapWarningBanner(leadEventMissing ? 'Заявка отмечена как «Продано» — выберите мероприятие, которое из неё создано.' : saleDateMissing ? 'Заявка отмечена как «Продано» — укажите дату продажи.' : 'Заполните все поля перед сохранением заявки — включая номер/ник гостя.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const updated = {
        id: state.modal.lead.id,
        requestDate: dateVal,
        contact: contactVal,
        eventMonth: monthVal,
        source: sourceVal,
        product: productVal,
        location: locationVal,
        revenue: parseInt(revenueRaw),
        sold: soldVal,
        saleDate: soldVal ? saleDateVal : '',
        eventId: soldVal ? leadEventVal : '',
      };
      const idx = state.leads.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.leads[idx] = updated; else state.leads.push(updated);
      await saveLeads();
      recordAction("Заявка сохранена");
      state.modal = null; overlay.remove(); render();
    };
  }

  function attachItemSaleModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-itemsale');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const revenueInput = overlay.querySelector('#is-revenue');
    const previewEl = overlay.querySelector('#is-split-preview');
    const updatePreview = ()=>{
      const rev = parseInt(revenueInput.value) || 0;
      const masterShare = Math.round(rev * ITEM_SALE_MASTER_PCT / 100);
      const studioShare = rev - masterShare;
      previewEl.textContent = rev > 0 ? `Мастеру (${ITEM_SALE_MASTER_PCT}%): ${formatMoney(masterShare)} · Студии (${ITEM_SALE_STUDIO_PCT}%): ${formatMoney(studioShare)}` : '';
    };
    revenueInput.addEventListener('input', updatePreview);
    updatePreview();

    const delBtn = overlay.querySelector('#btn-del-itemsale');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.itemSale.date ? state.modal.itemSale.date.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      const cascadesToIncome = !!state.modal.itemSale.incomeId;
      showConfirmDeletePopup(`Удалить эту продажу изделия?${cascadesToIncome ? ' Связанный доход в «Книге» тоже удалится.' : ' Действие необратимо.'}`, async ()=>{
        const saleToDelete = state.modal.itemSale;
        state.itemSales = state.itemSales.filter(x=>x.id !== saleToDelete.id);
        if(saleToDelete.incomeId){
          state.incomes = state.incomes.filter(x=>x.id !== saleToDelete.incomeId);
          await saveIncomes();
        }
        await saveItemSales();
        state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-itemsale').onclick = async ()=>{
      if(state.currentRole !== 'owner'){
        const dateCheck = overlay.querySelector('#is-date').value;
        const ymCheck = dateCheck ? dateCheck.slice(0,7) : null;
        const origYm = (state.modal.itemSale && state.modal.itemSale.date) ? state.modal.itemSale.date.slice(0,7) : null;
        const blockedYm = [ymCheck, origYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      ['is-date','is-master','is-revenue'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dateVal = overlay.querySelector('#is-date').value;
      const masterVal = overlay.querySelector('#is-master').value.trim();
      const revenueRaw = overlay.querySelector('#is-revenue').value;
      const sourceVal = overlay.querySelector('#is-source').value;
      const commentVal = overlay.querySelector('#is-comment').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!dateVal) markInvalid('is-date');
      if(!masterVal) markInvalid('is-master');
      if(revenueRaw === '' || Number(revenueRaw) < 0) markInvalid('is-revenue');
      if(!dateVal || !masterVal || revenueRaw==='' || Number(revenueRaw)<0){
        showGapWarningBanner('Заполните все поля перед сохранением продажи. Сумма не может быть отрицательной.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const updated = {
        id: state.modal.itemSale.id,
        date: dateVal,
        masterName: masterVal,
        revenue: parseInt(revenueRaw),
        source: sourceVal,
        comment: commentVal,
        incomeId: state.modal.itemSale.incomeId || '',
      };

      // связка с "Книга → Доходы", чтобы продажа изделия сразу попадала в общую книгу с источником оплаты,
      // а не жила отдельно только в разделе "Изделия" (как раньше)
      const incomeEntry = {
        id: updated.incomeId || uid(), date: updated.date, operation: INCOME_OPERATIONS[0], product: 'Изделие',
        account: sourceVal, eventId: '', amount: updated.revenue, masterName: masterVal, masterShare: null,
        itemSaleId: updated.id, orderId: '', comment: updated.comment || `Продажа изделия — ${masterVal}`,
      };
      updated.incomeId = incomeEntry.id;
      const incIdx = state.incomes.findIndex(x=>x.id===incomeEntry.id);
      if(incIdx >= 0) state.incomes[incIdx] = incomeEntry; else state.incomes.push(incomeEntry);
      await saveIncomes();

      const idx = state.itemSales.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.itemSales[idx] = updated; else state.itemSales.push(updated);
      await saveItemSales();
      recordAction("Продажа изделия сохранена");
      state.modal = null; overlay.remove(); render();
    };
  }

      const dateVal = overlay.querySelector('#bulk-adj-date').value;
      const amountRaw = overlay.querySelector('#bulk-adj-amount').value;
      const commentVal = overlay.querySelector('#bulk-adj-comment').value.trim();
      const selectedNames = nameChecks.filter(c=>c.checked).map(c=>c.value);
      const hintEl = overlay.querySelector('#bulk-adj-hint');

      const amount = parseInt(amountRaw) || 0;
      if(!dateVal || amount <= 0 || !commentVal || selectedNames.length === 0){
        hintEl.style.color = 'var(--status-red)';
        hintEl.textContent = 'Заполните дату, сумму больше нуля, причину и отметьте хотя бы одного человека.';
        return;
      }

      selectedNames.forEach(name=>{
        state.salaryAdjustments.push({
          id: uid(), date: dateVal, masterName: name, amount: -amount, eventId: '', comment: commentVal,
        });
      });
      await saveSalaryAdjustments();
      recordAction(`Массовое удержание: ${formatMoney(amount)} с ${selectedNames.length} чел.`, commentVal);
      state.modal = null; overlay.remove(); render();
    };
  }

  function attachSalaryAdjModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-adj');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const eventOptions = eventSelectOptions();
    const labelToId = {};
    eventOptions.forEach(o=>{ labelToId[o.label] = o.id; });
    const eventSearchInput = overlay.querySelector('#adj-event-search');
    const eventHidden = overlay.querySelector('#adj-event');
    if(eventSearchInput && eventHidden){
      eventSearchInput.addEventListener('input', ()=>{
        const val = eventSearchInput.value.trim();
        if(val === ''){ eventHidden.value = ''; eventSearchInput.style.borderColor = ''; return; }
        if(labelToId[val]){ eventHidden.value = labelToId[val]; eventSearchInput.style.borderColor = ''; }
      });
      eventSearchInput.addEventListener('blur', ()=>{
        const val = eventSearchInput.value.trim();
        if(val !== '' && !labelToId[val]){
          eventSearchInput.value = '';
          eventHidden.value = '';
        }
      });
    }

    const amountInput = overlay.querySelector('#adj-amount');
    overlay.querySelector('#adj-preset-plus').onclick = ()=>{
      amountInput.value = Math.abs(parseInt(amountInput.value) || 0) || '';
    };
    overlay.querySelector('#adj-preset-minus').onclick = ()=>{
      amountInput.value = -Math.abs(parseInt(amountInput.value) || 250);
    };

    const delBtn = overlay.querySelector('#btn-del-adj');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.adj.date ? state.modal.adj.date.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      const hasLink = !!state.modal.adj.eventId;
      showConfirmDeletePopup(`Удалить эту корректировку ЗП?${hasLink ? ' Она также уберётся из себестоимости привязанного мероприятия.' : ' Действие необратимо.'}`, async ()=>{
      const adjToDelete = state.modal.adj;
      state.salaryAdjustments = state.salaryAdjustments.filter(x=>x.id !== adjToDelete.id);
      // убираем строку себестоимости, если она была синхронизирована с мероприятием
      if(adjToDelete.eventId){
        const ev = state.events.find(e=>e.id===adjToDelete.eventId);
        if(ev && Array.isArray(ev.materialsItems)){
          const before = ev.materialsItems.length;
          ev.materialsItems = ev.materialsItems.filter(m=>m.adjRef !== adjToDelete.id);
          if(ev.materialsItems.length !== before) await saveEvents();
        }
      }
      await saveSalaryAdjustments();
      state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-adj').onclick = async ()=>{
      if(state.currentRole !== 'owner'){
        const dateCheck = overlay.querySelector('#adj-date').value;
        const ymCheck = dateCheck ? dateCheck.slice(0,7) : null;
        const origYm = (state.modal.adj && state.modal.adj.date) ? state.modal.adj.date.slice(0,7) : null;
        const blockedYm = [ymCheck, origYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      ['adj-date','adj-master','adj-amount','adj-comment'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dateVal = overlay.querySelector('#adj-date').value;
      const masterVal = overlay.querySelector('#adj-master').value.trim();
      const amountRaw = overlay.querySelector('#adj-amount').value;
      const commentVal = overlay.querySelector('#adj-comment').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!dateVal) markInvalid('adj-date');
      if(!masterVal) markInvalid('adj-master');
      if(amountRaw === '' || parseInt(amountRaw) === 0) markInvalid('adj-amount');
      if(!commentVal) markInvalid('adj-comment');
      if(!dateVal || !masterVal || amountRaw==='' || parseInt(amountRaw)===0 || !commentVal){
        showGapWarningBanner('Заполните все поля — сумма не может быть нулевой (положительная — доплата, отрицательная — удержание).');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const previousAdj = state.modal.adj;
      const updated = {
        id: previousAdj.id,
        date: dateVal,
        masterName: masterVal,
        amount: parseInt(amountRaw),
        eventId: overlay.querySelector('#adj-event').value || '',
        comment: commentVal,
      };

      // синхронизация с себестоимостью мероприятия: только положительные доплаты (студия должна),
      // отрицательные удержания к конкретному мероприятию не относятся
      const prevEventId = previousAdj.eventId || '';
      const affectedEventIds = new Set([prevEventId, updated.eventId].filter(Boolean));
      let anyEventChanged = false;
      affectedEventIds.forEach(eventId=>{
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        if(!Array.isArray(ev.materialsItems)) ev.materialsItems = [];
        const before = ev.materialsItems.length;
        ev.materialsItems = ev.materialsItems.filter(m=>m.adjRef !== updated.id);
        if(eventId === updated.eventId && updated.amount > 0){
          ev.materialsItems.push({ name: `Возврат мастеру: ${updated.comment}`, cost: updated.amount, source: 'studio', adjRef: updated.id });
        }
        if(ev.materialsItems.length !== before || (eventId === updated.eventId && updated.amount > 0)) anyEventChanged = true;
      });
      if(anyEventChanged) await saveEvents();

      const idx = state.salaryAdjustments.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.salaryAdjustments[idx] = updated; else state.salaryAdjustments.push(updated);
      await saveSalaryAdjustments();
      recordAction("Корректировка ЗП сохранена");
      state.modal = null; overlay.remove(); render();
    };
  }

  // Универсальный помощник для панели навигации "по месяцам / сводка за год" —
  // используется в разделах без собственной сложной логики (Возвраты, Изделия, Заказы, Корректировки ЗП).
  // cursorKey/modeKey — имена полей в state (например 'refundsCursor'/'refundsMode'), idPrefix — префикс для id кнопок в DOM.
  function buildPeriodNav(cursorKey, modeKey, idPrefix){
    const mode = state[modeKey] || 'month';
    const cursor = state[cursorKey] || (state[cursorKey] = new Date());
    const year = cursor.getFullYear();
    const monthIdx = cursor.getMonth();
    const ym = year+'-'+pad(monthIdx+1);
    const periodLabel = mode==='month' ? (MONTHS[monthIdx]+' '+year) : (year+' год');
    const navLabel = mode==='month' ? periodLabel : String(year); // без слова «год» — иначе CSS text-transform:capitalize превратит его в «Год»
    const inPeriod = (dateStr)=> dateStr && (mode==='month' ? dateStr.startsWith(ym) : dateStr.startsWith(String(year)));
    const navHtml = `
      <div class="cal-nav" style="margin-bottom:14px;">
        <div class="month-label">${escapeHtml(navLabel)}</div>
        <div class="cal-nav-btns">
          <button class="today-btn" id="${idPrefix}-mode-toggle">${mode==='month' ? '📆 Сводка за год' : '📅 По месяцам'}</button>
          <button class="today-btn" id="${idPrefix}-today">${mode==='month' ? 'текущий месяц' : 'текущий год'}</button>
          <button class="nav-btn" id="${idPrefix}-prev">‹</button>
          <button class="nav-btn" id="${idPrefix}-next">›</button>
        </div>
      </div>
    `;
    return { navHtml, period: { mode, periodLabel, inPeriod } };
  }
  function attachPeriodNav(cursorKey, modeKey, idPrefix){
    const prevBtn = document.getElementById(`${idPrefix}-prev`);
    if(prevBtn) prevBtn.onclick = ()=>{
      const c = state[cursorKey];
      state[cursorKey] = (state[modeKey]==='year')
        ? new Date(c.getFullYear()-1, c.getMonth(), 1)
        : new Date(c.getFullYear(), c.getMonth()-1, 1);
      render();
    };
    const nextBtn = document.getElementById(`${idPrefix}-next`);
    if(nextBtn) nextBtn.onclick = ()=>{
      const c = state[cursorKey];
      state[cursorKey] = (state[modeKey]==='year')
        ? new Date(c.getFullYear()+1, c.getMonth(), 1)
        : new Date(c.getFullYear(), c.getMonth()+1, 1);
      render();
    };
    const todayBtn = document.getElementById(`${idPrefix}-today`);
    if(todayBtn) todayBtn.onclick = ()=>{ state[cursorKey] = new Date(); render(); };
    const modeToggleBtn = document.getElementById(`${idPrefix}-mode-toggle`);
    if(modeToggleBtn) modeToggleBtn.onclick = ()=>{ state[modeKey] = state[modeKey]==='year' ? 'month' : 'year'; render(); };
  }

  function renderBookView(){
    const subTabsHtml = `
      <div class="cert-subtabs">
        <button data-bookview="incomes" class="${state.bookView!=='expenses'&&state.bookView!=='book-analytics'?'active':''}">Доходы</button>
        <button data-bookview="expenses" class="${state.bookView==='expenses'?'active':''}">Расходы</button>
        <button data-bookview="book-analytics" class="${state.bookView==='book-analytics'?'active':''}">Аналитика</button>
      </div>
    `;
    const mode = state.bookMode || 'month';
    const cursor = state.bookCursor || (state.bookCursor = new Date());
    const year = cursor.getFullYear();
    const monthIdx = cursor.getMonth();
    const ym = year+'-'+pad(monthIdx+1);
    const periodLabel = mode==='month' ? (MONTHS[monthIdx]+' '+year) : (year+' год');
    const navLabel = mode==='month' ? periodLabel : String(year); // без слова «год» — иначе CSS text-transform:capitalize превратит его в «Год»
    const inPeriod = (dateStr)=> dateStr && (mode==='month' ? dateStr.startsWith(ym) : dateStr.startsWith(String(year)));
    const navHtml = `
      <div class="cal-nav" style="margin-bottom:14px;">
        <div class="month-label">${escapeHtml(navLabel)}</div>
        <div class="cal-nav-btns">
          <button class="today-btn" id="book-mode-toggle">${mode==='month' ? '📆 Сводка за год' : '📅 По месяцам'}</button>
          <button class="today-btn" id="book-today">${mode==='month' ? 'текущий месяц' : 'текущий год'}</button>
          <button class="nav-btn" id="book-prev">‹</button>
          <button class="nav-btn" id="book-next">›</button>
        </div>
      </div>
    `;
    const period = { mode, periodLabel, inPeriod };
    if(state.bookView === 'expenses'){
      return subTabsHtml + navHtml + renderExpensesView(period);
    }
    if(state.bookView === 'book-analytics'){
      return subTabsHtml + navHtml + renderBookAnalyticsView(period);
    }
    return subTabsHtml + navHtml + renderIncomesView(period);
  }

  function renderBookAnalyticsView(period){
    const inPeriod = period ? period.inPeriod : (()=>true);
    const mode = period ? period.mode : 'month';
    const periodLabel = period ? period.periodLabel : '';
    const incomesP = state.incomes.filter(i=>inPeriod(i.date));
    const expensesP = state.expenses.filter(e=>inPeriod(e.date));

    const totalIncome = incomesP.reduce((s,i)=> s + ((i.amount!==undefined&&i.amount!==null&&!isNaN(i.amount))?Number(i.amount):0), 0);
    const totalExpense = expensesP.reduce((s,e)=> s + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0), 0);
    const balance = totalIncome - totalExpense;

    const byCategory = {};
    expensesP.forEach(e=>{
      const cat = e.category || 'Без категории';
      byCategory[cat] = (byCategory[cat]||0) + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0);
    });
    const catList = Object.entries(byCategory).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxCat = Math.max(1, ...catList.map(x=>x[1]));

    const byDirection = {};
    expensesP.filter(e=>e.category==='Материалы' && e.direction).forEach(e=>{
      byDirection[e.direction] = (byDirection[e.direction]||0) + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0);
    });
    const dirList = Object.entries(byDirection).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxDir = Math.max(1, ...dirList.map(x=>x[1]));

    // расходы по источникам оплаты
    const bySourceExp = {};
    expensesP.forEach(e=>{
      const src = e.source || 'Не указан';
      bySourceExp[src] = (bySourceExp[src]||0) + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0);
    });
    const sourceExpList = Object.entries(bySourceExp).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxSourceExp = Math.max(1, ...sourceExpList.map(x=>x[1]));

    // доходы по продукту
    const incomeByProduct = {};
    incomesP.forEach(i=>{
      const p = i.product || 'Без категории';
      incomeByProduct[p] = (incomeByProduct[p]||0) + ((i.amount!==undefined&&i.amount!==null&&!isNaN(i.amount))?Number(i.amount):0);
    });
    const incomeProductList = Object.entries(incomeByProduct).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxIncomeProduct = Math.max(1, ...incomeProductList.map(x=>x[1]));

    // доходы по счёту
    const incomeByAccount = {};
    incomesP.forEach(i=>{
      const a = i.account || 'Не указан';
      incomeByAccount[a] = (incomeByAccount[a]||0) + ((i.amount!==undefined&&i.amount!==null&&!isNaN(i.amount))?Number(i.amount):0);
    });
    const incomeAccountList = Object.entries(incomeByAccount).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxIncomeAccount = Math.max(1, ...incomeAccountList.map(x=>x[1]));

    // динамика по месяцам — только в режиме "Сводка за год"
    let yearOnlyHtml = '';
    if(mode === 'year'){
      const incomeByMonthIdx = Array(12).fill(0);
      incomesP.forEach(i=>{
        if(!i.date) return;
        const mi = parseInt(i.date.slice(5,7),10) - 1;
        if(mi>=0 && mi<12) incomeByMonthIdx[mi] += (i.amount!==undefined&&i.amount!==null&&!isNaN(i.amount))?Number(i.amount):0;
      });
      const expenseByMonthIdx = Array(12).fill(0);
      expensesP.forEach(e=>{
        if(!e.date) return;
        const mi = parseInt(e.date.slice(5,7),10) - 1;
        if(mi>=0 && mi<12) expenseByMonthIdx[mi] += (e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0;
      });
      yearOnlyHtml = `
        <div class="analytics-section">
          <h4>Доходы по месяцам — ${escapeHtml(periodLabel)}</h4>
          ${renderBarChart(MONTHS.map((name,i)=>({ label: name.slice(0,3), value: incomeByMonthIdx[i], valueLabel: formatMoney(incomeByMonthIdx[i]) })))}
        </div>
        <div class="analytics-section">
          <h4>Расходы по месяцам — ${escapeHtml(periodLabel)}</h4>
          ${renderBarChart(MONTHS.map((name,i)=>({ label: name.slice(0,3), value: expenseByMonthIdx[i], valueLabel: formatMoney(expenseByMonthIdx[i]) })))}
        </div>
      `;
    }

    return `
      <div class="analytics-summary" style="margin-bottom:20px;">
        <div class="summary-card"><div class="num" style="font-size:20px;">${formatMoney(totalIncome)}</div><div class="label">Доходы всего</div></div>
        <div class="summary-card"><div class="num" style="font-size:20px;color:var(--status-red);">${formatMoney(totalExpense)}</div><div class="label">Расходы всего</div></div>
        <div class="summary-card" style="border-left:4px solid ${balance>=0?'var(--status-green)':'var(--status-red)'};"><div class="num" style="font-size:20px;color:${balance>=0?'var(--status-green)':'var(--status-red)'};">${formatMoney(balance)}</div><div class="label">Баланс</div></div>
      </div>

      <div class="analytics-section">
        <h4>Доходы по продукту — всего ${formatMoney(totalIncome)}</h4>
        ${incomeProductList.length ? incomeProductList.map(([p,sum])=>`
          <div class="stat-row">
            <div class="stat-label">${escapeHtml(p)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(sum/maxIncomeProduct*100)}%;background:var(--status-green);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(sum)}${totalIncome>0?' · '+Math.round(sum/totalIncome*100)+'%':''}</div>
          </div>
        `).join('') : `<div style="color:var(--ink-soft);font-size:13px;">Доходов пока нет.</div>`}
      </div>

      <div class="analytics-section">
        <h4>Доходы по счёту</h4>
        ${incomeAccountList.length ? incomeAccountList.map(([a,sum])=>`
          <div class="stat-row">
            <div class="stat-label">${escapeHtml(a)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(sum/maxIncomeAccount*100)}%;background:var(--accent);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(sum)}</div>
          </div>
        `).join('') : `<div style="color:var(--ink-soft);font-size:13px;">Доходов пока нет.</div>`}
      </div>

      ${yearOnlyHtml}

      <div class="analytics-section">
        <h4>Расходы по категориям — всего ${formatMoney(totalExpense)}</h4>
        ${catList.length ? catList.map(([cat,sum])=>`
          <div class="stat-row">
            <div class="stat-label">${escapeHtml(cat)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(sum/maxCat*100)}%;background:var(--status-red);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(sum)}${totalExpense>0?' · '+Math.round(sum/totalExpense*100)+'%':''}</div>
          </div>
        `).join('') : `<div style="color:var(--ink-soft);font-size:13px;">Расходов пока нет.</div>`}
      </div>

      <div class="analytics-section">
        <h4>Расходы по направлениям (Материалы) — всего ${formatMoney(dirList.reduce((s,[,v])=>s+v,0))}</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Только расходы с категорией «Материалы», где указано направление.</div>
        ${dirList.length ? dirList.map(([dir,sum])=>`
          <div class="stat-row">

  function renderExpensesView(period){
    const inPeriod = period ? period.inPeriod : (()=>true);

    const isOwner = state.currentRole === 'owner';
    const expensesP = state.expenses.filter(e=>inPeriod(e.date) && (isOwner || !e.ownerOnly));
    const items = [...expensesP].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    const total = items.reduce((s,e)=> s + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0), 0);

    const byCategory = {};
    expensesP.forEach(e=>{
      const cat = e.category || 'Без категории';
      byCategory[cat] = (byCategory[cat]||0) + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0);
    });
    const catList = Object.entries(byCategory).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxCat = Math.max(1, ...catList.map(x=>x[1]));

    return `
      ${catList.length ? `
      <div class="analytics-section" style="margin-bottom:20px;">
        <h4>Расходы по категориям</h4>
        ${catList.map(([cat,sum])=>`
          <div class="stat-row">

            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(sum/maxCat*100)}%;background:var(--status-red);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${formatMoney(sum)}</div>
          </div>
        `).join('')}
      </div>
      ` : ''}

        <div style="font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);">${escapeHtml(periodLabel)} · Записей: ${items.length} · Сумма: ${formatMoney(total)}</div>

      ${items.length === 0 ? `<div class="host-empty">Записей пока нет</div>` : `
        <div class="cert-list">
          ${items.map(e=>`
            <div class="expense-row" data-eid="${e.id}">
              <div class="cell">${e.date ? formatDateText(e.date) : '—'}</div>
              <div class="cell">${escapeHtml(e.category||'')}${e.ownerOnly?' <span title="Из «Ручные расходы» — редактируется там, видно только владельцу" style="opacity:.55;">🔒</span>':''}${e.category==='Материалы'&&e.direction?'<br><span style="color:var(--ink-soft);font-size:11px;">'+escapeHtml(e.direction)+'</span>':''}${e.category==='Зарплата'&&e.master?'<br><span style="color:var(--ink-soft);font-size:11px;">'+escapeHtml(e.master)+'</span>':''}</div>
              <div class="cell">${escapeHtml(e.source||'')}</div>
              <div class="amount">${e.amount!==undefined&&e.amount!==null ? formatMoneyPrecise(e.amount) : ''}</div>
              <div class="cell">${escapeHtml(e.responsible||'')}</div>
              <div class="comment">${escapeHtml(e.comment||'')}</div>
            </div>
          `).join('')}
        </div>
      `}
    `;
  }

    document.querySelectorAll('[data-bookview]').forEach(btn=>{
      btn.onclick = ()=>{ state.bookView = btn.dataset.bookview; render(); };
    });

      const c = state.bookCursor;
      state.bookCursor = (state.bookMode==='year')
        ? new Date(c.getFullYear()-1, c.getMonth(), 1)
        : new Date(c.getFullYear(), c.getMonth()-1, 1);
      render();
    };
    const bookNextBtn = document.getElementById('book-next');
    if(bookNextBtn) bookNextBtn.onclick = ()=>{
      const c = state.bookCursor;
      state.bookCursor = (state.bookMode==='year')
        ? new Date(c.getFullYear()+1, c.getMonth(), 1)
        : new Date(c.getFullYear(), c.getMonth()+1, 1);
      render();
    };
    const bookTodayBtn = document.getElementById('book-today');
    if(bookTodayBtn) bookTodayBtn.onclick = ()=>{ state.bookCursor = new Date(); render(); };
    const bookModeToggleBtn = document.getElementById('book-mode-toggle');
    if(bookModeToggleBtn) bookModeToggleBtn.onclick = ()=>{ state.bookMode = state.bookMode==='year' ? 'month' : 'year'; render(); };
    const addIncomeBtn = document.getElementById('btn-add-income');
    if(addIncomeBtn) addIncomeBtn.onclick = ()=>{
      requireUnlock(()=>{
        state.modal = {type:'income', isNew:true, income:{
          id: uid(), date: todayStr(), operation: INCOME_OPERATIONS[0], product: INCOME_PRODUCTS[0],
          account: INCOME_ACCOUNTS[0], amount: null, comment: '', eventId: '', masterName: '', itemSaleId: '', orderId: '',
        }};
        render();
      });
    };
    document.querySelectorAll('.refund-row[data-iid]').forEach(row=>{
      row.onclick = ()=>{
        const i = state.incomes.find(x=>x.id===row.dataset.iid);
        if(!i) return;
        // доход от продажи сертификата — редактируем и удаляем через карточку сертификата,
        // иначе при удалении прямо здесь сертификат в "Базе сертификатов" остаётся осиротевшим
        // (и наоборот — приходится удалять в двух местах отдельно)
        const linkedCert = state.certificates.find(c=>c.incomeId===i.id);
        if(linkedCert){
          requireUnlock(()=>{
            state.modal = {type:'certificate', isNew:false, cert:{...linkedCert}};
            render();
          });
          return;
        }
        requireUnlock(()=>{
          state.modal = {type:'income', isNew:false, income:{...i}};
          render();
        });
      };
    });

    const addExpenseBtn = document.getElementById('btn-add-expense');
    if(addExpenseBtn) addExpenseBtn.onclick = ()=>{
      requireUnlock(()=>{
        state.modal = {type:'expense', isNew:true, expense:{
          id: uid(), date: todayStr(), category: EXPENSE_CATEGORIES[0], direction: '', master: '',
          source: EXPENSE_SOURCES[0], amount: null, responsible: EXPENSE_RESPONSIBLE[0], eventId: '', comment: '',
        }};
        render();
      });
    };
    document.querySelectorAll('.expense-row').forEach(row=>{
      row.onclick = ()=>{
        const e = state.expenses.find(x=>x.id===row.dataset.eid);
        if(!e) return;
        if(e.ownerOnly && e.netProfitRef){
          const ym = e.netProfitRef.split(':')[1];
          const [y,m] = ym.split('-').map(Number);
          requireUnlock(()=>{
            state.analyticsCursor = new Date(y, m-1, 1);
            state.modal = {type:'netprofit-edit'};
            render();
          });
          return;
        }
        requireUnlock(()=>{
          state.modal = {type:'expense', isNew:false, expense:{...e}};
          render();
        });
      };
    });
  }

  function attachIncomeModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-income');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const eventOptions = eventSelectOptions();
    const labelToId = {};
    eventOptions.forEach(o=>{ labelToId[o.label] = o.id; });
    const eventSearchInput = overlay.querySelector('#i-event-search');
    const eventHidden = overlay.querySelector('#i-event');
    if(eventSearchInput && eventHidden){
      eventSearchInput.addEventListener('input', ()=>{
        const val = eventSearchInput.value.trim();
        if(val === ''){ eventHidden.value = ''; eventSearchInput.style.borderColor = ''; return; }
        if(labelToId[val]){ eventHidden.value = labelToId[val]; eventSearchInput.style.borderColor = ''; }
      });
      eventSearchInput.addEventListener('blur', ()=>{
        const val = eventSearchInput.value.trim();
        if(val !== '' && !labelToId[val]){
          // введённый текст не совпал ни с одним мероприятием — считаем "без привязки"
          eventSearchInput.value = '';
          eventHidden.value = '';
        }
      });
    }

    const delBtn = overlay.querySelector('#btn-del-income');
    if(delBtn) delBtn.onclick = ()=>{
      if(state.currentRole !== 'owner'){
        const ym = state.modal.income.date ? state.modal.income.date.slice(0,7) : null;
        if(ym && state.closedMonths && state.closedMonths.includes(ym)){
          showGapWarningBanner(`Месяц ${ym} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      const linkedCertForDelete = state.certificates.find(c=>c.incomeId===state.modal.income.id);
      const cascades = state.modal.income.itemSaleId || state.modal.income.orderId || linkedCertForDelete;
      showConfirmDeletePopup(`Удалить этот доход?${cascades ? ' Связанная запись в «Изделиях»/«Заказе»/«Сертификатах» также удалится.' : ' Действие необратимо.'}`, async ()=>{
      state.incomes = state.incomes.filter(x=>x.id !== state.modal.income.id);
      if(state.modal.income.itemSaleId){
        state.itemSales = state.itemSales.filter(x=>x.id !== state.modal.income.itemSaleId);
        await saveItemSales();
      }
      if(state.modal.income.orderId){
        state.orders = state.orders.filter(x=>x.id !== state.modal.income.orderId);
        await saveOrders();
      }
      // подстраховка — обычно доход сертификата открывается и удаляется через карточку сертификата (см. клик по строке в "Книге"),
      // но если он всё же удалён отсюда, не оставляем сертификат "осиротевшим" со ссылкой на несуществующий доход
      if(linkedCertForDelete){
        state.certificates = state.certificates.filter(x=>x.id !== linkedCertForDelete.id);
        await saveCertificates();
      }
      await saveIncomes();
      state.modal = null; overlay.remove(); render();
      });
    };

    const productSelect = overlay.querySelector('#i-product');
    const masterField = overlay.querySelector('#income-master-field');
    const orderField = overlay.querySelector('#income-order-field');
    if(productSelect){
      productSelect.addEventListener('change', ()=>{
        if(masterField) masterField.style.display = (productSelect.value === 'Изделие') ? 'block' : 'none';
        if(orderField) orderField.style.display = (productSelect.value === 'Заказ') ? 'block' : 'none';
      });
    }

    overlay.querySelector('#btn-save-income').onclick = async ()=>{
      if(state.currentRole !== 'owner'){
        const dateCheck = overlay.querySelector('#i-date').value;
        const ymCheck = dateCheck ? dateCheck.slice(0,7) : null;
        const origYm = (state.modal.income && state.modal.income.date) ? state.modal.income.date.slice(0,7) : null;
        const blockedYm = [ymCheck, origYm].find(ym => ym && state.closedMonths && state.closedMonths.includes(ym));
        if(blockedYm){
          showGapWarningBanner(`Месяц ${blockedYm} закрыт для редактирования. Обратитесь к руководителю.`);
          return;
        }
      }
      ['i-date','i-amount','i-comment','i-master','i-order-master','i-order-share'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dateVal = overlay.querySelector('#i-date').value;
      const amountRaw = overlay.querySelector('#i-amount').value;
      const operationVal = overlay.querySelector('#i-operation').value;
      const productVal = overlay.querySelector('#i-product').value;
      const accountVal = overlay.querySelector('#i-account').value;
      const commentVal = overlay.querySelector('#i-comment').value.trim();
      const masterVal = overlay.querySelector('#i-master').value.trim();
      const orderMasterVal = overlay.querySelector('#i-order-master').value.trim();
      const orderShareRaw = overlay.querySelector('#i-order-share').value;

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!dateVal) markInvalid('i-date');
      if(amountRaw === '' || Number(amountRaw) < 0) markInvalid('i-amount');
      if(!commentVal) markInvalid('i-comment');
      const masterMissing = (productVal === 'Изделие' && !masterVal);
      if(masterMissing) markInvalid('i-master');
      const orderMasterMissing = (productVal === 'Заказ' && !orderMasterVal);
      if(orderMasterMissing) markInvalid('i-order-master');
      const orderShareMissing = (productVal === 'Заказ' && orderShareRaw === '');
      if(orderShareMissing) markInvalid('i-order-share');
      if(!dateVal || amountRaw==='' || Number(amountRaw)<0 || !commentVal || masterMissing || orderMasterMissing || orderShareMissing){
        let msg = 'Заполните все поля перед сохранением дохода. Сумма не может быть отрицательной.';
        if(masterMissing) msg = 'Продукт «Изделие» — укажите мастера, который его изготовил.';
        else if(orderMasterMissing || orderShareMissing) msg = 'Продукт «Заказ» — укажите мастера и договорённую сумму ЗП мастера.';
        showGapWarningBanner(msg);
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const updated = {
        id: state.modal.income.id,
        date: dateVal,
        operation: operationVal,
        product: productVal,
        account: accountVal,
        eventId: overlay.querySelector('#i-event').value || '',
        amount: Math.round(Number(amountRaw) * 100) / 100, // округляем только до копеек, а не до целых рублей
        masterName: productVal==='Изделие' ? masterVal : (productVal==='Заказ' ? orderMasterVal : ''),
        masterShare: productVal==='Заказ' ? parseInt(orderShareRaw) : null,
        itemSaleId: state.modal.income.itemSaleId || '',
        orderId: state.modal.income.orderId || '',
        comment: commentVal,
      };

      // синхронизация с "Для менеджеров → Изделия"
      if(productVal === 'Изделие'){
        const saleEntry = { id: updated.itemSaleId || uid(), date: updated.date, masterName: masterVal, revenue: updated.amount, source: accountVal, comment: updated.comment, incomeId: updated.id };
        updated.itemSaleId = saleEntry.id;
        const saleIdx = state.itemSales.findIndex(x=>x.id===saleEntry.id);
        if(saleIdx >= 0) state.itemSales[saleIdx] = saleEntry; else state.itemSales.push(saleEntry);
        await saveItemSales();
      } else if(updated.itemSaleId){
        state.itemSales = state.itemSales.filter(x=>x.id !== updated.itemSaleId);
        await saveItemSales();
        updated.itemSaleId = '';
      }

      // синхронизация с "Для менеджеров → Заказ"
      if(productVal === 'Заказ'){
        const orderEntry = { id: updated.orderId || uid(), date: updated.date, masterName: orderMasterVal, revenue: updated.amount, masterShare: parseInt(orderShareRaw), comment: updated.comment };
        updated.orderId = orderEntry.id;
        const orderIdx = state.orders.findIndex(x=>x.id===orderEntry.id);
        if(orderIdx >= 0) state.orders[orderIdx] = orderEntry; else state.orders.push(orderEntry);
        await saveOrders();
      } else if(updated.orderId){
        state.orders = state.orders.filter(x=>x.id !== updated.orderId);
        await saveOrders();
        updated.orderId = '';
      }

      const idx = state.incomes.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.incomes[idx] = updated; else state.incomes.push(updated);
      await saveIncomes();
      recordAction("Доход сохранён");
      state.modal = null; overlay.remove(); render();
    };
  }
